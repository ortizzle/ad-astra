<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="14%" r="100%">
      <stop offset="0%"   stop-color="#0f5c56"/>
      <stop offset="45%"  stop-color="#0a2f33"/>
      <stop offset="100%" stop-color="#04141a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6fe3cd" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#6fe3cd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aqua" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a8f5e4"/>
      <stop offset="50%"  stop-color="#6fe3cd"/>
      <stop offset="100%" stop-color="#34a898"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- aurora bloom -->
  <ellipse cx="320" cy="140" rx="190" ry="150" fill="url(#glow)"/>
  <ellipse cx="150" cy="370" rx="150" ry="125" fill="#34a898" opacity=".14"/>

  <!-- background stars -->
  <g fill="#eafaf6">
    <circle cx="96"  cy="112" r="3"   opacity=".7"/>
    <circle cx="410" cy="96"  r="2.5" opacity=".55"/>
    <circle cx="146" cy="396" r="2.5" opacity=".5"/>
    <circle cx="432" cy="352" r="3"   opacity=".45"/>
    <circle cx="318" cy="436" r="2"   opacity=".5"/>
    <circle cx="72"  cy="250" r="2"   opacity=".42"/>
    <circle cx="456" cy="214" r="2"   opacity=".42"/>
    <circle cx="214" cy="82"  r="2"   opacity=".38"/>
  </g>

  <!-- constellation: the "ad astra" line rising to the lead star -->
  <g stroke="url(#aqua)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity=".6">
    <path d="M150 372 L214 268 L300 300"/>
    <path d="M214 268 L268 196"/>
  </g>
  <g fill="url(#aqua)">
    <circle cx="150" cy="372" r="8"/>
    <circle cx="214" cy="268" r="11"/>
    <circle cx="300" cy="300" r="8"/>
    <circle cx="268" cy="196" r="6.5"/>
  </g>

  <!-- lead star -->
  <path fill="url(#aqua)" d="M330 150
    C338 208 368 238 426 246
    C368 254 338 284 330 342
    C322 284 292 254 234 246
    C292 238 322 208 330 150 Z"/>
</svg>
