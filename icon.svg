<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#2e3c78"/>
      <stop offset="55%" stop-color="#111832"/>
      <stop offset="100%" stop-color="#080b16"/>
    </radialGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2cf72"/>
      <stop offset="50%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#a8863a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- background stars -->
  <g fill="#f2efe4">
    <circle cx="96"  cy="108" r="3"   opacity=".7"/>
    <circle cx="404" cy="96"  r="2.5" opacity=".55"/>
    <circle cx="146" cy="392" r="2.5" opacity=".5"/>
    <circle cx="422" cy="352" r="3"   opacity=".45"/>
    <circle cx="322" cy="428" r="2"   opacity=".5"/>
    <circle cx="72"  cy="252" r="2"   opacity=".4"/>
    <circle cx="448" cy="220" r="2"   opacity=".4"/>
  </g>

  <!-- constellation lines -->
  <g stroke="url(#brass)" stroke-width="3" stroke-linecap="round" fill="none" opacity=".55">
    <path d="M170 320 L232 214 L318 258 L360 168"/>
    <path d="M232 214 L300 132"/>
  </g>

  <!-- constellation nodes -->
  <g fill="url(#brass)">
    <circle cx="170" cy="320" r="9"/>
    <circle cx="232" cy="214" r="12"/>
    <circle cx="318" cy="258" r="9"/>
    <circle cx="360" cy="168" r="10"/>
    <circle cx="300" cy="132" r="7"/>
  </g>

  <!-- lead star -->
  <path fill="url(#brass)" d="M256 176
    L272 232 L328 248 L272 264 L256 320 L240 264 L184 248 L240 232 Z" opacity=".95"/>
</svg>
