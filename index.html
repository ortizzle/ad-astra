<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04141a">
<title>Ad Astra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preload" href="fonts/jakarta.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Self-hosted variable fonts (latin subsets, ~176KB total) under the same
   family names as before, so every font-family rule below is untouched.
   No CDN: the look can no longer be lost to a filtered or hanging network,
   and the first paint stops waiting on a third party. */
@font-face{font-family:'Caveat';src:url('fonts/caveat.woff2') format('woff2');
  font-weight:600;font-display:swap}
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;
  font-display:swap;src:url(fonts/fraunces.woff2) format('woff2-variations')}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:100 900;
  font-display:swap;src:url(fonts/fraunces-italic.woff2) format('woff2-variations')}
@font-face{font-family:'Plus Jakarta Sans';font-style:normal;font-weight:200 800;
  font-display:swap;src:url(fonts/jakarta.woff2) format('woff2-variations')}

:root{
  --ac:#6fe3cd;                     /* personalized accent — set from prefs */
  --r:20px; --tap:48px;
  /* One vertical rhythm, three steps: between sibling blocks, between rows of
     a list, and the air before a section divider. Four different values had
     grown up here by accident (14 / 11 / 8 / 2) and the 2px was visible. */
  --gap:14px; --gap-row:10px; --gap-sec:26px;
  --ac-8:color-mix(in srgb, var(--ac) 8%, transparent);
  --ac-14:color-mix(in srgb, var(--ac) 14%, transparent);
  --ac-25:color-mix(in srgb, var(--ac) 25%, transparent);
}
/* Dark is the default. `data-theme` is always written explicitly by
   applyTheme(), including when the preference is "auto" — so the CSS only ever
   has two states to reason about. */
:root, :root[data-theme="dark"]{
  --ink:#04141a; --deep:#072027; --surface:#0b2a32; --raised:#10373f;
  --line:#1b4a54; --line-soft:#133b44;
  --text:#e9f4f1; --muted:#8fb0ab; --faint:#749994;
  --ac-fg:var(--ac);                /* accent that is safe as *text* here */
  --warm:#f2c48a; --bad:#ff8f9e; --good:#6fe3cd;
  --shadow:0 7px 20px rgba(0,0,0,.5);
  --veil:rgba(2,10,13,.8);
  --wash-1:var(--ac-14); --wash-2:rgba(242,196,138,.07);
}
:root[data-theme="light"]{
  /* Sea-glass paper, not generic white — light mode carries the identity too.
     The page is a tinted ground the white cards float on; the washes were
     always accent-keyed, they just never had paper that let them read. */
  --ink:#e7f0ed; --deep:#ffffff; --surface:#ffffff; --raised:#dcebe6;
  --line:#bfd7d1; --line-soft:#d3e3de;
  --text:#0c2b29; --muted:#42605d; --faint:#425c59;
  /* --faint carries hints and explanations — real reading, not decoration — so
     it is held above 4.5:1 against both the card (#fff) and the page. */
  /* Raw aquamarine on white fails contrast, so text-weight accent is deepened.
     40% keeps the hue recognisable while clearing WCAG AA (4.5:1) for the
     small-caps labels, which are 10.5px and therefore normal-size text. */
  --ac-fg:color-mix(in srgb, var(--ac) 32%, #04302a);
  --warm:#754a0e; --bad:#b02c3f; --good:#07604b;
  --shadow:0 5px 16px rgba(12,43,41,.10);
  --veil:rgba(12,43,41,.45);
  --wash-1:color-mix(in srgb, var(--ac) 30%, transparent);
  --wash-2:rgba(242,196,138,.26);
}
/* Skies — her pick of canvas washes (Settings → Personalize). Only the wash
   colours change; the canvas (--ink) and every text colour stay put, so the
   contrast measurements hold under every sky. */
:root[data-sky="nebula"]{--wash-1:rgba(178,110,235,.13);--wash-2:rgba(90,120,236,.10)}
:root[data-theme="light"][data-sky="nebula"]{--wash-1:rgba(147,84,201,.16);--wash-2:rgba(90,120,236,.14)}
:root[data-sky="tide"]{--wash-1:rgba(90,166,236,.13);--wash-2:rgba(111,227,205,.09)}
:root[data-theme="light"][data-sky="tide"]{--wash-1:rgba(59,130,200,.16);--wash-2:rgba(11,123,98,.12)}
:root[data-sky="graphite"]{--wash-1:rgba(255,255,255,.035);--wash-2:transparent}
:root[data-theme="light"][data-sky="graphite"]{--wash-1:rgba(12,43,41,.05);--wash-2:transparent}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-.005em;
  min-height:100vh; overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(70% 45% at 15% -5%, var(--wash-1), transparent 70%),
    radial-gradient(60% 40% at 95% 12%, var(--wash-2), transparent 70%),
    radial-gradient(80% 50% at 50% 105%, var(--wash-1), transparent 70%);
}
#app{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:0 18px 128px}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0;line-height:1.15}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac-fg);font-weight:700;opacity:.85}
/* Subject screens borrow the subject's colour as their accent — the derived
   tints are re-mixed here so a JS override of --ac on #screen cascades. */
#screen{--ac-8:color-mix(in srgb, var(--ac) 8%, transparent);
  --ac-14:color-mix(in srgb, var(--ac) 14%, transparent);
  --ac-25:color-mix(in srgb, var(--ac) 25%, transparent)}
:root[data-theme="dark"] #screen{--ac-fg:var(--ac)}
:root[data-theme="light"] #screen{--ac-fg:color-mix(in srgb, var(--ac) 40%, #04302a)}

header{padding:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--ac-14);border:1px solid var(--ac-25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.brand{cursor:pointer}
.brand:active{transform:scale(.985)}
.brand h1{font-size:24px}
.brand .sub{font-size:11.5px;color:var(--faint);letter-spacing:.06em;margin-top:1px}
.hdr{display:flex;gap:6px;flex-shrink:0}
.chip{background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ac{border-color:var(--ac-25);color:var(--ac-fg);background:var(--ac-8)}
.swbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));
  z-index:60;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 15px;
  border-radius:16px;border:1px solid var(--line);background:var(--raised);
  color:var(--text);font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.swbar span{flex:1}
.swbar button{min-height:var(--tap);padding:8px 15px;border-radius:11px;border:0;
  background:var(--ac);color:#04141a;font:inherit;font-size:13px;font-weight:700}
.swbar button.x{background:none;color:var(--muted);font-weight:600;padding:8px 11px}
.pickrow{display:flex;align-items:center;justify-content:space-between;width:100%;
  min-height:var(--tap);padding:10px 13px;border-radius:12px;border:1px solid var(--line);
  background:var(--deep);color:var(--text);font:inherit;margin-top:var(--gap-row)}
.pickrow .cur{font-size:19px}
.pickrow .pv{color:var(--ac-fg);font-size:12.5px;font-weight:600}
/* The runway card: what is necessary, then what is possible. */
.runway .rw{display:flex;align-items:center;gap:12px;width:100%;min-height:var(--tap);
  padding:10px 12px;margin-top:var(--gap-row);border-radius:13px;border:1px solid var(--line);
  background:var(--deep);color:var(--text);font:inherit;text-align:left}
.runway .rw:disabled{opacity:1}
.runway .rn{flex:0 0 auto;min-width:26px;text-align:center;font-family:'Fraunces',Georgia,serif;
  font-size:19px;font-weight:600;color:var(--ac-fg)}
.runway .rt{flex:1;font-size:13px;line-height:1.35}
.runway .rc{flex:0 0 auto;color:var(--faint);font-size:17px}
.runway .rhours{margin-top:11px;font-size:12.5px;line-height:1.45;color:var(--muted)}
/* ---- Letting the sky through (Ad Astra v108 / Wayfinder v87) ----
   The cards above the fold sit over the starfield and the shooting stars, and
   an opaque card is a hole punched in the sky exactly where she looks first.
   These three go translucent so the comet reads through them.

   --glass is the knob. It is NOT a free parameter: .card.ac was made opaque in
   the first place because bright stars were punching through its 8% gradient
   corner behind the eyebrow. So the alpha here is the lowest that still clears
   4.5:1 for every reading token against the worst case — a star at full
   brightness directly behind the text — measured, not guessed. Lower it and
   re-measure, or the sky starts eating words. */
:root{ --glass:.90; }
/* The strip is deliberately NOT in this list. Measured against a star at full
   brightness behind the text: --text, --muted and --ac-fg all clear 4.5:1 at
   .90, but --faint does not clear at ANY transparency (4.83 opaque, 4.05 at
   .94, 3.59 at .90). The day and week cards use no --faint; the strip's tile
   labels do. So the two big cards let the sky through and the strip stays
   solid, rather than dropping a reading token below the bar for the look. */
.card.ac.daycard, .card.ac.brief{
  background-color:color-mix(in srgb, var(--surface) calc(var(--glass)*100%), transparent);
  backdrop-filter:blur(2px);
}

/* The star sky: River's game. Stars are buttons, full tap size, positioned on
   a seeded grid so the same unit always draws the same sky. Lit stars go the
   gilt gold the finished-book spines use — earned, never currency. */
.skyfield{position:relative;height:340px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(180deg,#050a18,#0a1230 70%,#0d1738);overflow:hidden;margin-bottom:var(--gap)}
.skystar{position:absolute;transform:translate(-50%,-50%);min-width:var(--tap);min-height:var(--tap);
  background:none;border:none;color:#8fa3c8;font-size:17px;cursor:pointer;
  text-shadow:0 0 6px rgba(160,190,255,.55)}
.skystar.lit{color:#f8e7b4;font-size:21px;text-shadow:0 0 10px rgba(248,231,180,.75)}
.skystar.open{color:#fff}
/* Star sky panel states. The win has to be loud — a tick, the word big, the
   card turning green — because "the word just appeared" is indistinguishable
   from having been told the answer. */
.skywon{border-color:var(--good)}
.skywon .eyebrow{color:var(--good)}
.skyword{font-family:'Fraunces',Georgia,serif;font-size:29px;line-height:1.15;color:var(--text);margin:2px 0 0}
.skyhint{margin-top:var(--gap-row);padding:9px 12px;border-radius:11px;background:var(--deep);
  border-left:3px solid var(--ac-fg);font-size:13.5px;line-height:1.45;color:var(--muted)}
.skysay{margin-top:var(--gap-row);font-size:13.5px;line-height:1.45;color:var(--warm)}
/* The revealed word, called out the same way a Growth Zone miss marks its
   correct answer (.miss .a) — bold and --good, not just plain text in a
   sentence she has to parse. Both are already held to 4.5:1 on card and page. */
.skyreveal{margin-top:var(--gap-row);font-size:13.5px;line-height:1.45;color:var(--muted)}
.skyreveal .a{font-weight:700;font-size:16px;color:var(--good)}
/* Recording has to be visibly happening — Chris could not tell it had started. */
.skylisten{display:flex;align-items:center;gap:10px;margin-top:var(--gap-row);
  padding:11px 13px;border-radius:12px;background:var(--ac-8);border:1px solid var(--ac-fg);
  font-size:14px;font-weight:600;color:var(--text)}
.skylisten .dot{width:11px;height:11px;border-radius:50%;background:var(--bad);flex:0 0 auto;
  animation:miclive 1s ease-in-out infinite}
@keyframes miclive{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.72)}}

/* A note from home, as a note. Chris asked for bigger, and for it to look
   placed on the screen by a person rather than drawn by the app — so it is
   warm paper, tilted a degree and a half, sitting slightly off the column
   with a shadow under it. It is the one surface in either app that is NOT
   the dark theme, and that is the whole point: it did not come from the app.

   Dark ink on warm paper, measured: 12.8:1. It carries its own colours
   rather than the theme tokens precisely because it is meant to look
   foreign, so it holds in light mode and under every accent and sky. */
.card.pnote{background:linear-gradient(170deg,#fdf3b8,#f7e58c);border:none;border-radius:3px;
  transform:rotate(-1.4deg);margin-left:10px;margin-right:22px;padding:18px 20px 22px;
  box-shadow:0 10px 20px -8px rgba(0,0,0,.55),0 2px 4px rgba(0,0,0,.3)}
.card.pnote .eyebrow{color:#6b5310}
.card.pnote p{font-family:'Caveat','Bradley Hand',cursive;font-size:30px;line-height:1.22;
  color:#2f2708;white-space:pre-line;margin:0}
/* The bit of tape holding it on. */
.card.pnote::before{content:'';position:absolute;top:-9px;left:50%;width:64px;height:19px;
  transform:translateX(-50%) rotate(1.4deg);background:rgba(255,255,255,.34);
  border-left:1px solid rgba(255,255,255,.18);border-right:1px solid rgba(255,255,255,.18)}
.card.pnote{position:relative}
/* ---- Direction A: the subject owns the colour (Ad Astra v116 / Wayfinder v94)
   Chosen from prototype-focus.html. The diagnosis was that one hue did every
   job — important, interactive, active, decorative — so it meant none of them.
   The accent now keeps ONE job, the thing you can tap, and anything that
   belongs to a subject wears that subject's own hue instead.

   Every subject colour rides on --pc, set from classColor() at the render
   site, and is carried on borders, eyebrows and a faint wash — never on body
   text, so every reading token keeps its measured value. Twelve palettes ×
   two themes is a lot of contrast surface, and the way to keep it safe is to
   never put a palette hue behind a paragraph. */
/* The card's own wash lives further down, immediately after .card.ac — see
   the note there. It cannot live here: .card.ac sets the same background-image
   at equal specificity and later in the sheet, so a rule written here loses. */
/* --pc-fg is the subject colour as TEXT, exactly as --ac-fg is for the accent
   — and for the same reason. The palette's g1 values are FILLS, designed to
   sit behind white labels on a subject tile; used as text they measured 4.37:1
   for orchid in dark and failed on ALL TWELVE in light, worst 1.60:1, because
   a mid-tone on a white card is barely there.
   Lifted 10% toward white in dark and deepened to 42% over ink in light: worst
   case 4.90:1 (orchid, dark) and 5.76:1 (lime, light), measured across every
   palette in both themes. The hue stays recognisable, which is the whole point
   of using it. */
/* Declared on every element that can carry its OWN --pc, not just inherited:
   an unregistered custom property resolves its var() references on the element
   where it is DECLARED, so a row that overrides --pc would otherwise inherit
   the card's already-computed --pc-fg — the week card's lead rows wore the
   focus subject's colour no matter whose door they were. Where --pc is unset
   the mix is invalid, so every use site falls back with var(--pc-fg,var(--ac-fg)). */
.card.subj-a,.row.subj-a,.lk,.tile,.plan,.subjline,.ledger-row.subj{--pc-fg:color-mix(in srgb,var(--pc) 90%,#ffffff)}
[data-theme="light"] .card.subj-a,[data-theme="light"] .row.subj-a,
[data-theme="light"] .lk,
[data-theme="light"] .tile,[data-theme="light"] .plan,[data-theme="light"] .subjline,
[data-theme="light"] .ledger-row.subj{
  --pc-fg:color-mix(in srgb,var(--pc) 42%,#0b1b22)}
.card.subj-a>.eyebrow{color:var(--pc-fg)}
/* Runway rows only: every runway row IS the card's subject. The week card's
   doors are NOT all one subject — a lesson door can point at another class —
   so there the rule lives on .rw.lead, which carries its own --pc. */
.card.runway.subj-a .rw{border-left:3px solid var(--pc-fg)}
.card.runway.subj-a .rw .rn{color:var(--pc-fg)}
/* A dated row in Coming up belongs to its subject, so it is ruled in that
   subject's colour rather than in the one accent every row used to share. */
.row.subj-a{border-left:3px solid var(--pc-fg);padding-left:11px;
  background:color-mix(in srgb,var(--pc) 7%,transparent);
  border-radius:11px;margin-left:-2px}
.row.subj-a .k{font-weight:650}
/* Growth Zone group headers wear their subject's rule — the same grammar as a
   Coming up row: this colour = this subject, wherever she meets it. */
.subjline{border-left:3px solid var(--pc-fg,var(--ac-fg));padding-left:10px}

/* ---- Your week: the brief (v104). Direction C's prose + ledger with
   direction B's load bars, chosen from prototype-brief.html. ---- */
/* The prose is the one place on Today that is meant to be READ rather than
   scanned, so it takes the serif at a reading size — the same face the
   headings use, which is what marks it as writing and not a label. */
/* .card p.brief-prose, not bare .brief-prose: `.card p` outguns a lone class
   on specificity and was silently forcing the prose down to 14px muted — the
   same cascade trap .card.pnote p documents. Chris asked for a bigger font;
   the styled size had never actually applied. */
.card p.brief-prose{font-family:'Fraunces',Georgia,serif;font-size:16px;line-height:1.52;
  color:var(--text);font-weight:400;margin:0 0 var(--gap-row)}
.card p.brief-prose:last-of-type{margin-bottom:0}
.brief-prose b{font-weight:700}
/* Load bars: where the time actually sits. Each subject carries its own --pc,
   set from classColor() at the render site — direction A's rule, a subject
   hue only ever where that subject is the topic. */
.load{margin-top:var(--gap)}
/* Button reset: the row is a door now, but must look exactly as it did as a
   div — the bar itself is the content. */
.load-row{display:block;width:100%;margin-bottom:var(--gap-row);padding:0;
  background:none;border:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.load-row:last-child{margin-bottom:0}
.load-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.load-nm{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px}
.load-nm .subjdot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;background:var(--pc,var(--ac))}
.load-mins{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:9px;border-radius:999px;background:var(--deep);border:1px solid var(--line-soft);
  overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .q{background:var(--pc,var(--ac))}
.bar .c{background:color-mix(in srgb,var(--pc,var(--ac)) 45%,transparent)}
.bar .r{background:color-mix(in srgb,var(--pc,var(--ac)) 20%,transparent)}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:var(--gap-row);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;
  vertical-align:-1px;background:var(--muted)}
.legend span:nth-child(2) i{opacity:.55}
.legend span:nth-child(3) i{opacity:.3}
/* The ledger: the week, day by day. */
.ledger{margin-top:var(--gap);border-top:1px solid var(--line-soft)}
/* Padded on both sides so the tinted "today" row can round its corners
   without a negative margin — the first version bled 9px past the card on
   each side and gave the whole page a horizontal scroll. The bottom border
   still spans the full row: padding sits inside the border box. */
.ledger-row{display:flex;align-items:center;gap:11px;padding:11px 9px;
  border-bottom:1px solid var(--line-soft);min-height:var(--tap)}
.ledger-day{flex:0 0 38px;font-size:11px;letter-spacing:.08em;font-weight:800;color:var(--faint)}
.ledger-what{flex:1;font-size:13.5px;line-height:1.4}
.ledger-what small{display:block;color:var(--faint);font-size:11.5px}
.ledger-min{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger-row.test .ledger-day{color:var(--bad)}
/* Today is tinted AND its label is heavier — colour is never the only signal,
   the same rule the "lands today" row in Coming up follows. */
.ledger-row.now{background:var(--ac-8);border-radius:9px}
/* A study row wears its subject — the .subjline grammar carried to the one
   list on Today that lacked it. Today's row keeps the accent: .now is later
   in this block, and today is a different axis from topic. */
.ledger-row.subj .ledger-day{color:var(--pc-fg,var(--ac-fg))}
.ledger-row.now .ledger-day{color:var(--ac-fg)}
/* Where to actually study. Quiet on purpose: it is a reminder that the app is
   NOT the source, so it must not out-shout the work above it. */
.first{background:var(--deep);border:1px dashed var(--line);border-radius:16px;
  padding:16px;margin-top:var(--gap)}
.first .fh{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;
  color:var(--warm);margin-bottom:10px}
.first .step{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.first .step .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--raised);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:800;color:var(--warm);font-variant-numeric:tabular-nums}
.first .step .t{font-size:13.5px;line-height:1.45}
.first .step .t b{color:var(--text);font-weight:700}
.first .step .t span{color:var(--muted)}
/* The folded study-path line: same plate, one line, a real button. */
.firstfold{width:100%;cursor:pointer;text-align:left;font:inherit;color:inherit;display:block}
.first .tail{font-size:12.5px;color:var(--muted);margin-top:var(--gap-row);line-height:1.45;
  padding-top:10px;border-top:1px solid var(--line-soft)}
/* Locked-in: one chip per subject, carrying that subject's colour. */
.locked{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.lk{display:flex;align-items:baseline;gap:7px;min-height:var(--tap);padding:9px 14px;
  border-radius:999px;border:1px solid var(--line);background:var(--deep);
  color:var(--text);font:inherit;border-left:3px solid var(--pc-fg,var(--ac-fg))}
.lk .ln{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:600}
.lk .lt{font-size:12.5px;color:var(--muted);font-weight:600}
/* Trophies: earned, permanent, never currency. */
.trophies{display:flex;flex-direction:column;gap:8px}
.trophy{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:15px;
  background:var(--surface);border:1px solid var(--line-soft)}
.trophy .ti{font-size:21px;flex:0 0 auto}
.trophy .tn{flex:1;font-size:13.5px;font-weight:600;line-height:1.3}
.trophy .tk{font-size:11.5px;color:var(--faint);letter-spacing:.04em;flex:0 0 auto}
.gz-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.gz-chip{min-height:var(--tap);padding:9px 14px;border-radius:999px;border:1px solid var(--line);
  background:var(--deep);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The selected chip: accent wash and accent border carry the selection; the
   text stays --text. --ac-fg over --ac-8 on the light paper measured 4.41:1
   with the aqua accent — the same wash trap .felt hit — so the accent is
   never the text here. Measured by tools/contrast_gzchip.js. */
.gz-chip.on{background:var(--ac-8);border-color:var(--ac);color:var(--text)}
.gz-chips.units{margin-top:8px}
/* A folded Growth Zone row: question and ladder only; tap the head to open. */
.miss .mhead{display:block;width:100%;background:none;border:0;padding:0;margin:0;text-align:left;
  color:inherit;font:inherit;cursor:pointer;min-height:var(--tap)}
.miss.fold .q{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.miss .box .chev{margin-left:auto;font-style:normal;font-weight:400;color:var(--faint);font-size:12px}
.miss .mhead+.a,.miss .mhead+.graph,.miss .mhead+svg{margin-top:8px}

.sandbox-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:12px;padding:10px 14px;border:1.5px dashed var(--warm);border-radius:14px;
  color:var(--warm);font-size:13px;font-weight:600}
.sandbox-banner .btn{width:auto;min-height:36px;padding:7px 12px;font-size:13px;flex-shrink:0}

.perch{display:flex;align-items:flex-end;gap:10px;margin-bottom:14px}
.perch.tap{cursor:pointer}
.perch .pet{font-size:36px;line-height:1;flex-shrink:0;animation:pet-bob 3.4s ease-in-out infinite}
@keyframes pet-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.perch .pet{animation:none}}
.bubble{position:relative;flex:1;background-color:var(--surface);
  background-image:linear-gradient(120deg,var(--ac-14),transparent 72%);
  border:1px solid var(--ac-25);box-shadow:0 0 14px -5px var(--ac);
  border-radius:16px 16px 16px 5px;padding:11px 14px;
  font-family:'Fraunces',Georgia,serif;font-style:italic;
  font-size:14px;line-height:1.5;color:var(--text)}
/* The companion arrives, it doesn't just appear: a gentle rise plus one
   brighter pulse of the glow to say "new line". Reduced motion gets stillness. */
@media (prefers-reduced-motion: no-preference){
  #screen.enter .perch{animation:perch-in .45s cubic-bezier(.2,.7,.3,1) both}
  #screen.enter .bubble{animation:bubble-hello 2.2s ease-out .25s 1}
}
@keyframes perch-in{from{opacity:0;transform:translateY(9px) scale(.97)}}
@keyframes bubble-hello{0%{box-shadow:0 0 24px -2px var(--ac)}100%{box-shadow:0 0 14px -5px var(--ac)}}
.bubble::before{content:'';position:absolute;left:-5px;bottom:14px;width:9px;height:9px;
  background:var(--surface);border-left:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
  transform:rotate(45deg)}
.bubble .who{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ac-fg);margin-bottom:3px}
.modal-box .perch{margin:14px 0 0;text-align:left}

.step{display:flex;gap:10px;align-items:flex-start;margin:9px 0}
.step .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--ac-14);color:var(--ac-fg);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.step p{margin:0;font-size:14px;line-height:1.5}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;margin-bottom:var(--gap)}
/* background-color, not the shorthand: the gradient's first stop is --ac-8, so
   the shorthand left the card 8% transparent at its top-left and the starfield
   showed through behind the eyebrow. Opaque base, same gradient, same look. */
.card.ac{border-color:var(--ac-25);background-color:var(--surface);
  background-image:linear-gradient(165deg,var(--ac-8),var(--surface) 60%)}
/* Direction A's card wash, and it MUST sit after .card.ac rather than with the
   other subj-a rules: .card.ac sets background-image at the same specificity,
   so the subject gradient written earlier was silently replaced by the accent
   one — the eyebrow and rules went subject-coloured while the card stayed
   accent, which is the bug this pair of selectors fixes. Both forms are listed
   because .card.subj-a alone (0,2,0) still loses to .card.ac.
   background-color is deliberately NOT set: .card.ac.brief / .daycard carry the
   glass mix that lets the comet through, at the same specificity as this rule
   and earlier in the sheet, so setting it here would quietly make the two top
   cards opaque again. */
.card.subj-a,.card.ac.subj-a{
  border-color:color-mix(in srgb,var(--pc) 34%,transparent);
  background-image:linear-gradient(165deg,color-mix(in srgb,var(--pc) 13%,transparent),var(--surface) 62%)}
.card.quiet{background:transparent;border-style:dashed}
.card h2{font-size:23px;margin-bottom:6px}
.card h3{font-size:18px;margin-bottom:6px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.card p:last-child{margin-bottom:0}
.card p.lede{color:var(--text);font-size:16px}

button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
.btn{min-height:var(--tap);border-radius:14px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--ac);color:#04141a}
.btn-secondary{background:var(--raised);color:var(--text);border:1px solid var(--line)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line-soft)}
.btn-row{display:flex;gap:12px;margin-top:8px}
.btn-row .btn{width:auto;flex:1}
.inrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;margin-top:16px}
.inrow label{margin-top:0}
/* Breathing room between stacked buttons — thumbs need margins. */
.btn+.btn,.btn-row+.btn,.btn+.btn-row,.mrow+.btn{margin-top:var(--gap-row)}
.btn-row .btn+.btn{margin-top:0}
.btn-sm{min-height:var(--tap);padding:8px 14px;font-size:13px;width:auto;border-radius:11px}
/* ---- Paper study guide ---- */
.door{width:100%;display:flex;align-items:center;gap:13px;min-height:var(--tap);
  padding:14px;margin-bottom:10px;border:1px solid var(--line);border-radius:16px;
  background-color:var(--surface);text-align:left;color:inherit}
.door .dn{font-size:22px;flex:0 0 auto}
.door .db{flex:1;min-width:0}
.door .db b{display:block;font-weight:600;font-size:15px}
.door .db small{display:block;color:var(--faint);font-size:12.5px;
  line-height:1.5;margin-top:3px}
.grow{width:100%;display:flex;align-items:center;gap:8px;padding:7px 0;
  border-top:1px solid var(--line)}
.grow:first-child{border-top:0}
.grow .gn{flex:0 0 26px;font-size:12.5px;color:var(--faint);text-align:right}
.gopt{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gopt button{min-height:var(--tap);border-radius:11px;border:1px solid var(--line);
  background-color:var(--surface);color:var(--muted);font-weight:700;font-size:14px}
.gopt button.on{background-color:var(--ac);border-color:var(--ac);color:var(--ac-on,#12100a)}
.gbar{position:sticky;bottom:0;padding:12px 0 4px;background:linear-gradient(
  to top, var(--ink) 62%, transparent)}
.wq{border-top:1px solid var(--line);padding:13px 0}
.wq:first-child{border-top:0}
.wq .qh{font-size:14px;line-height:1.5;font-weight:600}
.wq .picked{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.55}
.wq .picked b{color:var(--good);font-weight:600}
.btn[disabled]{opacity:.5;pointer-events:none}

nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb, var(--ink) 92%, transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:660px;margin:0 auto;display:flex}
.nav-btn{flex:1;min-height:var(--tap);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.03em}
.nav-btn .ic{font-size:18px;line-height:1;position:relative}
.nav-btn .ic .dot{position:absolute;top:-2px;right:-7px;min-width:15px;height:15px;padding:0 4px;
  border-radius:8px;background:var(--ac);color:color-mix(in srgb, var(--ac) 22%, #000);font-size:9.5px;font-weight:800;
  line-height:15px;text-align:center}
/* Active tab: a tinted pill as well as the colour — colour is never the
   sole signal, and the nav was the one place it still was. */
.nav-btn.on{color:var(--ac-fg);background:var(--ac-8);border-radius:14px}
/* A right answer's feedback is tappable — say so quietly on press. */
.explain.go-on{cursor:pointer}
.explain.go-on:active{transform:scale(.99)}
/* The live period's progress through itself. White on the painted fill —
   the row's scrim already guarantees the surface. */
.period .pleft{height:3px;border-radius:2px;background:rgba(255,255,255,.28);
  margin-top:7px;overflow:hidden;max-width:160px}
.period .pleft i{display:block;height:100%;background:rgba(255,255,255,.92);border-radius:2px}

.period{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);margin-bottom:var(--gap-row);border-left:3px solid var(--pc,var(--line))}
.period.now{border-color:var(--ac);background:linear-gradient(100deg,var(--ac-14),var(--surface));border-left-color:var(--ac)}
.period.done{opacity:.4}
.period .ic{font-size:19px;width:24px;text-align:center;flex-shrink:0}
.period .meta{flex:1;min-width:0}
.period .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period .dt{font-size:12.5px;color:var(--faint)}
.period .tm{font-size:12.5px;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.tag-now{background:var(--ac);color:#04141a;font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.09em}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--pc-fg,var(--ac-fg));border-radius:16px;padding:15px;min-height:var(--tap);text-align:left;display:flex;flex-direction:column;gap:4px}
.tile:active{transform:scale(.985)}
.tile .ic{font-size:21px}
.tile .nm{font-weight:600;font-size:14px;line-height:1.3}
.tile .ct{font-size:11.5px;color:var(--faint)}

/* ---- subject identity: texture layers painted over the subject's own colour ---- */
.subj{--pl:rgba(255,255,255,.15);--fill:linear-gradient(150deg,var(--c1),var(--c2));
  color:#fff;position:relative;overflow:hidden;border-color:transparent}
/* Bottom scrim keeps label text legible over any hue she picks; the soft top
   highlight is what stops the fill reading as flat. Text sits above both. */
.subj::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%),
             linear-gradient(to top,rgba(0,0,0,.42),transparent 62%)}
.subj > *{position:relative;z-index:1}
.subj .ct,.subj .dt,.subj .tm{color:rgba(255,255,255,.88)}
.subj .nm,.subj .term,.subj .def{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.pat-algeo{background-image:
  linear-gradient(var(--pl) 1px,transparent 1px),
  linear-gradient(90deg,var(--pl) 1px,transparent 1px),
  var(--fill); background-size:16px 16px,16px 16px,cover}
.pat-english{background-image:
  repeating-linear-gradient(180deg,transparent 0 16px,var(--pl) 16px 17px),
  linear-gradient(90deg,transparent 22px,rgba(255,255,255,.34) 22px 23px,transparent 23px),
  var(--fill); background-size:auto,auto,cover}
.pat-bio{background-image:
  radial-gradient(circle,var(--pl) 1.7px,transparent 2.1px),
  var(--fill); background-size:17px 17px,cover}
.pat-physics{background-image:
  repeating-radial-gradient(circle at 12% 118%,transparent 0 14px,var(--pl) 14px 15px),
  var(--fill); background-size:auto,cover}
.pat-history{background-image:
  repeating-linear-gradient(90deg,var(--pl) 0 2px,transparent 2px 15px),
  var(--fill); background-size:auto,cover}
.pat-latin{background-image:
  repeating-linear-gradient(45deg,var(--pl) 0 2px,transparent 2px 13px),
  var(--fill); background-size:auto,cover}
.pat-theatre{background-image:
  repeating-linear-gradient(90deg,var(--pl) 0 1px,transparent 1px 11px),
  var(--fill); background-size:auto,cover}
.pat-lunch{background-image:var(--fill);background-size:cover}
/* Paired dots on the diagonal — two points of contact, distinct from Biology's
   single dot grid. */
.pat-asl{background-image:
  radial-gradient(circle at 28% 28%,var(--pl) 1.6px,transparent 2px),
  radial-gradient(circle at 72% 72%,var(--pl) 1.6px,transparent 2px),
  var(--fill); background-size:18px 18px,18px 18px,cover}
/* Schedule rows: a colour wash bleeding in from the left plus a painted icon
   chip. Enough character to read as "this is Physics" without eight saturated
   bars fighting each other. The current period still gets the full fill. */
/* Bookends are not classes, so they keep the neutral slate wash their palette
   gives them and sit quieter than the coloured subject rows around them. */
.period.bookend .nm{font-weight:600;color:var(--muted)}
.period.bookend.now .nm,.period.bookend.now .dt{color:#fff}
.period.bookend .pchip{box-shadow:none;opacity:.92}
.period.tinted{background-image:none;color:var(--text);
  background:linear-gradient(90deg,
    color-mix(in srgb, var(--c1) 30%, var(--surface)) 0%,
    color-mix(in srgb, var(--c1) 10%, var(--surface)) 38%,
    var(--surface) 78%);
  border:1px solid var(--line-soft);border-left:3px solid var(--c1)}
.pchip{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:19px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.22)}
/* the emoji is this element's own text, so the scrim would paint over it */
.pchip::after{display:none}
.period.subj.now{background-image:var(--fill);border-color:transparent;color:#fff}
.period.subj.now::after{display:block}
.period.subj.now .dt,.period.subj.now .tm{color:rgba(255,255,255,.88)}
.period.subj.now .pchip{background:rgba(255,255,255,.2);box-shadow:none}

.bar{height:8px;background:var(--deep);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ac);border-radius:999px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.bar.warm > i{background:var(--warm)}
/* countdown for timed quizzes — turns urgent in the last five seconds */
.qtimer-track{height:6px;background:var(--deep);border-radius:999px;overflow:hidden;margin-top:8px}
.qtimer-track > i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .12s linear}
.qtimer-track > i.low{background:var(--bad)}

.flip{perspective:1500px;margin:14px 0}
/* Grid-stacked faces (not absolute): the card grows to fit its tallest face,
   so a graph or a long bulleted definition never gets clipped. */
.flip-in{position:relative;width:100%;min-height:290px;display:grid;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
/* Left-aligned like a ruled page — centered text reads as a poster, not
   study material. The watermark and tap-cue stay centered underneath. */
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:28px 24px 44px;display:flex;flex-direction:column;align-items:stretch;justify-content:center;text-align:left;border:1px solid var(--line);overflow:hidden}
/* :not(.subj) so a subject-painted card keeps its own texture — a plain
   `background` shorthand here would wipe the pattern layers. */
.face:not(.subj){background:var(--surface)}
.face.back{transform:rotateY(180deg)}
.face.back:not(.subj){background:linear-gradient(165deg,var(--ac-14),var(--deep));border-color:var(--ac-25)}
.face .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:130px;opacity:.045;pointer-events:none;user-select:none}
.face .term{font-family:'Fraunces',serif;font-size:27px;line-height:1.25;position:relative;text-align:center}
/* The respelling under a term. Deliberately NOT the serif the term wears —
   it is a pronunciation aid, not more of the language, and the change of face
   is what says so. Read at 13px, so it holds the 4.5:1 bar on both surfaces. */
.face .saidas{align-self:center;max-width:100%;margin-top:10px;font-size:13px;line-height:1.4;
  text-align:center;letter-spacing:.03em;color:var(--faint);position:relative}
/* On a painted face the fill is a gradient, and the ::after scrim only guards
   the BOTTOM of the card — the respelling sits mid-face, where it measured as
   low as 2.45:1 over the lighter palettes. So it carries its own plate, the
   same move .eq already makes. background-color, never the shorthand: a
   shorthand here would wipe the pattern layers. */
.face.subj .saidas{color:#fff;background-color:rgba(0,0,0,.42);
  border-radius:9px;padding:5px 11px}
.face .def{font-size:16px;line-height:1.65;position:relative}
/* The straightforward answer leads each definition in bold. */
.def b,.explain p b,.o b{font-weight:800}
/* Formulas set like a textbook: serif italics, not code. */
.face .eq{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:500;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:17.5px;letter-spacing:.02em;position:relative}
.face .hint{margin-top:14px;font-size:13px;color:var(--ac-fg);position:relative}
/* A card's only route to an external video (ASL signs) — a real button, not
   a link buried in the def, and never smaller than the tap-target floor. */
.face .watchb{margin-top:14px;align-self:flex-start;min-height:var(--tap);padding:0 16px;
  border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.22);color:inherit;
  font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:7px;position:relative}
.face.subj .watchb{background:rgba(0,0,0,.32);border-color:rgba(255,255,255,.28);color:#fff}
/* A verified sign video, embedded right in place — 16:9, cropped to fit
   whichever card it sits in (a painted flashcard face or a plain review
   row), never letting the iframe's own size dictate the layout. */
.vidwrap{position:relative;width:100%;padding-top:56.25%;margin-top:14px;
  border-radius:12px;overflow:hidden;background:#000}
.vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
/* A fingerspelling handshape reference. White plate so the dark line art
   stays legible over any subject colour or theme. */
.signimg{align-self:center;width:150px;max-width:60%;margin-top:14px;padding:10px;
  background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.signimg img{display:block;width:100%;height:auto}
.face .tap{position:absolute;bottom:15px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.face.subj .tap{color:rgba(255,255,255,.6)}
.face.subj .hint{color:#fff;opacity:.92}
.face.subj .eq{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.28)}
.face .subjtag{position:absolute;top:14px;left:16px;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.65)}
.face.back .wm{display:none}

.opt{width:100%;text-align:left;min-height:var(--tap);padding:14px 16px;margin-bottom:var(--gap-row);border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
/* Passage excerpts render as a scrap torn out of the book: cream paper in BOTH
   themes (a physical object doesn't change colour in the dark), fixed dark-brown
   ink (#3a3022 on the deepest cream ≈ 9:1), Fraunces upright like a printed page.
   The torn top/bottom edges are a clip-path with px-offset points so the tear
   depth stays constant however tall the excerpt runs; drop-shadow (not
   box-shadow) so the shadow follows the jagged clip. */
.passage{font-family:'Fraunces',Georgia,serif;position:relative;color:#3a3022;
  background:
    radial-gradient(ellipse at 15% 8%,rgba(133,101,55,.10),transparent 55%),
    radial-gradient(ellipse at 88% 94%,rgba(133,101,55,.13),transparent 50%),
    linear-gradient(173deg,#f8f1df 0%,#f2e8cf 60%,#ecdfc0 100%);
  padding:20px 20px 22px;margin:14px 3px 8px;
  font-size:15.5px;line-height:1.7;white-space:pre-line;
  transform:rotate(-.5deg);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.28));
  clip-path:polygon(0 12px,3% 5px,7% 10px,12% 2px,18% 9px,24% 4px,31% 11px,38% 3px,45% 8px,52% 2px,59% 10px,66% 5px,73% 12px,80% 4px,86% 9px,92% 3px,97% 8px,100% 5px,
    100% calc(100% - 10px),96% calc(100% - 4px),90% calc(100% - 11px),83% calc(100% - 3px),76% calc(100% - 9px),69% calc(100% - 4px),62% calc(100% - 12px),55% calc(100% - 5px),48% calc(100% - 10px),41% calc(100% - 3px),34% calc(100% - 8px),27% calc(100% - 12px),20% calc(100% - 4px),14% calc(100% - 10px),8% calc(100% - 3px),3% calc(100% - 9px),0 calc(100% - 6px))}
/* On the light canvas the cream scrap needs a warmer, stronger shadow to separate. */
[data-theme="light"] .passage{filter:drop-shadow(0 2px 3px rgba(74,55,25,.35))}

/* Day stepper: two buttons side by side, each still a full tap target. */

/* An item that is happening TODAY, sitting in a list that also holds future
   ones. The accent rule and tint make it findable without reading; the word
   "Today" is still written in the row, so the highlight only reinforces a
   label that was already there — it is never the sole carrier of meaning.
   Tint is --ac-8, the same 8% wash used elsewhere, so body text over it keeps
   its measured contrast. */
.row.now{background:var(--ac-8);border-left:3px solid var(--ac-fg);
  padding-left:10px;border-radius:0 10px 10px 0;margin:2px 0}
.row.now .k{font-weight:650}
.navrow{display:flex;gap:10px;margin-top:8px}
.navrow .btn{flex:1;margin:0}

/* ---- The day dashboard ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.tile{padding:14px 10px;text-align:center;margin:0}
.tile .n{font-family:'Fraunces',Georgia,serif;font-size:27px;font-weight:700;
  color:var(--ac-fg);line-height:1.05}
.tile .l{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-top:5px}
.tile .s{font-size:11.5px;color:var(--faint);margin-top:3px}
/* Accuracy meter. Track is an accent tint, fill is the accent itself — both
   decorative: every number it represents is also written out in text. */
.meter{height:6px;border-radius:3px;background:var(--ac-14);overflow:hidden;margin-top:9px}
.meter i{display:block;height:100%;background:var(--ac);border-radius:3px}
/* One answered question: marker, the question, then what she picked. */
.qcap{display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:12.5px;color:var(--faint)}
.qtog{background:none;border:0;padding:11px 0;min-height:var(--tap);
  color:var(--ac-fg);font-size:12.5px;font-weight:600;text-align:right}
.qline{display:flex;gap:9px;padding:9px 0;border-top:1px solid var(--line)}
.qline:first-child{border-top:0}
.qline .mk{flex:0 0 16px;font-weight:700;font-size:14px;line-height:1.5}
.qline .mk.ok{color:var(--good)}
.qline .mk.no{color:var(--warm)}
.qline .tx{flex:1;font-size:13px;line-height:1.5}
.qline .tx small{display:block;color:var(--faint);font-size:12.5px;margin-top:3px}
.qline .tx small b{font-weight:600;color:var(--good)}
/* ---- The day, as one list ----
   This screen used to be three inventories of the same sessions sorted three
   different ways, each in its own card: 18 cards and 3.7 screens of scroll for
   an ordinary evening, with the same score printed six times. It is now one
   spine — sessions in a single card, each opening to everything about it. */
.daylist{padding:2px 14px}
.sesblock{border-top:1px solid var(--line)}
.sesblock:first-child{border-top:0}
.sesrow{width:100%;display:flex;align-items:center;gap:11px;min-height:var(--tap);
  padding:11px 0;background:none;border:0;text-align:left;color:inherit}
.sesrow .tl{flex:1;min-width:0}
.sesrow .nm{font-weight:600;font-size:14px;line-height:1.35}
.sesrow .mt{font-size:11.5px;color:var(--faint);line-height:1.45;margin-top:2px}
.sesrow .score{flex-shrink:0;text-align:right;line-height:1.25}
.sesrow .score b{display:block;font-weight:700;font-size:14px}
.sesrow .score i{display:block;font-style:normal;font-size:11.5px;color:var(--faint)}
/* The affordance was a grey glyph the same colour as the meta text, so nothing
   said the rows opened. Rows with nothing under them are no longer buttons at
   all, rather than disabled ones that look identical to live ones. */
.exp{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--ac-fg)}
.sesblock.open .exp{background-color:var(--ac-8);border-color:var(--ac)}
.subhead{padding:13px 0 9px;border-top:1px solid var(--line)}
.subhead:first-child{border-top:0}
.subhead .k{font-weight:700}
.felt{margin:0 0 10px;padding:10px 12px;border-radius:12px;background-color:var(--ac-8)}
.felt .row:first-child{padding-top:0}
.felt .hintline{color:var(--muted)}
/* Worth a word: at most two, and each one opens the session it is about. */
.sig{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;
  background:none;border:0;color:inherit;padding:9px 0;min-height:var(--tap)}
.sig+.sig{border-top:1px solid var(--line)}
.sig .bd{flex:1;min-width:0}
.sig .bd b{display:block;font-weight:600;font-size:14px;line-height:1.45}
.sig .bd small{display:block;color:var(--faint);font-size:12.5px;
  line-height:1.5;margin-top:3px}
.sig .go{flex:0 0 auto;color:var(--ac-fg);font-size:16px;font-weight:600}

/* ---- Analogies (kind:'analogy') ---- */
/* The stem of a test-style analogy: A : B :: ? : ?. Rendered as its own
   plate rather than an ordinary question heading, because the shape IS the
   instruction — she has met this format on standardized tests and should
   recognise it instantly. Caps + letterspacing is the convention those tests
   use for the stem pair; the options stay lowercase, same as the real thing.
   Underneath it is an ordinary multiple choice, so shuffling, the miss
   ladder and qstats all work untouched. */
.analogy{font-family:'Fraunces',Georgia,serif;text-align:center;
  padding:15px 10px 16px;margin:12px 2px 4px;
  border-top:1px solid var(--ac-25);border-bottom:1px solid var(--ac-25);
  background:var(--ac-8);border-radius:6px;
  font-size:18px;font-weight:600;letter-spacing:.07em;line-height:1.55;
  text-transform:uppercase;color:var(--ac-fg)}
.analogy .cln{opacity:.5;padding:0 .28em;font-weight:400}
.analogy .dbl{opacity:.75;padding:0 .34em;letter-spacing:.02em}
.analogy .blank{opacity:.42;letter-spacing:.16em}
@media (max-width:360px){.analogy{font-size:16px;letter-spacing:.04em}}

/* ---- The Bookshelf ---- */
/* Spines are a SOLID colour — each series' SUBJECT_PALETTE deep (g2) darkened
   15% in spineEl(), which puts white labels at ≥5.3:1 across all twelve
   (texture was tried and read as noise at spine size — Chris, 2026-08).
   Depth comes from the inset shading, not from any pattern. */
.shelf{display:flex;align-items:flex-end;gap:12px;padding:0 8px;flex-wrap:wrap}
.spine{position:relative;width:54px;height:150px;border:0;border-radius:5px 9px 9px 5px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;
  background-color:var(--raised);
  box-shadow:inset -7px 0 10px rgba(0,0,0,.30), inset 2px 0 0 rgba(255,255,255,.16), 0 3px 6px rgba(0,0,0,.30)}
.spine .snm{writing-mode:vertical-rl;font-family:'Fraunces',Georgia,serif;font-size:12.5px;
  font-weight:600;color:#fff;letter-spacing:.02em;max-height:80%;overflow:hidden;
  line-height:1.35;position:relative;z-index:2;
  text-shadow:0 1px 3px rgba(0,0,0,.55)}
.spine .sct{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-size:9.5px;
  font-weight:800;color:rgba(255,255,255,.9);z-index:2;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.spine .ribbon{position:absolute;top:0;right:7px;width:10px;height:32px;z-index:3;
  background-color:var(--ac);clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.35)}
.shelfboard{height:10px;border-radius:3px;margin:-2px 4px 16px;background-color:var(--raised);
  border:1px solid var(--line);box-shadow:0 4px 7px rgba(0,0,0,.22)}
/* The table of contents inside a book: one row per lesson, one expanded card. */
/* ---- The topic map ----
   The shelf's contents, drawn as a path rather than a list. A topic is seven
   lessons and a review — a finish line she can see — where an XP bar never
   ends. Every state is still derived from qstat coverage; nothing new is
   stored, and nothing is ever locked. */
.tmap{position:relative;display:flex;flex-direction:column;gap:2px;
  padding:4px 0 2px;margin-bottom:12px}
/* A LEFT RAIL, not an alternating zigzag. The zigzag left roughly 165px a side
   at 390px, and River's lesson titles ("2-2 Estimate Sums and Differences")
   wrapped to four lines and collided with the spine. A single rail still reads
   as a path and gives the title the whole width. */
.tmap::before{content:'';position:absolute;left:23px;top:22px;bottom:22px;width:2px;
  background:linear-gradient(to bottom,transparent,var(--line) 10%,
  var(--line) 90%,transparent)}
.stop{display:flex;align-items:center;gap:13px;
  width:100%;padding:7px 4px;background:none;border:0;color:inherit;
  font:inherit;text-align:left;min-height:var(--tap);border-radius:12px}
.stop:focus-visible{outline:2px solid var(--ac-fg);outline-offset:2px}
.stop .sbody{flex:1;min-width:0}
.stop .pip{flex:0 0 40px;width:40px;height:40px;border-radius:50%;
  border:2px solid var(--line);background-color:var(--deep);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--faint);position:relative;z-index:1}
.stop .pip.part{border-color:var(--ac-25);color:var(--ac-fg)}
.stop .pip.done{border-color:#f2ca63;background-color:#f2ca63;color:#2a1c00}
/* The open lesson has to be unmistakable AT THE ROW — the 4px pip ring alone
   measured as near-invisible (8% alpha), which is how a mis-tap went unnoticed:
   nothing at the tap point visibly changed. Full-row wash + accent title now;
   .s deliberately steps up from --faint to --muted over the wash (the same
   tint trap .felt hit in v84 — --faint measured 4.30:1 over --ac-8). */
.stop.here{background-color:var(--ac-8)}
.stop.here .t{color:var(--ac-fg)}
.stop.here .s{color:var(--muted)}
.stop.here .pip{box-shadow:0 0 0 4px var(--ac-8);border-color:var(--ac-25)}
.stop.cap .pip{border-style:dashed}
/* Test-prep stops wear the gold ring on the map, so a study guide reads as
   its own kind of stop at a glance. A DONE prep stop keeps the full gold
   done pip — done outranks prep. */
.stop.prep .pip{border-color:#f2ca63}
/* display:block matters — these are spans, and inline spans run the title and
   its sub-label together on one line. */
.stop .t{display:block;font-size:14px;font-weight:600;line-height:1.35}
.stop.todo .t{color:var(--muted)}
.stop .s{display:block;font-size:11.5px;color:var(--faint);margin-top:2px}
.stop .cov{display:block;height:4px;border-radius:2px;background:var(--line-soft);
  margin-top:6px;overflow:hidden;max-width:170px}
.stop .cov i{display:block;height:100%;background:var(--ac);border-radius:2px}
/* The crest marks a topic that is genuinely over — see capstoneOf(). */
.tcrest{display:flex;align-items:center;gap:13px;padding:14px;border-radius:16px;
  border:1px solid var(--line);background-color:var(--deep);margin-bottom:12px}
.tcrest.won{border-color:#f2ca63;background-color:color-mix(in srgb,#f2ca63 10%,transparent)}
.tcrest .sig{flex:0 0 46px;height:46px;border-radius:50%;border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:21px;
  filter:grayscale(1) opacity(.6)}
.tcrest.won .sig{border-color:#f2ca63;filter:none}
.tcrest .ct{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:600}
.tcrest .cs{font-size:12.5px;color:var(--faint);margin-top:2px;line-height:1.45}
.tocrow{width:100%;display:flex;align-items:center;gap:12px;min-height:var(--tap);
  padding:12px 14px;border:1px solid var(--line);border-radius:14px;
  background-color:var(--surface);margin-bottom:var(--gap-row);text-align:left;font-size:14px}
.tocrow .st{width:22px;text-align:center;flex-shrink:0;color:var(--muted)}
/* Signed up is a fact (green tick); starred is a wish (accent star). The glyph
   already tells them apart — the colour only reinforces it. */
.tocrow .st.reg{color:var(--good);font-weight:800}
.tocrow .st.want{color:var(--ac-fg);font-weight:800}
.tocrow .tl{flex:1;line-height:1.35}
.tocrow .mt{font-size:11.5px;color:var(--faint);flex-shrink:0}
/* A finished book's spine title turns gilt — measured ≥4.5:1 on every
   darkened spine colour. State, never a reward. */
.spine.gilt .snm,.spine.gilt .sct{color:#f8e7b4}
/* Mode tiles — the three doors into a unit, drawn rather than labelled: a
   fanned stack for flashcards, a marked sheet for the quiz, a stopwatch at
   full sprint for Beat the clock. background-color only (the background
   shorthand wipes pattern layers elsewhere); tinted through the --ac vars so
   every subject colours its own set. */
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mrow.three{grid-template-columns:repeat(3,1fr)}
.mtile{display:flex;flex-direction:column;align-items:center;gap:5px;min-height:96px;
  padding:12px 6px 11px;border:1.5px solid var(--ac-25);border-radius:14px;
  background-color:var(--ac-8);font-weight:700;font-size:12.5px;cursor:pointer}
.mtile svg{width:54px;height:40px;color:var(--ac-fg);overflow:visible}
.mtile small{font-weight:500;font-size:10px;color:var(--faint);letter-spacing:.04em}
/* Match: a 3-across grid of face-down tiles. Face-down is the accent wash;
   face-up is the surface; a found pair keeps its text and goes quiet. Tiles
   are square-ish and never under 44px — they are the only tap targets. */
/* The daily three's squares: lit stars in the accent, said once. */
.dsq{display:inline-flex;gap:4px}
.dsq i{font-style:normal;color:var(--ac-fg);font-size:15px}
.dsq.big{justify-content:center;width:100%;margin:6px 0 2px}
.dsq.big i{font-size:22px}
.card.dailydone .row{align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mt{min-height:96px;border-radius:14px;border:1.5px solid var(--ac-25);background-color:var(--ac-8);
  color:var(--text);font:inherit;font-size:12.5px;font-weight:600;line-height:1.3;padding:8px 7px;
  display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;
  overflow:hidden;word-break:break-word}
.mt .pip{font-size:20px;color:var(--ac-fg);opacity:.7}
.mt.up{background-color:var(--surface);border-color:var(--ac)}
.mt.done{background-color:var(--surface);border-color:var(--line-soft);color:var(--muted);cursor:default}
.mt.t{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:14px}
.mt .txt{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media (prefers-reduced-motion:no-preference){
  .mtile{transition:transform .12s ease}
  .mtile:active{transform:scale(.96)}
  /* The stopwatch runs — one sweeping hand is the whole joke. */
  .mtile .mhand{transform-origin:39px 26px;animation:mtick 2.2s linear infinite}
  @keyframes mtick{to{transform:rotate(360deg)}}
}
/* Hear-it button on flashcard faces — never flips the card. */
.sayb{position:absolute;top:10px;right:12px;z-index:3;min-width:44px;min-height:44px;
  background-color:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.3);border-radius:12px;
  font-size:17px;display:flex;align-items:center;justify-content:center}
/* ---- The visual pass ---- */
/* Living sky: a slow twinkle and the occasional shooting star. Ambient only —
   dark mode, and never under prefers-reduced-motion. */
#app{position:relative;z-index:1}
.skyfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
[data-theme="light"] .skyfx{display:none}
/* Each star is one box-shadow with a 2px blur, so it reads as a point of light
   with a soft edge rather than a hard pixel. Three layers at different scales,
   speeds and phases: the field shimmers instead of pulsing in unison, which is
   what makes it read as sky. Sized and timed to be noticed at a glance — the
   first pass was 2px dots fading between .1 and .45, which nobody ever saw. */
.skyfx .tw{position:absolute;top:0;left:0;width:3px;height:3px;border-radius:50%;background:#fff;
  box-shadow:
    44px 130px 2px 0 #fff,  140px 310px 2px 0 #fff, 330px 90px 2px 0 #fff,  255px 520px 2px 0 #fff,
    64px 660px 2px 0 #fff,  355px 430px 2px 0 #fff, 200px 180px 2px 0 #fff, 20px 400px 2px 0 #fff,
    290px 250px 2px 0 #fff, 120px 580px 2px 0 #fff, 380px 620px 2px 0 #fff,  8px 240px 2px 0 #fff,
    170px 470px 2px 0 #fff, 305px 700px 2px 0 #fff;
  opacity:.6;animation:tw 4.4s ease-in-out infinite}
.skyfx .t2{transform:translate(105px,55px) scale(.8);animation-duration:6.4s;animation-delay:1.4s}
.skyfx .t3{transform:translate(212px,268px) scale(1.15);animation-duration:8.1s;animation-delay:2.9s}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
/* Shooting stars. The head is the bright end of the gradient, so the streak
   points the way it travels. Two of them on offset cycles — one every ~13s,
   which is often enough to catch without becoming the thing you watch. */
.skyfx .shoot{position:absolute;top:12%;left:-14%;width:130px;height:2.5px;border-radius:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35) 55%,#fff);
  box-shadow:0 0 10px 2px rgba(255,255,255,.45);
  transform:rotate(13deg);animation:shoot 26s linear infinite}
.skyfx .s2{top:34%;width:104px;transform:rotate(19deg);animation-duration:26s;animation-delay:13s}
@keyframes shoot{0%,92%{opacity:0;left:-14%;top:10%}93%{opacity:1}100%{opacity:0;left:114%;top:30%}}
.skyfx .aur{position:absolute;top:-12%;left:-25%;right:-25%;height:42%;filter:blur(46px);opacity:.14;
  background:linear-gradient(100deg,#19e3b1,#2b6cd4 55%,#19e3b1);
  animation:aur 19s ease-in-out infinite alternate}
@keyframes aur{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
@media (prefers-reduced-motion: reduce){.skyfx{display:none}}
/* Motion with meaning: lists compose in, presses compress, bars glide. */
@media (prefers-reduced-motion: no-preference){
  #screen.enter>*{animation:rise .22s cubic-bezier(.2,.7,.3,1) both}
  #screen.enter>*:nth-child(2){animation-delay:.03s}
  #screen.enter>*:nth-child(3){animation-delay:.06s}
  #screen.enter>*:nth-child(4){animation-delay:.09s}
  #screen.enter>*:nth-child(n+5){animation-delay:.12s}
  .btn:active,.opt:active,.tile:active,.cardbtn:active,.spine:active{transform:scale(.98)}
}
/* ---- Press ----
   The old press was a 1.5% squeeze, which on a phone is invisible. This is a
   real one: the control drops, darkens and tightens, and comes back on a
   spring rather than a linear fade. Held inside no-preference like every
   other motion in the app.

   Two rules keep it honest: nothing MOVES layout (transform only, so no
   reflow on touch), and the press is on :active only, so a stuck hover state
   on a touch device can never leave a control looking pressed. */
@media (prefers-reduced-motion: no-preference){
  .btn,.opt,.tile,.cardbtn,.spine,.mtile,.rw,.pickrow,.act,.tool,.chip,.back-chip{
    transition:transform .13s cubic-bezier(.2,.8,.3,1), filter .13s ease, box-shadow .13s ease;
    will-change:transform}
  .btn:active,.opt:active,.tile:active,.cardbtn:active,.spine:active,.mtile:active,
  .rw:active,.pickrow:active,.act:active,.tool:active,
  .chip:active,.back-chip:active{
    transform:scale(.955) translateY(1px);filter:brightness(.88)}
  /* The primary action presses deepest — it is the one with the most weight. */
  .btn-primary:active{transform:scale(.94) translateY(1px);filter:brightness(.86)}
  /* A star is a point of light, so it flares instead of dimming. */
  .skystar{transition:transform .13s cubic-bezier(.2,.8,.3,1),filter .13s ease}
  .skystar:active{transform:translate(-50%,-50%) scale(1.35);filter:brightness(1.5)}
  .nav-btn{transition:transform .13s cubic-bezier(.2,.8,.3,1)}
  .nav-btn:active{transform:scale(.9)}
}
@media (prefers-reduced-motion: no-preference){
  .bar i{transition:width .5s cubic-bezier(.2,.7,.3,1)}
}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
/* Hero moments: the thread card leads, modal titles get the display face. */
.cardbtn.hero{border-left:4px solid var(--ac);background-image:linear-gradient(120deg,var(--ac-8),transparent 60%)}
.cardbtn.hero .cb-t{font-size:22px}
.modal-box h3{font-family:'Fraunces',Georgia,serif;font-size:28px;letter-spacing:-.02em}
/* The quiz round as a constellation — gold for right, dim-but-lit for a miss. */
/* ---- The round bar ----
   Every question is a star; answering lights it and draws the line to the one
   before, so a finished round is a shape rather than a row of ticks. A missed
   question still lights its star, just dimmer — nothing breaks and nothing is
   taken away, the same rule the Sky Map runs on.

   Deliberately UNNAMED. The Sky Map names constellations, and one there means
   a week she showed up five days out of seven. A round happens several times a
   day; giving those names too would spend the Sky Map's currency. */
.qband{display:block;width:100%;height:62px;margin-top:9px;overflow:visible}
.qband .seg{stroke:#f2ca63;stroke-width:1.6;fill:none;opacity:.75;stroke-linecap:round}
.qband .seg.miss{stroke:var(--muted);opacity:.5}
.qband .star{fill:var(--line);transition:fill .35s ease}
.qband .star.lit{fill:#f2ca63}
.qband .star.dim{fill:var(--muted)}
.qband .star.now{fill:var(--ac)}
.qband .halo{fill:#f2ca63;opacity:0}
@media (prefers-reduced-motion: no-preference){
  .qband .seg{stroke-dasharray:1;stroke-dashoffset:1;animation:qdraw .5s ease forwards}
  .qband .star.lit,.qband .star.dim{animation:qpop .45s ease}
  .qband .halo.on{animation:qhalo .7s ease forwards}
}
@keyframes qdraw{to{stroke-dashoffset:0}}
@keyframes qpop{0%{transform:scale(.45)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes qhalo{0%{opacity:.45;r:3}100%{opacity:0;r:14}}
/* The round, finished: the same shape it drew, given room, at the top of the
   results. The score is the quiet line underneath rather than a number in a box. */
.qband.drawn{height:104px;margin:2px 0 10px}
.tally{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:13px}
.tally span{padding:7px 13px;border-radius:999px;border:1px solid var(--line-soft);
  font-size:12.5px;color:var(--muted)}
.tally b{color:var(--text);font-weight:700}
/* The tools under a question — hint, calculator, sheet, leave — used to be four
   stacked full-width buttons, roughly 250px of furniture between her and the
   next question. One slim row instead, so the ANSWERS are the only big targets.
   Still >=44px tall; only the width is shared. */
.tools{display:flex;gap:8px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft)}
.tool{flex:1 1 0;min-width:0;min-height:var(--tap);border-radius:13px;
  border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:11.5px;font-weight:600;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;padding:6px 4px;line-height:1.2;
  text-align:center;transition:border-color .15s,color .15s}
.tool .ti{font-size:16px;line-height:1}
.tool small{font-size:11.5px;font-weight:600}
.qstars{display:flex;gap:9px;margin-top:11px;font-size:13px;line-height:1}
.qstars .qs{color:var(--line);transition:color .3s}
.qstars .qs.now{color:var(--ac)}
.qstars .qs.lit{color:#f2ca63}
.qstars .qs.dim{color:var(--muted)}
/* Subject crest: a two-ring badge around the subject mark, slow orbit. */
.crestrow{display:flex;align-items:center;gap:12px;margin-top:4px}
.crestrow h2{margin:0}
.crest{position:relative;width:52px;height:52px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;font-size:23px}
.crest::before{content:'';position:absolute;inset:5px;border-radius:50%;border:2px solid var(--c1);opacity:.9}
.crest::after{content:'';position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--c2);opacity:.55}
@media (prefers-reduced-motion: no-preference){.crest::after{animation:orbit 60s linear infinite}}
@keyframes orbit{to{transform:rotate(360deg)}}
/* Section labels get a quiet star. */
.divider span::before{content:'✦';margin-right:7px;opacity:.5;font-size:8px;vertical-align:1px}
/* An input followed by a button needs air — same 10px-plus rule as stacked
   buttons. Covers the reading form, Mission Control, and any future form. */
.card input+.btn,.card select+.btn,.card textarea+.btn,.card .row+.btn{margin-top:14px}
/* Quick-log chips: one tap for the usual book and the usual minutes. */
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 10px}
.chipbtn{min-height:44px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);
  background-color:var(--raised);font-size:13px;line-height:1.2}
.chipbtn.on{border-color:var(--ac);background-color:var(--ac-8)}
/* Formula sheet rows inside the modal. */
.frow{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.frow .fn{font-size:12.5px;color:var(--faint)}
.frow .eq{margin-top:0}
/* Illustrated empty states. */
.empty .scene{margin-bottom:6px}
/* The Today strip: three numbers that are doors, not a scoreboard. */
/* Flashcard definitions: one idea per line, with air between ideas. */
.def .defline{margin-top:10px}
.def .defline:first-child{margin-top:0;margin-bottom:3px}
.opt.picked{border-color:var(--ac);background:var(--ac-8)}
.opt .ltr{width:24px;height:24px;flex-shrink:0;border-radius:8px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.right .ltr{background:var(--good);color:#04141a;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .ltr{background:var(--bad);color:#2a0810;border-color:var(--bad)}
.explain{border-radius:15px;padding:16px;margin-top:12px;border:1px solid var(--line);background:var(--deep)}
.explain.ok{border-color:var(--good)} .explain.no{border-color:var(--bad)}
.explain .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-fg);font-weight:700;margin-top:12px}
/* Bulleted lists inside content: definitions, questions, and explanations
   preserve their newlines, so "•" lines written in the material render as
   actual lists instead of collapsing into a paragraph. */
.def,.card.ac h3,.explain p,.rev .q,.rev .why,.rev .o,.miss .q,.face .def{white-space:pre-line}
/* Graphs attached to cards/questions. Deliberately paper-coloured in BOTH
   themes — it reads as a printed worksheet, which is the point. */
.graph-wrap{background:#fffdf4;border:1px solid #e0d9c3;border-radius:12px;margin:12px auto 2px;padding:7px 7px 3px;max-width:330px;width:100%;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.graph-wrap svg{display:block;width:100%;height:auto}
.face .graph-wrap{max-width:225px;margin:10px auto 22px;padding:5px 5px 2px}
.rev .graph-wrap{margin:8px 0 6px}
.back-chip{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;margin-bottom:10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.explain .lbl:first-child{margin-top:0}
.explain p{font-size:14px;color:var(--text);margin:4px 0 0}

.scale{display:flex;gap:8px;margin-top:10px}
.scale button{flex:1;min-height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:22px;padding:6px 2px}
.scale button .lb{font-size:9.5px;color:var(--faint);font-weight:600;letter-spacing:.02em;line-height:1.2;text-align:center}
.scale button.on{border-color:var(--ac);background:var(--ac-14)}
.scale button.on .lb{color:var(--ac-fg)}

.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.ring{position:relative;width:236px;height:236px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .cd{font-family:'Fraunces',serif;font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .ph{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac-fg);font-weight:700}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{font-size:40px;opacity:.35;display:block;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .k{font-size:14px}
.row .k small{display:block;font-size:11.5px;color:var(--faint);font-weight:400}
.row .v{font-weight:700;color:var(--ac-fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v.warm{color:var(--warm)} .row .v.bad{color:var(--bad)} .row .v.plain{color:var(--muted)}
label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac-fg);font-weight:700;margin:16px 0 7px}
input,textarea,select{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:13px 14px;font-family:inherit;font-size:16px;min-height:var(--tap)}
textarea{min-height:140px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
.rev{padding:14px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);margin-bottom:var(--gap-row)}
/* Her own cards, listed in the editor. */
.ocrow .oct{font-weight:700;font-size:15px}
.ocrow .ocd{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
.ocrow .btn-row{margin-top:10px}
/* Her deck's stop in a book: no coverage bar, and a mark of its own so it
   never reads as lesson N. */
.tmap .stop.own .pip{background:var(--deep);border-color:var(--ac-fg);font-size:13px}
.rev.cut{opacity:.42}
.rev .q{font-size:14px;font-weight:600;margin-bottom:8px;padding-right:34px}
.rev .o{font-size:13px;color:var(--muted);padding:3px 0 3px 18px;position:relative;line-height:1.45}
.rev .o.flat{padding-left:0}
.rev .o.yes{color:var(--good);font-weight:600}
.rev .o.yes:before{content:'✓';position:absolute;left:0}
.rev .why{font-size:12.5px;color:var(--faint);margin-top:7px;line-height:1.5}
.rev-more{display:block;background:none;border:0;color:var(--ac-fg);font:inherit;
  font-size:12.5px;font-weight:600;padding:9px 0 2px;min-height:var(--tap);text-align:left;width:100%}
/* A card being reviewed may point at an external video (ASL signs) — the one
   place in the review queue a parent needs to actually check the link, not
   just read that it exists. */
.rev-watch{display:flex;align-items:center;min-height:var(--tap);color:var(--ac-fg);
  font-size:12.5px;font-weight:700;text-decoration:none;margin-top:4px}
.rev .cut-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:9px;
  background:var(--raised);border:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1}
.rev{position:relative}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.shot{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:8px;
  background:rgba(0,0,0,.62);color:#fff;font-size:13px;line-height:1;border:none}
.shot .n{position:absolute;bottom:0;left:0;right:0;padding:3px 6px;font-size:10px;font-weight:700;
  background:rgba(0,0,0,.55);color:#fff}
.evt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:var(--gap-row);border-radius:15px;
  background:color-mix(in srgb, var(--ac) 10%, var(--surface));border:1px solid var(--ac);
  border-left-width:3px}
.evt .pchip{flex-shrink:0}
.evt .meta{flex:1;min-width:0}
.evt .nm{font-size:14px;font-weight:700}
.evt .dt{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.evt .tm{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ac-fg);text-transform:uppercase;
  flex-shrink:0;text-align:right}
.evt.quiet{background:var(--surface);border-color:var(--line);border-left-color:var(--muted)}
/* A club she signed up for is HERS, not the school's. It takes the quiet plate
   so it never competes with a pinned school event — two accent-washed rows on
   one day is two focal points — but keeps an accent rule on the left so the
   day still reads as one of hers among the school's. */
.evt.club{background:var(--surface);border-color:var(--line);border-left-color:var(--ac-fg)}
.evt.club .tm{color:var(--muted)}
.evt.quiet .tm{color:var(--muted)}
.prov{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;padding:2px 7px;border-radius:7px;vertical-align:middle;white-space:nowrap}
/* Opaque fills, not tints over whatever happens to be behind: a badge lands on
   plain cards, accent-washed cards and review rows, and a translucent fill made
   the 10px label drop under 4.5:1 on the lighter ones. */
.prov.src{background:color-mix(in srgb, var(--good) 6%, var(--surface));color:var(--good);
  border:1px solid color-mix(in srgb, var(--good) 45%, var(--surface))}
.prov.add{background:color-mix(in srgb, var(--muted) 5%, var(--surface));color:var(--muted);
  border:1px solid color-mix(in srgb, var(--muted) 38%, var(--surface))}
.cite{font-size:12.5px;color:var(--muted);margin:10px 0;line-height:1.5;
  padding-left:10px;border-left:2px solid var(--line)}
.cite + p{margin-top:12px}
.objs{list-style:none;padding:0;margin:8px 0 0}
.objs li{position:relative;padding:5px 0 5px 20px;font-size:14px;line-height:1.5}
.objs li:before{content:'→';position:absolute;left:0;color:var(--ac-fg);font-weight:700}
.objs li .prov{margin-left:6px}
.hintline{font-size:12.5px;color:var(--faint);margin:7px 0 var(--gap-row);line-height:1.5}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw{width:44px;height:44px;border-radius:14px;border:2px solid transparent;position:relative}
.sw.on{border-color:var(--text)}
.sw::after{content:'';position:absolute;inset:5px;border-radius:9px;background:var(--c)}
.emoji-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.emoji-pick button{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px}
.emoji-pick button.on{border-color:var(--ac);background:var(--ac-14)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:var(--gap-row);margin-bottom:var(--gap)}
.bdg{text-align:center;padding:13px 6px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);opacity:.3}
.bdg.got{opacity:1;border-color:var(--ac-25);background:var(--ac-8)}
.bdg .ic{font-size:25px;display:block}
.bdg .nm{font-size:10.5px;font-weight:600;margin-top:5px;line-height:1.25}
.pill{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);margin:0 5px 5px 0}
/* Test prep stands out (Chris, 2026-08): any unit flagged prep:true — or a
   paper guide, which is test prep by definition — wears an unmissable gold
   band and a gold card edge. Opaque fill per the badge rule; the ink is the
   same measured pair .pip.done already ships (#2a1c00 on #f2ca63, ≈11:1),
   identical in both themes on purpose — like the note-from-home post-it,
   this reads as a physical object, not theme chrome. */
.card.prepcard{border-color:#f2ca63;border-width:2px}
.prepband{display:inline-flex;align-items:center;gap:6px;background:#f2ca63;color:#2a1c00;
  font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 10px;border-radius:8px;margin-bottom:10px}
.prepband .pb-ic{font-size:12px;letter-spacing:0}
.pill.ac{background:var(--ac-8);border-color:var(--ac-25);color:var(--ac-fg)}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad);color:var(--bad)}
