<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04141a">
<title>Ad Astra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#04141a; --deep:#072027; --surface:#0b2a32; --raised:#10373f;
  --line:#1b4a54; --line-soft:#133b44;
  --text:#e9f4f1; --muted:#8fb0ab; --faint:#5b807b;
  --ac:#6fe3cd;                     /* personalized accent — set from prefs */
  --warm:#f2c48a; --bad:#ff8f9e; --good:#6fe3cd;
  --r:20px; --tap:48px;
  --ac-8:color-mix(in srgb, var(--ac) 8%, transparent);
  --ac-14:color-mix(in srgb, var(--ac) 14%, transparent);
  --ac-25:color-mix(in srgb, var(--ac) 25%, transparent);
  --ac-ink:color-mix(in srgb, var(--ac) 22%, #04141a);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  font-size:16px; line-height:1.55; letter-spacing:-.005em;
  min-height:100vh; overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(70% 45% at 15% -5%, var(--ac-14), transparent 70%),
    radial-gradient(60% 40% at 95% 12%, rgba(242,196,138,.07), transparent 70%),
    radial-gradient(80% 50% at 50% 105%, color-mix(in srgb, var(--ac) 7%, transparent), transparent 70%);
}
#app{position:relative;z-index:1;max-width:660px;margin:0 auto;padding:0 18px 128px}
h1,h2,h3,.display{font-family:'Fraunces',Georgia,serif;font-weight:500;letter-spacing:-.015em;margin:0;line-height:1.15}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);font-weight:700;opacity:.85}

header{padding:22px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.avatar{width:44px;height:44px;border-radius:14px;background:var(--ac-14);border:1px solid var(--ac-25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;cursor:pointer;position:relative}
.avatar::after{content:'⚙';position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--raised);border:1px solid var(--line);font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.avatar:active{transform:scale(.95)}
.brand h1{font-size:24px}
.brand .sub{font-size:11px;color:var(--faint);letter-spacing:.06em;margin-top:1px}
.hdr{display:flex;gap:6px;flex-shrink:0}
.chip{background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ac{border-color:var(--ac-25);color:var(--ac);background:var(--ac-8)}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card.ac{border-color:var(--ac-25);background:linear-gradient(165deg,var(--ac-8),var(--surface) 60%)}
.card.quiet{background:transparent;border-style:dashed}
.card h2{font-size:23px;margin-bottom:6px}
.card h3{font-size:18px;margin-bottom:6px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.card p:last-child{margin-bottom:0}
.card p.lede{color:var(--text);font-size:16px}

button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
.btn{min-height:var(--tap);border-radius:14px;padding:13px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s ease,opacity .15s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--ac);color:#04141a}
.btn-secondary{background:var(--raised);color:var(--text);border:1px solid var(--line)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line-soft)}
.btn-row{display:flex;gap:10px;margin-top:4px}
.btn-row .btn{width:auto;flex:1}
.btn-sm{min-height:40px;padding:8px 14px;font-size:13px;width:auto;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}

nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:color-mix(in srgb, var(--ink) 92%, transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:660px;margin:0 auto;display:flex}
.nav-btn{flex:1;min-height:var(--tap);padding:10px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.03em}
.nav-btn .ic{font-size:18px;line-height:1}
.nav-btn.on{color:var(--ac)}

.period{display:flex;align-items:center;gap:13px;padding:13px 15px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);margin-bottom:8px;border-left:3px solid var(--pc,var(--line))}
.period.now{border-color:var(--ac);background:linear-gradient(100deg,var(--ac-14),var(--surface));border-left-color:var(--ac)}
.period.done{opacity:.4}
.period .ic{font-size:19px;width:24px;text-align:center;flex-shrink:0}
.period .meta{flex:1;min-width:0}
.period .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period .dt{font-size:12px;color:var(--faint)}
.period .tm{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.tag-now{background:var(--ac);color:#04141a;font-size:9px;font-weight:800;padding:3px 8px;border-radius:999px;letter-spacing:.09em}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--pc,var(--ac));border-radius:16px;padding:15px;min-height:var(--tap);text-align:left;display:flex;flex-direction:column;gap:4px}
.tile:active{transform:scale(.985)}
.tile .ic{font-size:21px}
.tile .nm{font-weight:600;font-size:14.5px;line-height:1.3}
.tile .ct{font-size:11.5px;color:var(--faint)}

/* ---- subject identity: texture layers painted over the subject's own colour ---- */
.subj{--pl:rgba(255,255,255,.15);--fill:linear-gradient(150deg,var(--c1),var(--c2));
  color:#fff;position:relative;overflow:hidden;border-color:transparent}
/* Bottom scrim keeps label text legible over any hue she picks; the soft top
   highlight is what stops the fill reading as flat. Text sits above both. */
.subj::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 45%),
             linear-gradient(to top,rgba(0,0,0,.42),transparent 62%)}
.subj > *{position:relative;z-index:1}
.subj .ct,.subj .dt,.subj .tm{color:rgba(255,255,255,.88)}
.subj .nm,.subj .term,.subj .def{text-shadow:0 1px 3px rgba(0,0,0,.3)}
.pat-algeo{background-image:
  linear-gradient(var(--pl) 1px,transparent 1px),
  linear-gradient(90deg,var(--pl) 1px,transparent 1px),
  var(--fill); background-size:16px 16px,16px 16px,cover}
.pat-english{background-image:
  repeating-linear-gradient(180deg,transparent 0 16px,var(--pl) 16px 17px),
  linear-gradient(90deg,transparent 22px,rgba(255,255,255,.34) 22px 23px,transparent 23px),
  var(--fill); background-size:auto,auto,cover}
.pat-bio{background-image:
  radial-gradient(circle,var(--pl) 1.7px,transparent 2.1px),
  var(--fill); background-size:17px 17px,cover}
.pat-physics{background-image:
  repeating-radial-gradient(circle at 12% 118%,transparent 0 14px,var(--pl) 14px 15px),
  var(--fill); background-size:auto,cover}
.pat-history{background-image:
  repeating-linear-gradient(90deg,var(--pl) 0 2px,transparent 2px 15px),
  var(--fill); background-size:auto,cover}
.pat-latin{background-image:
  repeating-linear-gradient(45deg,var(--pl) 0 2px,transparent 2px 13px),
  var(--fill); background-size:auto,cover}
.pat-theatre{background-image:
  repeating-linear-gradient(90deg,var(--pl) 0 1px,transparent 1px 11px),
  var(--fill); background-size:auto,cover}
.pat-lunch{background-image:var(--fill);background-size:cover}
/* compact schedule rows: subject colour as an edge, texture only when it is "now" */
.period.subj{background-image:none;background:var(--surface);color:var(--text);
  border:1px solid var(--line-soft);border-left:3px solid var(--pc)}
.period.subj::after{display:none}
.period.subj.now{background-image:var(--fill);border-color:transparent;color:#fff}
.period.subj.now::after{display:block}
.period.subj.now .dt{color:rgba(255,255,255,.85)}

.bar{height:8px;background:var(--deep);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--ac);border-radius:999px;transition:width .55s cubic-bezier(.2,.8,.2,1)}
.bar.warm > i{background:var(--warm)}

.flip{perspective:1500px;margin:14px 0}
.flip-in{position:relative;width:100%;min-height:290px;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);overflow:hidden}
/* :not(.subj) so a subject-painted card keeps its own texture — a plain
   `background` shorthand here would wipe the pattern layers. */
.face:not(.subj){background:var(--surface)}
.face.back{transform:rotateY(180deg)}
.face.back:not(.subj){background:linear-gradient(165deg,var(--ac-14),var(--deep));border-color:var(--ac-25)}
.face .wm{position:absolute;font-size:130px;opacity:.045;pointer-events:none;user-select:none}
.face .term{font-family:'Fraunces',serif;font-size:29px;line-height:1.2;position:relative}
.face .def{font-size:16px;line-height:1.6;position:relative}
.face .eq{font-family:ui-monospace,Menlo,monospace;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;padding:9px 13px;margin-top:12px;font-size:14.5px;position:relative}
.face .hint{margin-top:14px;font-size:13px;color:var(--ac);position:relative}
.face .tap{position:absolute;bottom:15px;font-size:10.5px;color:var(--faint);letter-spacing:.12em;text-transform:uppercase}
.face.subj .tap{color:rgba(255,255,255,.6)}
.face.subj .hint{color:#fff;opacity:.92}
.face.subj .eq{background:rgba(0,0,0,.22);border-color:rgba(255,255,255,.28)}
.face .subjtag{position:absolute;top:14px;left:16px;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;font-weight:800;color:rgba(255,255,255,.65)}
.face.back .wm{display:none}

.opt{width:100%;text-align:left;min-height:var(--tap);padding:14px 16px;margin-bottom:9px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px;display:flex;gap:12px;align-items:flex-start;line-height:1.45}
.opt .ltr{width:24px;height:24px;flex-shrink:0;border-radius:8px;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.opt.right .ltr{background:var(--good);color:#04141a;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.opt.wrong .ltr{background:var(--bad);color:#2a0810;border-color:var(--bad)}
.explain{border-radius:15px;padding:16px;margin-top:12px;border:1px solid var(--line);background:var(--deep)}
.explain.ok{border-color:var(--good)} .explain.no{border-color:var(--bad)}
.explain .lbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin-top:12px}
.explain .lbl:first-child{margin-top:0}
.explain p{font-size:14px;color:var(--text);margin:4px 0 0}

.scale{display:flex;gap:8px;margin-top:10px}
.scale button{flex:1;min-height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:22px;padding:6px 2px}
.scale button .lb{font-size:9.5px;color:var(--faint);font-weight:600;letter-spacing:.02em;line-height:1.2;text-align:center}
.scale button.on{border-color:var(--ac);background:var(--ac-14)}
.scale button.on .lb{color:var(--ac)}

.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.ring{position:relative;width:236px;height:236px}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .cd{font-family:'Fraunces',serif;font-size:52px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .ph{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);font-weight:700}

.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty .ic{font-size:40px;opacity:.35;display:block;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .k{font-size:14px}
.row .k small{display:block;font-size:11.5px;color:var(--faint);font-weight:400}
.row .v{font-weight:700;color:var(--ac);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v.warm{color:var(--warm)} .row .v.bad{color:var(--bad)} .row .v.plain{color:var(--muted)}
label{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:700;margin:16px 0 7px}
input,textarea,select{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:13px;color:var(--text);padding:13px 14px;font-family:inherit;font-size:16px;min-height:var(--tap)}
textarea{min-height:140px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ac)}
.hintline{font-size:12.5px;color:var(--faint);margin-top:7px;line-height:1.5}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.sw{width:44px;height:44px;border-radius:14px;border:2px solid transparent;position:relative}
.sw.on{border-color:var(--text)}
.sw::after{content:'';position:absolute;inset:5px;border-radius:9px;background:var(--c)}
.emoji-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.emoji-pick button{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:22px}
.emoji-pick button.on{border-color:var(--ac);background:var(--ac-14)}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.bdg{text-align:center;padding:13px 6px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);opacity:.3}
.bdg.got{opacity:1;border-color:var(--ac-25);background:var(--ac-8)}
.bdg .ic{font-size:25px;display:block}
.bdg .nm{font-size:10.5px;font-weight:600;margin-top:5px;line-height:1.25}
.pill{display:inline-block;font-size:11px;padding:4px 10px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);margin:0 5px 5px 0}
.pill.ac{background:var(--ac-8);border-color:var(--ac-25);color:var(--ac)}
.pill.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad);color:var(--bad)}
.pill.warm{background:color-mix(in srgb,var(--warm) 12%,transparent);border-color:var(--warm);color:var(--warm)}

.miss{padding:14px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--bad);margin-bottom:9px}
.miss .q{font-size:14.5px;font-weight:600;margin-bottom:5px}
.miss .a{font-size:13px;color:var(--good)}
.miss .n{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.5}
.divider{display:flex;align-items:center;gap:13px;margin:24px 0 14px;color:var(--ac)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.divider span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85}

.plan{padding:15px;border-radius:16px;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--pc,var(--ac));margin-bottom:10px}
.plan .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.plan .nm{font-weight:600;font-size:15px}
.plan .mins{font-size:12px;font-weight:700;color:var(--ac);white-space:nowrap}
.plan .why{font-size:13px;color:var(--muted);line-height:1.5}

.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.gl{background:var(--deep);border:1px solid var(--line-soft);border-radius:13px;padding:11px 6px;text-align:center}
.gl .gi{font-size:15px;line-height:1}
.gl .gv{font-family:'Fraunces',serif;font-size:22px;color:var(--ac);margin-top:3px;line-height:1.1}
.gl .gk{font-size:10px;color:var(--faint);margin-top:1px;line-height:1.25}

.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px}
.spark div{flex:1;background:var(--ac-25);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark div.has{background:var(--ac)}
.sparklbl{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:5px}

.modal-overlay{position:fixed;inset:0;background:rgba(2,10,13,.8);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:90vw;width:370px;max-height:82vh;overflow-y:auto}
.modal-box h3{font-size:22px;margin-bottom:9px}
.modal-box p{color:var(--muted);font-size:14.5px;white-space:pre-wrap;margin:0}
.modal-buttons{display:flex;gap:10px;margin-top:22px}
.modal-buttons .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:1100;background:var(--raised);border:1px solid var(--ac-25);color:var(--text);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.confetti{position:fixed;pointer-events:none;z-index:900;width:8px;height:8px;border-radius:2px;animation:fall 1.5s ease-out forwards}
@keyframes fall{to{transform:translateY(-150px) rotate(220deg);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <div class="avatar" id="avatar">✦</div>
      <div>
        <h1 id="brandName">Ad Astra</h1>
        <div class="sub" id="brandSub"></div>
      </div>
    </div>
    <div class="hdr">
      <span class="chip ac" id="chipXp">0 XP</span>
      <span class="chip" id="chipStreak">🔥 0</span>
    </div>
  </header>
  <main id="screen"></main>
</div>

<nav><div class="nav-inner" id="nav"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ==========================================================================
   AD ASTRA v2 — Sedona's learning lab
   Single file, no build step. localStorage + optional private Gist sync.
   ========================================================================== */

/* ---------- Arizona time (no DST — never derive "today" from toISOString) ---------- */
const AZ = {
  tz:'America/Phoenix',
  today(){ return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(new Date()); },
  dateKey(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(d); },
  nowMinutes(){
    const p = new Intl.DateTimeFormat('en-US',{timeZone:this.tz,hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    return (+p.find(x=>x.type==='hour').value)*60 + (+p.find(x=>x.type==='minute').value);
  },
  weekday(ds){ const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).getDay(); },
  pretty(ds){ const [y,m,d]=ds.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); },
  shortDate(ds){ const [y,m,d]=ds.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); },
  daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); },

function migrate(d){

const Sync = {
  get gistId(){ return Store.get('gist_id',''); },
  get token(){ return Store.get('gist_token',''); },
  filename:'ad-astra-data.json',
  configured(){ return !!(this.gistId && this.token); },
  headers(){ return {'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github+json'}; },
  async pullRemote(){
    const res = await fetch(`https://api.github.com/gists/${this.gistId}`,{headers:this.headers()});
    if(!res.ok) throw new Error('Gist fetch failed: '+res.status);
    const g = await res.json(); const f = g.files[this.filename];
    if(!f) return { v:SCHEMA_VERSION, records:{} };
    const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    return migrate(JSON.parse(text||'{"records":{}}'));
  },
  merge(local, remote){
    const out = { v:SCHEMA_VERSION, records:{...(remote.records||{})} };
    for(const [id,rec] of Object.entries(local.records||{})){
      const r = out.records[id];
      if(!r || (rec.updatedAt||0) > (r.updatedAt||0)) out.records[id] = rec;
    }
    const cutoff = Date.now() - 60*86400000;
    for(const [id,rec] of Object.entries(out.records)) if(rec.deleted && rec.updatedAt < cutoff) delete out.records[id];
    return out;
  },
  async save(){
    if(!this.configured()) throw new Error('NO_SYNC');
    let merged = DATA;
    try{ merged = this.merge(DATA, await this.pullRemote()); }catch(e){}
    const res = await fetch(`https://api.github.com/gists/${this.gistId}`,{
      method:'PATCH', headers:{...this.headers(),'Content-Type':'application/json'},
      body: JSON.stringify({files:{[this.filename]:{content:JSON.stringify(merged,null,2)}}}) });
    if(!res.ok) throw new Error('Gist save failed: '+res.status);
    DATA = merged; saveLocal(); Store.set('last_sync', Date.now()); return merged;
  },
  async load(){
    if(!this.configured()) return DATA;
    try{ DATA = this.merge(DATA, await this.pullRemote()); saveLocal(); Store.set('last_sync',Date.now()); }catch(e){}
    return DATA;
  }
};

/* ---------- Derived stats (never stored — cannot drift between devices) ---------- */
const logs  = () => all('log').sort((a,b)=>b.at-a.at);
const focusLogs = () => all('focus').sort((a,b)=>b.at-a.at);

function stats(){
  const L = logs(), F = focusLogs();
  let xp=0,correct=0,answered=0,seconds=0;
  const days = new Set();
  L.forEach(l=>{ xp+=l.xp||0; correct+=l.correct||0; answered+=l.total||0; seconds+=l.seconds||0; days.add(l.date); });
  F.forEach(f=>{ xp+=f.xp||0; seconds+=(f.minutes||0)*60; days.add(f.date); });
  all('affirm').forEach(a=>{ xp += a.xp||0; });   // reading the morning line counts
  return { xp, level:Math.floor(xp/500)+1, intoLevel:xp%500, toNext:500-(xp%500),
    correct, answered, seconds, accuracy: answered?Math.round(correct/answered*100):0,
    days:days.size, streak:streakFrom(days), sessions:L.length,
    focusMin: F.reduce((s,f)=>s+(f.minutes||0),0) };
}
function streakFrom(daySet){
  let n=0, cur=AZ.today();
  if(!daySet.has(cur)){ cur=AZ.shift(cur,-1); if(!daySet.has(cur)) return 0; }
  while(daySet.has(cur)){ n++; cur=AZ.shift(cur,-1); }
  return n;
}
function classStats(cid){
  const L = logs().filter(l=>l.classId===cid);
  const F = focusLogs().filter(f=>f.classId===cid);
  let c=0,t=0,xp=0,sec=0;
  L.forEach(l=>{c+=l.correct||0;t+=l.total||0;xp+=l.xp||0;sec+=l.seconds||0;});
  F.forEach(f=>{xp+=f.xp||0;sec+=(f.minutes||0)*60;});
  const last = [...L,...F].sort((a,b)=>b.at-a.at)[0];
  return { sessions:L.length, correct:c, answered:t, xp, minutes:Math.round(sec/60),
    accuracy: t?Math.round(c/t*100):null, lastOn: last?last.date:null };
}
function minutesInRange(from,to,cid){
  let s=0;
  logs().forEach(l=>{ if(l.date>=from&&l.date<=to&&(!cid||l.classId===cid)) s+=(l.seconds||0)/60; });
  focusLogs().forEach(f=>{ if(f.date>=from&&f.date<=to&&(!cid||f.classId===cid)) s+=f.minutes||0; });
  return Math.round(s);
}
function recentAccuracy(days){
  const from = AZ.shift(AZ.today(), -days);
  const L = logs().filter(l=>l.date>=from && l.total);
  if(!L.length) return null;
  const c = L.reduce((s,l)=>s+l.correct,0), t = L.reduce((s,l)=>s+l.total,0);
  return t ? Math.round(c/t*100) : null;
}

/* ---------- Study plan (rule-based — always works, no API key needed) ---------- */
function studyPlan(date){
  const out = [];
  STUDY_CLASSES.forEach(c=>{
    const st = classStats(c.id);
    const gz = all('miss').filter(m=>m.classId===c.id).length;
    const nextA = assessments().find(a=>a.classId===c.id && a.date>=date && !a.score);
    const daysOut = nextA ? AZ.daysBetween(date, nextA.date) : null;
    const sinceStudied = st.lastOn ? AZ.daysBetween(st.lastOn, date) : null;
    const hasUnits = units(c.id).some(u=>u.id!=='unit-orientation');

    let score = 0; const reasons = [];
    if(daysOut !== null && daysOut <= 14){
      score += (15 - daysOut) * 6;
      reasons.push(daysOut === 0 ? `${KINDS[nextA.kind].nm.toLowerCase()} is today`
                : daysOut === 1 ? `${KINDS[nextA.kind].nm.toLowerCase()} tomorrow`
                : `${KINDS[nextA.kind].nm.toLowerCase()} in ${daysOut} days`);
    }
    if(gz){ score += gz*4; reasons.push(`${gz} question${gz>1?'s':''} in your Growth Zone`); }
    if(st.accuracy !== null && st.accuracy < 70){ score += (70-st.accuracy); reasons.push(`accuracy is ${st.accuracy}%`); }
    if(sinceStudied !== null && sinceStudied >= 5){ score += sinceStudied*2; reasons.push(`not studied in ${sinceStudied} days`); }
    if(sinceStudied === null && hasUnits){ score += 12; reasons.push('never studied yet'); }

    const goal = prefs().goals[c.id];
    if(goal){
      const wk = minutesInRange(AZ.weekStart(date), date, c.id);
      if(wk < goal){ score += Math.min(20,(goal-wk)/2); reasons.push(`${wk} of ${goal} min this week`); }
    }
    if(score <= 0) return;
    out.push({ classId:c.id, score,
      minutes: score>=60?40 : score>=30?25 : 15,
      why: reasons.slice(0,2).join(' · '),
      hasUnits, assess:nextA });
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,3);
}

const earned = () => new Set(all('badge').map(b=>b.badgeId));
function checkBadges(){
  const s = stats(), have = earned(), fresh = [];
  BADGES.forEach(b=>{ if(!have.has(b.id) && b.check(s)){
    put({id:'badge_'+b.id,type:'badge',badgeId:b.id,earnedOn:AZ.today()}); fresh.push(b); } });
  if(fresh.length){ celebrate(); toast(`${fresh[0].ic} ${fresh[0].nm} unlocked`); }
  return fresh;
}
/* Calibration: how close her pre-quiz readiness was to the score she got. */
function calibrationPairs(){
  const pre = all('mood').filter(m=>m.when==='pre' && m.logId);
  return pre.map(m=>{
    const l = DATA.records[m.logId];
    if(!l || !l.total) return null;
    return { predicted: m.readiness*20, actual: Math.round(l.correct/l.total*100), date:m.date };
  }).filter(Boolean);
}
const calibrationHits = () => calibrationPairs().filter(p=>Math.abs(p.predicted-p.actual)<=10).length;

/* ---------- UI helpers (createElement only — never innerHTML with data) ---------- */
function el(tag,cls,text){ const n=document.createElement(tag);
  if(cls) n.className=cls; if(text!==undefined&&text!==null) n.textContent=String(text); return n; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2600); }
/* `build(box, close)` may set `box._go` to take over the confirm button —
   used by the forms (assessment editor, passcode) so they can validate first. */
function showModal({title,message,confirmText='OK',cancelText=null,onConfirm=null,build=null}){
  const ov=el('div','modal-overlay'), box=el('div','modal-box');
  box.appendChild(el('h3',null,title));
  if(message) box.appendChild(el('p',null,message));
  const close = ()=>ov.remove();
  if(build) build(box, close);
  const row=el('div','modal-buttons');
  if(cancelText){ const c=el('button','btn btn-secondary',cancelText);
    c.addEventListener('click',close); row.appendChild(c); }
  const ok=el('button','btn btn-primary',confirmText);
  ok.addEventListener('click',()=>{
    if(typeof box._go === 'function'){ box._go(); return; }   // form owns close()
    close(); if(onConfirm) onConfirm();
  });
  row.appendChild(ok); box.appendChild(row); ov.appendChild(box);
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.body.appendChild(ov); return ov;
}
function celebrate(){
  const ac = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  const cols=[ac,'#f2c48a','#ffffff',ac];
  for(let i=0;i<26;i++){
    const c=el('div','confetti');
    c.style.left=Math.random()*100+'vw'; c.style.top=(58+Math.random()*28)+'vh';
    c.style.background=cols[i%cols.length]; c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),2000);
  }
  if(navigator.vibrate) navigator.vibrate(18);
}
function shuffle(a){ const b=a.slice();
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }
const uid = p => p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
function divider(text){ const d=el('div','divider'); d.appendChild(el('span',null,text)); return d; }
function headline(title,sub){ const d=el('div','card ac');
  d.appendChild(el('h2',null,title)); if(sub) d.appendChild(el('p',null,sub)); return d; }
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}

   ['⏱️', wkMin, 'min this week'],

    glance.appendChild(b);
  });
  lvl.appendChild(glance);
  root.appendChild(lvl);

  /* Upcoming assessments */
  const up = upcomingAssessments(date, 21);
  if(up.length){
    root.appendChild(divider('Coming up'));
    const ac = el('div','card');
    up.slice(0,5).forEach(a=>{
      const c = CLASS_BY_ID[a.classId], k = KINDS[a.kind]||KINDS.test;
      const d = AZ.daysBetween(date, a.date);
      const r = el('div','row');
      const kk = el('span','k',`${k.ic} ${a.title}`);

      r.appendChild(v); ac.appendChild(r);

  /* Schedule — this is what Chris and Kat check to know where she is, so it
     renders every day. On a non-school day it shows as her standing timetable
     rather than being hidden entirely. */
  const schoolDay = !weekend && !closed && date>=CAL.firstDay && date<=CAL.lastDay;
  root.appendChild(divider(schoolDay ? "Today's schedule" : 'Her school day'));
  if(!schoolDay){

      : 'No classes today — this is her normal weekday timetable.'));

  const now = AZ.nowMinutes();

  if(ms){
    root.appendChild(divider('On the horizon'));
    const c = el('div','card');
    const r = el('div','row');
    r.appendChild(el('span','k',`${ms.icon} ${ms.name}`));

      r2.appendChild(el('span','v plain',`${AZ.daysBetween(date,q.end)} days`)); c.appendChild(r2); }
    root.appendChild(c);
  }
};

let cardState = {start:0};
SCREENS.cards = function(root){
  const u = DATA.records[ctx.unitId];
  if(!u || !u.cards.length) return go('unit',{classId:ctx.classId});
  if(!cardState.start || cardState.unitId!==u.id)
    cardState = {unitId:u.id,i:0,flipped:false,start:Date.now(),seen:new Set(),order:shuffle(u.cards.map((_,i)=>i))};
  const card = u.cards[cardState.order[cardState.i]], cls = CLASS_BY_ID[ctx.classId];

  const head = el('div','card');
  head.appendChild(el('div','eyebrow',u.title));
  const r = el('div','row');
  r.appendChild(el('span','k',`Card ${cardState.i+1} of ${u.cards.length}`));
  const seenLabel = el('span','v',`${cardState.seen.size} reviewed`);
  r.appendChild(seenLabel); head.appendChild(r);
  const bar = el('div','bar'), fi = el('i');
  fi.style.width = (cardState.i/u.cards.length*100)+'%'; bar.appendChild(fi); head.appendChild(bar);
  root.appendChild(head);

  /* The card wears its subject: graph paper for maths, ruled paper for English,
     cell dots for Biology, and so on. */
  const flip = el('div','flip'+(cardState.flipped?' on':'')), inner = el('div','flip-in');
  const front = paint(el('div','face front'), cls);
  front.appendChild(el('div','wm', cls?cls.icon:'✦'));
  if(cls) front.appendChild(el('div','subjtag', cls.name));
  front.appendChild(el('div','term',card.term));
  front.appendChild(el('div','tap','Tap to reveal'));
  const back = paint(el('div','face back'), cls);
  back.appendChild(el('div','def',card.def));
  if(card.eq) back.appendChild(el('div','eq',card.eq));
  if(card.hint) back.appendChild(el('div','hint','💡 '+card.hint));
  back.appendChild(el('div','tap','Tap to flip back'));
  inner.appendChild(front); inner.appendChild(back); flip.appendChild(inner);
  // Toggle in place — a full render would rebuild the node and kill the transition.
  flip.addEventListener('click',()=>{
    cardState.flipped=!cardState.flipped; cardState.seen.add(cardState.i);
    flip.classList.toggle('on',cardState.flipped);
    seenLabel.textContent = `${cardState.seen.size} reviewed`;
  });
  root.appendChild(flip);

  const row = el('div','btn-row');
  const prev = el('button','btn btn-secondary','← Back');
  prev.addEventListener('click',()=>{ if(cardState.i>0){cardState.i--;cardState.flipped=false;render();} });
  const next = el('button','btn btn-primary', cardState.i===u.cards.length-1?'Finish ✓':'Next →');
  next.addEventListener('click',()=>{ cardState.seen.add(cardState.i);
    if(cardState.i<u.cards.length-1){cardState.i++;cardState.flipped=false;render();} else finishCards(u); });
  row.appendChild(prev); row.appendChild(next); root.appendChild(row);
  const quit = el('button','btn btn-ghost','Exit');
  quit.addEventListener('click',()=>{cardState.start=0;go('unit',{classId:ctx.classId});});
  root.appendChild(quit);
};
function finishCards(u){
  const secs = Math.round((Date.now()-cardState.start)/1000);
  const xp = Math.min(cardState.seen.size*5,150);
  put({id:uid('log'),type:'log',mode:'cards',classId:ctx.classId,unitId:u.id,
       date:AZ.today(),at:Date.now(),correct:0,total:0,seconds:secs,xp});
  checkBadges(); syncSoon(); celebrate();
  const seen = cardState.seen.size; cardState.start=0;
  showModal({ title:`+${xp} XP`,
    message:`${seen} cards reviewed in ${Math.max(1,Math.round(secs/60))} min.\n\nFlashcards build recognition. The quiz is where you find out what actually stuck.`,
    confirmText:'Take the quiz', cancelText:'Later',
    onConfirm:()=>launchQuiz(u.id,ctx.classId) });
  go('unit',{classId:ctx.classId});
}

/* ================= QUIZ ================= */
let quizState = null;
SCREENS.quiz = function(root){
  const u = DATA.records[ctx.unitId];
  if(!u || !u.questions.length) return go('unit',{classId:ctx.classId});
  if(!quizState || quizState.unitId!==u.id)
    quizState = {unitId:u.id,i:0,correct:0,answered:null,start:Date.now(),
      order:shuffle(u.questions.map((_,i)=>i)),missed:[],hintUsed:false,hints:0,pre:ctx.pre||null};
  const q = u.questions[quizState.order[quizState.i]];

  const head = el('div','card');
  head.appendChild(el('div','eyebrow',`${u.title} · Level ${q.lv||1}`));
  const r = el('div','row');
  r.appendChild(el('span','k',`Question ${quizState.i+1} of ${u.questions.length}`));
  r.appendChild(el('span','v',`${quizState.correct} correct`));
  head.appendChild(r);
  const bar = el('div','bar'), fi = el('i');
  fi.style.width = (quizState.i/u.questions.length*100)+'%'; bar.appendChild(fi); head.appendChild(bar);
  root.appendChild(head);

  const qc = el('div','card ac'); qc.appendChild(el('h3',null,q.q)); root.appendChild(qc);

  q.opts.forEach((text,idx)=>{
    const b = el('button','opt');
    b.appendChild(el('span','ltr',String.fromCharCode(65+idx)));
    b.appendChild(el('span',null,text));
    if(quizState.answered!==null){
      b.disabled = true;
      if(idx===q.ans) b.className='opt right';
      else if(idx===quizState.answered) b.className='opt wrong';
    } else b.addEventListener('click',()=>answer(u,q,idx));
    root.appendChild(b);
  });

  if(quizState.answered===null){
    if(q.hint && !quizState.hintUsed){
      const h = el('button','btn btn-ghost','💡  Give me a hint (−5 XP)');
      h.addEventListener('click',()=>{quizState.hintUsed=true;quizState.hints++;render();});
      root.appendChild(h);
    } else if(q.hint){
      const h = el('div','card'); h.appendChild(el('p',null,'💡 '+q.hint)); root.appendChild(h);
    }
  } else {
    const right = quizState.answered===q.ans;
    const ex = el('div','explain '+(right?'ok':'no'));
    ex.appendChild(el('div','lbl', right?'Correct':'Not quite'));
    ex.appendChild(el('p',null, q.ex?.main || `The answer is ${q.opts[q.ans]}.`));
    if(q.ex?.tip){ ex.appendChild(el('div','lbl','Test tip')); ex.appendChild(el('p',null,q.ex.tip)); }
    if(q.ex?.mnemonic){ ex.appendChild(el('div','lbl','Memory hook')); ex.appendChild(el('p',null,q.ex.mnemonic)); }
    root.appendChild(ex);
    const n = el('button','btn btn-primary', quizState.i===u.questions.length-1?'See results →':'Next question →');
    n.addEventListener('click',()=>{
      if(quizState.i<u.questions.length-1){quizState.i++;quizState.answered=null;quizState.hintUsed=false;render();}
      else finishQuiz(u);
    });
    root.appendChild(n);
  }
  const quit = el('button','btn btn-ghost','Exit quiz');
  quit.addEventListener('click',()=>{quizState=null;go('unit',{classId:ctx.classId});});
  root.appendChild(quit);
};
function answer(u,q,idx){
  quizState.answered = idx;
  const right = idx===q.ans;
  if(right) quizState.correct++;
  /* Per-question tally powers the strong/weak topic breakdown in the parent view. */
  const key = 'qstat_'+u.id+'_'+q.id;
  const prev = DATA.records[key];
  put({ id:key, type:'qstat', unitId:u.id, classId:ctx.classId, qid:q.id, q:q.q,
        attempts:(prev?.attempts||0)+1, correct:(prev?.correct||0)+(right?1:0) });
  if(!right){
    quizState.missed.push(q.id);
    put({ id:'miss_'+u.id+'_'+q.id, type:'miss', unitId:u.id, classId:ctx.classId, qid:q.id,
          q:q.q, right:q.opts[q.ans], chose:q.opts[idx], why:q.ex?.main||'', on:AZ.today() });
  }
  render();
}
function finishQuiz(u){
  const total = u.questions.length, pct = Math.round(quizState.correct/total*100);
  const secs = Math.round((Date.now()-quizState.start)/1000);
  const bonus = pct===100?50 : pct>=80?25 : 0;
  const xp = Math.max(0, quizState.correct*10 + bonus - quizState.hints*5);
  const hintsUsed = quizState.hints, pre = quizState.pre;
  const log = put({ id:uid('log'), type:'log', mode:'quiz', classId:ctx.classId, unitId:u.id,
    date:AZ.today(), at:Date.now(), correct:quizState.correct, total, seconds:secs, xp, hints:hintsUsed });
  if(pre) put({ id:uid('mood'), type:'mood', when:'pre', logId:log.id, classId:ctx.classId,
    unitId:u.id, readiness:pre.readiness, feeling:pre.feeling, date:AZ.today(), at:Date.now() });

  /* Growth Zone items answered right this round clear themselves. */
  all('miss').forEach(m=>{
    if(m.unitId===u.id && !quizState.missed.includes(m.qid)){
      put({id:'cleared_'+m.qid,type:'cleared',qid:m.qid,on:AZ.today()}); softDelete(m.id);
    }
  });
  checkBadges(); syncSoon();
  if(pct>=80) celebrate();

  const missed = quizState.missed.length;
  let calib = '';
  if(pre){
    const predicted = pre.readiness*20, gap = pct - predicted;
    calib = Math.abs(gap) <= 10 ? '\n\nYour gut was right — you predicted about this.'
      : gap > 10 ? '\n\nYou did better than you expected. Worth noticing: your nerves undersell you.'
      : '\n\nYou felt more ready than this turned out. That gap is the useful part — it means reviewing felt like knowing.';
  }
  const msg = (pct===100 ? `Perfect. ${total}/${total}.\n\n+${xp} XP`
    : pct>=80 ? `${quizState.correct}/${total} — strong.\n\n+${xp} XP`
    : pct>=60 ? `${quizState.correct}/${total}. Solid base, a few gaps.\n\n+${xp} XP`
    : `${quizState.correct}/${total}. This one needs another pass — that is information, not a verdict.\n\n+${xp} XP`)
    + (hintsUsed?`\n\n${hintsUsed} hint${hintsUsed>1?'s':''} used (−${hintsUsed*5} XP).`:'')
    + calib + (missed?`\n\n${missed} question${missed>1?'s':''} went to your Growth Zone.`:'');

  quizState = null; ctx._state = null; ctx._pre = null;
  const clsId = ctx.classId;
  showModal({ title:`${pct}%`, message:msg,
    confirmText:'How did that feel?', cancelText:null,
    onConfirm:()=>go('postmood',{logId:log.id, classId:clsId, missed}) });
  go('unit',{classId:clsId});
}

/* Countdown is derived from an absolute end timestamp, not an accumulating
   interval, so locking the phone mid-session does not drift the clock. */
let focusState = null, focusTick = null;
SCREENS.focus = function(root){
  const p = prefs();
  if(!focusState){
    root.appendChild(headline('Focus session','Pick a length, put the phone face down, and do one thing. The timer keeps running if the screen locks.'));
    const c = el('div','card');
    c.appendChild(el('label',null,'Subject'));
    const sel = el('select');
    const none = el('option',null,'Anything'); none.value=''; sel.appendChild(none);
    STUDY_CLASSES.forEach(cl=>{ const o=el('option',null,cl.name); o.value=cl.id;
      if(cl.id===ctx.classId) o.selected=true; sel.appendChild(o); });
    c.appendChild(sel);
    c.appendChild(el('label',null,'Focus length'));
    const row = el('div','btn-row');
    [15,25,50].forEach(m=>{
      const b = el('button','btn '+(p.pomodoro===m?'btn-primary':'btn-secondary'), m+' min');
      b.addEventListener('click',()=>{ setPref('pomodoro',m); render(); });
      row.appendChild(b);
    });
    c.appendChild(row);
    c.appendChild(el('div','hintline','25 minutes is the classic. 50 works better once you are warmed up; 15 is the right size when starting feels hard.'));
    const start = el('button','btn btn-primary','▶  Start '+p.pomodoro+' minutes');
    start.addEventListener('click',()=>{
      focusState = { phase:'focus', classId:sel.value||null, minutes:p.pomodoro,
                     endsAt: Date.now()+p.pomodoro*60000, cycles:0 };
      startTick(); render();
    });
    c.appendChild(start);
    root.appendChild(c);

    const recent = focusLogs().slice(0,5);
    if(recent.length){
      root.appendChild(divider('Recent focus'));
      const rc = el('div','card');
      recent.forEach(f=>{
        const cl = CLASS_BY_ID[f.classId];
        const r = el('div','row');
        const k = el('span','k', cl?`${cl.icon} ${cl.name}`:'Focus');
        k.appendChild(el('small',null,AZ.shortDate(f.date)));
        r.appendChild(k); r.appendChild(el('span','v',f.minutes+' min')); rc.appendChild(r);
      });
      root.appendChild(rc);
    }
    return;
  }

  const remain = Math.max(0, focusState.endsAt - Date.now());
  const totalMs = (focusState.phase==='focus'?focusState.minutes:p.brk)*60000;
  const pctLeft = totalMs ? remain/totalMs : 0;
  const mm = Math.floor(remain/60000), ss = Math.floor((remain%60000)/1000);
  const cl = CLASS_BY_ID[focusState.classId];

  const wrap = el('div','ring-wrap');
  const ring = el('div','ring');
  const NS='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width','236'); svg.setAttribute('height','236');
  const mk = (r,stroke,w,dash)=>{ const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx','118'); c.setAttribute('cy','118'); c.setAttribute('r',r);
    c.setAttribute('fill','none'); c.setAttribute('stroke',stroke); c.setAttribute('stroke-width',w);
    c.setAttribute('stroke-linecap','round');
    if(dash){ c.setAttribute('stroke-dasharray',dash.d); c.setAttribute('stroke-dashoffset',dash.o); }
    return c; };
  const R = 104, C = 2*Math.PI*R;
  svg.appendChild(mk(R,'#133b44',12));
  const acCol = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  svg.appendChild(mk(R, focusState.phase==='focus'?acCol:'#f2c48a', 12, {d:C, o:C*(1-pctLeft)}));
  ring.appendChild(svg);
  const mid = el('div','mid');
  mid.appendChild(el('div','ph', focusState.phase==='focus'?'Focus':'Break'));
  mid.appendChild(el('div','cd', `${mm}:${String(ss).padStart(2,'0')}`));
  if(cl) mid.appendChild(el('div','lb', cl.name));
  ring.appendChild(mid); wrap.appendChild(ring); root.appendChild(wrap);

  const note = el('div','card quiet');
  note.appendChild(el('p',null, focusState.phase==='focus'
    ? 'Phone face down. One task. If a thought about something else shows up, write it on paper and come back — it will still be there in twenty minutes.'
    : 'Stand up, look out a window, drink some water. Do not start anything you will not want to stop.'));
  root.appendChild(note);

  const row = el('div','btn-row');
  const stop = el('button','btn btn-secondary','Stop');
  stop.addEventListener('click',()=>{ endFocus(false); });
  const skip = el('button','btn btn-ghost','Skip ahead');
  skip.addEventListener('click',()=>{ focusState.endsAt = Date.now(); tickFocus(); });
  row.appendChild(stop); row.appendChild(skip); root.appendChild(row);
};
function startTick(){ clearInterval(focusTick); focusTick = setInterval(tickFocus, 1000); }
function tickFocus(){
  if(!focusState){ clearInterval(focusTick); return; }
  if(Date.now() >= focusState.endsAt){
    if(focusState.phase==='focus'){
      const xp = focusState.minutes*2;
      put({ id:uid('focus'), type:'focus', classId:focusState.classId, minutes:focusState.minutes,
            date:AZ.today(), at:Date.now(), xp });
      checkBadges(); syncSoon(); celebrate();
      if(navigator.vibrate) navigator.vibrate([120,60,120]);
      focusState = { ...focusState, phase:'break', cycles:focusState.cycles+1,
                     endsAt: Date.now()+prefs().brk*60000 };
      toast(`+${xp} XP — take ${prefs().brk} minutes`);
    } else {
      if(navigator.vibrate) navigator.vibrate(80);
      endFocus(true); return;
    }
  }
  if(view==='focus') render();
}
function endFocus(completed){
  clearInterval(focusTick);
  const cycles = focusState ? focusState.cycles : 0;
  const cid = focusState ? focusState.classId : null;
  focusState = null;
  if(completed && cycles) toast('Break over — go again or stop here');
  go('focus',{classId:cid});
}

                 : e.message==='BAD_KEY' ? 'That API key was rejected.' : e.message});

      b.disabled = false; b.textContent = 'Ask';

async function askTutor(question){
  const key = Store.get('anthropic_key','');
  if(!key) throw new Error('NO_KEY');
  const s = stats(), date = AZ.today();
  const perClass = STUDY_CLASSES.map(c=>{
    const st = classStats(c.id);
    const gz = all('miss').filter(m=>m.classId===c.id).length;
    const nx = assessments().find(a=>a.classId===c.id && a.date>=date);
    return `- ${c.name}: ${st.accuracy===null?'not studied yet':st.accuracy+'% accuracy over '+st.answered+' questions'}`
      + `, ${st.minutes} min logged, ${gz} in growth zone`
      + (st.lastOn?`, last studied ${st.lastOn}`:'')
      + (nx?`, ${KINDS[nx.kind].nm.toLowerCase()} "${nx.title}" on ${nx.date} (${AZ.daysBetween(date,nx.date)} days away)`:'');
  }).join('\n');
  const moods = all('mood').filter(m=>m.when==='pre').slice(-5);
  const moodLine = moods.length
    ? `Recent pre-quiz readiness ratings (1-5): ${moods.map(m=>m.readiness).join(', ')}.` : '';

  const system = `You are a study coach for Sedona, a sharp 8th grader at BASIS Chandler. You are talking directly to her.

Ground every suggestion in her real data below. Be concrete: name the subject, the number of minutes, and what to actually do in that time. No generic advice like "make a schedule".

Use techniques with real evidence: retrieval practice over rereading, spaced practice over cramming, interleaving, sleep, explaining aloud. Frame effort and strategy, never fixed ability — do not tell her she is smart or talented. Do not be saccharine or use exclamation marks. Be warm, direct, and a little dry. Keep it under 200 words. Plain prose, no headers, no bullet lists.

Today is ${date}.
Overall: level ${s.level}, ${s.xp} XP, ${s.streak}-day streak, ${s.accuracy}% accuracy across ${s.answered} questions, ${Math.round(s.seconds/60)} minutes logged, ${s.focusMin} of those in focus sessions.
By subject:
${perClass}
${moodLine}`;

  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{ 'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:'claude-opus-5', max_tokens:2000, system,
      output_config:{ effort:'low' },
      messages:[{role:'user',content:question}] })
  });
  if(!res.ok) throw new Error(res.status===401?'BAD_KEY':`API error ${res.status}`);
  const data = await res.json();
  if(data.stop_reason==='refusal') throw new Error('The model declined that one.');
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
}

/* Passcode is a SHA-256 hash in localStorage, set on first use. This deters a
   curious 12-year-old; it is not real security and is not claimed to be. */
function openParentGate(){
  const stored = Store.get('parent_hash','');
  if(!stored){
    showModal({ title:'Set a passcode',
      message:'Pick a passcode for the grown-up view. Only you need to know it.',
      confirmText:'Set', cancelText:'Cancel',
      build:(box,close)=>{
        const i = el('input'); i.type='password'; i.placeholder='Passcode'; i.autocomplete='new-password';
        box.appendChild(i); setTimeout(()=>i.focus(),50);
        box._go = async ()=>{
          if(i.value.length<4){ toast('At least 4 characters'); return; }
          Store.set('parent_hash', await sha256(i.value)); close(); toast('Passcode set'); go('parent');
        };
        i.addEventListener('keydown',e=>{ if(e.key==='Enter') box._go(); });
      }});
    return;
  }
  showModal({ title:'Passcode', confirmText:'Open', cancelText:'Cancel',
    build:(box,close)=>{
      const i = el('input'); i.type='password'; i.placeholder='Passcode'; i.autocomplete='current-password';
      box.appendChild(i); setTimeout(()=>i.focus(),50);
      box._go = async ()=>{
        if(await sha256(i.value) === Store.get('parent_hash','')){ close(); go('parent'); }
        else { toast('Not quite'); i.value=''; }
      };
      i.addEventListener('keydown',e=>{ if(e.key==='Enter') box._go(); });
    }});
}

SCREENS.parent = function(root){
  const date = AZ.today(), s = stats();

  const eff = el('div','card');
  [['Study time this week', wkMin+' min'],
   ['Sessions this week', wkSessions],
   ['Current streak', s.streak+' day'+(s.streak===1?'':'s')],
   ['Total time logged', s.seconds>=3600?`${Math.floor(s.seconds/3600)}h ${Math.round(s.seconds%3600/60)}m`:`${Math.round(s.seconds/60)}m`],

  STUDY_CLASSES.forEach(c=>{

    anySub = true;
    const r = el('div','row');
    const k = el('span','k',`${c.icon} ${c.name}`);
    const wk = minutesInRange(wkStart, date, c.id);
    k.appendChild(el('small',null,
      `${wk} min this week${goal?` of ${goal} goal`:''}${st.lastOn?` · last ${AZ.shortDate(st.lastOn)}`:''}`));
    r.appendChild(k);
    const v = el('span','v'+(st.accuracy===null?' plain':st.accuracy<70?' bad':''),

    r.appendChild(v); sub.appendChild(r);
  });
  if(!anySub) sub.appendChild(el('p',null,'No subject activity yet.'));
  root.appendChild(sub);

  /* Strong vs weak topics */
  const qs = all('qstat').filter(q=>q.attempts>=2);
  if(qs.length){
    const weak = qs.filter(q=>q.correct/q.attempts < .7).sort((a,b)=>a.correct/a.attempts-b.correct/b.attempts);
    const strong = qs.filter(q=>q.correct/q.attempts >= .7);
    root.appendChild(divider('Topics'));
    const tc = el('div','card');
    tc.appendChild(el('p',null,`${strong.length} question${strong.length===1?'':'s'} answered reliably, ${weak.length} still shaky (based on 2+ attempts).`));
    if(weak.length){
      tc.appendChild(el('div','eyebrow','Needs another pass'));
      weak.slice(0,8).forEach(q=>{

        tc.appendChild(d);

  /* Wellbeing + calibration */
  const moods = all('mood');

    root.appendChild(divider('How she is feeling'));
    const mc = el('div','card');
    const pre = moods.filter(m=>m.when==='pre'), post = moods.filter(m=>m.when==='post');
    const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';
    const rows = [
      ['Average readiness before quizzes', avg(pre.map(m=>m.readiness))+' / 5'],
      ['Average mood before studying', avg(pre.map(m=>m.feeling))+' / 5'],
      ['Average mood after', avg(post.map(m=>m.feeling))+' / 5']
    ];
    const pairs = calibrationPairs();
    if(pairs.length){
      const gaps = pairs.map(p=>p.actual-p.predicted);
      const mean = Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length);
      rows.push(['Self-assessment accuracy',
        Math.abs(mean)<=10 ? 'Well calibrated' : mean>0 ? `Underestimates by ${Math.abs(mean)}%` : `Overestimates by ${Math.abs(mean)}%`]);

    v.addEventListener('click',()=>editAssessment(a));
    r.appendChild(v); asc.appendChild(r);
  });
  root.appendChild(asc);
  const add = el('button','btn btn-primary','＋  Add a test or quiz');
  add.addEventListener('click',()=>editAssessment(null)); root.appendChild(add);

  /* Weekly goals */
  root.appendChild(divider('Weekly study goals'));
  const gc = el('div','card');
  gc.appendChild(el('p',null,'Minutes per week per subject. These drive the recommendations on her Today screen.'));
  STUDY_CLASSES.forEach(c=>{
    const r = el('div','row');
    r.appendChild(el('span','k',`${c.icon} ${c.name}`));
    const i = el('input'); i.type='number'; i.min='0'; i.step='5'; i.inputMode='numeric';
    i.style.width='96px'; i.style.minHeight='40px'; i.style.textAlign='right';
    i.value = prefs().goals[c.id] || '';
    i.placeholder = '—';
    i.addEventListener('change',()=>{
      const g = {...prefs().goals};

      setPref('goals',g); toast('Goal saved');
    });
    r.appendChild(i); gc.appendChild(r);
  });
  root.appendChild(gc);

  /* Recent sessions */
  root.appendChild(divider('Recent sessions'));
  const rc = el('div','card');
  const recent = [...logs(), ...focusLogs()].sort((a,b)=>b.at-a.at).slice(0,12);
  if(!recent.length) rc.appendChild(el('p',null,'No sessions yet.'));
  recent.forEach(l=>{

    const k = el('span','k', c?`${c.icon} ${c.name}`:'General');

  const chg = el('button','btn btn-ghost','Change passcode');
  chg.addEventListener('click',()=>{ Store.remove('parent_hash'); toast('Passcode cleared'); go('setup'); });
  root.appendChild(chg);

function editAssessment(existing){
  showModal({
    title: existing ? 'Edit' : 'Add a test or quiz',
    confirmText: existing ? 'Save' : 'Add', cancelText:'Cancel',
    build:(box, close)=>{
      const cls = el('select');
      STUDY_CLASSES.forEach(c=>{ const o=el('option',null,c.name); o.value=c.id;
        if(existing && existing.classId===c.id) o.selected=true; cls.appendChild(o); });
      box.appendChild(el('label',null,'Subject')); box.appendChild(cls);

      const kind = el('select');
      Object.entries(KINDS).forEach(([k,v])=>{ const o=el('option',null,v.nm); o.value=k;
        if(existing && existing.kind===k) o.selected=true; kind.appendChild(o); });
      box.appendChild(el('label',null,'Type')); box.appendChild(kind);

      const title = el('input'); title.type='text'; title.placeholder='e.g. Unit 3 vocab quiz';
      title.value = existing?.title || '';
      box.appendChild(el('label',null,'Name')); box.appendChild(title);

      const date = el('input'); date.type='date';
      date.value = existing?.date || AZ.today();
      box.appendChild(el('label',null,'Date')); box.appendChild(date);

      const score = el('input'); score.type='number'; score.min='0'; score.max='100';
      score.inputMode='numeric'; score.placeholder='Leave blank until it comes back';
      if(existing?.score!=null) score.value = existing.score;
      box.appendChild(el('label',null,'Score (%)')); box.appendChild(score);

      box._go = ()=>{
        if(!title.value.trim()){ toast('Give it a name'); return; }
        const sc = score.value===''?null:Math.max(0,Math.min(100,parseInt(score.value,10)));
        put({ id: existing?.id || uid('assess'), type:'assess', classId:cls.value, kind:kind.value,
              title:title.value.trim(), date:date.value, score:sc });
        syncSoon(); close(); toast('Saved'); render();
      };
      if(existing){
        const del = el('button','btn btn-ghost btn-sm','Delete');
        del.style.marginTop='14px'; del.style.width='100%';
        del.addEventListener('click',()=>{ softDelete(existing.id); syncSoon(); close(); toast('Deleted'); render(); });
        box.appendChild(del);
      }
    }
  });
}

const UNIT_SCHEMA = {
  type:'object',
  properties:{
    title:{type:'string'},
    cards:{type:'array',items:{type:'object',
      properties:{term:{type:'string'},def:{type:'string'},hint:{type:'string'},eq:{type:'string'}},
      required:['term','def','hint'],additionalProperties:false}},
    questions:{type:'array',items:{type:'object',
      properties:{ lv:{type:'integer',enum:[1,2,3]}, q:{type:'string'},
        opts:{type:'array',items:{type:'string'}}, ans:{type:'integer',enum:[0,1,2,3]},
        hint:{type:'string'},
        ex:{type:'object',properties:{main:{type:'string'},tip:{type:'string'},mnemonic:{type:'string'}},
            required:['main','tip'],additionalProperties:false}},
      required:['lv','q','opts','ans','hint','ex'],additionalProperties:false}}
  },
  required:['title','cards','questions'], additionalProperties:false
};
async function generateUnit(classId, notes){
  const key = Store.get('anthropic_key','');
  if(!key) throw new Error('NO_KEY');
  const cls = CLASS_BY_ID[classId];
  const system = [
    `You build study material for Sedona, a sharp 8th grader at BASIS Chandler taking ${cls?cls.name:'this class'}.`,
    `Write 15-25 flashcards and 18-24 quiz questions (6-8 each at level 1 recall, level 2 application, level 3 analysis).`,
    `Every question has exactly 4 options and one correct answer.`,
    `Anchor everything to the supplied notes. Do not invent facts they do not support.`,
    `Tone: direct and a little dry. Never condescending. She can handle why something is actually interesting.`,
    `Card hints are memory hooks or mnemonics, never restatements of the definition.`,
    `Explanations say why the right answer is right, not just what it is.`
  ].join(' ');
  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({ model:'claude-opus-5', max_tokens:16000, system,
      output_config:{ effort:'medium', format:{type:'json_schema',schema:UNIT_SCHEMA} },
      messages:[{role:'user',content:`Class notes / study material:\n\n${notes}`}] })
  });
  if(!res.ok){ const t = await res.text();
    throw new Error(res.status===401?'BAD_KEY':`API error ${res.status}: ${t.slice(0,180)}`); }
  const data = await res.json();
  if(data.stop_reason==='refusal') throw new Error('The model declined this content.');
  const parsed = JSON.parse(data.content.filter(b=>b.type==='text').map(b=>b.text).join(''));
  parsed.questions = (parsed.questions||[]).filter(q=>Array.isArray(q.opts)&&q.opts.length===4&&q.ans>=0&&q.ans<4&&q.q);
  parsed.cards = (parsed.cards||[]).filter(c=>c.term&&c.def);
  if(!parsed.questions.length && !parsed.cards.length) throw new Error('Nothing usable came back. Try more detailed notes.');
  parsed.cards.forEach((c,i)=>c.id=`c${i}`);
  parsed.questions.forEach((q,i)=>q.id=`q${i}`);
  return parsed;
}
SCREENS.generate = function(root){
  root.appendChild(headline('Generate a unit','Paste notes, a study guide, a vocab list, or a chapter summary. You see everything before it saves.'));
  const c = el('div','card');
  c.appendChild(el('label',null,'Subject'));
  const sel = el('select');
  STUDY_CLASSES.forEach(cl=>{ const o=el('option',null,cl.name); o.value=cl.id;
    if(cl.id===ctx.classId) o.selected=true; sel.appendChild(o); });
  c.appendChild(sel);
  c.appendChild(el('label',null,'Class notes'));
  const ta = el('textarea');
  ta.placeholder = 'Paste the material here — notes, slide text, a vocab list, a study guide…';
  c.appendChild(ta);
  c.appendChild(el('div','hintline','More detail means better questions. Everything is grounded in what you paste.'));
  const gob = el('button','btn btn-primary','✨  Generate');
  gob.addEventListener('click', async ()=>{
    if(ta.value.trim().length < 80){ toast('Paste a bit more material first'); return; }
    gob.disabled = true; gob.textContent = 'Thinking… this can take a minute';
    try{
      const u = await generateUnit(sel.value, ta.value.trim());
      const rec = put({ id:uid('unit'), type:'unit', classId:sel.value, title:u.title||'Untitled unit',
        quarter: currentQuarter(AZ.today())?.n || null, source:'Pasted notes',
        cards:u.cards, questions:u.questions });
      syncSoon(); celebrate();
      showModal({ title:'Unit ready',
        message:`"${rec.title}"\n\n${rec.cards.length} flashcards · ${rec.questions.length} quiz questions`,
        confirmText:'Open it', onConfirm:()=>go('unit',{classId:sel.value}) });
      go('unit',{classId:sel.value});
    }catch(e){
      gob.disabled=false; gob.textContent='✨  Generate';
      showModal({ title:'Could not generate',
        message: e.message==='NO_KEY' ? 'Add an Anthropic API key in the You tab first. Everything else works without one.'
               : e.message==='BAD_KEY' ? 'That API key was rejected.' : e.message });
    }
  });
  c.appendChild(gob); root.appendChild(c);
  const back = el('button','btn btn-ghost','← Back');
  back.addEventListener('click',()=>go(ctx.classId?'unit':'study',{classId:ctx.classId}));
  root.appendChild(back);
};
