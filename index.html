          const r = new SR(); r.lang = 'en-US'; r.maxAlternatives = 5; r.interimResults = false;
          let done = false;
          r.onresult = e => { done = true; skyState.listening = false;
            const alts = [...e.results[0]].map(a => a.transcript);
            if(skyMatch(cur.term, alts)) lightIt();
            else {
              markTry();
              skyState.verdict = 'Heard “' + (alts[0] || '').trim() + '” — not it. Try once more, or spell it.';
              if(skyState.tried[cur.id] >= 2) skyState.spell = true;
            }
            render();
          };
          r.onerror = e => { done = true; skyState.listening = false;
            const k = e.error;
            if(k === 'no-speech'){
              markTry();
              skyState.verdict = 'It did not catch anything — hold the phone closer and try again, or spell it.';
              if(skyState.tried[cur.id] >= 2) skyState.spell = true;
            } else if(k === 'not-allowed' || k === 'service-not-allowed'){
              skyState.srDead = true; skyState.spell = true;
              skyState.verdict = 'The microphone is blocked for this site, so spelling is the game today. A grown-up can allow the mic in the browser settings.';
            } else if(k === 'network'){
              skyState.srDead = true; skyState.spell = true;
              skyState.verdict = 'Voice checking needs the internet and could not reach it — spelling counts just the same.';
            } else if(k === 'audio-capture'){
              skyState.srDead = true; skyState.spell = true;
              skyState.verdict = 'No microphone could be found — spelling counts just the same.';
            } else if(k === 'aborted'){
              skyState.verdict = 'That one stopped early — tap and try again.';
            } else {
              markTry(); skyState.spell = true;
              skyState.verdict = 'The microphone had trouble (' + k + ') — spell it instead.';
            }
            render();
          };
          r.onend = () => { if(!done){ skyState.listening = false; markTry();
            skyState.verdict = 'It stopped listening before it heard you — try again.';
            if(skyState.tried[cur.id] >= 2) skyState.spell = true;
            render(); } };
          try { r.start(); }
          catch(err){ skyState.listening = false; skyState.spell = true;
            skyState.verdict = 'The microphone would not start — spell it instead.'; render(); }
        });
        btns.appendChild(mic);
        if(skyState.tried[cur.id]){
          const sp2 = el('button','btn btn-secondary','Spell it instead');
          sp2.addEventListener('click', () => { skyState.spell = true; render(); });
          btns.appendChild(sp2);
        }
      }
      if(skyState.spell){
        const ti = el('input'); ti.type = 'text';
        ti.autocapitalize = 'none'; ti.autocomplete = 'off'; ti.spellcheck = false;
        ti.placeholder = 'Spell the word';
        ti.value = skyState.typed || '';
        ti.addEventListener('input', () => { skyState.typed = ti.value; });
        p.appendChild(ti);
        if(skyState.reveal){
          /* The word itself is the one thing in this sentence she actually needs —
             plain text buried it mid-sentence and Chris found it hard to read.
             Same convention as a Growth Zone miss's correct answer: bold, --good. */
          const rv = el('p','skyreveal');
          rv.appendChild(el('span',null,'The word is '));
          rv.appendChild(el('span','a', cur.term));
          rv.appendChild(el('span',null,' — type it once to light the star.'));
          p.appendChild(rv);
        }
        const chk = el('button','btn btn-primary','Check my spelling');
        chk.addEventListener('click', () => {
          const norm = t => String(t).toLowerCase().replace(/[^a-z]/g, '');
          if(norm(skyState.typed) === norm(cur.term)) lightIt();
          else {
            skyState.spellTries++;
            skyState.verdict = 'Not quite — check it letter by letter.';
            if(skyState.spellTries >= 2) skyState.reveal = true;
          }
          render();
        });
        btns.appendChild(chk);
      }
      p.appendChild(btns);
      /* Hints are the example sentences with the word blanked — free, because
         a definition alone is sometimes genuinely not enough, and a blanked
         sentence still makes her produce the word herself. */
      if(skyState.hints < hints.length && !skyState.listening){
        const hb = el('button','btn btn-ghost',
          skyState.hints ? 'Another hint' : 'Give me a hint');
        hb.addEventListener('click', () => { skyState.hints++; render(); });
        p.appendChild(hb);
      }
    }
    root.appendChild(p);
  } else {
    const hint = el('div','card quiet');
    hint.appendChild(el('p',null, litCount === cards.length
      ? 'Every star is lit. That is the whole sky.'
      : 'Press any star to begin. A lit star is a word you produced yourself, from its meaning alone.'));
    root.appendChild(hint);
  }
  const leave = el('button','btn btn-ghost','Back to the unit');
  leave.addEventListener('click', () => { skyLog(u); skyState = null; go('unit', {classId: ctx.classId}); });
  root.appendChild(leave);
};

let quizState = null;
let reviewUnit = null;

/* Builds a one-off unit from everything due, newest-struggle first. Kept out of
   DATA.records on purpose — it is a view, not saved content. */
/* `opt` narrows the round: {classId} reviews one subject, {guide:true} only
   questions that came off a paper study guide. No filter = everything due,
   exactly as before. The id stays __review__ so the ladder settles the same
   way whichever door she came through. */
function buildReviewUnit(opt){
  opt = opt || {};
  /* `all` widens the pool from what is DUE to everything on the ladder inside
     the filter — the test-week door. The round settles through the same code
     an ordinary quiz uses, and that code already promotes a laddered question
     on ANY correct sighting, due or not, and resets it on a miss; so an early
     review needs no rule of its own. Due questions still go first. */
  let pool = opt.all ? all('miss') : dueMisses();
  if(opt.classId) pool = pool.filter(m=>m.classId===opt.classId);
  if(opt.unitId)  pool = pool.filter(m=>m.unitId===opt.unitId);
  if(opt.guide) pool = pool.filter(m=>{ const u = DATA.records[m.unitId]; return u && !u.deleted && u.guide; });
  if(opt.all){
    const dueIds = new Set(dueMisses().map(m=>m.id));
    pool = pool.slice().sort((a,b)=> (dueIds.has(b.id)?1:0)-(dueIds.has(a.id)?1:0) || ((a.box??0)-(b.box??0)));
  }
  const qs = pool.map(missAsQuestion).filter(Boolean);
  if(!qs.length) return null;
  reviewUnit = { id:'__review__', classId:opt.classId||'__all__', title:opt.title||'Review', cards:[], questions:qs.slice(0,20) };
  return reviewUnit;
}
const unitFor = id => id==='__review__' ? reviewUnit
  : id==='__daily__' ? dailyUnit
  : id==='__shuffle__' ? shuffleUnit
  : id==='__rescue__' ? rescueUnit : DATA.records[id];

SCREENS.quiz = function(root){
  const u = unitFor(ctx.unitId);
  if(!u || !u.questions.length) return go('unit',{classId:ctx.classId});
  /* Also restart when the mode changes, so switching between the normal quiz
     and Beat the clock never resumes the other one's half-finished run. */
  if(!quizState || quizState.unitId!==u.id || quizState.timed !== !!ctx.timed){
    /* Pick the round back up if one was left today on this same unit. */
    const saved = loadRound(u, !!ctx.timed);
    if(saved){
      quizState = saved;
      /* The save fires at the END of answer(), before Next advances the index,
         so a round parked mid-question has `answered` set on a question that
         is already counted in seen/correct. Resuming without stepping past it
         would re-ask it and let her answer the same question twice. */
      if(quizState.answered !== null && quizState.answered !== undefined) quizState.i++;
      /* Land her ON a question, never on a revealed answer, with fresh clocks. */
      quizState.answered = null;
      /* Rebase the clock so only time spent IN the round counts — without this,
         seconds spans the whole parked gap and one resumed quiz logs a day of
         "study" into the day view and the parent's weekly minutes. A pre-elapsed
         save (older client) restarts the clock at zero: undercounting is the safe
         direction. */
      quizState.start = Date.now() - (quizState.elapsed || 0);
      delete quizState.elapsed;
      quizState.hintUsed = false;
      quizState.qShownAt = Date.now();
      quizState.perm = null; quizState.permFor = -1;
    }
    if(saved && quizState.i >= quizState.order.length){
      /* She answered the last one and never tapped through to the results —
         there is no question left to return to, so start clean. */
      clearRound(); quizState = null;
    } else if(saved){
      toast('Picked up where you left off');
    }
    if(!quizState){
      quizState = {unitId:u.id,i:0,correct:0,answered:null,start:Date.now(),
        order:pickRound(u, !!ctx.timed),missed:[],hintUsed:false,hints:0,pre:ctx.pre||null,
        timed:!!ctx.timed, speedBonus:0, fastest:null, deadline:0, seen:[], items:[],
        limit:quizLimit(), runStreak:0, qShownAt:Date.now(), ansMs:0, ansN:0};
    }
    /* Inside the branch now, and deliberately: this line sat outside an
       unbraced if, so the countdown restarted on EVERY render of the quiz
       screen — revealing a hint handed her a fresh clock. The deadline is
       meant to be an absolute timestamp precisely so a re-render cannot
       reset it. Beat the clock only. */
    if(quizState.timed) startQuestionTimer(u);
  }
  const q = u.questions[quizState.order[quizState.i]];

  const head = el('div','card');
  head.appendChild(el('div','eyebrow',`${u.title} · Level ${q.lv||1}`));
  const r = el('div','row');
  r.appendChild(el('span','k',`Question ${quizState.i+1} of ${quizState.order.length}`));
  r.appendChild(el('span','v',`${quizState.correct} correct`));
  head.appendChild(r);
  /* One star per question in the round — gold when right, dim-but-lit on a
     miss (showing up still counts; Sky Map rules). */
  head.appendChild(roundBand(u));
  if(quizState.timed){
    const t = el('div','qtimer-track'), ti = el('i');
    ti.id = 'qtimer';
    const left = quizState.answered===null ? Math.max(0, quizState.deadline - Date.now()) : 0;
    ti.style.width = (left/quizState.limit*100)+'%';
    if(left < 5000 && quizState.answered===null) ti.className='low';
    t.appendChild(ti); head.appendChild(t);
  }
  root.appendChild(head);

  const qc = el('div','card ac');
  /* An analogy's stem is the question — it gets the plate, not an h3. */
  if(q.kind==='analogy'){
    qc.appendChild(el('div','eyebrow','Complete the analogy'));
    qc.appendChild(analogyStem(q.q));
    qc.appendChild(el('div','hintline','Work out how the first pair relates, then find the pair that relates the same way.'));
  } else qc.appendChild(el('h3',null,q.q));
  if(q.passage) qc.appendChild(el('div','passage', q.passage));
  const qg = graphNode(q.graph); if(qg) qc.appendChild(qg);
  root.appendChild(qc);

  if(q.kind==='order'){
    /* Put-it-in-order: she taps the events into sequence. The shuffled
       arrangement is pinned on quizState so re-renders never rescramble it
       mid-thought, and it is never dealt pre-solved. */
    if(quizState.orderFor !== q.id){
      let arr = shuffle(q.opts.map((_,k)=>k));
      if(arr.every((v,k)=>v===k)) arr = arr.slice().reverse();
      quizState.orderArr = arr; quizState.orderPick = []; quizState.orderFor = q.id;
    }
    if(quizState.answered!==null){
      /* Reveal: the true sequence, marking where her picks matched. */
      q.opts.forEach((text,k)=>{
        const b = el('button','opt '+((quizState.orderPick||[])[k]===k?'right':'wrong'));
        b.disabled = true;
        b.appendChild(el('span','ltr',String(k+1)));
        b.appendChild(el('span',null,text));
        root.appendChild(b);
      });
    } else {
      quizState.orderArr.forEach(orig=>{
        const at = quizState.orderPick.indexOf(orig);
        const b = el('button','opt'+(at>=0?' picked':''));
        b.appendChild(el('span','ltr', at>=0 ? String(at+1) : '·'));
        b.appendChild(el('span',null,q.opts[orig]));
        b.addEventListener('click',()=>{
          if(at>=0) quizState.orderPick.splice(at,1);
          else if(quizState.orderPick.length<q.opts.length) quizState.orderPick.push(orig);
          render();
        });
        root.appendChild(b);
      });
      if(quizState.orderPick.length===q.opts.length){
        const lock = el('button','btn btn-primary','Lock it in');
        lock.addEventListener('click',()=>answerOrder(u,q));
        root.appendChild(lock);
      } else {
        root.appendChild(el('div','hintline','Tap the events in the order they happened.'));
      }
    }
  } else if(q.kind==='spell'){
    /* Type-the-word: multiple choice can't test spelling. Her typing lives on
       quizState, so a hint re-render never eats it. -3 is the wrong-spelling
       sentinel (-1 stays out-of-time, -2 wrong-sequence). Spell questions
       carry the word as opts[ans]. */
    const word = q.opts && q.opts[q.ans] !== undefined ? q.opts[q.ans] : (q.word||'');
    if(quizState.spellFor !== q.id){ quizState.spellFor = q.id; quizState.spellVal = ''; }
    if(quizState.answered!==null){
      const rightSp = quizState.answered===q.ans;
      const sw = el('div','card');
      sw.appendChild(el('div','eyebrow', rightSp ? 'Spelled right' : 'The word'));
      sw.appendChild(el('h3',null, word));
      if(!rightSp && (quizState.spellVal||'').trim())
        sw.appendChild(el('p',null,'You typed: '+quizState.spellVal.trim()));
      root.appendChild(sw);
    } else {
      const sc2 = el('div','card');
      const inp = el('input');
      inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false;
      inp.setAttribute('autocapitalize','off'); inp.setAttribute('autocorrect','off');
      inp.placeholder='Type the word';
      inp.value = quizState.spellVal || '';
      inp.addEventListener('input',()=>{ quizState.spellVal = inp.value; });
      const lockSpell = ()=>{
        const typed = (quizState.spellVal||'').trim().toLowerCase();
        if(!typed) return;
        answer(u, q, typed===word.toLowerCase() ? q.ans : -3);
      };
      inp.addEventListener('keydown',e=>{ if(e.key==='Enter') lockSpell(); });
      sc2.appendChild(inp); root.appendChild(sc2);
      const lock = el('button','btn btn-primary','Check my spelling');
      lock.addEventListener('click',lockSpell);
      root.appendChild(lock);
      setTimeout(()=>{ const n2 = sc2.querySelector('input'); if(n2) n2.focus(); }, 50);
    }
  } else {
    /* Options are shown in a shuffled order, so the answer cannot be learned by
       its POSITION — which is not knowing the answer. The permutation is stored
       per question id, so revealing a hint (which re-renders) does not reshuffle
       the options underneath her mid-question. answer() still receives the
       ORIGINAL index, so q.ans, the miss record and every explanation downstream
       are untouched.
       Content must therefore never refer to an option by position. */
    if(quizState.optFor !== q.id){
      quizState.optFor = q.id;
      /* On a paper guide the letters must match the printout — see the
         guide-unit note above. Everywhere else they shuffle. */
      quizState.optArr = u.guide ? q.opts.map((_,k)=>k) : shuffle(q.opts.map((_,k)=>k));
    }
    quizState.optArr.forEach((orig,pos)=>{
      const b = el('button','opt');
      b.appendChild(el('span','ltr',String.fromCharCode(65+pos)));
      b.appendChild(el('span',null,q.opts[orig]));
      if(quizState.answered!==null){
        b.disabled = true;
        if(orig===q.ans) b.className='opt right';
        else if(orig===quizState.answered) b.className='opt wrong';
      } else b.addEventListener('click',()=>answer(u,q,orig));
      root.appendChild(b);
    });
  }

  if(quizState.answered===null){
    /* The hint button moved into the tool row at the foot of the screen; once
       it is bought, the hint itself renders here where she is reading. */
    if(q.hint && quizState.hintUsed && !quizState.timed){
      const h = el('div','card'); h.appendChild(el('p',null,'💡 '+q.hint)); root.appendChild(h);
    }
  } else {
    const right = quizState.answered===q.ans && quizState.answered!==-2;
    const ex = el('div','explain '+(right?'ok':'no'));
    ex.appendChild(el('div','lbl', cheerLabel(right, quizState.answered===-1)));
    /* On a RIGHT answer the feedback card is also the way forward — the
       biggest thing on the screen advances the round, exactly like Next.
       Wrong answers keep the deliberate journey past the walkthrough. */
    if(right && quizState.answered!==-2){
      ex.classList.add('go-on');
      ex.addEventListener('click',()=>{ const nb = document.getElementById('qnext'); if(nb) nb.click(); });
    }
    ex.appendChild(richify(el('p'), q.ex?.main || `The answer is ${q.opts[q.ans]}.`));
    if(q.ex?.tip){ ex.appendChild(el('div','lbl','Test tip')); ex.appendChild(el('p',null,q.ex.tip)); }
    if(q.ex?.mnemonic){ ex.appendChild(el('div','lbl','Memory hook')); ex.appendChild(el('p',null,q.ex.mnemonic)); }
    root.appendChild(ex);
    /* A right answer she is not sure of is hidden shakiness no tally can see —
       so she can put it on the ladder herself. Her call entirely: no XP change,
       no penalty, an ordinary Growth Zone entry due tomorrow. Hidden in review
       rounds (the ladder already owns those) and when it is already laddered. */
    if(right && u.id!=='__review__'){
      const aUnit = q._srcUnit || u.id, aClass = q._srcClass || ctx.classId, aQid = q._srcQid || q.id;
      const live = DATA.records['miss_'+aUnit+'_'+aQid];
      if(!live || live.deleted){
        const ag = el('button','btn btn-ghost','🌱  Right, but shaky? See it again tomorrow');
        ag.addEventListener('click',()=>{
          put(scheduleMiss({ id:'miss_'+aUnit+'_'+aQid, type:'miss', unitId:aUnit, classId:aClass,
            qid:aQid, q:q.q, opts:q.opts, ans:q.ans, kind:q.kind||null, passage:q.passage||null,
            right:(q.kind==='order' ? q.opts.join(' → ') : q.opts[q.ans]),
            chose:'(you chose to see it again)',
            why:q.ex?.main||'', graph:q.graph||null, steps:q.steps||null, on:AZ.today() }, false));
          syncSoon(); toast('Back tomorrow. Knowing what is shaky is half the work.'); render();
        });
        root.appendChild(ag);
      }
    }
    /* A question she thinks might just be WRONG — a typo'd answer key, a
       confusing scenario, a graph that doesn't match its own question. Not
       the Growth Zone (that's about what SHE knows); this is about the
       content itself, and it goes straight to a grown-up, never auto-acted
       on. Excluded on a rescue-round variant: it's a sub-field of another
       question, not something with its own place to remove it from. */
    if(!q._rescue){
      const aUnit2 = q._srcUnit || u.id, aClass2 = q._srcClass || ctx.classId, aQid2 = q._srcQid || q.id;
      const flagId = 'flag_'+aUnit2+'_'+aQid2;
      const already = DATA.records[flagId] && !DATA.records[flagId].deleted;
      const fb = el('button','btn btn-ghost btn-sm', already ? '🚩 Flagged for a grown-up' : '🚩 Something wrong with this question?');
      fb.disabled = already;
      if(!already) fb.addEventListener('click',()=>{
        showModal({ title:'Flag this question',
          message:'A grown-up will take a look — say what seems off if you want, or just flag it.',
          confirmText:'Flag it', cancelText:'Cancel',
          build:(box,close)=>{
            const ta = el('textarea'); ta.placeholder = 'What seems wrong? (optional)'; ta.style.minHeight='72px';
            box.appendChild(ta);
            box._go = ()=>{
              put({ id:flagId, type:'flag', unitId:aUnit2, classId:aClass2, qid:aQid2,
                q:q.q, note:ta.value.trim()||null, date:AZ.today() });
              syncSoon(); close(); toast('Flagged — a grown-up will take a look.'); render();
            };
          }
        });
      });
      root.appendChild(fb);
    }
    /* Wrong answer + a question that carries steps → offer the full worked
       path, one step per tap. After the answer, so it teaches rather than
       leaks; free, because it is remediation, not a hint economy. */
    if(!right && Array.isArray(q.steps) && q.steps.length){
      const shown = quizState.stepsShown || 0;
      if(shown > 0){
        const sc = el('div','card');
        sc.appendChild(el('div','eyebrow','Step by step'));
        q.steps.slice(0, shown).forEach((s,i)=>{
          const row = el('div','step');
          row.appendChild(el('span','n', String(i+1)));
          row.appendChild(richify(el('p'), s));
          sc.appendChild(row);
        });
        root.appendChild(sc);
      }
      if(shown < q.steps.length){
        const wb = el('button','btn btn-secondary',
          shown===0 ? '🧭  Walk me through it' : `Next step  (${shown} of ${q.steps.length})`);
        wb.addEventListener('click',()=>{ quizState.stepsShown = shown+1; render(); });
        root.appendChild(wb);
      }
    }
    const n = el('button','btn btn-primary', quizState.i===quizState.order.length-1?'See results →':'Next question →');
    n.id = 'qnext';
    n.addEventListener('click',()=>{
      if(quizState.i<quizState.order.length-1){
        quizState.i++; quizState.answered=null; quizState.hintUsed=false; quizState.stepsShown=0;
        quizState.qShownAt = Date.now();
        render(); startQuestionTimer(u);
      } else finishQuiz(u);
    });
    root.appendChild(n);
  }
  /* One slim row of tools rather than four stacked full-width buttons, so the
     answers stay the only big targets on the screen. Every tool still clears
     44px; they share the width, not the height. */
  const tools = el('div','tools');
  const tool = (icon, label, fn) => {
    const b = el('button','tool');
    b.appendChild(el('span','ti',icon));
    b.appendChild(el('small',null,label));
    b.addEventListener('click',fn);
    tools.appendChild(b);
  };
  /* The cost stays on the button — she should never buy a hint without being
     told what it costs. */
  if(q.hint && !quizState.hintUsed && !quizState.timed && quizState.answered===null)
    tool('💡','Hint −5',()=>{quizState.hintUsed=true;quizState.hints++;render();});
  /* Maths and science quizzes get a calculator — the questions test concepts,
     not arithmetic stamina, and real tests in these subjects allow one. */
  if(CALC_CLASSES.has(ctx.classId)) tool('🧮','Calculator',openCalc);
  /* Just "Sheet" in the row — a sheet's full name ("DBQ essay rubric") does not
     fit a quarter of the width, and the subject screen still names it in full. */
  if(SHEETS[ctx.classId]) tool(SHEETS[ctx.classId].ic, 'Sheet', ()=>openSheet(ctx.classId));
  const back = ctx.unitId==='__review__' ? ['growth',{}] : ctx.unitId==='__daily__' ? ['today',{}] : ['unit',{classId:ctx.classId}];
  /* Exit is the usual way she leaves a round, and it used to drop quizState
     before navigating — which meant the go() hook never saw it and the work
     was lost. Log what she answered first, then go. */
  tool('✕','Leave',()=>{
    stopQuestionTimer();
    /* Leaving now behaves exactly like the screen going to sleep: the partial
       round is logged so the work counts, her place is saved so she can pick
       it up, and NOTHING is settled. Deliberately changed from v78, where
       Leave settled the ladder and discarded the round — which made the
       commonest accidental tap the one that cost her the most. She keeps the
       XP either way; now she keeps the round too. */
    const qu = unitFor(quizState && quizState.unitId);
    persistRound();
    if(qu) saveRound(qu);
    quizState = null;
    go(back[0],back[1]);
  });
  root.appendChild(tools);
};
function answer(u,q,idx){
  /* Kahoot-style: the faster it lands, the bigger the bonus. */
  if(quizState.timed){
    const used = quizState.limit - Math.max(0, quizState.deadline - Date.now());
    stopQuestionTimer();
    if(idx===q.ans){
      quizState.speedBonus += Math.round(10 * Math.max(0, 1 - used/quizState.limit));
      const secs = used/1000;
      if(quizState.fastest===null || secs<quizState.fastest) quizState.fastest = secs;
    }
  } else {
    /* Untimed rounds measure her real pace — this average becomes Beat the
       clock's countdown. Walk-aways (>2 min on one question) don't count. */
    const d = Date.now() - (quizState.qShownAt || Date.now());
    if(d > 0 && d < 120000){ quizState.ansMs += d; quizState.ansN++; }
  }
  quizState.answered = idx;
  if(!quizState.seen.includes(q.id)) quizState.seen.push(q.id);
  const right = idx===q.ans;
  quizState.runStreak = right ? (quizState.runStreak||0)+1 : 0;
  if(right) quizState.correct++;
  /* The star sky's win buzz, scaled down: a right answer taps back, softly.
     A miss deliberately gets nothing — the phone never scolds. */
  if(right && navigator.vibrate) navigator.vibrate([12, 40, 12]);
  /* What she was asked and what she picked, for the day view's question-level
     drill-down. Stored as short TEXT rather than option indexes: options are
     shuffled per question and a unit can be edited later, so an index would
     quietly point at the wrong option months from now. The correct answer is
     only stored when she got it wrong — when she is right it is what she
     picked. */
  const cutTxt = (t,n)=>{ t = String(t==null?'':t); return t.length>n ? t.slice(0,n-1)+'…' : t; };
  const choseTxt = idx===-1 ? '(ran out of time)'
    : idx===-2 ? (quizState.orderPick||[]).map(k=>q.opts[k]).join(' → ')
    : idx===-3 ? ((quizState.spellVal||'').trim() || '(blank)')
    : (q.opts && q.opts[idx]!=null ? q.opts[idx] : '');
  if(!quizState.items) quizState.items = [];
  if(quizState.items.length < QUIZ_ITEM_MAX)
    quizState.items.push({ c: right?1:0, qt: cutTxt(q.q,110), ch: cutTxt(choseTxt,70),
      ca: right ? '' : cutTxt(q.opts && q.opts[q.ans]!=null ? q.opts[q.ans] : '', 70) });
  /* Review and shuffle questions are on loan from other units — credit the
     tally to where the question actually lives, or the parent view attributes
     it to nothing. */
  const src = u.id==='__review__' ? DATA.records[q._missId] : null;
  const unitId  = src ? src.unitId  : (q._srcUnit  || u.id);
  const classId = src ? src.classId : (q._srcClass || ctx.classId);
  const qid     = src ? src.qid     : (q._srcQid   || q.id);

  /* Per-question tally powers the strong/weak topic breakdown in the parent view. */
  const key = 'qstat_'+unitId+'_'+qid;
  const prev = DATA.records[key];
  put({ id:key, type:'qstat', unitId, classId, qid, q:q.q,
        attempts:(prev?.attempts||0)+1, correct:(prev?.correct||0)+(right?1:0) });
  /* Working the guide in the app saves her place after every question, so
     closing it mid-pass costs nothing. */
  if(u.guide) guideSet(u.id, q.id, idx);
  if(!right){
    quizState.missed.push(q.id);
    const chose = choseTxt;
    /* A rescue variant is practice on a question that is ALREADY on the
       ladder. Writing a second miss would double-count it and reset a box she
       has not been re-tested on. Attempts are recorded above either way. */
    if(q._rescue){ render(); return; }
    if(src){
      /* Demotion is finishQuiz's job; here we just record what she picked this time. */
      put({ ...src, chose });
    } else {
      /* Keyed to the ORIGINAL unit, so a shuffle-round miss re-asks and
         promotes exactly like a miss from the unit's own quiz. */
      const was = DATA.records['miss_'+unitId+'_'+qid];
      put(scheduleMiss({ id:'miss_'+unitId+'_'+qid, type:'miss', unitId, classId,
            qid, q:q.q, opts:q.opts, ans:q.ans, kind:q.kind||null, passage:q.passage||null,
            right:(q.kind==='order' ? q.opts.join(' → ') : q.opts[q.ans]), chose,
            why:q.ex?.main||'', graph:q.graph||null, steps:q.steps||null,
            on:(was&&!was.deleted?was.on:AZ.today()) }, false));
    }
  }
  /* Saved on every answer, once every field above is settled. A phone screen
     that sleeps and drops the page fires no pagehide, so waiting for the
     backgrounding hooks is not enough — this is the one that saves River. */
  saveRound(u);
  render();
}
/* Order questions grade the whole sequence — exact order counts, anything else
   routes to the Growth Zone like any other miss. Routed through answer() so
   qstats, misses, pace measurement and speed bonuses all work identically;
   -2 is the "sequence wrong" sentinel (-1 stays "out of time"). */
function answerOrder(u,q){
  if(!quizState || quizState.answered!==null) return;
  const seq = quizState.orderPick||[];
  const right = seq.length===q.opts.length && seq.every((v,k)=>v===k);
  answer(u, q, right ? q.ans : -2);
}
/* `partial` = she left the round part-way. Then the session is logged as the
   questions she ACTUALLY ANSWERED — never as the full round with the rest
   marked wrong. Leaving early is a shorter sitting, not a failed one.
   Everything below already judges only `askedThisRound`, so the ladder, the
   qstats and the badges all settle correctly on a short round; the only thing
   that was missing was the log itself. Without it her answers still counted
   toward qstats and the Growth Zone, but the session left no trace: no
   minutes, no XP, no streak or sky-map day, and nothing in the day view. */
/* ---- Losing the app mid-round ----
   A round she abandons by NAVIGATING is caught by go() and the Exit button.
   A round she abandons by closing the app, switching to another app or
   locking the phone was caught by nothing at all — and on a phone that is
   the most common way a quiz ends. This writes (or updates) the round's log
   at that moment.

   Deliberately does NOT settle the miss ladder or clear quizState: a quick
   app-switch must not cost her the round she is in the middle of. Her
   answers already updated qstats and the Growth Zone as she made them, so
   the only thing at risk was the session record, and that is what this
   saves. If she comes back and finishes, finishQuiz updates this same log
   in place — quizState.logId is what keeps it to one record. */
/* ---- Resuming a round (v107) ----
   quizState is memory only, so a refresh, a killed PWA, or a screen sleep long
   enough to drop the page lost her PLACE in the round. Her CREDIT already
   survived — persistRound writes the log when the app backgrounds — but coming
   back to question 1 of 5 feels like losing work, and feeling like you lost
   work is what stops a kid coming back at all.

   Device-local, never a record. A half-finished round is a snapshot of one
   moment; syncing it would drop it onto her other device mid-question. Same
   reasoning that keeps the review unit out of DATA.records.

   Synthetic rounds (__review__, __shuffle__, __rescue__) are deliberately NOT
   saved. They are assembled fresh from whatever is due right now, so a stored
   order would point at questions the ladder may have moved past. They already
   resume in spirit: an abandoned round settles nothing, so the same misses are
   still waiting next time. */
const ROUND_KEY = 'round';
const realUnit = id => !!id && !String(id).startsWith('__');
/* The order is a list of INDEXES into u.questions, so if the unit is edited
   and re-approved underneath a saved round those indexes silently point at
   different questions. Fingerprinting the ids makes that detectable. */
const roundPrint = (u, order) =>
  (order || []).map(i => u.questions[i] && u.questions[i].id).join(',');
function saveRound(u){
  if(!quizState || quizState.settled || !realUnit(quizState.unitId)) return;
  if(!u || !(quizState.seen || []).length) return;   // opened and never answered
  Store.set(ROUND_KEY, {...quizState, classId: ctx.classId, date: AZ.today(), print: roundPrint(u, quizState.order),
    /* Time actually spent, not the timestamp: `start` anchors seconds = now − start,
       and a raw start survives the park — so a round parked at 8am and resumed at
       6pm would log ten hours of study. The resume path rebases start from this. */
    elapsed: Date.now() - (quizState.start || Date.now())});
}
const clearRound = () => Store.remove(ROUND_KEY);
function loadRound(u, timed){
  const s = Store.get(ROUND_KEY);
  if(!s || s.unitId !== u.id || !!s.timed !== !!timed) return null;
  /* Yesterday's half-round is not today's sitting. */
  if(s.date !== AZ.today()){ clearRound(); return null; }
  if(s.print !== roundPrint(u, s.order)){ clearRound(); return null; }
  if(!s.order || !s.order.length || s.i >= s.order.length){ clearRound(); return null; }
  return s;
}
function persistRound(){
  if(!quizState || quizState.settled) return;
  const seen = (quizState.seen || []).length;
  if(!seen) return;                       // opened and never answered: nothing happened
  const lid = quizState.logId || uid('log');
  quizState.logId = lid;
  /* put() writes through to localStorage synchronously, which matters here —
     the page may be seconds from being killed. Sync is left for next launch. */
  put({ id:lid, type:'log', mode:'quiz', classId:ctx.classId, unitId:quizState.unitId,
        date:AZ.today(), at:quizState.start || Date.now(),
        correct:quizState.correct, total:seen,
        seconds:Math.round((Date.now() - quizState.start)/1000),
        xp:Math.max(0, quizState.correct*10 - quizState.hints*5),
        hints:quizState.hints, timed:!!quizState.timed, speedBonus:0, partial:true,
        items:(quizState.items||[]).slice(0, QUIZ_ITEM_MAX),
        ansSeconds:Math.round((quizState.ansMs||0)/1000), ansCount:quizState.ansN||0 });
}
/* visibilitychange covers switching apps and locking the phone — the cases a
   PWA actually meets. pagehide covers a real close or reload. beforeunload is
   deliberately not used: mobile browsers fire it unreliably. */
/* Both hooks save the PLACE as well as the log — a sleeping screen that drops
   the page is the commonest way a round ends on a phone. */
const parkRound = ()=>{ const u = unitFor(quizState && quizState.unitId);
                        persistRound(); if(u) saveRound(u); };
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) parkRound(); });
window.addEventListener('pagehide', parkRound);

function finishQuiz(u, partial){
  /* `settled` guards the LADDER, not the log. A round may already have written
     a log (see persistRound, called when the app is backgrounded) — finishing
     then UPDATES that same record rather than adding a second one. */
  if(quizState.settled) return;
  quizState.settled = true;
  clearRound();          // the round is over; nothing left to come back to
  const total = partial ? quizState.seen.length : quizState.order.length;
  if(!total){ quizState = null; return; }
  const pct = Math.round(quizState.correct/total*100);
  const secs = Math.round((Date.now()-quizState.start)/1000);
  /* The completion and speed bonuses are for finishing; a short round still
     earns the per-question XP, just not the bonus on top. */
  /* The daily three is a finished round by design, but a short one: its
     completion bonus scales with its length (3 of 5 → 30 for a clean run,
     60 XP in all), or a one-minute ritual would out-earn a full quiz round
     at 4 of 5 — 80 against 65 — and quietly cheapen the quiz. */
  const bonus = partial ? 0 : Math.round((pct===100?50 : pct>=80?25 : 0)
    * (u.id==='__daily__' ? Math.min(1, total/QUIZ_ROUND) : 1));
  const speed = (!partial && quizState.timed) ? quizState.speedBonus : 0;
  const fastest = quizState.fastest;
  const wasTimed = quizState.timed;
  stopQuestionTimer();
  const xp = Math.max(0, quizState.correct*10 + bonus + speed - quizState.hints*5);
  const hintsUsed = quizState.hints, pre = quizState.pre;
  const lid = quizState.logId || uid('log');
  quizState.logId = lid;
  const log = put({ id:lid, type:'log', mode:'quiz', classId:ctx.classId, unitId:u.id,
    date:AZ.today(), at:Date.now(), correct:quizState.correct, total, seconds:secs, xp,
    hints:hintsUsed, timed:wasTimed, speedBonus:speed, partial:!!partial,
    items:(quizState.items||[]).slice(0, QUIZ_ITEM_MAX),
    ansSeconds:Math.round((quizState.ansMs||0)/1000), ansCount:quizState.ansN||0 });
  if(pre) put({ id:uid('mood'), type:'mood', when:'pre', logId:log.id, classId:ctx.classId,
    unitId:u.id, readiness:pre.readiness, feeling:pre.feeling, date:AZ.today(), at:Date.now() });

  const askedThisRound = new Set(quizState.seen);
  if(u.id==='__review__'){
    /* Review rounds judge each question by the miss it came from, since they are
       gathered from many different units. */
    u.questions.forEach(q=>{
      if(!askedThisRound.has(q.id)) return;
      const m = DATA.records[q._missId];
      if(!m || m.deleted) return;
      const right = !quizState.missed.includes(q.id);
      const next = scheduleMiss(m, right);
      if(right && next.box >= LAST_BOX){
        put({id:'cleared_'+m.id,type:'cleared',unitId:m.unitId,qid:m.qid,q:m.q,on:AZ.today()});
        softDelete(m.id);
      } else put(next);
    });
  }
  /* Getting one right moves it up the ladder rather than clearing it outright —
     it only leaves once it has survived every interval. Judged by the
     question's ORIGINAL unit+qid so shuffle rounds promote and demote the
     same misses a unit's own quiz would. */
  /* __rescue__ is excluded on purpose: see buildRescueUnit. Massed practice
     straight after a walkthrough is not evidence the interval was survived. */
  if(u.id!=='__review__' && u.id!=='__rescue__'){
    const askedPairs = new Set(), missedPairs = new Set();
    u.questions.forEach(q=>{
      const pair = (q._srcUnit||u.id)+'::'+(q._srcQid||q.id);
      if(askedThisRound.has(q.id)) askedPairs.add(pair);
      if(quizState.missed.includes(q.id)) missedPairs.add(pair);
    });
    all('miss').forEach(m=>{
      const pair = m.unitId+'::'+m.qid;
      if(!askedPairs.has(pair) || missedPairs.has(pair)) return;   // only judge what she actually saw
      const next = scheduleMiss(m, true);
      if(next.box >= LAST_BOX){
        put({id:'cleared_'+m.id,type:'cleared',unitId:m.unitId,qid:m.qid,q:m.q,on:AZ.today()});
        softDelete(m.id);
      } else put(next);
    });
  }
  checkBadges(); syncSoon();
  /* She is already gone: settle the books and stop. No celebration, no
     results screen, and quizState is cleared so coming back starts a fresh
     round rather than resuming one that has been logged. */
  if(partial){ quizState = null; return; }
  /* 80% or better is the moment that earns the big one. */
  if(pct>=80) celebrate({big:true});

  const missed = quizState.missed.length;
  let calib = '';
  if(pre){
    const predicted = pre.readiness*20, gap = pct - predicted;
    calib = Math.abs(gap) <= 10 ? '\n\nYour gut was right — you predicted about this.'
      : gap > 10 ? '\n\nYou did better than you expected. Worth noticing: your nerves undersell you.'
      : '\n\nYou felt more ready than this turned out. That gap is the useful part — it means reviewing felt like knowing.';
  }
  /* The round ends on the shape it drew. The fraction and the XP move into one
     quiet line under it — said once, not restated in a headline and a message
     and a box. */
  const shape = roundState(u);
  const right = quizState.correct;
  const msg = (pct===100 ? 'Every one, first pass.'
    : pct>=80 ? 'A strong run.'
    : pct>=60 ? 'A solid base, with gaps in it.'
    : 'This one needs another pass. That is information, not a verdict.')
    + (speed?`\n\nSpeed bonus +${speed} XP${fastest!==null?` · fastest answer ${fastest.toFixed(1)}s`:''}.`:'')
    + (hintsUsed?`\n\n${hintsUsed} hint${hintsUsed>1?'s':''} used (−${hintsUsed*5} XP).`:'')
    + calib + (missed
        ? (u.id==='__review__'
            ? `\n\n${missed} still needs another look — ${missed>1?'they go':'it goes'} back to the start of the ladder.`
            : `\n\n${missed} question${missed>1?'s':''} went to your Growth Zone.`)
        : (u.id==='__review__' ? '\n\nEvery one of those moved further out. That is the list shrinking.' : ''));

  quizState = null; ctx._state = null; ctx._pre = null;
  const clsId = ctx.classId;
  const wasReview = u.id==='__review__', wasDaily = u.id==='__daily__';
  showModal({ title:"That's the whole round", message:msg,
    confirmText:'How did that feel?', cancelText:null,
    build:(box)=>{
      /* The finished shape goes ABOVE the title — it is what the round was,
         and she watched it being drawn one star at a time. */
      box.insertBefore(roundBand(u, {state:shape, tall:true}), box.firstChild);
      const t = el('div','tally');
      const chip = (n, rest) => { const s = el('span');
        s.appendChild(el('b',null,String(n))); s.appendChild(document.createTextNode(rest));
        t.appendChild(s); };
      chip(right, ` of ${total}`);
      /* The percentage returned (v106/v123): v91 removed it, keeping the
         fraction — and River reported the science quizzes "did not provide
         grades". 4 of 5 IS the grade, but not in the language school has
         taught her grades come in. Said once, as a chip, headline unchanged. */
      chip(pct + '%', '');
      chip('+'+xp, ' XP');
      chip(secs < 90 ? secs : Math.round(secs/60), secs < 90 ? ' sec' : ' min');
      box.appendChild(t);
      /* The daily three ends on its three squares and a share, before the
         companion. The squares say done, not a score: the constellation above
         already shows which stars lit, and what goes to the family thread is
         the ritual, never the marks. */
      if(wasDaily){
        box.appendChild(dailySquares(true));
        box.appendChild(dailyShareButton(true));
      }
      /* The companion turns up when a quiz ends — a natural seam, never an
         interruption. Same steady creature whatever the score. */
      const comp = companionOf();
      if(!comp) return;
      const pool = companionPool(pct>=80 ? 'cheer' : 'steady', comp);
      box.appendChild(companionSays(pool[logs().length % pool.length], comp));
    },
    onConfirm:()=>go('postmood',{logId:log.id, classId:clsId, missed, back: wasReview?'growth': wasDaily?'today':null}) });
  go(wasReview ? 'growth' : wasDaily ? 'today' : 'unit', {classId:clsId});
}

SCREENS.postmood = function(root){
  /* Teach it back. After a strong round (80%+ of at least 4 questions) she can
     explain the trickiest idea in her own words — the protégé effect, made
     one optional textarea. Saved verbatim for the parent view, never graded,
     never required, no XP attached: explaining is its own payoff and pricing
     it would cheapen it. Keyed to the log id so it can only be written once. */
  const tbLog = DATA.records[ctx.logId];
  const tbOK = tbLog && tbLog.mode==='quiz' && tbLog.total>=4 &&
               (tbLog.correct/tbLog.total)>=0.8 && !DATA.records['teach_'+ctx.logId];
  const saveTB = ()=>{
    const t = (ctx._tb||'').trim();
    if(!tbOK || !t) return;
    put({ id:'teach_'+ctx.logId, type:'teach', classId:ctx.classId, unitId:tbLog.unitId,
          logId:ctx.logId, date:AZ.today(), at:Date.now(), text:t.slice(0,500) });
    ctx._tb = '';
  };
  root.appendChild(headline('How did that feel?','One tap. This is the part that tells you whether studying is actually working for you.'));
  const c = el('div','card');
  const s = el('div','scale');
  FEELING.forEach(o=>{
    const b = el('button');
    b.appendChild(el('span',null,o.e)); b.appendChild(el('span','lb',o.l));
    if(ctx._feel === o.v) b.className = 'on';
    b.addEventListener('click',()=>{
      /* Deterministic id: tapping a second time changes her mind rather than
         writing a second mood for the same round. */
      put({ id:'mood_post_'+ctx.logId, type:'mood', when:'post', logId:ctx.logId,
            classId:ctx.classId, feeling:o.v, date:AZ.today(), at:Date.now() });
      checkBadges(); syncSoon();
      ctx._feel = o.v;
      /* When there is a written question on offer, the tap must NOT leave.
         The emoji row renders ABOVE the textarea, so auto-advancing here threw
         away the answer before she could reach the box — the tap required to
         record the mood was destroying the question underneath it. With
         nothing else to ask, one tap still finishes, which is the whole point
         of the check-in. */
      if(tbOK){ render(); return; }
      toast('Noted — thanks');
      go(ctx.back || (ctx.missed ? 'growth' : 'unit'), {classId:ctx.classId});
    });
    s.appendChild(b);
  });
  c.appendChild(s); root.appendChild(c);
  if(tbOK){
    const tb = el('div','card');
    tb.appendChild(el('div','eyebrow','Teach it back'));
    tb.appendChild(el('p',null,'Strong round. Explain the trickiest idea from it as if you were teaching it — a sentence or two is plenty.'));
    const ta = el('textarea'); ta.rows = 3; ta.placeholder = 'The trickiest idea was…';
    ta.value = ctx._tb || '';
    ta.addEventListener('input',()=>{ ctx._tb = ta.value; });
    tb.appendChild(ta);
    tb.appendChild(el('div','hintline','Optional. It saves with your check-in — a grown-up can read it, and nothing grades it.'));
    root.appendChild(tb);
  }
  /* Once a feeling is recorded the exit becomes a real Done, so the written
     answer has something to be saved BY. Before that it is still Skip — she
     can always leave without answering anything. */
  const done = ctx._feel != null && tbOK;
  const skip = el('button','btn '+(done?'btn-primary':'btn-ghost'), done ? 'Done' : 'Skip');
  skip.addEventListener('click',()=>{
    saveTB();
    if(done) toast('Noted — thanks');
    go(ctx.back || (ctx.missed?'growth':'unit'),{classId:ctx.classId});
  });
  root.appendChild(skip);
};

/* ================= FOCUS (Pomodoro) ================= */
/* Countdown is derived from an absolute end timestamp, not an accumulating
   interval, so locking the phone mid-session does not drift the clock. */
let focusState = null, focusTick = null;
SCREENS.focus = function(root){
  const p = prefs();
  if(!focusState){
    root.appendChild(headline('Focus session','Pick a length, put the phone face down, and do one thing. The timer keeps running if the screen locks.'));
    const c = el('div','card');
    c.appendChild(el('label',null,'Subject'));
    const sel = el('select');
    const none = el('option',null,'Anything'); none.value=''; sel.appendChild(none);
    STUDY_CLASSES.forEach(cl=>{ const o=el('option',null,cl.name); o.value=cl.id;
      if(cl.id===ctx.classId) o.selected=true; sel.appendChild(o); });
    c.appendChild(sel);
    c.appendChild(el('label',null,'Focus length'));
    const row = el('div','btn-row');
    [15,25,50].forEach(m=>{
      const b = el('button','btn '+(p.pomodoro===m?'btn-primary':'btn-secondary'), m+' min');
      b.addEventListener('click',()=>{ setPref('pomodoro',m); render(); });
      row.appendChild(b);
    });
    c.appendChild(row);
    c.appendChild(el('div','hintline','25 minutes is the classic. 50 works better once you are warmed up; 15 is the right size when starting feels hard.'));
    const start = el('button','btn btn-primary','▶  Start '+p.pomodoro+' minutes');
    start.addEventListener('click',()=>{
      primeAudio();   // the tap that starts the session is our one gesture
      focusState = { phase:'focus', classId:sel.value||null, minutes:p.pomodoro,
                     endsAt: Date.now()+p.pomodoro*60000, cycles:0 };
      startTick(); render();
    });
    c.appendChild(start);
    root.appendChild(c);

    const recent = focusLogs().slice(0,5);
    if(recent.length){
      root.appendChild(divider('Recent focus'));
      const rc = el('div','card');
      recent.forEach(f=>{
        const cl = CLASS_BY_ID[f.classId];
        const r = el('div','row');
        const k = el('span','k', cl?`${cl.icon} ${cl.name}`:'Focus');
        k.appendChild(el('small',null,AZ.shortDate(f.date)));
        r.appendChild(k); r.appendChild(el('span','v',f.minutes+' min')); rc.appendChild(r);
      });
      root.appendChild(rc);
    }
    return;
  }

  const remain = Math.max(0, focusState.endsAt - Date.now());
  const totalMs = (focusState.phase==='focus'?focusState.minutes:p.brk)*60000;
  const pctLeft = totalMs ? remain/totalMs : 0;
  const mm = Math.floor(remain/60000), ss = Math.floor((remain%60000)/1000);
  const cl = CLASS_BY_ID[focusState.classId];

  const wrap = el('div','ring-wrap');
  const ring = el('div','ring');
  const NS='http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('width','236'); svg.setAttribute('height','236');
  const mk = (r,stroke,w,dash)=>{ const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx','118'); c.setAttribute('cy','118'); c.setAttribute('r',r);
    c.setAttribute('fill','none'); c.setAttribute('stroke',stroke); c.setAttribute('stroke-width',w);
    c.setAttribute('stroke-linecap','round');
    if(dash){ c.setAttribute('stroke-dasharray',dash.d); c.setAttribute('stroke-dashoffset',dash.o); }
    return c; };
  const R = 104, C = 2*Math.PI*R;
  svg.appendChild(mk(R,'#133b44',12));
  const acCol = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  svg.appendChild(mk(R, focusState.phase==='focus'?acCol:'#f2c48a', 12, {d:C, o:C*(1-pctLeft)}));
  ring.appendChild(svg);
  const mid = el('div','mid');
  mid.appendChild(el('div','ph', focusState.phase==='focus'?'Focus':'Break'));
  mid.appendChild(el('div','cd', `${mm}:${String(ss).padStart(2,'0')}`));
  if(cl) mid.appendChild(el('div','lb', cl.name));
  ring.appendChild(mid); wrap.appendChild(ring); root.appendChild(wrap);

  const note = el('div','card quiet');
  note.appendChild(el('p',null, focusState.phase==='focus'
    ? 'Phone face down. One task. If a thought about something else shows up, write it on paper and come back — it will still be there in twenty minutes.'
    : 'Stand up, look out a window, drink some water. Do not start anything you will not want to stop.'));
  root.appendChild(note);

  const row = el('div','btn-row');
  const stop = el('button','btn btn-secondary','Stop');
  stop.addEventListener('click',()=>{ endFocus(false); });
  const skip = el('button','btn btn-ghost','Skip ahead');
  skip.addEventListener('click',()=>{ focusState.endsAt = Date.now(); tickFocus(); });
  row.appendChild(stop); row.appendChild(skip); root.appendChild(row);
};
/* iOS ignores navigator.vibrate entirely, so a finished session was landing
   in silence. Web Audio needs a user gesture to unlock — we prime it on the
   Start tap and ring a short gentle arpeggio when a phase ends. */
let audioCtx = null;
function primeAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){ audioCtx = null; }
}
function chime(notes){
  if(prefs().chime === false || !audioCtx) return;
  try{
    if(audioCtx.state === 'suspended') audioCtx.resume();
    notes.forEach(([freq, at, dur])=>{
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      const t0 = audioCtx.currentTime + at;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    });
  }catch(e){}
}
/* Rising major triad — done, well done. */
const chimeDone  = ()=>chime([[523.25,0,.5],[659.25,.16,.5],[783.99,.32,.7]]);
/* Two soft notes — break is over, nothing dramatic. */
const chimeBreak = ()=>chime([[659.25,0,.4],[523.25,.18,.55]]);

function startTick(){ clearInterval(focusTick); focusTick = setInterval(tickFocus, 1000); }
function tickFocus(){
  if(!focusState){ clearInterval(focusTick); return; }
  if(Date.now() >= focusState.endsAt){
    if(focusState.phase==='focus'){
      const xp = focusState.minutes*2;
      put({ id:uid('focus'), type:'focus', classId:focusState.classId, minutes:focusState.minutes,
            date:AZ.today(), at:Date.now(), xp });
      checkBadges(); syncSoon(); celebrate();
      chimeDone();
      if(navigator.vibrate) navigator.vibrate([120,60,120]);
      focusState = { ...focusState, phase:'break', cycles:focusState.cycles+1,
                     endsAt: Date.now()+prefs().brk*60000 };
      toast(`+${xp} XP — take ${prefs().brk} minutes`);
    } else {
      chimeBreak();
      if(navigator.vibrate) navigator.vibrate(80);
      endFocus(true); return;
    }
  }
  if(view==='focus') render();
}
function endFocus(completed){
  clearInterval(focusTick);
  const cycles = focusState ? focusState.cycles : 0;
  const cid = focusState ? focusState.classId : null;
  focusState = null;
  if(completed && cycles) toast('Break over — go again or stop here');
  go('focus',{classId:cid});
}

/* ================= GROWTH ZONE ================= */
/* The Growth Zone filter survives navigation on purpose: she picks Algebra,
   reviews, comes back, and it is still Algebra. Session-scoped, never stored —
   the ladder is hers, the view of it is just where she was looking. `gzOpen`
   holds which rows she has unfolded, for the same reason. */
let gzFilter = { cid:null, unitId:null };
let gzOpen = {};

SCREENS.growth = function(root){
  root.appendChild(headline('Growth Zone','Every question you missed comes back — a day later, then two, then four, then eight, then three weeks. Survive all five and it has stopped being a weak spot.'));
  const ms = all('miss');
  if(!ms.length){
    const e = el('div','empty');
    e.appendChild(el('span','ic','🌱'));
    e.appendChild(el('p',null,'Nothing here. Missed questions land here automatically and work their way out as you get them right.'));
    root.appendChild(e);
    const cl = all('cleared');
    if(cl.length){
      const w = el('div','card');
      w.appendChild(el('h2',null, cl.length+' learned for good'));
      w.appendChild(el('p',null,'Questions that came back five times over three weeks and you got every one.'));
      root.appendChild(w);
    }
    return;
  }

  const due = dueMisses();
  const dueIds = new Set(due.map(m=>m.id));
  /* Nearest unscored test per subject — the honest tiebreak for where to
     start when the list is long. Undefined when nothing is coming. */
  const today = AZ.today();
  const testIn = {};
  assessments().forEach(a=>{
    if(a.score!=null || a.date<today) return;
    const d = AZ.daysBetween(today, a.date);
    if(testIn[a.classId]===undefined || d < testIn[a.classId]) testIn[a.classId] = d;
  });
  const prio = cid => testIn[cid]!==undefined ? testIn[cid] : 9999;
  const testTag = cid => testIn[cid]!==undefined && testIn[cid]<=14
    ? (testIn[cid]===0 ? ' · test today' : testIn[cid]===1 ? ' · test tomorrow' : ` · test in ${testIn[cid]} days`) : '';

  /* ---- The filter: subject, then unit — over the WHOLE ladder. ----
     In test week the question this screen has to answer is "just Algebra,
     just the recent topic", and that is a question about everything she has
     missed, not about what happens to be due this morning. The chips used to
     live inside the due card and only covered due questions; now they scope
     the entire screen and both review doors below. */
  const bySubj = {};
  ms.forEach(m=>{ (bySubj[m.classId] = bySubj[m.classId]||[]).push(m); });
  const subjects = Object.keys(bySubj).sort((a,b)=> prio(a)-prio(b) || bySubj[b].length-bySubj[a].length);
  if(gzFilter.cid && !bySubj[gzFilter.cid]) gzFilter = { cid:null, unitId:null };   // that subject emptied
  /* One subject on the ladder needs no chooser — it is implicitly chosen, so
     its units can still be picked between. */
  const cidEff = gzFilter.cid || (subjects.length===1 ? subjects[0] : null);

  if(subjects.length > 1){
    const chips = el('div','gz-chips');
    const allc = el('button','gz-chip'+(gzFilter.cid ? '' : ' on'), `Everything · ${ms.length}`);
    allc.addEventListener('click',()=>{ gzFilter = { cid:null, unitId:null }; render(); });
    chips.appendChild(allc);
    subjects.forEach(cid=>{
      const cl = CLASS_BY_ID[cid]; if(!cl) return;
      const ch = el('button','gz-chip'+(gzFilter.cid===cid ? ' on' : ''),
        `${cl.icon} ${cl.short||cl.name} · ${bySubj[cid].length}${testTag(cid)}`);
      ch.addEventListener('click',()=>{
        gzFilter = gzFilter.cid===cid ? { cid:null, unitId:null } : { cid, unitId:null };
        render();
      });
      chips.appendChild(ch);
    });
    root.appendChild(chips);
  }

  let pool = cidEff ? ms.filter(m=>m.classId===cidEff) : ms;
  let unitTitle = '';
  if(cidEff){
    /* Units inside the chosen subject, MOST RECENTLY MISSED first. "The
       recent material" is what a test is about, and when she last missed
       something in a unit is the honest proxy for how recent it is. */
    const byUnit = {};
    pool.forEach(m=>{ (byUnit[m.unitId] = byUnit[m.unitId]||[]).push(m); });
    /* Ranked by when each unit was FIRST missed (`on`), not `updatedAt`:
       put() re-stamps updatedAt on every write, so a review round would
       bounce an old unit back to the top. `on` is set when the miss is
       born and survives every reschedule. A miss with no `on` (pre-v3) sorts
       oldest. Ties break on updatedAt. */
    const recentKey = uid => byUnit[uid].map(m=>(m.on||'0000-00-00')+String(m.updatedAt||0).padStart(14,'0')).sort().pop();
    const unitIds = Object.keys(byUnit).sort((a,b)=> recentKey(b).localeCompare(recentKey(a)));
    if(gzFilter.unitId && !byUnit[gzFilter.unitId]) gzFilter.unitId = null;
    const part = uid => {
      const u = DATA.records[uid];
      const t = u && u.title ? u.title : 'Mixed round';
      const i = t.lastIndexOf(' · ');
      return (u && u.guide ? '📄 ' : '') + (i>0 ? t.slice(i+3) : t);
    };
    if(unitIds.length > 1){
      const chips = el('div','gz-chips units');
      const allu = el('button','gz-chip'+(gzFilter.unitId ? '' : ' on'), `Every unit · ${pool.length}`);
      allu.addEventListener('click',()=>{ gzFilter.unitId = null; render(); });
      chips.appendChild(allu);
      unitIds.forEach(uid=>{
        const ch = el('button','gz-chip'+(gzFilter.unitId===uid ? ' on' : ''), `${part(uid)} · ${byUnit[uid].length}`);
        ch.addEventListener('click',()=>{ gzFilter.unitId = gzFilter.unitId===uid ? null : uid; render(); });
        chips.appendChild(ch);
      });
      root.appendChild(chips);
    }
    if(gzFilter.unitId){ pool = pool.filter(m=>m.unitId===gzFilter.unitId); unitTitle = part(gzFilter.unitId); }
  }
  const cls = cidEff ? CLASS_BY_ID[cidEff] : null;
  const scope = unitTitle ? unitTitle : cls ? (cls.short||cls.name) : '';
  const poolDue = pool.filter(m=>dueIds.has(m.id));
  const poolRest = pool.filter(m=>!dueIds.has(m.id));
  const rvOpt = extra => ({ classId: cidEff||undefined, unitId: gzFilter.unitId||undefined,
                            title: (scope ? scope+' review' : 'Review'), ...extra });
  const startReview = extra => {
    if(!buildReviewUnit(rvOpt(extra))){ toast('Nothing to review here'); return; }
    /* Deliberately skips the readiness check-in: that question is about one
       unit, and this runs most days. Friction here would kill the habit. */
    go('quiz',{unitId:'__review__', classId: cidEff||'__all__'});
  };

  /* ---- Two doors. ----
     Due is the daily habit. "Ahead of time" is the test-week door: everything
     in the filter, due or not. It reads as the primary action only when
     nothing is due, so the habit loop is never upstaged. */
  const c = el('div','card ac');
  if(poolDue.length){
    c.appendChild(el('h2',null, `${poolDue.length} ${poolDue.length===1?'question is':'questions are'} back${scope?' in '+scope:''}`));
    const b = el('button','btn btn-primary', poolDue.length>20 ? 'Review 20 of them' : 'Start review');
    b.addEventListener('click',()=>startReview({}));
    c.appendChild(b);
  } else {
    c.appendChild(el('h2',null, `Nothing due${scope?' in '+scope:''} today`));
  }
  if(poolRest.length){
    const n = Math.min(pool.length, 20);
    const b2 = el('button','btn'+(poolDue.length ? ' btn-ghost' : ' btn-primary'),
      `Review ${n===pool.length ? 'all '+n : n+' of '+pool.length}${scope?' in '+scope:''} · ahead of time`);
    b2.addEventListener('click',()=>startReview({all:true}));
    c.appendChild(b2);
  }
  c.appendChild(el('p',null,'Get one right and it goes quiet for longer; miss it and it starts over.'));
  root.appendChild(c);

  /* ---- The list, folded. ----
     A row is the question and its ladder bar; the answer, what she chose and
     the explanation open on a tap. A long ladder used to be a wall of every
     detail at once, which is the part that made it unappealing to open. */
  const row = m => {
    const box = m.box ?? -1;
    const open = !!gzOpen[m.id];
    const d = el('div','miss' + (box>=3 ? ' nearly' : box>=1 ? ' settling' : '') + (open ? '' : ' fold'));
    const head = el('button','mhead');
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.appendChild(el('div','q', m.q));
    const bar = el('div','box');
    for(let i=0;i<BOX_GAPS.length;i++){ const p=el('i'); if(i<=box) p.classList.add('on'); bar.appendChild(p); }
    bar.appendChild(el('em',null, dueIds.has(m.id) ? 'due now'
      : box<0 ? 'not seen again yet' : 'back '+AZ.short(m.due)));
    bar.appendChild(el('b','chev', open ? '▾' : '▸'));
    head.appendChild(bar);
    head.addEventListener('click',()=>{ gzOpen[m.id] = !open; render(); });
    d.appendChild(head);
    if(open){
      const mg = graphNode(m.graph); if(mg) d.appendChild(mg);
      d.appendChild(el('div','a','✓ '+m.right));
      if(m.chose) d.appendChild(el('div','n','You chose: '+m.chose));
      /* richify, so a **bold** run in an explanation renders as bold rather
         than as its asterisks — the old screen printed them raw. */
      if(m.why) d.appendChild(richify(el('div','n'), m.why));
    }
    return d;
  };
  const renderList = (list, header) => {
    if(!list.length) return;
    root.appendChild(divider(header));
    if(cidEff){
      /* Inside one subject the group header would only repeat the chip. */
      list.forEach(m=>root.appendChild(row(m)));
      return;
    }
    const byG = {};
    list.forEach(m=>{ (byG[m.classId] = byG[m.classId]||[]).push(m); });
    Object.keys(byG).sort((a,b)=> prio(a)-prio(b) || byG[b].length-byG[a].length).forEach(cid=>{
      const c = CLASS_BY_ID[cid];
      if(c){
        /* Direction A carried into the Growth Zone: the group header wears its
           subject's rule, so "these are the Biology ones" reads at a glance. */
        const gh = el('div','hintline subjline', c.icon+' '+c.name+testTag(cid));
        gh.style.setProperty('--pc', classColor(c));
        root.appendChild(gh);
      }
      byG[cid].forEach(m=>root.appendChild(row(m)));
    });
  };
  renderList(poolDue, 'Due today');
  renderList(poolRest.slice().sort((a,b)=>(a.due||'').localeCompare(b.due||'')), 'Settling in');
  /* State, not action — it reads fine below the work. */
  const cleared = all('cleared').length;
  if(cleared){
    const w = el('div','card');
    w.appendChild(el('h2',null, cleared+' learned for good'));
    w.appendChild(el('p',null,'Each of these came back five times over three weeks and you got every one. They have left this list.'));
    root.appendChild(w);
  }
};

/* ---- Grown-up correction tool: take a question OFF the review ladder ----
   The Growth Zone fills itself automatically and that stays automatic — this
   is the other direction, for when a question itself was the problem: a
   misprint since fixed, a duplicate, a question a content edit superseded.
   Removing one only tombstones the miss record (softDelete, so it can never
   resurrect on its own) — it never touches the unit, her qstats, or her XP,
   and it never re-adds a miss if she goes on to get the live question wrong
   again some other day.

   Deliberately unreachable from her side. Her own Growth Zone screen has no
   delete button and stays exactly what it has always been — "information,
   not a verdict" — never a list she can quietly edit down herself. */
SCREENS.growthedit = function(root){
  root.appendChild(headline('Growth Zone',
    'Remove a question that should not be on the review ladder — a fixed misprint, a duplicate, or one that no longer applies. She never sees this screen or any button on it.'));
  const ms = all('miss');
  if(!ms.length){
    const e = el('div','empty');
    e.appendChild(el('span','ic','🌱'));
    e.appendChild(el('p',null,'Nothing on the ladder right now.'));
    root.appendChild(e);
  } else {
    const dueIds = new Set(dueMisses().map(m=>m.id));
    const byC = {};
    ms.forEach(m=>{ (byC[m.classId||'__mixed__'] = byC[m.classId||'__mixed__']||[]).push(m); });
    Object.keys(byC).sort((a,b)=>{
      const na = CLASS_BY_ID[a]?.name || 'Other', nb = CLASS_BY_ID[b]?.name || 'Other';
      return na.localeCompare(nb);
    }).forEach(cid=>{
      const c = CLASS_BY_ID[cid];
      const gh = el('div','hintline subjline', c ? c.icon+' '+c.name : 'Other');
      if(c) gh.style.setProperty('--pc', classColor(c));
      root.appendChild(gh);
      const card = el('div','card');
      byC[cid].forEach(m=>{
        const box = m.box ?? -1;
        const d = el('div','miss' + (box>=3 ? ' nearly' : box>=1 ? ' settling' : ''));
        d.appendChild(el('div','q',m.q));
        d.appendChild(el('div','a','✓ '+m.right));
        if(m.chose) d.appendChild(el('div','n','She chose: '+m.chose));
        const bar = el('div','box');
        for(let i=0;i<BOX_GAPS.length;i++){ const p=el('i'); if(i<=box) p.classList.add('on'); bar.appendChild(p); }
        bar.appendChild(el('em',null, dueIds.has(m.id) ? 'due now'
          : box<0 ? 'not seen again yet' : 'back '+AZ.short(m.due)));
        d.appendChild(bar);
        const xb = el('button','btn btn-sm btn-ghost','Remove from the Growth Zone');
        xb.style.marginTop = '10px';
        xb.addEventListener('click',()=>{
          softDelete(m.id);
          syncSoon(); toast('Removed'); render();
        });
        d.appendChild(xb);
        card.appendChild(d);
      });
      root.appendChild(card);
    });
  }
  const back = el('button','btn btn-ghost','← Grown-ups');
  back.addEventListener('click',()=>go('parent'));
  root.appendChild(back);
};

/* ---- Flagged questions: her own eyes on the content, not the Growth Zone ----
   The Growth Zone is about what SHE knows; this is about the QUESTION itself
   being wrong — a typo in the answer key, a confusing scenario, a graph that
   doesn't match its own text. She flags it from the quiz screen with an
   optional note; nothing happens automatically. Only a grown-up sees this
   screen, and only a grown-up decides what happens next: remove the question
   from the unit for good, or dismiss the flag because it checked out fine. */
SCREENS.flagged = function(root){
  root.appendChild(headline('Flagged questions',
    'Something she thought might be wrong. Removing a question takes it out of the unit for everyone; dismissing just clears the flag and leaves the question as it is.'));
  const flags = all('flag');
  if(!flags.length){
    const e = el('div','empty');
    e.appendChild(el('span','ic','🚩'));
    e.appendChild(el('p',null,'Nothing flagged right now.'));
    root.appendChild(e);
  } else {
    const byC = {};
    flags.forEach(f=>{ (byC[f.classId||'__mixed__'] = byC[f.classId||'__mixed__']||[]).push(f); });
    Object.keys(byC).sort((a,b)=>{
      const na = CLASS_BY_ID[a]?.name || 'Other', nb = CLASS_BY_ID[b]?.name || 'Other';
      return na.localeCompare(nb);
    }).forEach(cid=>{
      const c = CLASS_BY_ID[cid];
      const gh = el('div','hintline subjline', c ? c.icon+' '+c.name : 'Other');
      if(c) gh.style.setProperty('--pc', classColor(c));
      root.appendChild(gh);
      const card = el('div','card');
      byC[cid].forEach(f=>{
        const u = DATA.records[f.unitId];
        const row = el('div','miss');
        row.appendChild(el('div','q', f.q));
        row.appendChild(el('div','n', (u && !u.deleted ? u.title : 'Unit no longer exists') + ' · flagged '+AZ.short(f.date)));
        if(f.note) row.appendChild(el('div','n', '“'+f.note+'”'));
        const btnRow = el('div','btn-row');
        const rm = el('button','btn btn-sm btn-secondary','Remove the question');
        rm.addEventListener('click',()=>{
          if(u && !u.deleted){
            put({ ...u, questions: u.questions.filter(q=>q.id!==f.qid) });
            /* A removed-for-being-wrong question shouldn't keep haunting the
               Growth Zone from an old miss record that already snapshotted
               it — same softDelete every other correction tool here uses. */
            const missId = 'miss_'+f.unitId+'_'+f.qid;
            if(DATA.records[missId] && !DATA.records[missId].deleted) softDelete(missId);
          }
          softDelete(f.id);
          syncSoon(); toast('Removed from the unit'); render();
        });
        const dm = el('button','btn btn-sm btn-ghost','Dismiss — it checked out');
        dm.addEventListener('click',()=>{
          softDelete(f.id);
          syncSoon(); toast('Dismissed'); render();
        });
        btnRow.appendChild(rm); btnRow.appendChild(dm);
        row.appendChild(btnRow);
        card.appendChild(row);
      });
      root.appendChild(card);
    });
  }
  const back = el('button','btn btn-ghost','← Grown-ups');
  back.addEventListener('click',()=>go('parent'));
  root.appendChild(back);
};

/* ================= TUTOR ================= */
SCREENS.tutor = function(root){
  const date = AZ.today();
  const hasKey = !!Store.get('anthropic_key','');

  /* Asking comes first. Without a key this still records what she is stuck on
     so it reaches a person — that is arguably the more important half. */
  const ask = el('div','card ac');
  ask.appendChild(el('h2',null,'What are you stuck on?'));
  ask.appendChild(el('p',null,'Ask about a subject or about how to study. You get an answer straight away, and the question is saved so a person can pick it up too.'));
  const ta = el('textarea');
  ta.placeholder = 'e.g. "I keep blanking on Latin vocab in tests" or "how should I split this week?"';
  ta.style.minHeight = '92px';
  ask.appendChild(ta);
  const out = el('div');
  const b = el('button','btn btn-primary','Ask');
  b.addEventListener('click', async ()=>{
    const q = ta.value.trim();
    if(q.length < 5){ toast('Write a bit more first'); return; }
    b.disabled = true; b.textContent = hasKey ? 'Thinking…' : 'Working…'; out.textContent = '';

    /* Always answer. Claude when a key is set, the app's own reading of her
       numbers when not — and the question is recorded either way. */
    let answer, source = 'app', note = null;
    if(hasKey){
      try{ answer = await askTutor(q); source = 'ai'; }
      catch(e){
        answer = localAnswer(q, date);
        note = e.message==='BAD_KEY'
          ? 'That API key was rejected, so this is the app answering.'
          : 'Could not reach Claude just now, so this is the app answering.';
      }
    } else {
      answer = localAnswer(q, date);
    }
    put({id:uid('ask'), type:'ask', q, a:answer, source, answered:true, date, at:Date.now()});
    syncSoon();

    const card = el('div','card');
    if(note) card.appendChild(el('div','whyline', note));
    answer.split('\n\n').forEach(par=>{ if(par.trim()) card.appendChild(el('p',null,par.trim())); });
    if(source==='app') card.appendChild(el('div','hintline','Saved — someone can follow this up with you.'));
    out.appendChild(card);
    ta.value = '';
    b.disabled = false; b.textContent = 'Ask';
  });
  ask.appendChild(b);
  if(!hasKey) ask.appendChild(el('div','hintline','Answers get sharper once an Anthropic API key is added in the grown-up settings.'));
  ask.appendChild(out);
  root.appendChild(ask);

  /* One or two techniques, chosen for the situation. */
  const tips = relevantHabits(date);
  root.appendChild(divider(tips.length>1 ? 'Worth trying now' : 'Worth trying'));
  tips.forEach(({h,why})=>{
    const c = el('div','card');
    c.appendChild(el('h3',null,h.t));
    c.appendChild(el('div','whyline', why));
    c.appendChild(el('p',null,h.d));
    root.appendChild(c);
  });

  const plan = studyPlan(date);
  if(plan.length){
    root.appendChild(divider('Where the time is best spent'));
    plan.forEach(p=>{
      const c = CLASS_BY_ID[p.classId];
      const d = el('div','plan'); d.style.setProperty('--pc',classColor(c));
      const hd = el('div','hd');
      hd.appendChild(el('span','nm',`${c.icon} ${c.name}`));
      hd.appendChild(el('span','mins',`${p.minutes} min`));
      d.appendChild(hd);
      d.appendChild(el('div','why', p.why));
      d.addEventListener('click',()=>go('unit',{classId:p.classId}));
      root.appendChild(d);
    });
  }

  const asked = all('ask').sort((a,b)=>b.at-a.at);

    asked.slice(0,4).forEach(a=>{

      c.appendChild(el('div','eyebrow', AZ.shortDate(a.date)));
      c.appendChild(el('p','lede', a.q));
      if(a.a){
        const more = el('button','btn btn-ghost btn-sm','Show the answer');
        more.style.marginTop='10px';
        more.addEventListener('click',()=>showModal({title:'Tutor', message:a.a}));
        c.appendChild(more);
      }
      root.appendChild(c);
    });
  }
};

async function askTutor(question){
  const key = Store.get('anthropic_key','');
  if(!key) throw new Error('NO_KEY');
  const s = stats(), date = AZ.today();
  const perClass = STUDY_CLASSES.map(c=>{
    const st = classStats(c.id);
    const gz = all('miss').filter(m=>m.classId===c.id).length;
    const nx = assessments().find(a=>a.classId===c.id && a.date>=date);
    return `- ${c.name}: ${st.accuracy===null?'not studied yet':st.accuracy+'% accuracy over '+st.answered+' questions'}`
      + `, ${st.minutes} min logged, ${gz} in growth zone`
      + (st.lastOn?`, last studied ${st.lastOn}`:'')
      + (nx?`, ${KINDS[nx.kind].nm.toLowerCase()} "${nx.title}" on ${nx.date} (${AZ.daysBetween(date,nx.date)} days away)`:'');
  }).join('\n');
  const moods = all('mood').filter(m=>m.when==='pre').slice(-5);
  const moodLine = moods.length
    ? `Recent pre-quiz readiness ratings (1-5): ${moods.map(m=>m.readiness).join(', ')}.` : '';

  const who = roster().studentName || 'the student';
  const where = roster().school ? ` at ${roster().school}` : '';
  const system = `You are a study coach for ${who}, a sharp ${STUDENT.grade}th grader${where}. You are talking directly to her.

Ground every suggestion in her real data below. Be concrete: name the subject, the number of minutes, and what to actually do in that time. No generic advice like "make a schedule".

Use techniques with real evidence: retrieval practice over rereading, spaced practice over cramming, interleaving, sleep, explaining aloud. Frame effort and strategy, never fixed ability — do not tell her she is smart or talented. Do not be saccharine or use exclamation marks. Be warm, direct, and a little dry. Keep it under 200 words. Plain prose, no headers, no bullet lists.

Today is ${date}.
Overall: level ${s.level}, ${s.xp} XP, ${s.streak}-day streak, ${s.accuracy}% accuracy across ${s.answered} questions, ${Math.round(s.seconds/60)} minutes logged, ${s.focusMin} of those in focus sessions.
By subject:
${perClass}
${moodLine}`;

  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{ 'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:'claude-opus-5', max_tokens:2000, system,
      output_config:{ effort:'low' },
      messages:[{role:'user',content:question}] })
  });
  if(!res.ok) throw new Error(res.status===401?'BAD_KEY':`API error ${res.status}`);
  const data = await res.json();
  if(data.stop_reason==='refusal') throw new Error('The model declined that one.');
  return data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
