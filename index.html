<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Ad Astra — Sedona</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#080b16; --deep:#0e1428; --surface:#161e3c; --raised:#1e2850;
  --line:#2b3766; --line-soft:#1f2a52;
  --gold:#e8b84b; --gold-dim:#9c7f34; --gold-glow:rgba(232,184,75,.16);
  --star:#f2efe4; --muted:#8d95b8; --faint:#5c6488;
  --good:#5fd39a; --bad:#ff7a8a; --warn:#ffb765;
  --r:14px; --tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--void); color:var(--star);
  font-family:'Space Grotesk',system-ui,sans-serif;
  font-size:16px; line-height:1.5;
  min-height:100vh; overflow-x:hidden;
  padding-top:env(safe-area-inset-top);
}
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1px 1px at 12% 18%,rgba(242,239,228,.7),transparent),
    radial-gradient(1px 1px at 68% 9%,rgba(242,239,228,.5),transparent),
    radial-gradient(1.5px 1.5px at 34% 42%,rgba(232,184,75,.55),transparent),
    radial-gradient(1px 1px at 84% 31%,rgba(242,239,228,.45),transparent),
    radial-gradient(1px 1px at 22% 66%,rgba(242,239,228,.4),transparent),
    radial-gradient(1.5px 1.5px at 91% 72%,rgba(232,184,75,.4),transparent),
    radial-gradient(1px 1px at 55% 88%,rgba(242,239,228,.5),transparent),
    radial-gradient(1px 1px at 7% 91%,rgba(242,239,228,.35),transparent),
    radial-gradient(circle at 50% -10%,rgba(46,60,120,.5),transparent 60%);
}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px 120px}
h1,h2,h3,.display{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.01em;margin:0}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dim);font-weight:600}

/* header */
header{padding:20px 0 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{font-size:22px;line-height:1}
.brand h1{font-size:26px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}
.hdr-stats{display:flex;gap:6px;flex-shrink:0}
.chip{background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip.gold{border-color:var(--gold-dim);color:var(--gold)}

/* cards */
.card{background:linear-gradient(160deg,var(--surface),var(--deep));border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card.accent{border-left:3px solid var(--gold)}
.card h2{font-size:22px;margin-bottom:4px}
.card h3{font-size:18px;margin-bottom:6px}
.card p{margin:0 0 10px;color:var(--muted);font-size:14.5px}
.card p:last-child{margin-bottom:0}

/* buttons */
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit}
.btn{min-height:var(--tap);border-radius:12px;padding:12px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s ease,filter .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--gold),#c99a2e);color:#1a1405;box-shadow:0 3px 16px var(--gold-glow)}
.btn-secondary{background:var(--raised);color:var(--star);border:1px solid var(--line)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line-soft)}
.btn-row{display:flex;gap:10px}
.btn-row .btn{width:auto;flex:1}
.btn-sm{min-height:40px;padding:8px 14px;font-size:13.5px;width:auto}

/* nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(10,14,26,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:640px;margin:0 auto;display:flex}
.nav-btn{flex:1;min-height:var(--tap);padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.04em}
.nav-btn .ic{font-size:19px;line-height:1}
.nav-btn.on{color:var(--gold)}

/* schedule */
.period{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);margin-bottom:8px;border-left:3px solid var(--pc,var(--line))}
.period.now{border-color:var(--gold);background:linear-gradient(100deg,rgba(232,184,75,.12),var(--surface));box-shadow:0 0 0 1px var(--gold-glow)}
.period.done{opacity:.42}
.period .ic{font-size:20px;width:26px;text-align:center;flex-shrink:0}
.period .meta{flex:1;min-width:0}
.period .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.period .dt{font-size:12px;color:var(--faint)}
.period .tm{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.badge-now{background:var(--gold);color:#1a1405;font-size:9px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.08em}

/* class grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--pc,var(--gold));border-radius:12px;padding:14px;min-height:var(--tap);text-align:left;display:flex;flex-direction:column;gap:4px}
.tile:active{transform:scale(.985)}
.tile .ic{font-size:22px}
.tile .nm{font-weight:600;font-size:14.5px;line-height:1.25}
.tile .ct{font-size:11.5px;color:var(--faint)}

/* progress bar */
.bar{height:7px;background:var(--deep);border:1px solid var(--line-soft);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* flashcard */
.flip{perspective:1400px;margin:14px 0}
.flip-in{position:relative;width:100%;min-height:290px;transition:transform .55s cubic-bezier(.3,.9,.3,1);transform-style:preserve-3d;cursor:pointer}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r);padding:26px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:1px solid var(--line);overflow:hidden}
.face.front{background:linear-gradient(160deg,var(--surface),var(--deep))}
.face.back{background:linear-gradient(160deg,#1d2650,#121a38);transform:rotateY(180deg);border-color:var(--gold-dim)}
.face .wm{position:absolute;font-family:'Cormorant Garamond',serif;font-size:120px;opacity:.05;pointer-events:none;user-select:none}
.face .term{font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1.15;position:relative}
.face .def{font-size:16px;line-height:1.55;position:relative}
.face .eq{font-family:ui-monospace,Menlo,monospace;background:rgba(0,0,0,.32);border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin-top:12px;font-size:14.5px;position:relative}
.face .hint{margin-top:14px;font-size:13px;color:var(--gold);font-style:italic;position:relative}
.face .tap{position:absolute;bottom:14px;font-size:11px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}

/* quiz */
.opt{width:100%;text-align:left;min-height:var(--tap);padding:14px 16px;margin-bottom:9px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:15px;display:flex;gap:11px;align-items:flex-start;line-height:1.4}
.opt .ltr{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--good);background:rgba(95,211,154,.13)}
.opt.right .ltr{background:var(--good);color:#052;border-color:var(--good)}
.opt.wrong{border-color:var(--bad);background:rgba(255,122,138,.13)}
.opt.wrong .ltr{background:var(--bad);color:#3a0a12;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.explain{border-radius:12px;padding:15px;margin-top:12px;border:1px solid var(--line);background:var(--deep)}
.explain.ok{border-color:var(--good)}
.explain.no{border-color:var(--bad)}
.explain .lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-dim);font-weight:700;margin-top:10px}
.explain .lbl:first-child{margin-top:0}
.explain p{font-size:14px;color:var(--star);margin:3px 0 0}

/* misc */
.empty{text-align:center;padding:38px 20px;color:var(--muted)}
.empty .ic{font-size:44px;opacity:.4;display:block;margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row .k{font-size:14px}
.row .v{font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);font-weight:600;margin:14px 0 6px}
input,textarea,select{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:11px;color:var(--star);padding:13px 14px;font-family:inherit;font-size:16px;min-height:var(--tap)}
textarea{min-height:150px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold-dim)}
.hintline{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.45}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.bdg{text-align:center;padding:12px 6px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);opacity:.32}
.bdg.got{opacity:1;border-color:var(--gold-dim);background:linear-gradient(160deg,rgba(232,184,75,.14),var(--surface))}
.bdg .ic{font-size:26px;display:block}
.bdg .nm{font-size:10.5px;font-weight:600;margin-top:5px;line-height:1.25}
.pill{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);margin:0 5px 5px 0}
.miss{padding:13px;border-radius:12px;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--bad);margin-bottom:9px}
.miss .q{font-size:14.5px;font-weight:600;margin-bottom:5px}
.miss .a{font-size:13px;color:var(--good)}
.miss .n{font-size:12px;color:var(--faint);margin-top:5px}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--gold-dim)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.divider span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600}

/* modal + toast */
.modal-overlay{position:fixed;inset:0;background:rgba(4,6,14,.78);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:90vw;width:360px;max-height:80vh;overflow-y:auto}
.modal-box h3{font-size:21px;margin-bottom:8px}
.modal-box p{color:var(--muted);font-size:14.5px;white-space:pre-wrap;margin:0}
.modal-buttons{display:flex;gap:10px;margin-top:20px}
.modal-buttons .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:1100;background:var(--raised);border:1px solid var(--gold-dim);color:var(--star);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s ease;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.spark{position:fixed;pointer-events:none;z-index:900;font-size:19px;animation:rise 1.3s ease-out forwards}
@keyframes rise{to{transform:translateY(-130px) rotate(160deg);opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      <span class="mark">✦</span>
      <div>
        <h1>Ad Astra</h1>
        <div class="sub" id="brandSub">Sedona · 8th Grade</div>
      </div>
    </div>
    <div class="hdr-stats">
      <span class="chip gold" id="chipXp">0 XP</span>
      <span class="chip" id="chipStreak">🔥 0</span>
    </div>
  </header>
  <main id="screen"></main>
</div>

<nav>
  <div class="nav-inner" id="nav"></div>
</nav>

<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   AD ASTRA — Sedona's 8th grade learning lab
   Single file. No build step. localStorage + optional Gist sync.
   ============================================================ */

/* ---------- 1. Arizona time (no DST — never use toISOString) ---------- */
const AZ = {
  tz: 'America/Phoenix',
  today(){ return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(new Date()); },
  dateKey(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(d); },
  nowMinutes(){
    const p = new Intl.DateTimeFormat('en-US',{timeZone:this.tz,hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    const h = +p.find(x=>x.type==='hour').value, m = +p.find(x=>x.type==='minute').value;
    return h*60+m;
  },
  weekday(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y,m-1,d).getDay(); // 0=Sun
  },
  pretty(dateStr){
    const [y,m,d] = dateStr.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  },
  daysBetween(a,b){
    return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00'))/86400000);
  }
};

/* ---------- 2. Storage ---------- */
const Store = {
  ns:'adastra_',
  get(k,fb=null){ try{ const r=localStorage.getItem(this.ns+k); return r===null?fb:JSON.parse(r);}catch(e){return fb;} },
  set(k,v){ try{ localStorage.setItem(this.ns+k,JSON.stringify(v)); return true;}catch(e){ toast('Storage full — export a backup'); return false;} },
  remove(k){ try{ localStorage.removeItem(this.ns+k);}catch(e){} }
};

/* ---------- 3. School data (from Drive: schedule .ics + BASIS Chandler calendar) ---------- */
const STUDENT = { name:'Sedona', grade:8, school:'BASIS Chandler' };

// Sedona's schedule is identical Monday–Friday.
const CLASSES = [
  {id:'theatre', name:'Theatrical Design',     short:'Theatre',  teacher:'Taylor Nicole Finnell', room:'Theater', start:450, end:500, icon:'🎭', color:'#c77dff'},
  {id:'algeo',   name:'Algebra & Geometry II', short:'Alg/Geo',  teacher:'Michael Vedder',        room:'231',     start:505, end:555, icon:'📐', color:'#5fb8ff'},
  {id:'bio',     name:'Biology 8',             short:'Biology',  teacher:'TBA',                   room:'126',     start:560, end:610, icon:'🧬', color:'#5fd39a'},
  {id:'physics', name:'Physics 8',             short:'Physics',  teacher:'Curtis Canaday',        room:'122',     start:615, end:665, icon:'⚛️', color:'#ff9f6e'},
  {id:'history', name:'History 8',             short:'History',  teacher:'Addison Guevara',       room:'213',     start:670, end:720, icon:'🏛️', color:'#e8b84b'},
  {id:'english', name:'English 8',             short:'English',  teacher:'Cassandra Collins',     room:'221',     start:725, end:775, icon:'📖', color:'#ff7ab8'},
  {id:'lunch',   name:'Lunch',                 short:'Lunch',    teacher:'',                      room:'MPR2',    start:780, end:830, icon:'🥪', color:'#6c7699', break:true},
  {id:'latin',   name:'Latin I',               short:'Latin',    teacher:'Felicia Jo Gass',       room:'127',     start:835, end:885, icon:'🏺', color:'#b8a0ff'}
];
const CLASS_BY_ID = Object.fromEntries(CLASSES.map(c=>[c.id,c]));
const STUDY_CLASSES = CLASSES.filter(c=>!c.break);

const CAL = {
  firstDay:'2026-08-03', lastDay:'2027-05-21',
  quarters:[
    {n:1, start:'2026-08-03', end:'2026-10-02'},
    {n:2, start:'2026-10-12', end:'2026-12-18'},
    {n:3, start:'2027-01-04', end:'2027-03-12'},
    {n:4, start:'2027-03-22', end:'2027-05-14'}
  ],
  // No-school ranges (inclusive) from the BASIS Chandler SY26-27 calendar
  closed:[
    ['2026-09-04','2026-09-04','Labor Day Break'],
    ['2026-09-07','2026-09-07','Labor Day'],
    ['2026-10-05','2026-10-09','Fall Break'],
    ['2026-11-11','2026-11-11',"Veteran's Day"],
    ['2026-11-25','2026-11-30','Thanksgiving Break'],
    ['2026-12-21','2027-01-01','Winter Break'],
    ['2027-01-18','2027-01-18','MLK Day'],
    ['2027-02-15','2027-02-15','Presidents Day'],
    ['2027-03-15','2027-03-19','Spring Break'],
    ['2027-03-26','2027-03-26','March Break'],
    ['2027-05-31','2027-05-31','Memorial Day']
  ],
  // Grades 6–8 testing + key dates
  milestones:[
    {date:'2026-08-03', name:'First day of school', icon:'🚀'},
    {date:'2026-10-02', name:'End of Quarter 1',    icon:'📊'},
    {date:'2026-12-07', name:'Pre-Comp review begins', icon:'📚'},
    {date:'2026-12-15', name:'Pre-Comp Exams',      icon:'✍️'},
    {date:'2026-12-18', name:'End of Quarter 2',    icon:'📊'},
    {date:'2027-03-12', name:'End of Quarter 3',    icon:'📊'},
    {date:'2027-05-03', name:'Comp review begins',  icon:'📚'},
    {date:'2027-05-11', name:'Comp Exams',          icon:'🎓'},
    {date:'2027-05-14', name:'End of Quarter 4',    icon:'📊'},
    {date:'2027-05-17', name:'Project Week',        icon:'🛠️'},
    {date:'2027-05-21', name:'Last day of school',  icon:'🎉'}
  ]
};

function closedToday(dateStr){
  for(const [a,b,label] of CAL.closed){
    if(dateStr>=a && dateStr<=b) return label;
  }
  return null;
}
function currentQuarter(dateStr){
  for(const q of CAL.quarters){ if(dateStr>=q.start && dateStr<=q.end) return q; }
  return null;
}
function nextMilestone(dateStr){
  return CAL.milestones.find(m=>m.date>=dateStr) || null;
}
function isSchoolDay(dateStr){
  const wd = AZ.weekday(dateStr);
  if(wd===0||wd===6) return false;
  if(dateStr<CAL.firstDay||dateStr>CAL.lastDay) return false;
  return !closedToday(dateStr);
}
function fmtTime(mins){
  const h=Math.floor(mins/60), m=mins%60;
  const ampm = h>=12?'PM':'AM';
  const hh = h%12===0?12:h%12;
  return `${hh}:${String(m).padStart(2,'0')} ${ampm}`;
}

/* ---------- 4. Content model ----------
   A UNIT is a chunk of study material attached to one class.
   { id, classId, title, quarter, source, createdAt, updatedAt,
     cards:[{id,term,def,hint,eq}],
     questions:[{id,lv,q,opts[4],ans,hint,ex:{main,tip,mnemonic}}] }
   Units live in the same synced record store as progress, so content
   authored on Chris's laptop reaches Sedona's phone through one Gist.
--------------------------------------------------------------- */

const SCHEMA_VERSION = 1;

/* Seed unit: built from the real schedule so week one has something to
   drill (rooms + teachers), and so the engine is demonstrably working
   before any class content exists. No invented academic facts. */
function buildOrientationUnit(){
  const qs = [];
  let n = 0;
  STUDY_CLASSES.forEach(c=>{
    const others = STUDY_CLASSES.filter(x=>x.id!==c.id);
    const wrongRooms = shuffle(others.map(x=>x.room)).slice(0,3);
    qs.push({
      id:`orient-room-${c.id}`, lv:1,
      q:`Which room is ${c.name} in?`,
      opts: shuffle([c.room, ...wrongRooms]),
      ansValue: c.room,
      hint:'Think about where you walk after the previous period.',
      ex:{ main:`${c.name} meets in room ${c.room} at ${fmtTime(c.start)}.`, tip:'Room numbers stick faster if you picture the walk between periods.' }
    });
    if(c.teacher && c.teacher!=='TBA'){
      const wrongT = shuffle(others.filter(x=>x.teacher&&x.teacher!=='TBA').map(x=>x.teacher)).slice(0,3);
      qs.push({
        id:`orient-teacher-${c.id}`, lv:1,
        q:`Who teaches ${c.name}?`,
        opts: shuffle([c.teacher, ...wrongT]),
        ansValue: c.teacher,
        hint:'Picture the classroom door.',
        ex:{ main:`${c.teacher} teaches ${c.name} in room ${c.room}.`, tip:'Knowing names on day one makes asking for help much easier.' }
      });
    }
    n++;
  });
  // resolve ansValue -> index
  qs.forEach(q=>{ q.ans = q.opts.indexOf(q.ansValue); delete q.ansValue; });

  const cards = STUDY_CLASSES.map(c=>({
    id:`orient-card-${c.id}`,
    term:c.name,
    def:`${fmtTime(c.start)} – ${fmtTime(c.end)} · Room ${c.room}${c.teacher&&c.teacher!=='TBA'?` · ${c.teacher}`:''}`,
    hint:`Period ${STUDY_CLASSES.indexOf(c)+1} of your day.`
  }));

  return {
    id:'unit-orientation', classId:'__all__', title:'First Week: Rooms & Teachers',
    quarter:1, source:'Class schedule (Google Drive)',
    createdAt:Date.now(), updatedAt:Date.now(),
    cards, questions:qs
  };
}

/* ---------- 5. Record store (sync-safe: id + updatedAt, tombstones) ---------- */
let DATA = { v:SCHEMA_VERSION, records:{} };

function loadLocal(){
  const d = Store.get('data', null);
  if(d && d.records){ DATA = migrate(d); }
  else { DATA = { v:SCHEMA_VERSION, records:{} }; }
  // Always ensure the orientation unit exists (regenerated, never user-edited)
  const o = buildOrientationUnit();
  const ex = DATA.records[o.id];
  if(!ex || !ex.deleted) DATA.records[o.id] = { ...o, type:'unit', updatedAt: ex?.updatedAt || Date.now() };
  saveLocal();
}
function migrate(d){
  if(!d.v) d.v = 1;
  // future: step migrations here, bump SCHEMA_VERSION
  d.v = SCHEMA_VERSION;
  return d;
}
function saveLocal(){ Store.set('data', DATA); }

function put(rec){
  rec.updatedAt = Date.now();
  DATA.records[rec.id] = rec;
  saveLocal();
}
function softDelete(id){
  const r = DATA.records[id];
  if(!r) return;
  DATA.records[id] = { id, type:r.type, deleted:true, updatedAt:Date.now() };
  saveLocal();
}
function all(type){
  return Object.values(DATA.records).filter(r=>r && !r.deleted && r.type===type);
}
function units(classId){
  const u = all('unit');
  if(!classId) return u;
  return u.filter(x=>x.classId===classId || x.classId==='__all__');
}

/* ---------- 6. Gist sync (fetch → merge → write; never blind overwrite) ---------- */
const Sync = {
  get gistId(){ return Store.get('gist_id',''); },
  get token(){ return Store.get('gist_token',''); },
  filename:'ad-astra-data.json',
  configured(){ return !!(this.gistId && this.token); },
  headers(){ return { 'Authorization':'Bearer '+this.token, 'Accept':'application/vnd.github+json' }; },

  async pullRemote(){
    const res = await fetch(`https://api.github.com/gists/${this.gistId}`,{headers:this.headers()});
    if(!res.ok) throw new Error('Gist fetch failed: '+res.status);
    const gist = await res.json();
    const file = gist.files[this.filename];
    if(!file) return { v:SCHEMA_VERSION, records:{} };
    const text = file.truncated ? await (await fetch(file.raw_url)).text() : file.content;
    return migrate(JSON.parse(text || '{"records":{}}'));
  },

  merge(local, remote){
    const out = { v:SCHEMA_VERSION, records:{ ...(remote.records||{}) } };
    for(const [id,rec] of Object.entries(local.records||{})){
      const r = out.records[id];
      if(!r || (rec.updatedAt||0) > (r.updatedAt||0)) out.records[id] = rec;
    }
    const cutoff = Date.now() - 60*86400000;
    for(const [id,rec] of Object.entries(out.records)){
      if(rec.deleted && rec.updatedAt < cutoff) delete out.records[id];
    }
    return out;
  },

  async save(){
    if(!this.configured()) throw new Error('NO_SYNC');
    let merged = DATA;
    try{ merged = this.merge(DATA, await this.pullRemote()); }catch(e){ /* offline / first write */ }
    const res = await fetch(`https://api.github.com/gists/${this.gistId}`,{
      method:'PATCH',
      headers:{ ...this.headers(), 'Content-Type':'application/json' },
      body: JSON.stringify({ files:{ [this.filename]:{ content: JSON.stringify(merged,null,2) } } })
    });
    if(!res.ok) throw new Error('Gist save failed: '+res.status);
    DATA = merged; saveLocal();
    Store.set('last_sync', Date.now());
    return merged;
  },

  async load(){
    if(!this.configured()) return DATA;
    try{
      DATA = this.merge(DATA, await this.pullRemote());
      saveLocal(); Store.set('last_sync', Date.now());
    }catch(e){ /* offline-first: local always works */ }
    return DATA;
  }
};

let syncTimer = null;
function syncSoon(){
  if(!Sync.configured()) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>Sync.save().catch(()=>{}), 2500);
}

/* ---------- 7. Derived progress (never stored — can't diverge across devices) ---------- */
function logs(){ return all('log').sort((a,b)=>b.at-a.at); }

function stats(){
  const L = logs();
  let xp=0, correct=0, answered=0, seconds=0;
  const days = new Set();
  L.forEach(l=>{
    xp += l.xp||0; correct += l.correct||0; answered += l.total||0;
    seconds += l.seconds||0; days.add(l.date);
  });
  const level = Math.floor(xp/500)+1;
  const intoLevel = xp % 500;
  return {
    xp, level, intoLevel, toNext:500-intoLevel,
    correct, answered, seconds,
    accuracy: answered ? Math.round(correct/answered*100) : 0,
    days: days.size, streak: streakFrom(days), sessions:L.length
  };
}
function streakFrom(daySet){
  let n=0, cur=AZ.today();
  if(!daySet.has(cur)){
    const [y,m,d]=cur.split('-').map(Number);
    const prev=new Date(y,m-1,d-1);
    cur=AZ.dateKey(prev);
    if(!daySet.has(cur)) return 0;
  }
  while(daySet.has(cur)){
    n++;
    const [y,m,d]=cur.split('-').map(Number);
    cur=AZ.dateKey(new Date(y,m-1,d-1));
  }
  return n;
}
function classStats(classId){
  const L = logs().filter(l=>l.classId===classId);
  let c=0,t=0,xp=0;
  L.forEach(l=>{c+=l.correct||0;t+=l.total||0;xp+=l.xp||0;});
  return { sessions:L.length, correct:c, answered:t, xp, accuracy: t?Math.round(c/t*100):0 };
}

/* ---------- 9. UI helpers (createElement only — never innerHTML with data) ---------- */
function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined && text !== null) n.textContent = String(text);
  return n;
}
function frag(){ return document.createDocumentFragment(); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('on'), 2600);
}
function showModal({title, message, confirmText='OK', cancelText=null, onConfirm=null}){
  const ov = el('div','modal-overlay');
  const box = el('div','modal-box');
  box.appendChild(el('h3',null,title));
  if(message) box.appendChild(el('p',null,message));
  const row = el('div','modal-buttons');
  if(cancelText){
    const c = el('button','btn btn-secondary',cancelText);
    c.addEventListener('click',()=>ov.remove());

  ok.addEventListener('click',()=>{ ov.remove(); if(onConfirm) onConfirm(); });
  row.appendChild(ok);
  box.appendChild(row);
  ov.appendChild(box);
  ov.addEventListener('click',e=>{ if(e.target===ov) ov.remove(); });

function celebrate(){

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; }

      p.style.setProperty('--pc', c.color);

      const m = el('div','meta');

  // countdown

    const c = el('div','card');

  // node and the CSS flip transition would never play.
  flip.addEventListener('click',()=>{

  quit.addEventListener('click',()=>{ cardState.start=0; go('unit',{classId:ctx.classId}); });
  root.appendChild(quit);

  cardState.start=0;
  showModal({
    title:`+${xp} XP`,
    message:`${cardState.seen.size} cards reviewed in ${Math.max(1,Math.round(secs/60))} min.\n\nFlashcards build recognition. The quiz is where you find out what actually stuck.`,
    confirmText:'Take the quiz', cancelText:'Later',
    onConfirm:()=>go('quiz',{unitId:u.id, classId:ctx.classId})
  });
  go('unit',{classId:ctx.classId});
}

/* --- Quiz --- */
let quizState = null;
function scrQuiz(root){
  const u = DATA.records[ctx.unitId];
  if(!u || !u.questions.length) return go('unit',{classId:ctx.classId});
  if(!quizState || quizState.unitId!==u.id){
    quizState = { unitId:u.id, i:0, correct:0, answered:null, start:Date.now(),
                  order:shuffle(u.questions.map((_,i)=>i)), missed:[], hintUsed:false, hints:0 };
  }
  const q = u.questions[quizState.order[quizState.i]];

  const head = el('div','card');
  head.appendChild(el('div','eyebrow', `${u.title} · Level ${q.lv||1}`));
  const r = el('div','row');
  r.appendChild(el('span','k',`Question ${quizState.i+1} of ${u.questions.length}`));
  r.appendChild(el('span','v',`${quizState.correct} correct`));
  head.appendChild(r);
  const bar=el('div','bar'); const fi=el('i');
  fi.style.width=(quizState.i/u.questions.length*100)+'%';
  bar.appendChild(fi); head.appendChild(bar);
  root.appendChild(head);

  const qc = el('div','card accent');
  qc.appendChild(el('h3',null,q.q));
  root.appendChild(qc);

  q.opts.forEach((text,idx)=>{
    const b = el('button','opt');
    const l = el('span','ltr', String.fromCharCode(65+idx));
    b.appendChild(l); b.appendChild(el('span',null,text));
    if(quizState.answered!==null){
      b.disabled = true;
      if(idx===q.ans) b.className='opt right';
      else if(idx===quizState.answered) b.className='opt wrong';
    } else {
      b.addEventListener('click',()=>answer(u,q,idx));
    }
    root.appendChild(b);
  });

  if(quizState.answered===null){
    if(q.hint && !quizState.hintUsed){
      const h = el('button','btn btn-ghost','💡  Give me a hint (−5 XP)');
      h.addEventListener('click',()=>{ quizState.hintUsed=true; quizState.hints++; render(); });
      root.appendChild(h);
    } else if(q.hint){
      const h = el('div','card'); h.appendChild(el('p',null,'💡 '+q.hint)); root.appendChild(h);
    }
  } else {
    const right = quizState.answered===q.ans;
    const ex = el('div','explain '+(right?'ok':'no'));
    ex.appendChild(el('div','lbl', right?'Correct':'Not quite'));
    ex.appendChild(el('p',null, q.ex?.main || `The answer is ${q.opts[q.ans]}.`));
    if(q.ex?.tip){ ex.appendChild(el('div','lbl','Test tip')); ex.appendChild(el('p',null,q.ex.tip)); }
    if(q.ex?.mnemonic){ ex.appendChild(el('div','lbl','Memory hook')); ex.appendChild(el('p',null,q.ex.mnemonic)); }
    root.appendChild(ex);

    const n = el('button','btn btn-primary', quizState.i===u.questions.length-1?'See results →':'Next question →');
    n.addEventListener('click',()=>{
      if(quizState.i<u.questions.length-1){ quizState.i++; quizState.answered=null; quizState.hintUsed=false; render(); }
      else finishQuiz(u);
    });
    root.appendChild(n);
  }

  const quit = el('button','btn btn-ghost','Exit quiz');
  quit.addEventListener('click',()=>{ quizState=null; go('unit',{classId:ctx.classId}); });
  root.appendChild(quit);
}
function answer(u,q,idx){
  quizState.answered = idx;
  if(idx===q.ans){ quizState.correct++; }
  else {
    quizState.missed.push(q.id);
    put({ id:'miss_'+u.id+'_'+q.id, type:'miss', unitId:u.id, classId:ctx.classId,
          qid:q.id, q:q.q, right:q.opts[q.ans], chose:q.opts[idx],
          why:q.ex?.main||'', on:AZ.today() });
  }
  render();
}
function finishQuiz(u){
  const total = u.questions.length;
  const pct = Math.round(quizState.correct/total*100);
  const secs = Math.round((Date.now()-quizState.start)/1000);
  // Hints cost 5 XP each, as promised on the button. Never let a session go negative.
  const bonus = pct===100 ? 50 : pct>=80 ? 25 : 0;
  const xp = Math.max(0, quizState.correct*10 + bonus - quizState.hints*5);
  const hintsUsed = quizState.hints;
  put({ id:uid('log'), type:'log', mode:'quiz', classId:ctx.classId, unitId:u.id,
        date:AZ.today(), at:Date.now(), correct:quizState.correct, total, seconds:secs, xp, hints:hintsUsed });
  // Clear growth-zone entries answered correctly this round
  all('miss').forEach(m=>{
    if(m.unitId===u.id && !quizState.missed.includes(m.qid)){
      put({ id:'cleared_'+m.qid, type:'cleared', qid:m.qid, on:AZ.today() });
      softDelete(m.id);
    }
  });
  checkBadges(); syncSoon();
  if(pct>=80) celebrate();
  const msg = pct===100 ? `Perfect. ${total}/${total}.\n\n+${xp} XP` :
              pct>=80 ? `${quizState.correct}/${total} — strong.\n\n+${xp} XP` :
              pct>=60 ? `${quizState.correct}/${total}. Solid base, a few gaps.\n\n+${xp} XP` :
              `${quizState.correct}/${total}. This one needs another pass — that's information, not a verdict.\n\n+${xp} XP`;
  const missed = quizState.missed.length;
  quizState = null;
  showModal({
    title:`${pct}%`,
    message: msg
      + (hintsUsed?`\n\n${hintsUsed} hint${hintsUsed>1?'s':''} used (−${hintsUsed*5} XP).`:'')
      + (missed?`\n\n${missed} question${missed>1?'s':''} went to your Growth Zone.`:''),
    confirmText: missed?'Review misses':'Done',
    cancelText: missed?'Later':null,
    onConfirm:()=>go(missed?'growth':'unit',{classId:ctx.classId})
  });
  go('unit',{classId:ctx.classId});
}

/* --- Growth Zone --- */
function scrGrowth(root){
  root.appendChild(headline('Growth Zone','Every question you missed, with the reason why. Nothing here is a grade — it is a list of things worth one more look.'));
  const ms = all('miss').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  if(!ms.length){
    const e = el('div','empty');
    e.appendChild(el('span','ic','🌱'));
    e.appendChild(el('p',null,'Nothing here yet. Missed questions land here automatically, and clear themselves when you get them right on a retake.'));
    root.appendChild(e);
    return;
  }
  const byClass = {};
  ms.forEach(m=>{ (byClass[m.classId] = byClass[m.classId]||[]).push(m); });
  Object.entries(byClass).forEach(([cid,list])=>{
    const c = CLASS_BY_ID[cid];
    root.appendChild(divider(c?`${c.icon} ${c.name}`:'Other'));
    list.forEach(m=>{
      const d = el('div','miss');
      d.appendChild(el('div','q',m.q));
      d.appendChild(el('div','a','✓ '+m.right));
      if(m.chose) d.appendChild(el('div','n','You chose: '+m.chose));
      if(m.why) d.appendChild(el('div','n',m.why));
      root.appendChild(d);
    });
  });
}

/* --- Stars (progress) --- */
function scrStars(root){
  const s = stats();
  root.appendChild(headline('Star Chart', `Level ${s.level} · ${s.xp.toLocaleString()} XP`));

  const c = el('div','card');
  [['Current streak', s.streak+' day'+(s.streak===1?'':'s')],
   ['Days studied', s.days],
   ['Study sessions', s.sessions],
   ['Questions answered', s.answered],
   ['Overall accuracy', s.answered?s.accuracy+'%':'—'],
   ['Time logged', s.seconds>=3600?Math.floor(s.seconds/3600)+'h '+Math.round(s.seconds%3600/60)+'m':Math.round(s.seconds/60)+'m'],
   ['Growth Zone items', all('miss').length]
  ].forEach(([k,v])=>{
    const r = el('div','row');
    r.appendChild(el('span','k',k));
    r.appendChild(el('span','v',String(v)));
    c.appendChild(r);
  });
  root.appendChild(c);

  root.appendChild(divider('By subject'));
  const sub = el('div','card');
  let any=false;
  STUDY_CLASSES.forEach(cl=>{
    const st = classStats(cl.id);
    if(!st.sessions) return;
    any=true;
    const r = el('div','row');
    r.appendChild(el('span','k',`${cl.icon} ${cl.name}`));
    r.appendChild(el('span','v',`${st.accuracy}% · ${st.xp} XP`));
    sub.appendChild(r);
  });
  if(!any) sub.appendChild(el('p',null,'Subject breakdowns appear once you have studied.'));
  root.appendChild(sub);

  root.appendChild(divider('Badges'));
  const have = earned();
  const g = el('div','badges');
  BADGES.forEach(b=>{
    const d = el('div','bdg'+(have.has(b.id)?' got':''));
    d.appendChild(el('span','ic',b.ic));
    d.appendChild(el('span','nm',b.nm));
    d.addEventListener('click',()=>showModal({title:`${b.ic} ${b.nm}`, message:b.desc + (have.has(b.id)?'\n\nEarned ✓':'\n\nNot yet.')}));
    g.appendChild(d);
  });
  root.appendChild(g);
}

/* --- Setup --- */
function scrSetup(root){
  root.appendChild(headline('Setup','Sync, AI generation, and backups. Nothing here is stored anywhere but this device unless you turn on sync.'));

  // Sync
  root.appendChild(divider('Shared sync'));
  const sc = el('div','card');
  sc.appendChild(el('p',null,'Point this app at a private GitHub Gist and progress plus study content flow between Sedona\'s phone and your laptop. Both devices need the same two values.'));
  const gid = el('input'); gid.type='text'; gid.placeholder='Gist ID'; gid.value=Store.get('gist_id','');
  const gtk = el('input'); gtk.type='password'; gtk.placeholder='GitHub token (gist scope)'; gtk.value=Store.get('gist_token','');
  sc.appendChild(el('label',null,'Gist ID')); sc.appendChild(gid);
  sc.appendChild(el('label',null,'GitHub token')); sc.appendChild(gtk);
  sc.appendChild(el('div','hintline','The token stays in this browser only and is never written into the page source. Use a token with just the "gist" scope.'));
  const sv = el('button','btn btn-secondary','Save sync settings');
  sv.addEventListener('click',()=>{
    Store.set('gist_id', gid.value.trim());
    Store.set('gist_token', gtk.value.trim());
    toast('Saved'); render();
  });
  sc.appendChild(sv);
  if(Sync.configured()){
    const last = Store.get('last_sync',0);
    sc.appendChild(el('div','hintline', last?`Last sync: ${new Date(last).toLocaleString()}`:'Not synced yet.'));
    const row = el('div','btn-row');
    const up = el('button','btn btn-primary','↑ Push');
    up.addEventListener('click',async()=>{ up.textContent='Syncing…';
      try{ await Sync.save(); toast('Synced'); }catch(e){ toast('Sync failed — check the token'); } render(); });
    const dn = el('button','btn btn-secondary','↓ Pull');
    dn.addEventListener('click',async()=>{ dn.textContent='Loading…';
      try{ await Sync.load(); toast('Up to date'); }catch(e){ toast('Pull failed'); } render(); });
    row.appendChild(up); row.appendChild(dn);
    sc.appendChild(row);
  }
  root.appendChild(sc);

  // AI
  root.appendChild(divider('AI generation'));
  const ac = el('div','card');
  ac.appendChild(el('p',null,'An Anthropic API key lets the app turn notes into flashcards and quiz questions on the spot. Everything else works without it.'));
  const key = el('input'); key.type='password'; key.placeholder='sk-ant-…'; key.value=Store.get('anthropic_key','');
  ac.appendChild(el('label',null,'Anthropic API key')); ac.appendChild(key);
  ac.appendChild(el('div','hintline','Stored in this browser only. Never in the page source, never synced to the Gist.'));
  const sk = el('button','btn btn-secondary','Save key');
  sk.addEventListener('click',()=>{ Store.set('anthropic_key', key.value.trim()); toast('Saved'); });
  ac.appendChild(sk);
  root.appendChild(ac);

  // Content
  root.appendChild(divider('Study units'));
  const uc = el('div','card');
  const list = units(null).filter(u=>u.id!=='unit-orientation');
  if(!list.length) uc.appendChild(el('p',null,'No custom units yet.'));
  list.forEach(u=>{
    const r = el('div','row');
    const cl = CLASS_BY_ID[u.classId];
    r.appendChild(el('span','k',`${cl?cl.icon+' ':''}${u.title}`));
    const del = el('button','btn btn-ghost btn-sm','Delete');
    del.addEventListener('click',()=>showModal({
      title:'Delete unit?', message:`"${u.title}" — ${u.cards.length} cards and ${u.questions.length} questions.\n\nProgress logs stay; the material goes.`,
      confirmText:'Delete', cancelText:'Keep',
      onConfirm:()=>{ softDelete(u.id); syncSoon(); toast('Deleted'); render(); }
    }));
    r.appendChild(del);
    uc.appendChild(r);
  });
  root.appendChild(uc);

  // Backup
  root.appendChild(divider('Backup'));
  const bc = el('div','card');
  const row = el('div','btn-row');
  const ex = el('button','btn btn-secondary','⬇ Export');
  ex.addEventListener('click',()=>{
    const blob = new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});
    const a = el('a'); a.href=URL.createObjectURL(blob);
    a.download = `ad-astra-${AZ.today()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    Store.set('last_backup', Date.now()); toast('Exported');
  });
  const im = el('button','btn btn-secondary','⬆ Import');
  const file = el('input'); file.type='file'; file.accept='.json'; file.className='sr';
  file.addEventListener('change',e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const inc = migrate(JSON.parse(rd.result));
        DATA = Sync.merge(DATA, inc); saveLocal();
        toast('Imported and merged'); render();
      }catch(err){ toast('That file could not be read'); }
    };
    rd.readAsText(f);
  });
  im.addEventListener('click',()=>file.click());
  row.appendChild(ex); row.appendChild(im);
  bc.appendChild(row); bc.appendChild(file);
  const lb = Store.get('last_backup',0);
  bc.appendChild(el('div','hintline', lb?`Last export: ${new Date(lb).toLocaleDateString()}`:'No export yet. Worth doing once a week.'));
  root.appendChild(bc);

  const ver = el('div','hintline');
  ver.style.textAlign='center'; ver.style.marginTop='20px';
  ver.textContent = `Ad Astra · schema v${SCHEMA_VERSION} · ${STUDENT.school} SY 2026–27`;
  root.appendChild(ver);
}

/* --- AI unit generation (browser-direct; key from localStorage) --- */
const UNIT_SCHEMA = {
  type:'object',
  properties:{
    title:{type:'string'},
    cards:{ type:'array', items:{ type:'object',
      properties:{ term:{type:'string'}, def:{type:'string'}, hint:{type:'string'}, eq:{type:'string'} },
      required:['term','def','hint'], additionalProperties:false } },
    questions:{ type:'array', items:{ type:'object',
      properties:{
        lv:{type:'integer', enum:[1,2,3]},
        q:{type:'string'},
        opts:{ type:'array', items:{type:'string'} },
        ans:{type:'integer', enum:[0,1,2,3]},
        hint:{type:'string'},
        ex:{ type:'object',
          properties:{ main:{type:'string'}, tip:{type:'string'}, mnemonic:{type:'string'} },
          required:['main','tip'], additionalProperties:false }
      },
      required:['lv','q','opts','ans','hint','ex'], additionalProperties:false } }
  },
  required:['title','cards','questions'],
  additionalProperties:false
};

async function generateUnit(classId, notes){
  const key = Store.get('anthropic_key','');
  if(!key) throw new Error('NO_KEY');
  const cls = CLASS_BY_ID[classId];
  const system = [
    `You build study material for Sedona, a sharp 8th grader at BASIS Chandler taking ${cls?cls.name:'this class'}.`,
    `Write 15-25 flashcards and 18-24 quiz questions (6-8 each at level 1 recall, level 2 application, level 3 analysis).`,
    `Every question has exactly 4 options and one correct answer.`,
    `Anchor everything to the supplied notes. Do not invent facts that are not supported by them.`,
    `Tone: direct and a little witty. Never condescending. She can handle "why this is actually interesting".`,
    `Card hints are memory hooks or mnemonics, never restatements of the definition.`,
    `Explanations say why the right answer is right, not just what it is.`
  ].join(' ');

  const res = await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key':key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-opus-5',
      max_tokens:16000,
      system,
      output_config:{ effort:'medium', format:{ type:'json_schema', schema:UNIT_SCHEMA } },
      messages:[{ role:'user', content:`Class notes / study material:\n\n${notes}` }]
    })
  });
  if(!res.ok){
    const t = await res.text();
    throw new Error(res.status===401?'BAD_KEY':`API error ${res.status}: ${t.slice(0,200)}`);
  }
  const data = await res.json();
  if(data.stop_reason === 'refusal') throw new Error('The model declined this content.');
  const text = data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
  const parsed = JSON.parse(text);

  // Validate before storing — a malformed unit breaks the quiz screen.
  parsed.questions = (parsed.questions||[]).filter(q =>
    Array.isArray(q.opts) && q.opts.length===4 && q.ans>=0 && q.ans<4 && q.q);
  parsed.cards = (parsed.cards||[]).filter(c=>c.term && c.def);
  if(!parsed.questions.length && !parsed.cards.length) throw new Error('Nothing usable came back. Try more detailed notes.');

  parsed.cards.forEach((c,i)=>c.id = `c${i}`);
  parsed.questions.forEach((q,i)=>q.id = `q${i}`);
  return parsed;
}

function scrGenerate(root){
  root.appendChild(headline('Generate a unit','Paste notes, a study guide, a vocab list, or a chapter summary. You will see everything before it is saved.'));

  const c = el('div','card');
  c.appendChild(el('label',null,'Subject'));
  const sel = el('select');
  STUDY_CLASSES.forEach(cl=>{
    const o = el('option',null,cl.name); o.value=cl.id;
    if(cl.id===ctx.classId) o.selected=true;
    sel.appendChild(o);
  });
  c.appendChild(sel);
  c.appendChild(el('label',null,'Class notes'));
  const ta = el('textarea');
  ta.placeholder = 'Paste the material here — notes, slides text, a vocab list, a study guide…';
  c.appendChild(ta);
  c.appendChild(el('div','hintline','More detail means better questions. Everything is grounded in what you paste; nothing gets invented.'));

  const go_ = el('button','btn btn-primary','✨  Generate');
  go_.addEventListener('click',async()=>{
    if(ta.value.trim().length < 80){ toast('Paste a bit more material first'); return; }
    go_.disabled = true; go_.textContent = 'Thinking… (this can take a minute)';
    try{
      const u = await generateUnit(sel.value, ta.value.trim());
      const rec = {
        id: uid('unit'), type:'unit', classId: sel.value,
        title: u.title || 'Untitled unit',
        quarter: currentQuarter(AZ.today())?.n || null,
        source:'Pasted notes', createdAt:Date.now(),
        cards:u.cards, questions:u.questions
      };
      put(rec); syncSoon(); celebrate();
      showModal({
        title:'Unit ready',
        message:`"${rec.title}"\n\n${rec.cards.length} flashcards · ${rec.questions.length} quiz questions`,
        confirmText:'Open it',
        onConfirm:()=>go('unit',{classId:sel.value})
      });
      go('unit',{classId:sel.value});
    }catch(e){
      go_.disabled=false; go_.textContent='✨  Generate';
      const m = e.message==='NO_KEY' ? 'Add an Anthropic API key in Setup first. Everything else in the app works without one.'
             : e.message==='BAD_KEY' ? 'That API key was rejected. Check it in Setup.'
             : e.message;
      showModal({title:'Could not generate', message:m});
    }
  });
  c.appendChild(go_);
  root.appendChild(c);

  const back = el('button','btn btn-ghost','← Back');
  back.addEventListener('click',()=>go(ctx.classId?'unit':'study',{classId:ctx.classId}));
  root.appendChild(back);
}

  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

setInterval(()=>{ if(view==='today') render(); }, 60000);
