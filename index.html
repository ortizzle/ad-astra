/* Passcode is a SHA-256 hash in localStorage, set on first use. This deters a
   curious 12-year-old; it is not real security and is not claimed to be. */
function openParentGate(){
  const stored = Store.get('parent_hash','');
  /* A trusted device skips the gate. Per-device localStorage, never a record —
     same threat model as the passcode itself: it deters a curious kid on HER
     device; a parent's own phone gains nothing from asking every time. */
  if(stored && Store.get('parent_trust',false)){ go('parent'); return; }
  if(!stored){
    showModal({ title:'Set a passcode',
      message:'Pick a passcode for the grown-up view. Only you need to know it.',
      confirmText:'Set', cancelText:'Cancel',
      build:(box,close)=>{
        const i = el('input'); i.type='password'; i.placeholder='Passcode'; i.autocomplete='new-password';
        box.appendChild(i); setTimeout(()=>i.focus(),50);
        box._go = async ()=>{
          if(i.value.length<4){ toast('At least 4 characters'); return; }
          Store.set('parent_hash', await sha256(i.value)); close(); toast('Passcode set'); go('parent');
        };
        i.addEventListener('keydown',e=>{ if(e.key==='Enter') box._go(); });
      }});
    return;
  }
  showModal({ title:'Passcode', confirmText:'Open', cancelText:'Cancel',
    build:(box,close)=>{
      const i = el('input'); i.type='password'; i.placeholder='Passcode'; i.autocomplete='current-password';
      box.appendChild(i); setTimeout(()=>i.focus(),50);
      const remRow = el('label','trustrow');
      const cb = el('input'); cb.type='checkbox';
      remRow.appendChild(cb);
      remRow.appendChild(el('span',null,'Stop asking on this device (for your own phone, not hers)'));
      box.appendChild(remRow);
      box._go = async ()=>{
        if(await sha256(i.value) === Store.get('parent_hash','')){
          if(cb.checked) Store.set('parent_trust', true);
          close(); go('parent');
        }
        else { toast('Not quite'); i.value=''; }
      };
      i.addEventListener('keydown',e=>{ if(e.key==='Enter') box._go(); });
      /* Without this the only reset lives *inside* the area the passcode guards,
         so forgetting it locks you out for good. */
      const forgot = el('button','btn btn-ghost btn-sm','Forgot passcode?');
      forgot.style.width='100%'; forgot.style.marginTop='12px';
      forgot.addEventListener('click',()=>{ close(); resetPasscode(); });
      box.appendChild(forgot);
    }});
}

/* Resetting is gated on the Gist ID where sync is set up — a parent has it in
   their setup notes, a curious kid does not. With no sync configured there is
   nothing to check against, so it falls back to a plain confirmation. */
function resetPasscode(){
  const gid = Store.get('gist_id','');
  if(gid){
    showModal({ title:'Reset passcode',
      message:'Enter the Gist ID from your setup notes. Nothing is deleted — you just get to pick a new passcode.',
      confirmText:'Reset', cancelText:'Cancel',
      build:(box,close)=>{
        const i = el('input'); i.type='text'; i.placeholder='Gist ID'; i.autocapitalize='none';
        box.appendChild(i); setTimeout(()=>i.focus(),50);
        box._go = ()=>{
          if(i.value.trim() === gid){
            Store.remove('parent_hash'); close(); toast('Passcode cleared'); openParentGate();
          } else { toast('That does not match'); i.value=''; }
        };
        i.addEventListener('keydown',e=>{ if(e.key==='Enter') box._go(); });
      }});
  } else {
    showModal({ title:'Reset passcode',
      message:'This clears the passcode so you can set a new one.\n\nNo progress, study sets or settings are deleted.',
      confirmText:'Reset it', cancelText:'Cancel',
      onConfirm:()=>{ Store.remove('parent_hash'); toast('Passcode cleared'); openParentGate(); }});
  }
}

  const lvAgg = {1:{a:0,c:0},2:{a:0,c:0},3:{a:0,c:0}};

function editAssessment(existing){
  showModal({
    title: existing ? 'Edit' : 'Add a test or quiz',
    confirmText: existing ? 'Save' : 'Add', cancelText:'Cancel',
    build:(box, close)=>{
      const cls = el('select');
      STUDY_CLASSES.forEach(c=>{ const o=el('option',null,c.name); o.value=c.id;
        if(existing && existing.classId===c.id) o.selected=true; cls.appendChild(o); });
      box.appendChild(el('label',null,'Subject')); box.appendChild(cls);

      const kind = el('select');
      Object.entries(KINDS).forEach(([k,v])=>{ const o=el('option',null,v.nm); o.value=k;
        if(existing && existing.kind===k) o.selected=true; kind.appendChild(o); });
      box.appendChild(el('label',null,'Type')); box.appendChild(kind);

      const title = el('input'); title.type='text'; title.placeholder='e.g. Unit 3 vocab quiz';
      title.value = existing?.title || '';
      box.appendChild(el('label',null,'Name')); box.appendChild(title);

      const date = el('input'); date.type='date';
      date.value = existing?.date || AZ.today();
      box.appendChild(el('label',null,'Date')); box.appendChild(date);

      /* Teachers award points, not percentages — 42 out of 50, not 84%. Making
         a parent do that division in their head to type one number lost the
         information that made the grade legible in the first place. Both are
         stored; `score` stays the derived percentage so every existing reader
         (study plan, horizon, charts) is untouched and old records still work. */
      const pts = el('input'); pts.type='number'; pts.min='0'; pts.step='any';
      pts.inputMode='decimal'; pts.placeholder='—';
      if(existing?.points!=null) pts.value = existing.points;
      else if(existing?.score!=null) pts.value = existing.score;

      const outOf = el('input'); outOf.type='number'; outOf.min='1'; outOf.step='any';
      outOf.inputMode='decimal';
      outOf.value = existing?.outOf != null ? existing.outOf : 100;

      const grid = el('div','inrow');
      const cA = el('div'); cA.appendChild(el('label',null,'Points earned')); cA.appendChild(pts);
      const cB = el('div'); cB.appendChild(el('label',null,'Out of'));        cB.appendChild(outOf);
      grid.appendChild(cA); grid.appendChild(cB);
      box.appendChild(grid);

      /* The percentage as it will be stored, updating as they type — so the
         conversion is visible rather than taken on trust. */
      const echo = el('div','hintline','');
      const paint = ()=>{
        const p = assessPct(pts.value, outOf.value);
        echo.textContent = p==null
          ? 'Leave the points blank until the marked work comes back.'
          : pts.value + ' out of ' + (Number(outOf.value)||100) + '  ·  ' + p + '%'
            + (p > 100 ? '  (over full marks — kept as awarded)' : '');
      };
      paint();
      pts.addEventListener('input', paint);
      outOf.addEventListener('input', paint);
      box.appendChild(echo);

      box._go = ()=>{
        if(!title.value.trim()){ toast('Give it a name'); return; }
        const total = Math.max(1, Number(outOf.value) || 100);
        const earned = pts.value.trim()==='' ? null : Math.max(0, Number(pts.value));
        if(earned!=null && isNaN(earned)){ toast('Points must be a number'); return; }
        put({ id: existing?.id || uid('assess'), type:'assess', classId:cls.value, kind:kind.value,
              title:title.value.trim(), date:date.value,
              points:earned, outOf:total, score:assessPct(earned, total) });
        syncSoon(); close(); toast('Saved'); render();
      };
      if(existing){
        const del = el('button','btn btn-ghost btn-sm','Delete');
        del.style.marginTop='14px'; del.style.width='100%';
        del.addEventListener('click',()=>{ softDelete(existing.id); syncSoon(); close(); toast('Deleted'); render(); });
        box.appendChild(del);
      }
    }
  });
}

/* ================= STARS ================= */
/* ---- What she has actually learned ----
   Stars used to count activity: days studied, sessions, questions answered,
   focus minutes. Those only ever go up, cannot be acted on, and read the same
   after a great month as after a mechanical one. These derive the things that
   are genuinely EARNED — and, as ever, store nothing new. */

/* A `cleared` record means a question she once missed came back five times
   over three weeks and she got every one. It is the only signal in the app
   that cannot be farmed by showing up, which is exactly why it leads. */
function lockedIn(){
  const by = {};
  all('cleared').forEach(c => {
    const u = DATA.records[c.unitId];
    const cid = (u && !u.deleted && u.classId) || null;
    if(!cid || cid === '__all__') return;
    (by[cid] = by[cid] || []).push(c);
  });
  const rows = Object.entries(by)
    .map(([cid, list]) => ({ cid, cls:CLASS_BY_ID[cid], n:list.length }))
    .filter(r => r.cls)
    .sort((a,b) => b.n - a.n);
  return { total: rows.reduce((n,r) => n + r.n, 0), rows };
}
/* Trophies: a topic crest is won by finishing the capstone of a series, and a
   finished book is her own tap on the reading log. Both are already earned
   elsewhere in the app and were invisible on the tab that is supposed to hold
   achievements. Nothing here is a new mechanic and nothing can be un-won. */
function trophies(){
  const out = [];
  STUDY_CLASSES.forEach(c => {
    /* shelvesFor returns {shelves, loose} — the books are the .shelves half. */
    shelvesFor(c.id).shelves.forEach(sh => {
      if(crestWon(sh.units)) out.push({ kind:'crest', nm:sh.name, cls:c, ic:c.icon });
    });
  });
  const seen = new Set();
  logs().filter(l => l.mode === 'readfin' && l.book).forEach(l => {
    if(seen.has(l.book)) return;
    seen.add(l.book);
    out.push({ kind:'book', nm:l.book, ic:'📕' });
  });
  return out;
}
/* One honest line about MOVEMENT — a subject whose accuracy over the last
   three weeks beats the three before it. Change, never a grade: it names the
   direction and stops. Needs real volume on both sides so a couple of lucky
   rounds cannot manufacture a trend. */
function movement(date){
  const midA = AZ.shift(date, -21), midB = AZ.shift(date, -42);
  let best = null;
  STUDY_CLASSES.forEach(c => {
    const acc = (from, to) => {
      const L = logs().filter(l => l.classId === c.id && l.total && l.date >= from && l.date < to);
      const t = L.reduce((n,l) => n + l.total, 0);
      return t >= 15 ? { pct: Math.round(L.reduce((n,l) => n + l.correct, 0) / t * 100), t } : null;
    };
    const now = acc(midA, AZ.shift(date, 1)), before = acc(midB, midA);
    if(!now || !before) return;
    const d = now.pct - before.pct;
    if(d >= 8 && (!best || d > best.d)) best = { cls:c, d, now:now.pct };
  });
  return best;
}
SCREENS.stars = function(root){
  const s = stats(), date = AZ.today();
  /* The subtitle orients rather than counts: the header already wears the XP
     pill and the level card carries the level, so repeating either here would
     be the third printing of the same fact. */
  root.appendChild(headline('Star chart', 'Everything you have earned, and everything you have learned for keeps.'));

  /* The week as a constellation. Stars light for showing up, never for
     scores, and a short week simply stays dim — nothing breaks. */
  const preSky = date < skyWeek0();
  const wk = skyWeek(skyNow(date));
  const skc = el('div','card ac sky-card');
  skc.appendChild(el('div','eyebrow', preSky ? 'First constellation' : 'This week’s constellation'));
  skc.appendChild(el('h3',null,wk.c.nm));

  skc.appendChild(el('p',null, preSky
    ? `Your sky map begins ${AZ.shortDate(skyWeek0())}. ${wk.c.nm} is first.`

      ? `Complete — ${wk.c.nm} joins your sky map.`
      : `${wk.litCount} of 7 lit · ${SKY_GOAL} completes it`));
  skc.addEventListener('click',()=>go('skymap'));
  root.appendChild(skc);

  /* The level bar keeps its place — it is the one counter that is genuinely
     about her own progress rather than a tally of activity. The streak and
     the Growth count are NOT repeated here: the header already wears the
     streak and Growth wears its own nav badge, and printing either again is
     the same fact twice on one screen. */
  const lvl = el('div','card');
  const lr = el('div','row');
  lr.appendChild(el('span','k',`Level ${s.level}`));
  lr.appendChild(el('span','v',`${s.toNext} XP to go`));
  lvl.appendChild(lr);
  const bar = el('div','bar'), fi = el('i');
  fi.style.width = (s.intoLevel/500*100)+'%'; bar.appendChild(fi); lvl.appendChild(bar);
  root.appendChild(lvl);

  /* What you have locked in. This replaces seven rows of counters that only
     went up — days studied, sessions, questions answered, focus minutes —
     with the one number that has a real bar behind it. */
  const li = lockedIn();
  const lc = el('div','card ac');
  lc.appendChild(el('div','eyebrow','What you have locked in'));
  if(li.total){
    lc.appendChild(el('h3',null, li.total===1 ? '1 question, learned for good'
      : `${li.total} questions, learned for good`));
    lc.appendChild(el('p',null,'Each of these came back five times over three weeks — a day later, then two, four, eight, twenty-one — and you got every one. That is the bar, and you cleared it.'));
    const gr = el('div','locked');
    li.rows.forEach(r=>{
      const b = el('button','lk');
      b.style.setProperty('--pc', classColor(r.cls));
      b.appendChild(el('span','ln', String(r.n)));
      b.appendChild(el('span','lt', r.cls.short || r.cls.name));
      b.addEventListener('click',()=>go('unit',{classId:r.cid}));
      gr.appendChild(b);
    });
    lc.appendChild(gr);
  } else {
    lc.appendChild(el('h3',null,'Nothing here yet'));
    lc.appendChild(el('p',null,'When a question you missed survives the whole review ladder — five sightings over three weeks — it lands here. This is the slow list, and it is the one worth watching.'));
  }
  root.appendChild(lc);

  /* Movement, stated once and only when it is real. */
  const mv = movement(date);
  if(mv){
    const mc = el('div','card');
    mc.appendChild(el('div','eyebrow','Worth noticing'));
    mc.appendChild(el('p',null, `Your ${mv.cls.name} answers are landing ${mv.d} points better than they were three weeks ago — ${mv.now}% over the last three weeks. Whatever you changed there is working.`));
    root.appendChild(mc);
  }

  /* Trophies: crests already won on a shelf, books already finished in the
     reading log. Both were earned somewhere else and shown nowhere. */
  const tr = trophies();
  if(tr.length){
    root.appendChild(divider('Finished'));
    const tg = el('div','trophies');
    tr.forEach(t=>{
      const d = el('div','trophy');
      d.appendChild(el('span','ti', t.ic));
      d.appendChild(el('span','tn', t.nm));
      d.appendChild(el('span','tk', t.kind==='crest' ? 'topic crest' : 'book finished'));
      tg.appendChild(d);
    });
    root.appendChild(tg);
  }

  /* How well you call it. Every check-in asks how ready you feel; every quiz
     answers. This is the two side by side — the same gap the check-in names
     one round at a time, seen as a pattern. Hers to read, not a verdict:
     the direction of the gap is information about her gut, nothing else.
     Needs 4+ pairs so one odd day cannot masquerade as a pattern. */
  const pairs = calibrationPairs();
  if(pairs.length >= 4){
    const last = pairs.slice(-10);
    const cal = el('div','card');
    cal.appendChild(el('div','eyebrow','How well you call it'));
    const W2 = 320, H2 = 96, PADX = 18, PADY = 12;
    const sx = i => last.length>1 ? PADX + i*(W2-PADX*2)/(last.length-1) : W2/2;
    const sy = v => H2-PADY - (Math.min(100,Math.max(0,v))/100)*(H2-PADY*2);
    const svg = svgEl('svg',{viewBox:`0 0 ${W2} ${H2}`,'aria-hidden':'true'});
    svg.style.display='block'; svg.style.width='100%'; svg.style.height='96px';
    svg.style.margin='8px 0 2px'; svg.style.overflow='visible';
    last.forEach((p2,i)=>{
      const x = sx(i);
      const ln = svgEl('line',{x1:x,y1:sy(p2.predicted),x2:x,y2:sy(p2.actual)});
      ln.style.stroke='var(--line)'; ln.style.strokeWidth='1.6'; svg.appendChild(ln);
      const pr = svgEl('circle',{cx:x,cy:sy(p2.predicted),r:3.6});
      pr.style.fill='none'; pr.style.stroke='var(--muted)'; pr.style.strokeWidth='1.6';
      svg.appendChild(pr);
      const ac = svgEl('circle',{cx:x,cy:sy(p2.actual),r:4.2});
      ac.style.fill='var(--ac)'; svg.appendChild(ac);
    });
    cal.appendChild(svg);
    cal.appendChild(el('div','hintline','○ how ready you felt · ● how it went — your last '+last.length+' quizzes'));
    const hits = last.filter(p2=>Math.abs(p2.predicted-p2.actual)<=10).length;
    const gap = Math.round(last.reduce((s2,p2)=>s2+(p2.actual-p2.predicted),0)/last.length);
    cal.appendChild(el('p',null,`Within 10 points on ${hits} of the last ${last.length}. `
      + (gap > 5 ? `You usually do better than you predict — your gut undersells you by about ${gap} points.`
       : gap < -5 ? `You usually feel readier than the round turns out — by about ${Math.abs(gap)} points. One more pass before saying "ready" is the move.`
       : 'Your predictions land close to your scores. That is calibration, and it is a real skill.')));
    root.appendChild(cal);
  }

  /* Pinned badges: up to three earned ones she chooses to feature. Autonomy
     over how achievements display — no new mechanics, just curation. */
  const have = earned();
  const pins = (prefs().pins||[]).filter(id=>have.has(id));
  if(pins.length){
    root.appendChild(divider('Pinned'));
    const pg = el('div','badges pinned');
    pins.forEach(id=>{
      const b = BADGES.find(x=>x.id===id); if(!b) return;
      const d = el('div','bdg got');
      d.appendChild(el('span','ic',b.ic)); d.appendChild(el('span','nm',b.nm));
      d.addEventListener('click',()=>badgeModal(b, have));
      pg.appendChild(d);
    });
    root.appendChild(pg);
  }

  /* Earned badges first; the rest behind one tap. A grid where more than half
     the tiles are greyed "not yet" is the nearest thing to a nag mechanic in
     either app, and nothing here is a prize economy. Nothing is removed —
     tapping shows the lot, and every badge keeps its own modal. */
  root.appendChild(divider('Badges'));
  const gotList = BADGES.filter(b=>have.has(b.id));
  const restList = BADGES.filter(b=>!have.has(b.id));
  const g = el('div','badges');
  const tile = b => {
    const d = el('div','bdg'+(have.has(b.id)?' got':''));
    d.appendChild(el('span','ic',b.ic)); d.appendChild(el('span','nm',b.nm));
    d.addEventListener('click',()=>badgeModal(b, have));
    return d;
  };
  gotList.forEach(b=>g.appendChild(tile(b)));
  if(!gotList.length) g.appendChild(el('div','hintline','Badges arrive on their own as you go. Nothing to chase.'));
  root.appendChild(g);
  if(restList.length){
    if(ctx._allBadges){
      const g2 = el('div','badges');
      restList.forEach(b=>g2.appendChild(tile(b)));
      root.appendChild(g2);
    } else {
      const more = el('button','btn btn-ghost btn-sm',
        restList.length + ' more to find');
      more.addEventListener('click',()=>{ ctx._allBadges = true; render(); });
      root.appendChild(more);
    }
  }
};

function badgeModal(b, have){
  const got = have.has(b.id);
  showModal({
    title:`${b.ic} ${b.nm}`,
    message: b.desc + (got?'\n\nEarned ✓':'\n\nNot yet.'),
    build: got ? (box, close)=>{
      const pins = prefs().pins||[];
      const on = pins.includes(b.id);
      const pb = el('button','btn btn-secondary', on?'Unpin from the top':'Pin to the top');
      pb.style.marginTop='10px';
      pb.addEventListener('click',()=>{
        if(!on && pins.length>=3){ toast('Three pins is the limit — unpin one first'); return; }
        setPref('pins', on ? pins.filter(x=>x!==b.id) : pins.concat(b.id));
        close(); render(); toast(on?'Unpinned':'Pinned');
      });
      box.appendChild(pb);
    } : null
  });
}

/* ---------- Provenance ----------
   Every generated block says where it came from, and we render that rather than
   trusting tone to convey it. "From class material" carries the school's
   authority; "Study suggestion" carries only ours. */
const PROV_LABEL = { source:'From class material', added:'Study suggestion' };
function provTag(from){
  const src = from === 'source';
  const t = el('span','prov '+(src?'src':'add'), PROV_LABEL[src?'source':'added']);
  t.title = src ? 'Comes from the class material.' : 'The app\'s own suggestion.';
  return t;
}
/* A block is {text, from}. Older units predate this and have neither. */
function provBlock(block, opts){
  if(!block || !block.text) return null;
  const w = el('div');
  const p = el('p', (opts&&opts.cls)||null, block.text);
  w.appendChild(p);
  const line = el('div'); line.style.marginTop='6px';
  line.appendChild(provTag(block.from));
  w.appendChild(line);
  return w;
}
/* Just the source. That the original was left alone is an engineering
   guarantee, not something a student or parent needs told every time. */
function citeEl(u){ return u.srcName ? el('div','cite', 'From '+u.srcName) : null; }

/* ---------- Photo capture ---------- */
/* Photographing the whiteboard or a worksheet is how the material actually
   arrives — nobody is going to retype a page of notes on a phone. */
const MAX_SHOTS = 6, SHOT_EDGE = 1400;

function readShot(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith('image/')) return reject(new Error('That file is not an image.'));
    const fr = new FileReader();
    fr.onerror = ()=>reject(new Error('Could not read that photo.'));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('Could not open that photo.'));
      img.onload = ()=>{
        /* Downscaled before it ever leaves the phone: a 12MP photo is mostly
           wasted tokens, and the text stays legible well under 1400px. */
        const scale = Math.min(1, SHOT_EDGE/Math.max(img.width,img.height));
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        const url = cv.toDataURL('image/jpeg',0.82);
        resolve({ url, data:url.split(',')[1], w, h, kb:Math.round(url.length*0.75/1024) });
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function shotPicker(onAdd){
  const wrap = el('div');
  const mk = (label, capture) => {
    const inp = el('input'); inp.type='file'; inp.accept='image/*'; inp.multiple=true;
    if(capture) inp.capture='environment';
    inp.style.display='none';
    const b = el('button','btn btn-secondary',label);
    b.addEventListener('click',()=>inp.click());
    inp.addEventListener('change', async ()=>{
      const files = [...inp.files];
      inp.value = '';
      for(const f of files){
        try{ await onAdd(await readShot(f)); }
        catch(e){ toast(e.message); }
      }
    });
    wrap.appendChild(b); wrap.appendChild(inp);
    return b;
  };
  const row = el('div','btn-row');
  wrap.appendChild(row);
  const a = mk('📷  Take a photo', true);
  const b = mk('🖼  Choose photos', false);
  row.appendChild(a); row.appendChild(b);
  return wrap;
}

/* Anything generated lands as a draft. It reaches her only once a grown-up has
   read it — the model is good, but it is not the one who knows her class. */
const drafts = () => all('unit').filter(u=>u.status==='draft')
                     .sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

SCREENS.review = function(root){
  root.appendChild(headline('Waiting for review','Generated units stay here until you have read them. Nothing on this page has reached her yet.'));
  const ds = drafts();
  if(!ds.length){
    const e = el('div','empty');
    e.appendChild(el('span','ic','📭'));
    e.appendChild(el('p',null,'Nothing waiting. New units land here the moment they are generated.'));
    root.appendChild(e);
  } else {
    ds.forEach(u=>{
      const c = CLASS_BY_ID[u.classId];
      const n = (k,w) => `${k} ${w}${k===1?'':'s'}`;
      root.appendChild(cardButton(u.title,
        `${u.wasApproved?'🔁 Update to a unit you approved — the content changed, so it gets one more read. · ':''}${c?c.name+' · ':''}${n(u.cards.length,'card')} · ${n(u.questions.length,'question')}${u.source?' · '+u.source:''}`,
        ()=>go('reviewunit',{unitId:u.id})));
    });
  }

SCREENS.reviewunit = function(root){
  const u = DATA.records[ctx.unitId];
  if(!u || u.deleted) return go('review');
  const c = CLASS_BY_ID[u.classId];
  /* Cuts are held here, not written, so backing out changes nothing. */
  const cutC = ctx._cutC = ctx._cutC || new Set();
  const cutQ = ctx._cutQ = ctx._cutQ || new Set();
  /* An update to a unit already approved shows ONLY the difference — the
     change summary was computed when the library was fetched, the one moment
     both copies existed. "Show the whole unit" falls back to the full read. */
  const chg = (u.wasApproved && u.chg && !ctx._showAll) ? u.chg : null;
  const chgC = chg ? new Set(chg.c.a.concat(chg.c.m)) : null;
  const chgQ = chg ? new Set(chg.q.a.concat(chg.q.m)) : null;

  const head = el('div','card ac');
  head.appendChild(el('div','eyebrow', (c?c.name:'Unit') + ' · draft'));
  const ti = el('input'); ti.type='text'; ti.value = u.title;
  ti.addEventListener('change',()=>{ u.title = ti.value.trim() || u.title; });
  head.appendChild(ti);
  const cit = citeEl(u); if(cit) head.appendChild(cit);
  head.appendChild(el('p',null,'Read it through. Tap ✕ on anything wrong or off-topic — it is dropped when you approve. Nothing here is visible to her yet.'));
  if(chg){
    const say = (n,w) => n ? n+' '+w+(n===1?'':'s') : '';
    const bits = [
      say(chg.q.m.length,'question')&&say(chg.q.m.length,'question')+' edited',
      say(chg.q.a.length,'question')&&say(chg.q.a.length,'question')+' added',
      say(chg.c.m.length,'card')&&say(chg.c.m.length,'card')+' edited',
      say(chg.c.a.length,'card')&&say(chg.c.a.length,'card')+' added',
      (chg.c.d.length+chg.q.d.length) ? (chg.c.d.length+chg.q.d.length)+' removed' : '',
      chg.meta.length ? 'settings: '+chg.meta.join(', ') : ''
    ].filter(Boolean);
    const kept = (u.cards.length - chgC.size) + (u.questions.length - chgQ.size);
    head.appendChild(el('p',null,'Since you approved it: '+bits.join(' · ')+'. '
      + (kept ? kept+' item'+(kept===1?' is':'s are')+' exactly as you read '+(kept===1?'it':'them')+' — only the changes are shown below.' : '')));
    const allB = el('button','btn btn-ghost btn-sm','Show the whole unit');
    allB.addEventListener('click',()=>{ ctx._showAll = true; render(); });
    head.appendChild(allB);
  }
  /* Units built before provenance existed have nothing to explain. */
  const hasProv = (u.cards||[]).some(x=>x.from) || (u.questions||[]).some(x=>x.from) || !!u.summary;
  if(hasProv) head.appendChild(el('div','hintline','Green marks what came from the material — those are the claims worth checking.'));
  root.appendChild(head);

  /* In changes-only mode the unit-level blocks are exactly what she read
     at approval time — repeating them would bury the diff they came to see. */
  if(u.parentNote && u.parentNote.text && !chg){
    root.appendChild(divider('For you'));
    const pn = el('div','card');
    pn.appendChild(provBlock(u.parentNote));
    root.appendChild(pn);
  }

  const shown = chg ? [] : [['summary','What this covers'],['why','Why it is worth knowing']];
  shown.forEach(([k,label])=>{
    if(!u[k] || !u[k].text) return;
    root.appendChild(divider(label));
    const w = el('div','card');
    w.appendChild(provBlock(u[k]));
    root.appendChild(w);
  });

  if(u.objectives && u.objectives.length && !chg){
    root.appendChild(divider('After this she should be able to'));
    const w = el('div','card');
    const ul = el('ul','objs');
    u.objectives.forEach(o=>{ const li=el('li',null,o.text); li.appendChild(provTag(o.from)); ul.appendChild(li); });
    w.appendChild(ul);
    root.appendChild(w);
  }

  if(u.nextUp && u.nextUp.text && !chg){
    root.appendChild(divider("What she is told to do next"));
    const w = el('div','card');
    w.appendChild(provBlock(u.nextUp));
    if(u.nextUp.minutes) w.appendChild(el('div','hintline',`Estimated at ${u.nextUp.minutes} minutes.`));
    root.appendChild(w);
  }

  const counts = el('div','hintline');
  const recount = () => { counts.textContent =
    `${u.cards.length-cutC.size} of ${u.cards.length} cards · ${u.questions.length-cutQ.size} of ${u.questions.length} questions kept`; };
  recount();
  root.appendChild(counts);

  if(u.cards.length && (!chgC || chgC.size)){
    root.appendChild(divider(chg ? 'Changed flashcards' : 'Flashcards'));
    u.cards.forEach(card=>{
      if(chgC && !chgC.has(card.id)) return;
      const d = el('div','rev'+(cutC.has(card.id)?' cut':''));
      if(chg) d.appendChild(el('div','eyebrow', chg.c.a.includes(card.id) ? 'New card' : 'Edited card'));
      d.appendChild(el('div','q',card.term));
      const cg = graphNode(card.graph); if(cg) d.appendChild(cg);
      d.appendChild(richify(el('div','o flat'), card.def));
      const ig = signImgNode(card); if(ig) d.appendChild(ig);
      if(card.hint) d.appendChild(el('div','why','Hint: '+card.hint));
      /* The one place in the review queue a parent needs to see exactly what
         she'll be shown — the embed if there is one, else the real link. */
      const wn = watchNode(card, 'rev-watch'); if(wn) d.appendChild(wn);
      if(card.from){ const t=el('div'); t.style.marginTop='8px'; t.appendChild(provTag(card.from)); d.appendChild(t); }
      const x = el('button','cut-btn', cutC.has(card.id)?'↩':'✕');
      x.setAttribute('aria-label', cutC.has(card.id)?'Keep this card':'Drop this card');
      x.addEventListener('click',()=>{ cutC.has(card.id)?cutC.delete(card.id):cutC.add(card.id); render(); });
      d.appendChild(x);
      root.appendChild(d);
    });
  }

  if(u.questions.length && (!chgQ || chgQ.size)){
    root.appendChild(divider(chg ? 'Changed questions' : 'Quiz questions'));
    const LV = {1:'Recall',2:'Apply',3:'Analyse'};
    /* Collapsed by default: the question and its answer are what a read-through
       actually verifies. Distractors, the explanation and provenance open per
       item — and changed items in an update open already expanded. */
    const openQ = ctx._openRev = ctx._openRev || new Set();
    u.questions.forEach(q=>{
      if(chgQ && !chgQ.has(q.id)) return;
      const open = !!chgQ || openQ.has(q.id);
      const d = el('div','rev'+(cutQ.has(q.id)?' cut':''));
      d.appendChild(el('div','eyebrow', (LV[q.lv]||('Level '+q.lv))
        + (chg ? (chg.q.a.includes(q.id) ? ' · new' : ' · edited') : '')));
      if(q.kind==='analogy') d.appendChild(analogyStem(q.q));
      else d.appendChild(el('div','q',q.q));
      if(q.passage) d.appendChild(el('div','passage', q.passage));
      const qg2 = graphNode(q.graph); if(qg2) d.appendChild(qg2);
      if(!open){
        d.appendChild(el('div','o yes', '✓ ' + (q.kind==='order' ? q.opts.join(' → ') : q.opts[q.ans])));
        const more = el('button','rev-more','Check the options ▸');
        more.addEventListener('click',()=>{ openQ.add(q.id); render(); });
        d.appendChild(more);
      } else {
      if(q.kind==='order'){
        d.appendChild(el('div','hintline','Put-in-order — listed here in the correct sequence; she sees them shuffled.'));
        q.opts.forEach((o,i)=>d.appendChild(el('div','o yes', (i+1)+'. '+o)));
      } else q.opts.forEach((o,i)=>d.appendChild(el('div','o'+(i===q.ans?' yes':''), o)));
      if(q.ex && q.ex.main) d.appendChild(richify(el('div','why'), q.ex.main));
      if(q.from){ const t=el('div'); t.style.marginTop='8px'; t.appendChild(provTag(q.from)); d.appendChild(t); }
      if(!chgQ){
        const less = el('button','rev-more','Fold it back ▴');
        less.addEventListener('click',()=>{ openQ.delete(q.id); render(); });
        d.appendChild(less);
      }
      }
      const x = el('button','cut-btn', cutQ.has(q.id)?'↩':'✕');
      x.setAttribute('aria-label', cutQ.has(q.id)?'Keep this question':'Drop this question');
      x.addEventListener('click',()=>{ cutQ.has(q.id)?cutQ.delete(q.id):cutQ.add(q.id); render(); });
      d.appendChild(x);
      root.appendChild(d);
    });
  }

  if(chg && (chg.c.d.length || chg.q.d.length)){
    root.appendChild(divider('Removed in this update'));
    const rm = el('div','card');
    chg.c.d.concat(chg.q.d).forEach(t=>rm.appendChild(el('p',null,'— '+t)));
    root.appendChild(rm);
  }
  const ok = el('button','btn btn-primary','Approve — send it to her');
  ok.addEventListener('click',()=>{
    const cards = u.cards.filter(x=>!cutC.has(x.id));
    const qs = u.questions.filter(x=>!cutQ.has(x.id));
    if(!cards.length && !qs.length){ toast('Nothing left to approve'); return; }
    const rec = {...u, cards, questions:qs, title:ti.value.trim()||u.title,
         status:'approved', approvedOn:AZ.today()};
    delete rec.wasApproved; delete rec.chg;
    put(rec);
    syncSoon();
    const dropped = cutC.size + cutQ.size;
    toast(dropped ? `Approved — ${dropped} dropped` : 'Approved');
    ctx._cutC = ctx._cutQ = null;
    go('review');
  });
  root.appendChild(ok);

  const del = el('button','btn btn-ghost','Discard this unit');
  del.addEventListener('click',()=>showModal({ title:'Discard it?',
    message:`"${u.title}" is deleted for good. She never saw it, so nothing is lost on her side.`,
    confirmText:'Discard', cancelText:'Keep it',
    onConfirm:()=>{ softDelete(u.id); syncSoon(); toast('Discarded');
      ctx._cutC = ctx._cutQ = null; go('review'); } }));
  root.appendChild(del);

  const back = el('button','btn btn-ghost','← Back, decide later');
  back.addEventListener('click',()=>{ ctx._cutC = ctx._cutQ = null; go('review'); });
  root.appendChild(back);
};

/* ================= GENERATE ================= */
/* The unit is the contract between the teacher's material and everything the
   app says about it. Two rules shape this schema:

   1. The original is never altered. We read the source, cite it by name, and
      write something new alongside it — nothing is written back to Drive.
   2. Every block declares where it came from. `from:'source'` means the
      substance is the teacher's; `from:'added'` means it is our framing, advice
      or pacing. That flag is rendered, not decorative — a family can see at a
      glance which sentences carry the school's authority and which carry ours.
      Anything the model is unsure of must be marked 'added'. */
const PROV = {type:'string', enum:['source','added']};
const BLOCK = extra => ({type:'object', properties:{text:{type:'string'}, from:PROV, ...(extra||{})},
  required:['text','from'], additionalProperties:false});
/* The plotted-graph shape, for HAND-AUTHORED units — see renderGraph().
   Deliberately NOT part of UNIT_SCHEMA: its ~28 optional properties blew the
   structured-output cap on optional parameters, which failed every generation
   request. Graphs also want a human checking that the plotted curve really has
   the features the question claims, which is exactly what generation cannot
   verify. Content files keep full graph support. */
const GRAPH = {type:'object', properties:{
  w:{type:'array',items:{type:'number'}},
  gx:{type:'number'}, gy:{type:'number'}, xl:{type:'string'}, yl:{type:'string'},
  series:{type:'array',items:{type:'object',properties:{
    type:{type:'string',enum:['line','parabola','abs','pts']},
    m:{type:'number'}, b:{type:'number'}, a:{type:'number'}, h:{type:'number'}, k:{type:'number'},
    dom:{type:'array',items:{type:'number'}},
    pts:{type:'array',items:{type:'array',items:{type:'number'}}}
  },required:['type'],additionalProperties:false}},
  pts:{type:'array',items:{type:'object',properties:{
    x:{type:'number'}, y:{type:'number'}, label:{type:'string'}
  },required:['x','y'],additionalProperties:false}}
},required:['w','series'],additionalProperties:false};

const UNIT_SCHEMA = {
  type:'object',
  properties:{
    title:{type:'string'},
    /* What the teacher's material actually says, in her language. */
    summary:BLOCK(),
    /* Why it is worth knowing. Almost always ours. */
    why:BLOCK(),
    /* "After this you should be able to…" — from the material when it states
       objectives, inferred when it does not. Each carries its own flag. */
    objectives:{type:'array', items:BLOCK()},
    /* One paragraph for a parent: what was covered, what to watch for. */
    parentNote:BLOCK(),
    /* One short line for her, plus an honest estimate in minutes. */
    nextUp:BLOCK({minutes:{type:'integer'}}),
    cards:{type:'array',items:{type:'object',
      properties:{term:{type:'string'},def:{type:'string'},hint:{type:'string'},eq:{type:'string'},from:PROV},
      required:['term','def','hint','from'],additionalProperties:false}},
    questions:{type:'array',items:{type:'object',
      properties:{ lv:{type:'integer',enum:[1,2,3]}, q:{type:'string'},
        opts:{type:'array',items:{type:'string'}}, ans:{type:'integer',enum:[0,1,2,3]},
        hint:{type:'string'}, from:PROV,
        kind:{type:'string',enum:['mc','order','analogy']}, passage:{type:'string'},
        steps:{type:'array',items:{type:'string'}},
        ex:{type:'object',properties:{main:{type:'string'},tip:{type:'string'},mnemonic:{type:'string'}},
            required:['main','tip'],additionalProperties:false}},
      required:['lv','q','opts','ans','hint','ex','steps','from'],additionalProperties:false}}
  },
  required:['title','summary','why','objectives','parentNote','nextUp','cards','questions'],
  additionalProperties:false
};

/* fetch() rejects with a TypeError — "Failed to fetch" — when the request never
   reached a server at all: a dropped connection part-way through an upload,
   which a phone carrying six photos on school wifi manages regularly. That is
   worth one quiet retry. An HTTP error is NOT retried: the server answered, and
   a 400 answers the same way twice. */
async function postRetried(url, opts){
  try{ return await fetch(url, opts); }
  catch(e){
    await new Promise(r => setTimeout(r, 1500));
    try{ return await fetch(url, opts); }
    catch(e2){ throw new Error('NO_NET'); }
  }
}
async function generateUnit(classId, notes, shots, srcName){
  const key = Store.get('anthropic_key','');
  if(!key) throw new Error('NO_KEY');
  shots = shots || [];
  const cls = CLASS_BY_ID[classId];
  const system = [
    `You are the study engine for a sharp ${cls?cls.name:'school'} student — write for a capable 8th grader.`,

    `THE ORIGINAL IS NEVER ALTERED. You are reading the teacher's material and writing something new alongside it. Cite it by name in your summary. Never present your own words as if the teacher wrote them.`,

    `Every block carries a "from" flag and it must be honest, because it is shown to the family:`,
    `· from:"source" — the substance is the teacher's. Facts, definitions, formulas, worked methods, and any objective the material itself states. Cards and questions count as "source" when what they test is traceable to the material.`,
    `· from:"added" — this is yours. Motivation, study advice, pacing, time estimates, memory hooks, and any objective or example you inferred rather than read. If you are unsure which a block is, it is "added". Never inflate "source".`,

    `summary — what the material actually covers, in plain 8th grader language, naming the source. Do not editorialise here; this block stands in for the teacher.`,
    `why — why this is worth knowing, tied to something real. This is yours, so mark it "added".`,
    `objectives — 3 to 5 "after this you should be able to…" statements, each starting with a verb. Mark an objective "source" only if the material states it; mark it "added" if you inferred it from the content.`,
    `parentNote — one paragraph for a parent who did not attend the class: what was covered, and the one thing most likely to trip her up. Plain, specific, no praise language.`,
    `nextUp — one short line to her about what to do first, with an honest estimate in minutes for the flashcards and quiz together. Do not round to a comfortable number; if it is 23 minutes, say 23.`,

    `Then the study material: 15-25 flashcards and 18-24 quiz questions, 6-8 each at level 1 recall, level 2 application, level 3 analysis. Every question has exactly 4 options and one correct answer. Options are SHOWN IN A SHUFFLED ORDER, so never refer to a choice by position or letter — no "all of the above", no "none of the above", no "option B" in steps or explanations. Quote the choice's own text instead.`,
    `Every card and question must STAND ALONE: never reference "the worksheet", "the handout", or a numbered problem from the material — restate whatever context the question needs inside the question itself.`,
    `Every question carries "steps": 3-6 short strings that walk from the question to the answer, revealed one at a time after a wrong answer. Each step is ONE concrete move — read off a value, set up an equation, apply one rule, compute one result — written so she could do it herself on paper. The last step states the answer. No step may skip work ("simplify" alone is not a step; show what it becomes).`,
    `HOW THE QUESTIONS SHOULD MAKE HER THINK. Her teachers ask for reasoning, not recall, and the quiz should rehearse the same moves. Across a unit, include several of these deliberately:`,
    `· Interpret, do not just compute. Ask what a slope, intercept, rate or constant MEANS in the situation — "what is the physical significance of the slope here" — not only what it equals.`,
    `· Run the relationship BOTH directions. If a question predicts an output from an input, another should solve backwards for the input that produces a given output.`,
    `· Counterfactual. "If the car were moving faster, what happens to the slope, and why." Change one variable and ask what follows.`,
    `· Rank, do not just pick. Ordering several quantities from greatest to least tests comparative understanding that a single value never does. Use kind:"order" when the ranking is strict; if a genuine tie exists, ask it as multiple choice over candidate rankings, because kind:"order" cannot express a tie.`,
    `· Make her say how she knew. Prefer options that state a REASON over options that state only an answer, so the right choice is the right reasoning.`,
    `· Carry the units. Where a rate is per second, ask a question posed in minutes. The conversion is part of the work and should not be smoothed away.`,
    `Card definitions LEAD with the straightforward answer wrapped in **bold** — one short sentence that could stand alone as the study answer — then at most two or three supporting bullet lines. A card is a study aid, not an essay; the bold line is what she should retain.`,
    `When a definition or explanation lists several things, format the list as bullet lines: a newline then "• " before each item. Lists render as lists, and **bold** renders as bold.`,
    `Do not describe or reference a diagram, figure or plotted graph — this format cannot render one you invent. Ask about relationships in words instead, or use the eq field for a formula.`,
    `For literature or other reading material: when a question analyses specific lines, quote a SHORT excerpt (under 40 words) in a "passage" field — she sees it styled as a quotation above the choices. For chronology, set kind:"order": opts must then list exactly 4 events in their CORRECT order (she sees them shuffled and taps them into sequence; still include ans:0).`,
    `For VOCABULARY material, include 3-5 analogy questions: set kind:"analogy", put ONLY the stem pair in "q" formatted exactly as "WORD : WORD" (two words, one colon, no other text, no "::"), and make each of the 4 opts a lowercase pair formatted "word : word". The correct option must hold the SAME relationship as the stem, and every wrong option must hold a DIFFERENT, nameable relationship — never a near-miss of the right one. Use real relationships: synonym, antonym, degree (glad:elated), part-to-whole, worker-to-tool, cause-to-effect, word-to-definition. In ex.main, NAME the relationship in words ("both pairs are degree: the second is an extreme form of the first") — naming it is the skill being taught, not the answer itself.`,
    `Anchor everything to the supplied material. Do not invent facts it does not support. If the material is thin, write fewer cards rather than padding with things it never said.`,
    `Tone: direct and a little dry. Never condescending, never exclamation marks, never "great job". Card hints are memory hooks or mnemonics, never restatements of the definition. Explanations say why the right answer is right, not just what it is.`,

    shots.length ? `Some or all of the material arrives as photos — a whiteboard, a worksheet, a textbook page, handwritten notes. Read them carefully, including handwriting and diagrams. If a photo is too blurry or cropped to read, work from what you can read and leave the rest out rather than guessing.` : '',
    srcName ? `The source is titled "${srcName}". Cite it by that name.` : `The source has no filename. Refer to it as the class material rather than inventing a title.`
  ].filter(Boolean).join(' ');
  const res = await postRetried('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify({ model:'claude-opus-5', max_tokens:16000, system,
      output_config:{ effort:'medium', format:{type:'json_schema',schema:UNIT_SCHEMA} },
      messages:[{role:'user',content:[
        ...shots.map(s=>({type:'image',source:{type:'base64',media_type:'image/jpeg',data:s.data}})),
        {type:'text', text: (srcName ? `Source file: ${srcName}\n\n` : '') + (notes
          ? `Class notes / study material:\n\n${notes}`
          : `The material is in the attached photo${shots.length>1?'s':''}. Build the unit from what they show.`)}
      ]}] })
  });
  if(!res.ok){ const t = await res.text();
    throw new Error(res.status===401?'BAD_KEY':`API error ${res.status}: ${t.slice(0,180)}`); }
  const data = await res.json();
  if(data.stop_reason==='refusal') throw new Error('The model declined this content.');
  const parsed = JSON.parse(data.content.filter(b=>b.type==='text').map(b=>b.text).join(''));
  parsed.questions = (parsed.questions||[]).filter(q=>Array.isArray(q.opts)&&q.opts.length===4&&q.ans>=0&&q.ans<4&&q.q);
  /* Options render shuffled, so a question that names a choice by position is
     wrong the moment it ships. Belt to the prompt's braces: drop them here. */
  const posRef = /\b(all|none) of the above\b|\boptions? [a-d1-4]\b|\b(first|second|third|last) (option|choice)\b/i;
  parsed.questions = parsed.questions.filter(q=>{
    const blob = [q.q, q.hint, q.ex?.main, q.ex?.tip, ...(q.steps||[]), ...(q.opts||[])].join(' ');
    return !posRef.test(blob);
  });
  /* The output schema cannot express "exactly 4 numbers" (the API only allows
     minItems 0 or 1), so window shape is validated here instead — a malformed
     graph is dropped rather than shipped. */
  const okGraph = g => g && Array.isArray(g.w) && g.w.length===4 && g.w.every(n=>typeof n==='number');
  (parsed.cards||[]).forEach(c=>{ if(c.graph && !okGraph(c.graph)) delete c.graph; });
  parsed.questions.forEach(q=>{ if(q.graph && !okGraph(q.graph)) delete q.graph; });
  parsed.cards = (parsed.cards||[]).filter(c=>c.term&&c.def);
  if(!parsed.questions.length && !parsed.cards.length) throw new Error('Nothing usable came back. Try more detailed notes.');
  /* Unmarked means ours. Defaulting the other way would let a dropped flag
     quietly borrow the teacher's authority, which is the one failure this
     whole scheme exists to prevent. */
  const own = b => (b && b.from === 'source') ? 'source' : 'added';
  parsed.cards.forEach((c,i)=>{ c.id=`c${i}`; c.from = own(c); });
  parsed.questions.forEach((q,i)=>{ q.id=`q${i}`; q.from = own(q); });
  ['summary','why','parentNote','nextUp'].forEach(k=>{ if(parsed[k]) parsed[k].from = own(parsed[k]); });
  parsed.objectives = (parsed.objectives||[]).filter(o=>o&&o.text).map(o=>({...o, from:own(o)}));
  return parsed;
}
let shotTray = [], genForm = {notes:'', classId:null, srcName:''};
SCREENS.generate = function(root){
  root.appendChild(headline('Generate a unit',
    'Photograph the whiteboard or a worksheet, paste notes, or both. Everything is read before it saves.'));
  const c = el('div','card');
  c.appendChild(el('label',null,'Subject'));
  const sel = el('select');
  if(!genForm.classId) genForm.classId = ctx.classId || STUDY_CLASSES[0].id;
  STUDY_CLASSES.forEach(cl=>{ const o=el('option',null,cl.name); o.value=cl.id;
    if(cl.id===genForm.classId) o.selected=true; sel.appendChild(o); });
  sel.addEventListener('change',()=>{ genForm.classId = sel.value; });
  c.appendChild(sel);
  c.appendChild(el('label',null,'Source'));
  const src = el('input'); src.type='text';
  src.placeholder = 'File or handout name, e.g. "Unit 3 Study Guide.pdf"';
  src.value = genForm.srcName || '';
  src.addEventListener('input',()=>{ genForm.srcName = src.value; });
  c.appendChild(src);
  c.appendChild(el('div','hintline','Cited on everything built from it. Leave blank and it says so rather than inventing a name.'));

  c.appendChild(el('label',null,'Photos of the material'));
  c.appendChild(shotPicker(async shot=>{
    if(shotTray.length >= MAX_SHOTS){ toast(`${MAX_SHOTS} photos is the limit`); return; }
    shotTray.push(shot); render();
  }));
  if(shotTray.length){
    const grid = el('div','shots');
    shotTray.forEach((s,i)=>{
      const fig = el('div','shot');
      const im = el('img'); im.src = s.url; im.alt = `Photo ${i+1}`;
      fig.appendChild(im);
      fig.appendChild(el('div','n', s.kb+' KB'));
      const x = el('button',null,'✕');
      x.setAttribute('aria-label','Remove this photo');
      x.addEventListener('click',()=>{ shotTray.splice(i,1); render(); });
      fig.appendChild(x);
      grid.appendChild(fig);
    });
    c.appendChild(grid);
    c.appendChild(el('div','hintline',
      `${shotTray.length} of ${MAX_SHOTS} photos. They are shrunk on this device before sending, and never stored — only the unit they produce is saved.`));
  } else {
    c.appendChild(el('div','hintline','Straight-on beats angled, and one page per photo reads far better than a whole desk.'));
  }

  c.appendChild(el('label',null,'Class notes'+(shotTray.length?' (optional)':'')));
  const ta = el('textarea');
  ta.placeholder = shotTray.length
    ? 'Anything the photos do not show — the topic, what the test covers…'
    : 'Paste the material here — notes, slide text, a vocab list, a study guide…';
  ta.value = genForm.notes;
  ta.addEventListener('input',()=>{ genForm.notes = ta.value; });
  c.appendChild(ta);
  c.appendChild(el('div','hintline','More detail means better questions. Everything is grounded in what you give it.'));
  const gob = el('button','btn btn-primary','✨  Generate');
  gob.addEventListener('click', async ()=>{
    const notes = ta.value.trim();
    if(!shotTray.length && notes.length < 80){ toast('Add a photo or paste a bit more material'); return; }
    gob.disabled = true; gob.textContent = 'Reading… this can take a minute';
    try{
      const u = await generateUnit(sel.value, notes, shotTray, (genForm.srcName||'').trim());
      const rec = put({ id:uid('unit'), type:'unit', classId:sel.value, title:u.title||'Untitled unit',
        summary:u.summary, why:u.why, objectives:u.objectives,
        parentNote:u.parentNote, nextUp:u.nextUp, srcName:(genForm.srcName||'').trim() || null,
        quarter: currentQuarter(AZ.today())?.n || null,
        source: shotTray.length ? (shotTray.length===1?'Photo':`${shotTray.length} photos`) + (notes?' + notes':'') : 'Pasted notes',
        status:'draft', cards:u.cards, questions:u.questions });
      shotTray = []; genForm = {notes:'', classId:null, srcName:''};
      syncSoon();
      /* Straight into review when a grown-up made it; otherwise it waits. */
      if(ctx.fromParent){
        showModal({ title:'Ready to read',
          message:`"${rec.title}"\n\n${rec.cards.length} flashcard${rec.cards.length===1?'':'s'} · ${rec.questions.length} quiz question${rec.questions.length===1?'':'s'}.\n\nCheck it over before it reaches her.`,
          confirmText:'Read it now', onConfirm:()=>go('reviewunit',{unitId:rec.id}) });
        go('reviewunit',{unitId:rec.id});
      } else {
        celebrate();
        showModal({ title:'Sent for a check',
          message:`"${rec.title}" — ${rec.cards.length} flashcard${rec.cards.length===1?'':'s'} and ${rec.questions.length} question${rec.questions.length===1?'':'s'}.\n\nA grown-up reads it before it lands in your subjects. That is not about trusting you; it is about catching anything the model got wrong.`,
          confirmText:'Got it', onConfirm:()=>go('unit',{classId:sel.value}) });
        go('unit',{classId:sel.value});
      }
    }catch(e){
      gob.disabled=false; gob.textContent='✨  Generate';
      showModal({ title:'Could not generate',
        message: e.message==='NO_KEY' ? 'Add an Anthropic API key in the You tab first. Everything else works without one.'
               : e.message==='BAD_KEY' ? 'That API key was rejected.'
               : e.message==='NO_NET' ? 'Could not reach the server, twice. This is the connection, not the key — nothing was charged and nothing was lost. Your notes and photos are still here, so try again once you have a steadier signal.'
               : e.message });
    }
  });
  c.appendChild(gob); root.appendChild(c);
  const back = el('button','btn btn-ghost','← Back');
  back.addEventListener('click',()=>{ shotTray = []; genForm = {notes:'', classId:null, srcName:''};
    go(ctx.fromParent?'parent':(ctx.classId?'unit':'study'),{classId:ctx.classId}); });
  root.appendChild(back);
};

/* ---------- Boot ---------- */
loadLocal();
applyTheme();
/* The brand is the way home — there are no back buttons anywhere. */
const brandEl = document.getElementById('brand');
brandEl.addEventListener('click',()=>go('today'));
brandEl.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go('today'); } });
render();
/* Home-screen shortcuts (manifest.json) land here with a hash; consume it so
   a plain reload doesn't repeat the jump. */
const bootHash = location.hash.replace('#','');
if(bootHash){
  history.replaceState(null, '', location.pathname);
  if(bootHash==='growth') go('growth');
  else if(bootHash==='focus') go('focus',{});
  else if(bootHash==='reading') go('reading');
  else if(bootHash==='thread'){ const t = threadTarget(AZ.today()); if(t) t.go(); }
}
if(Sync.configured()) Sync.load().then(()=>{ applyTheme(); render(); });
/* Mobile Chrome caches hard — that is why every deploy bumps CACHE_VERSION.
   The worker already knows when a newer build is installed and waiting; this
   just says so, once, in a bar she can act on or dismiss. Dismissing costs
   nothing: the new version takes over on the next cold start anyway.
   The reload fires ONLY after she taps Refresh (swAccepted) — an unguarded
   controllerchange reload would yank a quiz out from under her mid-round. */
let swAccepted = false;
function offerUpdate(reg){
  const w = reg.waiting;
  if(!w || document.querySelector('.swbar')) return;
  const bar = el('div','swbar');
  bar.appendChild(el('span',null,'A new version is ready.'));
  const b = el('button',null,'Refresh');
  b.addEventListener('click',()=>{ swAccepted = true; b.textContent = '…'; w.postMessage('skip'); });
  bar.appendChild(b);
  const x = el('button','x','✕');
  x.setAttribute('aria-label','Not now');
  x.addEventListener('click',()=>bar.remove());
  bar.appendChild(x);
  document.body.appendChild(bar);
}
if('serviceWorker' in navigator) window.addEventListener('load', async ()=>{
  try{
    const reg = await navigator.serviceWorker.register('sw.js');
    if(reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg);
    reg.addEventListener('updatefound', ()=>{
      const nw = reg.installing;
      if(nw) nw.addEventListener('statechange', ()=>{
        if(nw.state==='installed' && navigator.serviceWorker.controller) offerUpdate(reg);
      });
    });
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if(swAccepted){ swAccepted = false; location.reload(); }
    });
  }catch(e){}
});
setInterval(()=>{ if(view==='today') render(); }, 60000);
