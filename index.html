.pill.warm{background:color-mix(in srgb,var(--warm) 12%,transparent);border-color:var(--warm);color:var(--warm)}

.miss{padding:14px;border-radius:15px;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--bad);margin-bottom:var(--gap-row)}
.miss.settling{border-left-color:var(--warm)}
.miss.nearly{border-left-color:var(--good)}
.miss .box{display:flex;align-items:center;gap:5px;margin-top:9px}
.miss .box i{width:16px;height:4px;border-radius:2px;background:var(--line);display:block}
.miss .box i.on{background:var(--ac)}
.miss .box em{font-style:normal;font-size:11.5px;color:var(--faint);margin-left:4px}
.miss .q{font-size:14px;font-weight:600;margin-bottom:5px}
.miss .a{font-size:13px;color:var(--good)}
.miss .n{font-size:12.5px;color:var(--faint);margin-top:5px;line-height:1.5}
.divider{display:flex;align-items:center;gap:13px;margin:var(--gap-sec) 0 var(--gap);color:var(--ac-fg)}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line-soft)}
.divider span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.85}

.plan{padding:15px;border-radius:16px;background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--pc-fg,var(--ac-fg));margin-bottom:var(--gap-row)}
.plan .hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
.plan .nm{font-weight:600;font-size:15px}
.plan .mins{font-size:12.5px;font-weight:700;color:var(--ac-fg);white-space:nowrap}
.plan .why{font-size:13px;color:var(--muted);line-height:1.5}

.whyline{font-size:13px;color:var(--ac-fg);font-weight:600;margin:2px 0 8px;line-height:1.45}

.cardbtn{width:100%;display:flex;align-items:center;gap:14px;text-align:left;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:18px 20px;margin-bottom:var(--gap);min-height:var(--tap);transition:transform .08s,border-color .15s}
.cardbtn:active{transform:scale(.99)}
.cardbtn:hover{border-color:var(--ac-25)}
.cb-txt{flex:1;min-width:0}
.cb-t{font-family:'Fraunces',serif;font-size:19px;font-weight:500;color:var(--text)}
.cb-d{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.5}
.cb-x{font-size:26px;color:var(--faint);line-height:1;flex-shrink:0}

.subrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
.subrow:last-of-type{border-bottom:none}
.subchip{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0}
.submeta{flex:1;min-width:0}
.submeta .sn{font-size:14px;font-weight:600}
.submeta .sc{font-size:12.5px;color:var(--faint)}
.palgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.palsw{height:52px;border-radius:13px;border:2px solid transparent}
.palsw.on{border-color:var(--text);box-shadow:0 0 0 3px var(--ac-25)}

.affirm-acts{display:flex;gap:10px;margin-top:16px}
.affirm-acts .act{flex:1;min-height:var(--tap);border-radius:13px;background:var(--deep);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:15px;font-weight:600;color:var(--muted)}
.affirm-acts .act .lb{font-size:13px}
.affirm-acts .act.on{border-color:var(--ac);background:var(--ac-14);color:var(--ac-fg)}
.affirm-acts .act:active{transform:scale(.98)}

.glance{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px}
.gl{background:var(--deep);border:1px solid var(--line-soft);border-radius:13px;padding:11px 6px;text-align:center}
.gl .gi{font-size:15px;line-height:1}
.gl .gv{font-family:'Fraunces',serif;font-size:22px;color:var(--ac-fg);margin-top:3px;line-height:1.1}
.gl .gk{font-size:10px;color:var(--faint);margin-top:1px;line-height:1.25}

.spark{display:flex;align-items:flex-end;gap:3px;height:56px;margin-top:10px}
.spark div{flex:1;background:var(--ac-25);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark div.has{background:var(--ac)}
.sparklbl{display:flex;justify-content:space-between;font-size:10px;color:var(--faint);margin-top:5px}

.modal-overlay{position:fixed;inset:0;background:var(--veil);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;max-width:90vw;width:370px;max-height:82vh;overflow-y:auto}
.modal-box h3{font-size:22px;margin-bottom:9px}
.modal-box p{color:var(--muted);font-size:14px;white-space:pre-wrap;margin:0}
.modal-buttons{display:flex;gap:10px;margin-top:22px}
.modal-buttons .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:1100;background:var(--raised);border:1px solid var(--ac-25);color:var(--text);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
/* Fireworks: a burst that radiates, rather than confetti that drifts up.
   Under prefers-reduced-motion the whole celebration is already suppressed by
   the quiet path; this keeps the same no-layout, no-listener shape as the
   confetti it sits beside. */
.spark{position:fixed;pointer-events:none;z-index:900;width:6px;height:6px;border-radius:50%;
  animation:burst 1.1s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes burst{
  0%{transform:translate(0,0) scale(1);opacity:1}
  70%{opacity:1}

/* ---------- Arizona time (no DST — never derive "today" from toISOString) ---------- */
const AZ = {
  tz:'America/Phoenix',
  today(){ return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(new Date()); },
  dateKey(d){ return new Intl.DateTimeFormat('en-CA',{timeZone:this.tz}).format(d); },
  nowMinutes(){
    const p = new Intl.DateTimeFormat('en-US',{timeZone:this.tz,hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
    return (+p.find(x=>x.type==='hour').value)*60 + (+p.find(x=>x.type==='minute').value);
  },
  weekday(ds){ const [y,m,d]=ds.split('-').map(Number); return new Date(y,m-1,d).getDay(); },
  pretty(ds){ const [y,m,d]=ds.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}); },
  shortDate(ds){ const [y,m,d]=ds.split('-').map(Number);
    return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'}); },
  daysBetween(a,b){ return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000); },
  /* Pure calendar arithmetic. The old version built a LOCAL-midnight Date and
     then formatted it in Arizona time — identical on a Phoenix phone, but one
     day short on any device east of Arizona (travel, or a tester in UTC),
     which quietly compressed every review-ladder interval. Date.UTC in,
     ISO slice out: no timezone touches either side. */
  shift(ds,n){ const [y,m,d]=ds.split('-').map(Number);
    return new Date(Date.UTC(y,m-1,d+n)).toISOString().slice(0,10); },
  short(ds){ const [y,m,dd]=ds.split('-').map(Number);
    return new Date(y,m-1,dd).toLocaleDateString('en-US',{month:'short',day:'numeric'}); },
  weekStart(ds){ return this.shift(ds, -AZ.weekday(ds)); }   // Sunday
};

/* ---- Registered clubs on the calendar ----
   A club joins the day it meets only when the day, the time AND the cadence
   are all genuinely derivable. Anything vaguer stays off the schedule rather
   than guessing at her week:
     dates     -> an explicit list of real meeting dates (ISO), when the
                  club has given one. Real dates beat inferred cadence —
                  a printed schedule already accounts for holidays and
                  breaks, which a pure every-14-days rule cannot (ASL
                  Club's real cadence skips a week around Veterans Day and
                  sits out Presidents Day entirely; a computed bi-weekly
                  would have placed both wrong). A date deliberately not
                  meeting (e.g. "Feb 15 — NO MEETING") is simply left out
                  of the list, not encoded as a rule.
     weekly*   -> every matching weekday from the first meeting onward
     bi-weekly -> every fourteen days from that first meeting
     otherwise -> not placed (monthly gives no week; "6 weeks only" gives no
                  cadence; a club with no time cannot be put at a time)
   `first` anchors everything, so a club without a parseable one is skipped. */
const CLUB_DAYS = {sunday:0, monday:1, tuesday:2, wednesday:3, thursday:4, friday:5, saturday:6};
const CLUB_MONTHS = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function clubFirstDate(c){
  const m = String(c.first||'').match(/([A-Za-z]+)\s+(\d{1,2})/);
  if(!m) return null;                                  // "Aug" with no date
  const mo = CLUB_MONTHS[m[1].toLowerCase().slice(0,4)] ?? CLUB_MONTHS[m[1].toLowerCase().slice(0,3)];
  if(mo == null) return null;
  /* The school year straddles a new year: months before August belong to the
     spring half of it. */
  const y = mo >= 7 ? +CAL.firstDay.slice(0,4) : +CAL.lastDay.slice(0,4);
  return `${y}-${String(mo+1).padStart(2,'0')}-${m[2].padStart(2,'0')}`;
}
const clubWeekdays = c => String(c.day||'').split(/\s*&\s*/)
  .map(d => CLUB_DAYS[d.trim().toLowerCase()]).filter(d => d != null);
function clubMeetsOn(c, date){
  if(!c.time) return false;
  if(c.dates) return c.dates.includes(date);
  const freq = String(c.freq||'').toLowerCase();
  const weekly = freq.startsWith('weekly'), fort = freq.startsWith('bi-weekly');
  if(!weekly && !fort) return false;
  const first = clubFirstDate(c);
  if(!first || date < first) return false;
  if(!clubWeekdays(c).includes(AZ.weekday(date))) return false;
  if(weekly) return true;
  /* Fortnightly: count from the club's OWN first matching weekday, not from
     `first` itself, which may fall on a different day than the club meets. */
  let start = first;
  for(let i = 0; i < 7 && !clubWeekdays(c).includes(AZ.weekday(start)); i++) start = AZ.shift(first, i+1);
  return AZ.daysBetween(start, date) % 14 === 0;
}

function sibSummary(d){
  const rec = Object.values(d.records||{}).filter(r=>r && !r.deleted);
  const today = AZ.today(), wk = AZ.weekStart(today), d7 = AZ.shift(today,-6);
  let wkMin = 0, c7 = 0, t7 = 0;
  rec.forEach(r=>{
    if(r.type==='log'){
      if(r.date>=wk) wkMin += Math.round((r.seconds||0)/60);
      if(r.date>=d7){ c7 += r.correct||0; t7 += r.total||0; }
    }
    if(r.type==='focus' && r.date>=wk) wkMin += r.minutes||0;
  });
  let tdMin = 0, tdQ = 0, tdC = 0, tdT = 0;
  rec.forEach(r=>{
    if(r.type==='log' && r.date===today){
      tdMin += r.minutes!=null ? r.minutes : Math.round((r.seconds||0)/60);
      if(r.mode==='quiz'){ tdQ++; tdC += r.correct||0; tdT += r.total||0; }
    }
    if(r.type==='focus' && r.date===today) tdMin += r.minutes||0;
  });
  const due = rec.filter(r=>r.type==='miss' && (!r.due || r.due<=today)).length;
  const dr  = rec.filter(r=>r.type==='unit' && r.status==='draft').length;
  const nx  = rec.filter(r=>r.type==='assess' && r.date>=today)
                 .sort((a,b)=>a.date<b.date?-1:1)[0];
  const dset = new Set();
  rec.forEach(r=>{ if((r.type==='log'||r.type==='focus') && r.date>=wk) dset.add(r.date); });
  const name = ((d.records||{}).roster||{}).studentName || '';
  return { name: name.split(' ')[0], wkMin, acc: t7 ? Math.round(c7/t7*100) : null,
           due, dr, days: dset.size, next: nx ? nx.title+' · '+AZ.shortDate(nx.date) : null,
           today: { min: tdMin, q: tdQ, right: tdC, asked: tdT,
                    acc: tdT ? Math.round(tdC/tdT*100) : null } };
}

function palOf(cls){
  const chosen = (prefs().subjectColors||{})[cls.id];
  return PAL_BY_ID[chosen] || PAL_BY_ID[cls.pal] || SUBJECT_PALETTE[0];
}

/* Just the colour variables, without the texture — for elements that want a
   wash rather than a full painted fill. */
function tint(node, cls){
  if(!cls) return node;
  const p = palOf(cls);
  node.style.setProperty('--c1', p.g1);
  node.style.setProperty('--c2', p.g2);
  return node;
}

/* Paint a subject's colour + texture onto any element. */
function paint(node, cls){
  if(!cls) return node;
  const p = palOf(cls);
  node.classList.add('subj','pat-'+cls.id);
  node.style.setProperty('--c1', p.g1);
  node.style.setProperty('--c2', p.g2);
  node.style.setProperty('--pc', p.g1);
  return node;
}

/* ---------- Morning affirmations ----------
   Grounded in four findings rather than generic positivity:
   · Growth mindset (Dweck) — praise process and strategy, never fixed traits.
     "You're so smart" measurably reduces persistence after failure.
   · Self-affirmation (Steele; Cohen & Sherman) — briefly connecting to your own
     values before evaluative situations buffers stress and narrows achievement gaps.
   · Self-compassion (Neff) — permission to struggle predicts more persistence
     than self-criticism does.
   · Self-determination theory (Deci & Ryan) — autonomy and competence language
     sustains motivation better than pressure language.
   So: no trait praise, no "you'll ace it", no toxic positivity.
------------------------------------------------------------------------- */

function affirmationFor(date){
  const s = stats();
  const soon = upcomingAssessments(date, 2).length > 0;
  const recentAcc = recentAccuracy(7);
  let group = 'general';
  if(soon) group = 'test';
  else if(recentAcc !== null && recentAcc < 65) group = 'recover';
  const pool = AFFIRMATIONS.filter(a=>a.g===group);
  // Deterministic by date so it does not reshuffle on every render.
  const seed = date.split('-').reduce((a,b)=>a+ +b, 0) + group.length;
  return pool[seed % pool.length].t;
}

/* ---------- Study-habit guidance (evidence-based; shown without an API key) ---------- */
/* Shown one or two at a time, only when the situation calls for them — a wall of
   eight tips is wallpaper. `when` returns the reason it is relevant right now,
   or null. */
const HABITS = [
  {id:'spacing', t:'Spread it out', d:'Four 25-minute sessions across four days beats one 100-minute cram, by a lot. The forgetting that happens in between is what makes the next session stick.',
   when:c => c.nextAssess && c.nextAssess.days>=2 && c.nextAssess.days<=12
     ? `${c.nextAssess.label} is ${c.nextAssess.days} days out — there is still time to space it` : null},
  {id:'retrieval', t:'Retrieval beats rereading', d:'Closing the book and trying to recall the answer builds far more durable memory than reading the notes again. The effort of pulling it out of your head is the point.',
   when:c => c.weak ? `${c.weak.name} is sitting at ${c.weak.acc}% — quizzing will move that faster than re-reading` : null},
  {id:'hardparts', t:'Study the hard parts', d:'It feels better to review what you already know. It only helps to review what you do not. The Growth Zone is deliberately a list of the uncomfortable ones.',
   when:c => c.growth>=5 ? `${c.growth} questions are waiting in your Growth Zone` : null},
  {id:'focus', t:'One thing at a time', d:'Every interruption costs several minutes of re-focusing. A 25-minute block with the phone in another room is worth more than an hour with it face-up.',
   when:c => c.focusCount===0 ? 'You have not tried the timer yet — it is the single easiest change' : null},
  {id:'interleave', t:'Mix subjects in one sitting', d:'Latin, then Biology, then back to Latin feels harder and works better than doing all of one. It forces your brain to pick the right method each time, which is exactly what a test asks for.',
   when:c => c.subjectsStudied>=3 ? 'You are juggling a few subjects — alternating them beats blocking them' : null},
  {id:'sleep', t:'Sleep is part of studying', d:'Memory gets consolidated overnight. An hour of study followed by a full night beats two hours followed by five hours of sleep.',
   when:c => c.nextAssess && c.nextAssess.days<=1 ? 'Something is due tomorrow — sleep will do more than another hour tonight' : null},
  {id:'explain', t:'Explain it out loud', d:'If you can explain something to someone who does not know it, you understand it. If you get stuck halfway, you just found the gap — go straight there.',
   when:c => c.answered>=40 ? 'You have covered a lot of ground — explaining it is how you find the soft spots' : null},
  {id:'writeq', t:'Write the questions, not just the answers', d:'Turning your notes into questions you could be asked is one of the highest-value ten minutes before a test.',
   when:c => c.nextAssess && c.nextAssess.days<=4 ? `${c.nextAssess.label} is close — write yourself questions rather than re-reading` : null}
];

function tutorContext(date){
  const s = stats();
  let weak = null;
  STUDY_CLASSES.forEach(c=>{
    const st = classStats(c.id);
    if(st.accuracy!==null && st.accuracy<70 && (!weak || st.accuracy<weak.acc))
      weak = {name:c.name, acc:st.accuracy, id:c.id};
  });
  const nx = assessments().find(a=>a.date>=date && a.score==null);
  return {
    weak, growth: all('miss').length, answered: s.answered,
    focusCount: focusLogs().length,
    subjectsStudied: new Set(logs().map(l=>l.classId)).size,
    nextAssess: nx ? {days:AZ.daysBetween(date,nx.date),
      label:`${CLASS_BY_ID[nx.classId]?CLASS_BY_ID[nx.classId].short:''} ${(KINDS[nx.kind]||KINDS.test).nm.toLowerCase()}`.trim()} : null
  };
}
/* An immediate answer with no API key. Not pretending to be the model — it
   reads her actual numbers and points at the technique that fits what she
   described. The AI replaces this the moment a key exists. */
function localAnswer(q, date){
  const c = tutorContext(date), s = stats(), low = q.toLowerCase();
  const named = STUDY_CLASSES.find(x =>
    low.includes(x.short.toLowerCase()) || low.includes(x.name.toLowerCase().split(' ')[0]));
  const bits = [];

  if(named){
    const st = classStats(named.id);
    const gz = all('miss').filter(m=>m.classId===named.id).length;
    bits.push(st.accuracy===null
      ? `You have not quizzed ${named.name} yet, so there is no accuracy to go on — that is the first thing to fix.`
      : `${named.name} is sitting at ${st.accuracy}% across ${st.answered} questions${gz?`, with ${gz} in your Growth Zone`:''}.`);
  }

  let tip;
  if(/forget|blank|memor|remember|vocab|recall/.test(low)){
    tip = HABITS.find(h=>h.id==='retrieval');
    bits.push('Blanking under pressure is usually a retrieval problem, not a knowing problem. Re-reading notes feels productive and mostly is not — quizzing yourself is what builds the path you need in the moment.');
  } else if(/time|schedule|split|plan|when|how long|organi/.test(low)){
    const plan = studyPlan(date);
    tip = HABITS.find(h=>h.id==='spacing');
    bits.push(plan.length
      ? `Right now the app would put your time into ${plan.slice(0,2).map(p=>`${CLASS_BY_ID[p.classId].short} (${p.minutes} min)`).join(' and ')}.`
      : 'Nothing is urgent yet, so short and regular beats long and rare.');
  } else if(/focus|distract|procrastin|concentrat|start|motivat/.test(low)){
    tip = HABITS.find(h=>h.id==='focus');
    bits.push('Starting is usually the hard part, not continuing. Set the timer to 15 rather than 25 — a block you will actually begin beats a longer one you keep putting off.');
  } else if(/test|quiz|exam|nervous|anxious|scared|stress/.test(low)){
    tip = HABITS.find(h=>h.id==='writeq');
    const pairs = calibrationPairs();
    if(pairs.length>=3){
      const mean = Math.round(pairs.reduce((a,p)=>a+(p.actual-p.predicted),0)/pairs.length);
      if(mean > 10) bits.push('Worth knowing: you have been scoring higher than you predict beforehand. Your nerves are not a good read on how prepared you are.');
      else if(mean < -10) bits.push('Worth knowing: you have been scoring lower than you predict beforehand — reviewing is feeling like knowing. Quiz yourself instead of re-reading.');
    }
  } else if(/understand|confus|hard|stuck|lost|difficult|make sense/.test(low)){
    tip = HABITS.find(h=>h.id==='explain');
    bits.push('Try saying it out loud as if you were teaching it. The exact sentence where you stall is the thing you actually need to look up — that is much faster than re-reading the whole chapter.');
  } else {
    tip = relevantHabits(date,1)[0].h;
    if(c.growth) bits.push(`You have ${c.growth} question${c.growth>1?'':''} waiting in your Growth Zone — that is the highest-value place to spend ten minutes.`);
  }

  if(c.nextAssess && c.nextAssess.days<=7)
    bits.push(`Your ${c.nextAssess.label} is ${c.nextAssess.days===0?'today':c.nextAssess.days===1?'tomorrow':`${c.nextAssess.days} days away`}.`);
  if(!bits.length && s.answered)
    bits.push(`You are at ${s.accuracy}% overall across ${s.answered} questions.`);

  bits.push(`${tip.t} — ${tip.d}`);
  return bits.join('\n\n');
}

function relevantHabits(date, limit=2){
  const c = tutorContext(date);
  const hits = [];
  HABITS.forEach(h=>{ const why = h.when(c); if(why) hits.push({h, why}); });

function migrate(d){

    Object.values(d.records||{}).forEach(r=>{
      if(r && r.type==='miss' && r.box === undefined){ r.box = 0; r.due = AZ.today(); }
    });

     poisoned stamp (bad content file, wrong device clock) silently reverts

     and un-approved themselves on every sync. Runs on every ingest (boot,
     gist pull, library fetch), so poisoned copies heal on the next pass;

     empty frame. A week with tests always has something to say. */
  if(!tests.length && !queue.length) return null;

  /* The plan: one row per remaining weekday. Test days ask for nothing new;
     the last free day before a multi-test day goes to mixed practice, which
     is the app's existing exam-ramp rule — in test week the right work
     changes shape, not just minutes. */
  const upcoming = days.filter(d => !d.past || d.today);
  const firstTestIdx = upcoming.findIndex(pendingDay);
  const freeIdx = upcoming.map((d, k) => ({d, k}))
    .filter(x => !pendingDay(x.d) && !x.d.closed)
    .map(x => x.k);
  let mixIdx = -1;
  if(testCids.size >= 2 && freeIdx.length >= 2){
    const before = firstTestIdx < 0 ? freeIdx : freeIdx.filter(k => k < firstTestIdx);
    if(before.length >= 2) mixIdx = before[before.length - 1];
  }
  const plan = [];
  let qi = 0;
  upcoming.forEach((d, k) => {
    if(pendingDay(d)){
      plan.push({ d, kind:'test',
        what: d.tests.length > 1 ? d.tests.length + ' tests today' : d.tests[0].title,
        sub: d.tests.length > 1
          ? joinList(d.tests.map(t => (CLASS_BY_ID[t.classId]||{}).short || ''))
          : (CLASS_BY_ID[d.tests[0].classId]||{}).name || '',
        mins: null });
      return;
    }
    if(d.closed){ plan.push({ d, kind:'closed', what: closedToday(d.date), sub:'', mins:null }); return; }
    if(k === mixIdx){
      plan.push({ d, kind:'mixed', what:'All of them, shuffled',
        sub:'Working out which kind of question it is, is the skill',
        mins: Math.max(8, Math.round(queue.slice(0,3).reduce((n,L)=>n+L.mins,0) / 3)),
        cid: queue[0] ? queue[0].cid : null });
      return;
    }
    if(!queue.length){ plan.push({ d, kind:'clear', what:'Yours', sub:'Nothing is waiting', mins:null }); return; }
    const L = queue[qi % queue.length]; qi++;
    plan.push({ d, kind:'subject', cid:L.cid, load:L, what:L.cls.name,
      sub: L.pick ? L.pick.title + (L.due ? ' · ' + L.due + ' review due' : '')
                  : L.due + ' review question' + (L.due===1?'':'s') + ' due',
      mins: L.mins });
  });

  /* ---- The prose. Two sentences: what the week holds, then what to do. ---- */
  const phrase = t => {
    const c = CLASS_BY_ID[t.classId];
    const k = (KINDS[t.kind] || KINDS.test).nm.toLowerCase();
    const body = (c ? (c.short || c.name) + ' ' : '') + k;
    /* "an English quiz", not "a English quiz" — the subject short name leads,
       so the article has to be decided from the assembled phrase. */
    return (/^[aeiou]/i.test(body) ? 'an ' : 'a ') + body;
  };
  const byDay = days.filter(d => d.tests.some(stillAhead));
  const dayWord = d => d.today ? 'today'
    : d.date === AZ.shift(date, 1) ? 'tomorrow' : 'on ' + d.name;
  let lead1;
  if(!tests.length){
    lead1 = 'Nothing is scheduled this week — which makes it a good week to get ahead.';
  } else if(!aheadTests.length){
    /* There WERE tests, and they are done — after 3pm on test day the app must
       not keep promoting a test she already sat. */
    lead1 = 'The week\'s tests are behind you.';
  } else if(byDay.length === 1){
    const d = byDay[0];
    const when = d.today ? 'Today' : d.date === AZ.shift(date, 1) ? 'Tomorrow' : d.name;
    lead1 = d.tests.length > 1
      /* "both" for two, "all" for three or more — the sentence is read aloud
         in her head and "all on the same day" for a pair is the kind of wrong
         that makes generated prose sound generated. */
      ? when + ' is the busy one — ' + joinList(d.tests.map(phrase))
        + ', ' + (d.tests.length === 2 ? 'both' : 'all') + ' on the same day.'
      : (d.today ? 'Today: ' : d.date === AZ.shift(date, 1) ? 'Tomorrow: ' : 'One thing this week: ')
        + joinList(d.tests.filter(stillAhead).map(phrase))
        + (d.today || d.date === AZ.shift(date, 1) ? '.' : ' on ' + d.name + '.');
  } else {
    lead1 = 'Two things to get ready for'.replace('Two', aheadTests.length === 2 ? 'Two' : String(aheadTests.length))
      + ' this week: ' + joinList(byDay.map(d =>
          joinList(d.tests.filter(stillAhead).map(phrase)) + ' ' + dayWord(d))) + '.';
  }

  const study = plan.filter(p => p.kind === 'subject' || p.kind === 'mixed');
  const totalMins = queue.reduce((n, L) => n + L.mins, 0);
  let lead2;
  if(!study.length){
    /* No study evenings left in the plan. The first draft said "the studying
       days are behind you — the work is done", and Chris caught both halves
       overreaching: "the work is done" is a claim the app cannot verify, and
       studying time always exists — the plan running out must never read as
       the door closing. Say what is true instead: nothing NEW before a test
       that is still ahead; shelves always open after it. */
    lead2 = aheadTests.length
      ? 'No study evenings left before it — nothing new now. A flip through the cards on the way in is plenty.'
      : 'Studying never closes, though — your shelves and the Growth Zone are open whenever you want a round.';
    if(!tests.length)
      lead2 = 'Nothing is waiting. A good week to pick up whatever you feel like.';
  } else {
    const n = study.length;
    /* Averaged over the DAYS AS PLANNED, not over the subject list. Those are
       different numbers whenever the queue is shorter than the week and a
       subject comes round twice — dividing the subject total by five evenings
       said "roughly 5 minutes each" under a ledger showing 7, 9, 7, 7, 9. */
    const mins = study.map(p => p.mins).filter(Boolean);
    const each = mins.length ? Math.round(mins.reduce((a, b) => a + b, 0) / mins.length) : 10;
    const howLong = n === 1
      ? 'one evening, and about ' + each + ' minutes'
      : n + ' evenings, and roughly ' + each + ' minutes each';
    const shape = (queue.length > 1
        ? 'Take one subject a night while it is quiet'
        : 'A little each night beats one long session')
      + (mixIdx >= 0 ? ', then let ' + upcoming[mixIdx].name + ' mix them together.' : '.');
    /* "That gives you" promises preparation time. It is only true when a test
       is still ahead — with the week's tests already sat, the same sentence
       would be pointing at revision for something that is over. */
    lead2 = aheadTests.length
      ? 'That gives you ' + howLong + '. ' + shape
      : 'The rest of the week is yours — ' + howLong + ' if you want it. ' + shape;
  }

  return { monday, friday, days, tests, plan, queue, totalMins, lead1, lead2,
           /* Coming up skips these — a test the ledger already lists would
              otherwise print twice, one screen apart. */
           ledgerTestIds: new Set(aheadTests.map(t => t.id)),
           namedCids: new Set(queue.map(L => L.cid)),
           namesDue: queue.some(L => L.due > 0),
           covers: d => d >= monday && d <= friday };
}
function threadTarget(date, opt){
  opt = opt || {};
  const due = dueMisses();
  if(due.length && !opt.skipDue) return {
    kind:'due',
    title: due.length===1 ? '1 question is back' : due.length+' questions are back',
    sub:'You missed these before. Getting them right now is what makes them stick.',
    go:()=>go('growth') };
  /* A test within three days outranks picking up the newest lesson — mixed
     practice for that subject is the honest use of the sitting. It never
     outranks due reviews, which return above. */
  const d0 = date || AZ.today();
  const soon = studyPlan(d0).find(p=>p.ramp && p.assess && p.hasUnits && AZ.daysBetween(d0, p.assess.date) <= 3);
  if(soon){
    const c0 = CLASS_BY_ID[soon.classId];
    const dd = AZ.daysBetween(d0, soon.assess.date);
    const knm = KINDS[soon.assess.kind] ? KINDS[soon.assess.kind].nm.toLowerCase() : 'test';
    return { kind:'ramp', classId:soon.classId,
      title: (c0.short||c0.name)+' '+knm+' '+(dd===0?'today':dd===1?'tomorrow':'in '+dd+' days'),
      sub:'One mixed round across every unit — picking the right skill is the tested skill.',
      go:()=>{ if(buildShuffleUnit(soon.classId)) go('quiz',{unitId:'__shuffle__', classId:soon.classId});
               else go('unit',{classId:soon.classId}); } };
  }
  let best = null, bt = 0;
  units().forEach(u=>{
    if(u.classId==='__all__' || !u.questions.length || unitDone(u)) return;
    const t = unitLastStudied(u);
    if(t > bt){ bt = t; best = u; }
  });
  if(best){
    const left = best.questions.length - unitAttempted(best);
    return { kind:'lesson', unitId:best.id, classId:best.classId,
      title:'Continue: '+best.title,
      sub: left>0 ? `${left} question${left===1?'':'s'} left in this lesson.` : 'One more pass locks it in.',
      go:()=>launchQuiz(best.id, best.classId, false) };
  }
  const p = studyPlan(date || AZ.today())[0];
  if(p){
    const c = CLASS_BY_ID[p.classId];
    return { kind:'plan', classId:p.classId,
      title:'Start: '+c.name, sub:`${p.minutes} minutes — ${p.why}.`,
      go:()=>go('unit',{classId:p.classId}) };
  }
  return null;
}

   possible. Two channels, because the girls are on different phones:
   navigator.vibrate on River's Android, and NOTHING on Sedona's iPhone —
   iOS ignores it entirely, which the focus timer already learned the hard

   the buzz is a bonus where it lands.

const TAPPY = '.btn,.opt,.tile,.cardbtn,.spine,.mtile,.rw,.pickrow,.skystar,.act,.tool,.nav-btn,.chip,.back-chip';
function tapBuzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  const t = e.target && e.target.closest && e.target.closest(TAPPY);
  if(!t || t.disabled) return;
  /* 8ms is under the threshold where a buzz reads as an alert — it reads as
     the button having weight. Long enough to feel, short enough to ignore. */
  tapBuzz(8);
}, {passive:true});

  try{

function applyTheme(){
  const p = prefs();
  const a = ACCENTS.find(x=>x.id===p.accent) || ACCENTS[0];
  document.documentElement.style.setProperty('--ac', a.c);
  /* "auto" is resolved here rather than in CSS, so stylesheets only deal with
     an explicit light/dark attribute. */
  const mode = p.theme || 'auto';
  const resolved = mode==='auto' ? (prefersLight() ? 'light' : 'dark') : mode;
  document.documentElement.dataset.theme = resolved;
  const skyPref = p.sky==='seasonal' ? seasonalSky() : p.sky;
  document.documentElement.dataset.sky = SKIES.some(s=>s.id===skyPref && s.id!=='seasonal') ? skyPref : 'constellation';
  /* Her subject icons ride the class objects so every render site — schedule,
     tiles, plan, parent view — picks them up without knowing the feature
     exists. baseIcon keeps the default recoverable. */
  CLASSES.concat(EXTRACURRICULARS).forEach(c=>{ if(c.baseIcon===undefined) c.baseIcon=c.icon;
    c.icon = (p.subjectIcons||{})[c.id] || c.baseIcon; });
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', resolved==='light' ? '#f2f6f5' : '#04141a');
}

const Sync = {
  get gistId(){ return Store.get('gist_id',''); },
  get token(){ return Store.get('gist_token',''); },
  filename:'ad-astra-data.json',
  configured(){ return !!(this.gistId && this.token); },
  headers(){ return {'Authorization':'Bearer '+this.token,'Accept':'application/vnd.github+json'}; },
  async pullRemote(){
    const res = await fetch(`https://api.github.com/gists/${this.gistId}`,{headers:this.headers()});
    if(!res.ok) throw new Error('Gist fetch failed: '+res.status);
    const g = await res.json(); const f = g.files[this.filename];
    if(!f) return { v:SCHEMA_VERSION, records:{} };
    const text = f.truncated ? await (await fetch(f.raw_url)).text() : f.content;
    return migrate(JSON.parse(text||'{"records":{}}'));
  },
  merge(local, remote){
    const out = { v:SCHEMA_VERSION, records:{...(remote.records||{})} };
    for(const [id,rec] of Object.entries(local.records||{})){
      const r = out.records[id];
      if(!r || (rec.updatedAt||0) > (r.updatedAt||0)) out.records[id] = rec;
    }
    const cutoff = Date.now() - 60*86400000;
    for(const [id,rec] of Object.entries(out.records)) if(rec.deleted && rec.updatedAt < cutoff) delete out.records[id];
    return out;
  },
  async save(){
    if(sandboxOn()) throw new Error('SANDBOX');
    if(!this.configured()) throw new Error('NO_SYNC');
    let merged = DATA;
    try{ merged = this.merge(DATA, await this.pullRemote()); }catch(e){}
    const res = await fetch(`https://api.github.com/gists/${this.gistId}`,{
      method:'PATCH', headers:{...this.headers(),'Content-Type':'application/json'},
      body: JSON.stringify({files:{[this.filename]:{content:JSON.stringify(merged,null,2)}}}) });
    if(!res.ok) throw new Error('Gist save failed: '+res.status);
    DATA = merged; saveLocal(); Store.set('last_sync', Date.now()); return merged;
  },
  async load(){
    if(sandboxOn() || !this.configured()) return DATA;
    try{ DATA = this.merge(DATA, await this.pullRemote()); saveLocal(); Store.set('last_sync',Date.now()); }catch(e){}
    return DATA;
  }
};

   Unit files I publish ship inside the app itself (content/ on the same
   GitHub Pages origin), so fetching them needs no account, no backend and
   no file juggling. Merging goes through Sync.merge, so a discarded unit's
   tombstone always beats the library copy — nothing resurrects — and new
   units arrive as drafts for the review queue, never straight to her. */
/* What changed between the approved copy and the incoming one — computed at
   the only moment both exist (fetchLibrary, below), stored on the draft, and
   cleared with wasApproved when the grown-up approves. Ids for kept items,
   display text for removed ones, since a removed item has no record to read. */
function unitDelta(oldU, newU){
  const sig = x => JSON.stringify([x.term,x.def,x.hint,x.eq,x.sp,x.graph,x.q,x.opts,x.ans,x.lv,x.kind,x.passage,x.steps,x.ex,x.variant,x.from]);
  const diff = (a,b) => {
    const A = new Map((a||[]).map(x=>[x.id,x])), B = new Map((b||[]).map(x=>[x.id,x]));
    const out = {a:[], d:[], m:[]};
    B.forEach((x,id)=>{ if(!A.has(id)) out.a.push(id); else if(sig(A.get(id))!==sig(x)) out.m.push(id); });
    A.forEach((x,id)=>{ if(!B.has(id)) out.d.push(x.term||x.q||String(id)); });
    return out;
  };
  const d = { c:diff(oldU.cards,newU.cards), q:diff(oldU.questions,newU.questions), meta:[] };
  ['title','round','order','guide','capstone','book'].forEach(k=>{
    if(JSON.stringify(oldU[k]??null)!==JSON.stringify(newU[k]??null)) d.meta.push(k); });
  return (d.c.a.length||d.c.d.length||d.c.m.length||d.q.a.length||d.q.d.length||d.q.m.length||d.meta.length) ? d : null;
}
async function fetchLibrary(btn){
  if(sandboxOn()){ toast('Sandbox is on — nothing is saved'); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Checking…';
  let added = 0, reachable = false;
  /* A fixed unit ships as a fresh draft, and merge replaces the approved copy
     wholesale — approval lives on the record. Remember what was approved going
     in, so the queue can say "this is an update, not a stranger" and the toast
     can count them honestly. */
  const wasApproved = new Set(Object.values(DATA.records)
    .filter(r=>r && r.type==='unit' && !r.deleted && r.status!=='draft').map(r=>r.id));
  for(const path of CONTENT_LIBRARY){
    try{
      const res = await fetch(path, {cache:'no-store'});
      if(!res.ok) continue;
      reachable = true;
      const inc = migrate(await res.json());
      /* A shipped unit may carry `libv`, a content version the author bumps
         whenever the file changes. Timestamps alone are not enough here:
         approving a unit re-stamps it to the moment of approval, so a fix
         shipped even minutes earlier LOSES the merge and vanishes silently —
         the toast then says "already in sync", which is not true. When the
         incoming content version is newer, its stamp is lifted just past the
         local copy so the ordinary merge does the right thing.
         A discarded unit is skipped: tombstones still beat library copies,
         and re-shipping one deliberately still means bumping updatedAt. */
      Object.values(inc.records||{}).forEach(r=>{
        if(!r || r.type!=='unit' || r.libv==null) return;
        const cur = DATA.records[r.id];
        if(cur && !cur.deleted && r.libv > (cur.libv||0))
          r.updatedAt = Math.max(r.updatedAt||0, (cur.updatedAt||0) + 1);
      });
      Object.values(inc.records||{}).forEach(r=>{
        if(!r || r.type!=='unit' || r.deleted) return;
        const cur = DATA.records[r.id];
        if(!cur || cur.deleted || cur.type!=='unit' || cur.status==='draft') return;
        if((r.updatedAt||0) <= (cur.updatedAt||0)) return;   // loses the merge anyway
        const d = unitDelta(cur, r);
        if(d) r.chg = d;
      });
      const fresh = Object.keys(inc.records||{}).filter(id=>{
        const cur = DATA.records[id];
        return !cur || (!!cur.deleted && (inc.records[id].updatedAt||0) > (cur.updatedAt||0));
      });
      DATA = Sync.merge(DATA, inc);
      fresh.forEach(id=>{ const r = DATA.records[id]; if(r && !r.deleted) added++; });
    }catch(e){}
  }
  let refreshed = 0;
  Object.values(DATA.records).forEach(r=>{
    if(r && r.type==='unit' && !r.deleted && r.status==='draft'
       && wasApproved.has(r.id) && !r.wasApproved){
      r.wasApproved = true; r.updatedAt = Date.now(); refreshed++;
    }
  });
  saveLocal(); syncSoon();
  btn.disabled = false; btn.textContent = label;
  toast(!reachable ? 'Could not reach the library — try again online'
    : (added || refreshed)
      ? [added ? `${added} new unit${added===1?'':'s'}` : '',
         refreshed ? `${refreshed} update${refreshed===1?'':'s'} to units you had approved` : '']
          .filter(Boolean).join(' and ') + ' — in the review queue'
    : 'Library already in sync — nothing new');
  render();
}

let syncTimer=null;
function syncSoon(){ if(sandboxOn() || !Sync.configured()) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>Sync.save().catch(()=>{}),2500); }

/* ---------- Derived stats (never stored — cannot drift between devices) ---------- */
const logs  = () => all('log').sort((a,b)=>b.at-a.at);
const focusLogs = () => all('focus').sort((a,b)=>b.at-a.at);

/* ---- The day report ----
   The weekly cards answer "how much"; they never answer "what did she
   actually do today", which is the question a parent asks at dinner.
   Everything here is derived from log and focus records at render time —
   no new record types, no counters, and it backfills over all history.

   Deliberately NO clock times. `at` is used to put the day's sessions in
   the order they happened and for nothing else; when she studied is
   surveillance flavour, not actionable signal (same call as the activity
   card). What is shown is what was done, how it went, and how long. */
function modeLabel(l){
  if(l.mode==='cards')   return 'Flashcards';
  if(l.mode==='match')   return 'Match';
  if(l.mode==='starsky') return 'Star sky';
  if(l.mode==='read')    return 'Reading';
  if(l.mode==='readfin') return 'Finished a book';
  if(l.mode==='quiz'){
    if(l.unitId==='__review__')  return 'Growth Zone review';
    if(l.unitId==='__shuffle__') return 'Shuffle round';
    if(l.unitId==='__daily__')   return 'The daily three';
    return (l.timed ? 'Beat the clock' : 'Quiz') + (l.partial ? ' · stopped early' : '');
  }
  return 'Session';
}
function dayReport(date){
  const sessions = [];
  logs().forEach(l=>{
    if(l.date !== date) return;
    const u = l.unitId ? DATA.records[l.unitId] : null;
    sessions.push({ classId:l.classId||null, label:modeLabel(l),
      unit: (u && !u.deleted && u.title) ? u.title : (l.book || null),
      correct: l.mode==='quiz' ? (l.correct||0) : null,
      total:   l.mode==='quiz' ? (l.total||0)   : null,
      hints: l.hints||0,
      minutes: l.minutes!=null ? l.minutes : Math.round((l.seconds||0)/60),
      items: l.items || null, at: l.at||0, logId: l.id,
      partial: !!l.partial });
  });
  focusLogs().forEach(f=>{
    if(f.date !== date) return;
    sessions.push({ classId:f.classId||null, label:'Focus timer', unit:null,
      correct:null, total:null, hints:0, minutes:f.minutes||0, at:f.at||0 });
  });
  /* The emotion check belongs to the session it was taken for — two taps
     before a quiz, one after — so it is matched by logId rather than by time. */
  const dayMoods = all('mood').filter(m=>m.date===date);
  sessions.forEach(x=>{
    if(!x.logId) return;
    x.pre  = dayMoods.find(m=>m.when==='pre'  && m.logId===x.logId) || null;
    x.post = dayMoods.find(m=>m.when==='post' && m.logId===x.logId) || null;
  });
  sessions.sort((a,b)=>a.at-b.at);
  const quizzes = sessions.filter(s=>s.total>0);
  const right = quizzes.reduce((n,s)=>n+s.correct,0);
  const asked = quizzes.reduce((n,s)=>n+s.total,0);
  const bySub = {};
  sessions.forEach(s=>{
    const k = s.classId || '__mixed__';
    const b = bySub[k] || (bySub[k] = {id:k, quizzes:0, right:0, asked:0, minutes:0, sessions:[]});
    b.minutes += s.minutes||0;
    if(s.total>0){ b.quizzes++; b.right += s.correct; b.asked += s.total; }
    b.sessions.push(s);
  });
  return { date, sessions, quizzes: quizzes.length, right, asked,
    acc: asked ? Math.round(right/asked*100) : null,
    minutes: sessions.reduce((n,s)=>n+(s.minutes||0),0),
    moods: dayMoods.sort((a,b)=>(a.at||0)-(b.at||0)),
    checks: sessions.filter(x=>x.pre || x.post),
    subs: Object.values(bySub).sort((a,b)=>b.minutes-a.minutes) };
}
const readyOf = v => READY.find(o=>o.v===v) || null;
const feelOf  = v => FEELING.find(o=>o.v===v) || null;
/* A compact "😎 → 😊" for a session's before/after feeling, or just one of
   them. Emoji alone is never the whole story, so every place this is used
   also spells the words out nearby. */
function moodChip(s){
  const bits = [];
  if(s.pre && feelOf(s.pre.feeling))  bits.push(feelOf(s.pre.feeling).e);
  if(s.post && feelOf(s.post.feeling)) bits.push(feelOf(s.post.feeling).e);
  return bits.join(' → ');
}
const subName = id => id==='__mixed__' ? 'Mixed / review'
  : (CLASS_BY_ID[id] ? (CLASS_BY_ID[id].icon+' '+CLASS_BY_ID[id].name) : id);
/* One session, as a row. Quizzes carry their score; everything else carries
   its minutes, because a flashcard run has no score and inventing one for
   symmetry would be a lie. */
function sessionRow(s, withSubject){
  const r = el('div','row');
  const sub = withSubject && s.classId && CLASS_BY_ID[s.classId]
    ? (CLASS_BY_ID[s.classId].short || CLASS_BY_ID[s.classId].name || '') : '';
  const k = el('span','k', s.label + (sub ? ' · '+sub : ''));
  if(s.unit) k.appendChild(el('small',null,s.unit));
  r.appendChild(k);
  const bits = [];
  if(s.total>0) bits.push(s.correct+'/'+s.total+' · '+Math.round(s.correct/s.total*100)+'%');
  if(s.minutes) bits.push(s.minutes+' min');
  r.appendChild(el('span','v', bits.join('  ') || '—'));
  return r;
}
function stats(){
  const L = logs(), F = focusLogs();
  let xp=0,correct=0,answered=0,seconds=0;
  const days = new Set();
  L.forEach(l=>{ xp+=l.xp||0; correct+=l.correct||0; answered+=l.total||0; seconds+=l.seconds||0; days.add(l.date); });
  F.forEach(f=>{ xp+=f.xp||0; seconds+=(f.minutes||0)*60; days.add(f.date); });
  all('affirm').forEach(a=>{ xp += a.xp||0; });   // reading the morning line counts
  return { xp, level:Math.floor(xp/500)+1, intoLevel:xp%500, toNext:500-(xp%500),
    correct, answered, seconds, accuracy: answered?Math.round(correct/answered*100):0,
    days:days.size, streak:streakFrom(days), sessions:L.length,
    focusMin: F.reduce((s,f)=>s+(f.minutes||0),0) };
}
function streakFrom(daySet){
  let n=0, cur=AZ.today();
  if(!daySet.has(cur)){ cur=AZ.shift(cur,-1); if(!daySet.has(cur)) return 0; }
  while(daySet.has(cur)){ n++; cur=AZ.shift(cur,-1); }
  return n;
}
function classStats(cid){
  const L = logs().filter(l=>l.classId===cid);
  const F = focusLogs().filter(f=>f.classId===cid);
  let c=0,t=0,xp=0,sec=0;
  L.forEach(l=>{c+=l.correct||0;t+=l.total||0;xp+=l.xp||0;sec+=l.seconds||0;});
  F.forEach(f=>{xp+=f.xp||0;sec+=(f.minutes||0)*60;});
  const last = [...L,...F].sort((a,b)=>b.at-a.at)[0];
  return { sessions:L.length, correct:c, answered:t, xp, minutes:Math.round(sec/60),
    accuracy: t?Math.round(c/t*100):null, lastOn: last?last.date:null };
}
function minutesInRange(from,to,cid){
  let s=0;
  logs().forEach(l=>{ if(l.date>=from&&l.date<=to&&(!cid||l.classId===cid)) s+=(l.seconds||0)/60; });
  focusLogs().forEach(f=>{ if(f.date>=from&&f.date<=to&&(!cid||f.classId===cid)) s+=f.minutes||0; });
  return Math.round(s);
}
function recentAccuracy(days){
  const from = AZ.shift(AZ.today(), -days);
  const L = logs().filter(l=>l.date>=from && l.total);
  if(!L.length) return null;
  const c = L.reduce((s,l)=>s+l.correct,0), t = L.reduce((s,l)=>s+l.total,0);
  return t ? Math.round(c/t*100) : null;
}

/* ---------- Spaced repetition ----------
   Missed questions ride a Leitner ladder. Each correct recall pushes the box up
   and the next sighting further out; a slip drops it back to the start. Only a
   question that survives the whole ladder counts as learned and leaves the
   Growth Zone — which is the difference between a list of mistakes and a system
   that actually clears them. */
const BOX_GAPS = [1, 2, 4, 8, 21];      // days until the next sighting
const LAST_BOX = BOX_GAPS.length - 1;

function scheduleMiss(m, gotItRight){
  const box = gotItRight ? Math.min(LAST_BOX, (m.box ?? -1) + 1) : 0;
  return { ...m, box, due: AZ.shift(AZ.today(), BOX_GAPS[box]), lastSeen: AZ.today() };
}
const dueMisses = (date = AZ.today()) =>
  all('miss').filter(m => !m.due || m.due <= date)
             .sort((a,b) => (a.box ?? 0) - (b.box ?? 0));

/* A miss can only be re-asked if it kept its options. Older ones fall back to
   the unit they came from. */
function missAsQuestion(m){
  /* The id is rewritten to the miss id: a review round gathers questions from
     many units, whose own ids restart at 1 and would otherwise collide. */
  if(Array.isArray(m.opts) && m.opts.length === 4 && m.ans != null)
    return { id:m.id, lv:1, q:m.q, opts:m.opts, ans:m.ans, hint:'', ex:{ main:m.why||'' }, graph:m.graph||null, steps:m.steps||null, kind:m.kind||null, passage:m.passage||null, _missId:m.id };
  const u = DATA.records[m.unitId];
  const q = u && !u.deleted && u.questions && u.questions.find(x => x.id === m.qid);
  return q ? { ...q, id:m.id, _missId:m.id } : null;
}

/* ---------- Assessments ---------- */
/* A grade as the teacher wrote it. `outOf` defaults to 100 so a record saved
   before this — or a parent who only knows the percentage — behaves exactly as
   it always did. Deliberately NOT clamped at 100: extra credit is real, and a
   52-out-of-50 that silently became 100% would be the app editing the grade.
   School rounding (5 up) is what Math.round already does for positives. */
function assessPct(points, outOf){
  if(points===null || points===undefined || String(points).trim()==='') return null;
  const p = Number(points), t = Number(outOf) || 100;
  if(isNaN(p) || t <= 0) return null;
  return Math.round(p / t * 100);
}
/* "42/50 · 84%", or just "84%" when the total was the default hundred and the
   fraction would say nothing the percentage does not. */
function assessLabel(a){
  if(a.score == null) return null;
  return (a.points != null && a.outOf != null && a.outOf !== 100)
    ? a.points + '/' + a.outOf + ' · ' + a.score + '%'
    : a.score + '%';
}
function assessments(){ return all('assess').sort((a,b)=>a.date<b.date?-1:1); }
/* Grades, tabulated by subject — derived at render time from `assess`
   records, same as everything else derived elsewhere in the app (XP, level,
   streak): nothing new is stored, so there is no subject-average field to
   drift out of sync when a grade is edited or deleted.

   Scoped to the current quarter — a stale average dragged along from last
   quarter would misrepresent how this one is going, and "no grades yet"
   should mean something a parent can act on, not something permanently true
   for a subject with one grade back in September.

   Every STUDY_CLASSES subject is included even at zero — the gap (nothing
   entered yet for a subject) is exactly what a parent scanning this needs to
   see, and hiding empty rows (the way the activity "By subject" card already
   does, on purpose, for a different reason) would erase it. */
function gradesBySubject(date = AZ.today()){
  const q = currentQuarter(date);
  const inQ = a => !q || (a.date >= q.start && a.date <= q.end);
  const list = assessments();
  return STUDY_CLASSES.map(c=>{
    const forC = list.filter(a=>a.classId===c.id && inQ(a));
    const graded = forC.filter(a=>a.score!=null);
    const avg = graded.length ? Math.round(graded.reduce((s,a)=>s+a.score,0)/graded.length) : null;
    return { cls:c, count:forC.length, graded:graded.length, pending:forC.length-graded.length, avg, quarter:q };
  });
}
function upcomingAssessments(from, withinDays){
  const to = AZ.shift(from, withinDays);
  return assessments().filter(a=>a.date>=from && a.date<=to);
}
const KINDS = {test:{nm:'Test',ic:'✍️'},quiz:{nm:'Quiz',ic:'📝'},project:{nm:'Project',ic:'🛠️'},essay:{nm:'Essay',ic:'📄'},present:{nm:'Presentation',ic:'🎤'}};

/* ---------- Study plan (rule-based — always works, no API key needed) ---------- */
function studyPlan(date){
  const out = [];
  STUDY_CLASSES.forEach(c=>{
    const st = classStats(c.id);
    const gz = all('miss').filter(m=>m.classId===c.id).length;
    const nextA = assessments().find(a=>a.classId===c.id && a.date>=date && a.score==null);
    const daysOut = nextA ? AZ.daysBetween(date, nextA.date) : null;
    const sinceStudied = st.lastOn ? AZ.daysBetween(st.lastOn, date) : null;
    const hasUnits = units(c.id).length > 0;

    let score = 0; const reasons = [];
    if(daysOut !== null && daysOut <= 14){
      score += (15 - daysOut) * 6;
      /* Guarded like every other KINDS lookup in the file. This one was not,
         and an assess record with an unrecognised kind — a parent typing one
         in, an old record, a typo in SUGGESTED_ASSESS — threw here and took
         down studyPlan(), which is rendered by BOTH Today and Study. A bad
         label is a cosmetic problem; a blank app is not. */
      const knm = (KINDS[nextA.kind] || KINDS.test).nm.toLowerCase();
      reasons.push(daysOut === 0 ? `${knm} is today`
                : daysOut === 1 ? `${knm} tomorrow`
                : `${knm} in ${daysOut} days`);
    }
    if(gz){ score += gz*4; reasons.push(`${gz} question${gz>1?'s':''} in your Growth Zone`); }
    if(st.accuracy !== null && st.accuracy < 70){ score += (70-st.accuracy); reasons.push(`accuracy is ${st.accuracy}%`); }
    if(sinceStudied !== null && sinceStudied >= 5){ score += sinceStudied*2; reasons.push(`not studied in ${sinceStudied} days`); }
    if(sinceStudied === null && hasUnits){ score += 12; reasons.push('never studied yet'); }

    const goal = prefs().goals[c.id];
    if(goal){
      const wk = minutesInRange(AZ.weekStart(date), date, c.id);
      if(wk < goal){ score += Math.min(20,(goal-wk)/2); reasons.push(`${wk} of ${goal} min this week`); }
    }
    if(score <= 0) return;
    /* Inside a week of a test, the RIGHT work changes shape: mixed practice
       across all the subject's units (deciding which skill a question wants
       is itself the tested skill), not rereading the newest lesson. The flag
       needs 2+ units — interleaving one unit is just that unit. */
    out.push({ classId:c.id, score,
      minutes: score>=60?40 : score>=30?25 : 15,
      why: reasons.slice(0,2).join(' · '),
      ramp: daysOut!==null && daysOut<=7 && units(c.id).length>1,
      hasUnits, assess:nextA });
  });
  return out.sort((a,b)=>b.score-a.score).slice(0,3);
}

/* ---------- The Sky Map ----------

/* Real constellations, one honest line of sky-lore each. Identity: Wayfinder
   invents playful ones instead — do not converge the rosters. */
const CONSTELLATIONS = [
  {nm:'Lyra', lore:'The harp. Its star Vega was the pole star 12,000 years ago, and will be again.'},

function studyDates(){
  const s = new Set();
  all('log').forEach(l=>{ if(l.date) s.add(l.date); });
  all('focus').forEach(f=>{ if(f.date) s.add(f.date); });
  return s;

/* The map starts with the first FULL school week (Chris, 2026-08): school
   opened mid-week, and a half week should not sit at the front of the sky
   as a permanently dim constellation. */
const SKY_OFFSET_WEEKS = 1;
const skyWeek0 = () => AZ.shift(AZ.weekStart(CAL.firstDay), 7*SKY_OFFSET_WEEKS);
const skyNow = date => Math.max(0, Math.round(AZ.daysBetween(skyWeek0(), AZ.weekStart(date))/7));
function skyWeek(i, set){
  set = set || studyDates();
  const start = AZ.shift(skyWeek0(), i*7);
  const days = Array.from({length:7},(_,d)=>AZ.shift(start,d));
  const lit = days.map(d=>set.has(d));
  const litCount = lit.filter(Boolean).length;
  return { i, start, days, lit, litCount, done:litCount>=SKY_GOAL,
           c: CONSTELLATIONS[i % CONSTELLATIONS.length] };
}
function skyDone(date){
  const set = studyDates(); let c = 0;
  for(let i=0;i<=skyNow(date);i++) if(skyWeek(i,set).done) c++;
  return c;
}
function skyChartEl(w, mini){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 100 60');
  svg.setAttribute('class','skysvg'+(mini?' mini':''));
  const pts = SKY_SHAPES[w.i % SKY_SHAPES.length];
  const line = document.createElementNS(NS,'polyline');
  line.setAttribute('points', pts.map(p=>p.join(',')).join(' '));
  line.setAttribute('fill','none');
  svg.appendChild(line);
  pts.forEach((p,d)=>{
    const c = document.createElementNS(NS,'circle');
    c.setAttribute('cx',p[0]); c.setAttribute('cy',p[1]);
    c.setAttribute('r', mini?2.6:3.4);
    c.setAttribute('class', w.lit[d]?'lit':'dim');

  return svg;
}

/* `build(box, close)` may set `box._go` to take over the confirm button —
   used by the forms (assessment editor, passcode) so they can validate first. */
function showModal({title,message,confirmText='OK',cancelText=null,onConfirm=null,build=null}){
  const ov=el('div','modal-overlay'), box=el('div','modal-box');
  box.appendChild(el('h3',null,title));
  if(message) box.appendChild(el('p',null,message));
  const close = ()=>ov.remove();
  if(build) build(box, close);
  const row=el('div','modal-buttons');
  if(cancelText){ const c=el('button','btn btn-secondary',cancelText);
    c.addEventListener('click',close); row.appendChild(c); }
  const ok=el('button','btn btn-primary',confirmText);
  ok.addEventListener('click',()=>{
    if(typeof box._go === 'function'){ box._go(); return; }   // form owns close()
    close(); if(onConfirm) onConfirm();
  });
  row.appendChild(ok); box.appendChild(row); ov.appendChild(box);
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.body.appendChild(ov); return ov;
}
/* opt.big marks a moment worth more than the everyday one — a strong round.
   It forces fireworks REGARDLESS of the chosen style, with one exception that
   is not negotiable: 'quiet' is an explicit opt-down, and opting down has to
   keep costing nothing. Everything else still gets her own style.

   Forcing it rather than leaning on the default is deliberate: setPref()
   spreads DEFAULT_PREFS into the stored record, so both girls already have
   fx baked in from the first preference they ever changed, and a new default
   would never reach them. */
function celebrate(opt){
  const chosen = prefs().fx || 'fireworks';
  const fx = (opt && opt.big && chosen !== 'quiet') ? 'fireworks' : chosen;
  if(navigator.vibrate) navigator.vibrate(fx==='quiet' ? 12 : 18);
  if(fx==='quiet'){
    const gl = el('div','glow');
    document.body.appendChild(gl); setTimeout(()=>gl.remove(),1400);
    return;
  }
  const ac = getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  if(fx==='fireworks'){
    /* Three bursts, staggered, each radiating from its own point. The angle
       and distance ride on custom properties so one keyframe serves them all,
       and every node is removed on a timer — nothing is left in the DOM. */
    const cols=[ac,'#f2c48a','#ffffff','#ff9ab0','#9fd8ff'];
    for(let b=0;b<3;b++){
      const ox = 18 + Math.random()*64, oy = 26 + Math.random()*34;
      for(let i=0;i<18;i++){
        const p2 = el('div','spark');
        const ang = (i/18)*2*Math.PI + Math.random()*.3;
        const dist = 60 + Math.random()*70;
        p2.style.left = ox+'vw'; p2.style.top = oy+'vh';
        p2.style.setProperty('--dx', Math.cos(ang)*dist+'px');
        p2.style.setProperty('--dy', Math.sin(ang)*dist+'px');
        p2.style.background = cols[(b+i)%cols.length];
        p2.style.animationDelay = (b*.22 + Math.random()*.06)+'s';
        document.body.appendChild(p2);
        setTimeout(()=>p2.remove(), 1500 + b*260);
      }
    }
    return;
  }
  const glyphs = { stars:['✦','✧','★','✶'], petals:['❀','✿','🌸','❀'], bubbles:['○','◦','○','∘'] }[fx];
  const cols=[ac,'#f2c48a','#ffffff',ac];
  for(let i=0;i<26;i++){
    const c=el('div','confetti'+(glyphs?' glyph':''));
    c.style.left=Math.random()*100+'vw'; c.style.top=(58+Math.random()*28)+'vh';
    if(glyphs){ c.textContent=glyphs[i%glyphs.length]; c.style.color=cols[i%cols.length]; }
    else c.style.background=cols[i%cols.length];
    c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),2000);
  }
}

function calcEval(s){
  let i = 0;
  const eat = c=>{ if(s[i]===c){ i++; return true; } return false; };
  function number(){
    let j = i;
    while(j<s.length && /[0-9.]/.test(s[j])) j++;
    if(j===i) return null;
    const v = parseFloat(s.slice(i,j));
    if(isNaN(v)) return null;
    i = j; return v;
  }
  function primary(){
    if(eat('(')){ const v = expr(); if(v===null || !eat(')')) return null; return v; }
    if(eat('π')) return Math.PI;
    return number();
  }
  function unary(){
    if(eat('−')||eat('-')){ const v = unary(); return v===null ? null : -v; }
    if(eat('√')){ const v = unary(); return (v===null || v<0) ? null : Math.sqrt(v); }
    return primary();
  }
  function power(){
    const b = unary(); if(b===null) return null;
    if(eat('^')){ const e = power(); return e===null ? null : Math.pow(b,e); }
    return b;
  }
  function term(){
    let v = power(); if(v===null) return null;
    for(;;){

/* ---------- Graphs ----------
   A card or question can carry a `graph` spec and it renders as worksheet-
   style graph paper. No expressions are ever evaluated — series are typed
   (line y=mx+b, parabola/abs in vertex form a·(x−h)²+k, or explicit pts)
   and sampled here in code.
   Spec: { w:[xmin,xmax,ymin,ymax], gx?,gy? (grid steps), xl?,yl? (axis
   labels), series:[{type,'m','b','a','h','k',dom?,pts?}], pts:[{x,y,label?}] } */
const GRAPH_INK='#3f4d63', GRAPH_GRID='#dbe4ee', GRAPH_CURVES=['#d81b60','#1565c0'];
function niceStep(span){
  const raw=span/8, p=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,2.5,5,10]) if(raw<=m*p) return m*p;
  return 10*p;
}
function seriesSamples(ser,x0,x1){
  if(ser.type==='pts') return (ser.pts||[]).slice();
  const a=ser.a??1,h=ser.h??0,k=ser.k??0,m=ser.m??1,b=ser.b??0;
  const lo=ser.dom?Math.max(ser.dom[0],x0):x0, hi=ser.dom?Math.min(ser.dom[1],x1):x1;
  if(hi<=lo) return [];
  if(ser.type==='line'){
    /* Sampled, not two endpoints: an endpoint outside the y-window would be
       dropped by clipping and take the whole segment with it. */
    const out=[]; for(let i=0;i<=60;i++){ const x=lo+(hi-lo)*i/60; out.push([x,m*x+b]); }
    return out;
  }
  if(ser.type==='abs'){
    /* Sampled like the parabola (same clipping reason), with the exact vertex
       spliced in so the V's corner stays sharp. */
    const f=x=>a*Math.abs(x-h)+k, out=[];
    for(let i=0;i<=60;i++){ const x=lo+(hi-lo)*i/60;
      if(h>lo&&h<hi&&out.length&&out[out.length-1][0]<h&&x>h) out.push([h,k]);
      out.push([x,f(x)]); }
    return out;
  }
  const f=x=>a*(x-h)*(x-h)+k, out=[];
  for(let i=0;i<=60;i++){ const x=lo+(hi-lo)*i/60; out.push([x,f(x)]); }
  return out;
}
function renderGraph(g){
  try{
    const [x0,x1,y0,y1]=g.w;
    if(!(x1>x0&&y1>y0)) return null;
    const W=300,H=210,P=26;
    const sx=x=>P+(x-x0)/(x1-x0)*(W-2*P), sy=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
    const NS='http://www.w3.org/2000/svg';
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
    svg.setAttribute('role','img');
    const add=(tag,attrs)=>{ const n=document.createElementNS(NS,tag);
      for(const [k2,v] of Object.entries(attrs)) n.setAttribute(k2,v); svg.appendChild(n); return n; };
    const txt=(x,y,t,anchor='middle',size=8.5,weight=400)=>{
      const n=add('text',{x,y,'text-anchor':anchor,'font-size':size,fill:GRAPH_INK,
        'font-family':'Inter,system-ui,sans-serif','font-weight':weight}); n.textContent=t; return n; };
    const gx=g.gx||niceStep(x1-x0), gy=g.gy||niceStep(y1-y0);
    const fmt=v=>{ const r=Math.round(v*100)/100; return Object.is(r,-0)?0:r; };
    /* grid */
    for(let x=Math.ceil(x0/gx-1e-9)*gx; x<=x1+1e-9; x+=gx)
      add('line',{x1:sx(x),y1:sy(y0),x2:sx(x),y2:sy(y1),stroke:GRAPH_GRID,'stroke-width':1});
    for(let y=Math.ceil(y0/gy-1e-9)*gy; y<=y1+1e-9; y+=gy)
      add('line',{x1:sx(x0),y1:sy(y),x2:sx(x1),y2:sy(y),stroke:GRAPH_GRID,'stroke-width':1});
    /* axes with arrowheads; drawn on the window edge when 0 is off-screen */
    const ax=y0<=0&&y1>=0?sy(0):sy(y0), ay=x0<=0&&x1>=0?sx(0):sx(x0);
    add('line',{x1:P-6,y1:ax,x2:W-P+6,y2:ax,stroke:GRAPH_INK,'stroke-width':1.4});
    add('line',{x1:ay,y1:H-P+6,x2:ay,y2:P-6,stroke:GRAPH_INK,'stroke-width':1.4});
    add('path',{d:`M ${W-P+6} ${ax} l -5 -3 v 6 z`,fill:GRAPH_INK});
    add('path',{d:`M ${ay} ${P-6} l -3 5 h 6 z`,fill:GRAPH_INK});
    /* numbers along the axes (0 once, at the origin corner) */
    for(let x=Math.ceil(x0/gx-1e-9)*gx; x<=x1+1e-9; x+=gx){
      if(Math.abs(x)<gx/2&&x0<=0) continue;
      txt(sx(x),ax+11,fmt(x));
    }
    for(let y=Math.ceil(y0/gy-1e-9)*gy; y<=y1+1e-9; y+=gy){
      if(Math.abs(y)<gy/2&&y0<=0) continue;
      txt(ay-4,sy(y)+3,fmt(y),'end');
    }
    if(x0<=0&&y0<=0) txt(ay-4,ax+11,'0','end');
    /* series, clipped to the window (a segment breaks where it leaves it) */
    (g.series||[]).forEach((ser,si)=>{
      const col=GRAPH_CURVES[si%GRAPH_CURVES.length];
      let seg=[];
      const flush=()=>{ if(seg.length>1)
        add('polyline',{points:seg.map(([px,py])=>`${sx(px)},${sy(py)}`).join(' '),
          fill:'none',stroke:col,'stroke-width':2.4,'stroke-linejoin':'round','stroke-linecap':'round'});
        seg=[]; };
      for(const [px,py] of seriesSamples(ser,x0,x1)){
        if(py>=y0-1e-9&&py<=y1+1e-9&&px>=x0-1e-9&&px<=x1+1e-9) seg.push([px,py]); else flush();
      }
      flush();
    });
    /* marked points */
    (g.pts||[]).forEach(p=>{
      add('circle',{cx:sx(p.x),cy:sy(p.y),r:3.4,fill:GRAPH_CURVES[0],stroke:'#fffdf4','stroke-width':1.4});
      if(p.label) txt(sx(p.x)+6,sy(p.y)-6,p.label,'start',8.5,700);
    });
    /* axis titles */
    if(g.xl) txt(W/2,H-3,g.xl,'middle',9.5,600);
    if(g.yl){ const n=txt(9,H/2,g.yl,'middle',9.5,600);
      n.setAttribute('transform',`rotate(-90 9 ${H/2})`); }
    return svg;
  }catch(e){ return null; }
}

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));

/* Focus lives inside Study rather than owning a tab, which leaves room for
   Settings to stay visible. */
const NAV = [
  {id:'today', ic:'🌅',nm:'Today'},
  {id:'study', ic:'📚',nm:'Study'},
  {id:'growth',ic:'🌱',nm:'Growth'},
  {id:'stars', ic:'✦', nm:'Stars'},
  {id:'setup', ic:'⚙️',nm:'Settings'}
];
let view='today', ctx={};
/* Back-stack navigation: tab roots clear it, everything else pushes, and
   render() shows a ← chip whenever there is somewhere to go back to. The
   mood check-in never lands on the stack — backing into it would re-ask. */
const ROOT_SCREENS = new Set(['today','study','growth','stars','setup']);
const SKIP_HIST = new Set(['checkin','postmood']);
let HIST = [];
function go(v,c={},opts={}){
  /* Leaving a quiz part-way records the questions she answered. See
     finishQuiz's note: this is the difference between a short session and a
     session that never happened. */
  if(view==='quiz' && v!=='quiz' && quizState && !quizState.settled
     && (quizState.seen||[]).length){
    const qLeft = unitFor(quizState.unitId);
    if(qLeft) finishQuiz(qLeft, true);
  }
  if(ROOT_SCREENS.has(v)) HIST = [];
  else if(!opts.back && view && view!==v && !SKIP_HIST.has(view)){
    HIST.push([view,ctx]);
    if(HIST.length>24) HIST.shift();
  }
  view=v; ctx=c; animateIn = true; render(); window.scrollTo(0,0);
}
function goBack(){
  const prev = HIST.pop();
  if(prev){ view=prev[0]; ctx=prev[1]; animateIn = true; render(); window.scrollTo(0,0); }
  else go('today');
}

  const subjCls = CLASS_BY_ID[ctx.classId] || CLASS_BY_ID[DATA.records[ctx.unitId]?.classId];

SCREENS.today = function(root){

  const weekend = wd===0||wd===6, q = currentQuarter(date), s = stats();

  /* The runway is computed first: when a test is close it becomes the screen's
     one focal point, and the school-day header goes quiet behind it rather
     than competing with a second accent wash. */
