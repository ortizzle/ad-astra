      c.appendChild(lg);
    }

    /* The ledger: the week day by day. Today's row is tinted and every row
       with somewhere to go is a door. */
    const led = el('div','ledger');
    wk.plan.forEach(pn => {
      const r = el('div','ledger-row' + (pn.d.today ? ' now' : '') + (pn.kind==='test' ? ' test' : '')
        + (pn.kind==='subject' && pn.cid && CLASS_BY_ID[pn.cid] ? ' subj' : ''));
      if(pn.kind==='subject' && pn.cid && CLASS_BY_ID[pn.cid])
        r.style.setProperty('--pc', classColor(CLASS_BY_ID[pn.cid]));
      /* MON/TUE/WED, not the strip's single letters — T and T are the same
         glyph for two different days, which was fine in a five-cell row read
         left to right and is ambiguous in a list that starts mid-week. */
      r.appendChild(el('div','ledger-day', pn.d.name.slice(0,3).toUpperCase()));
      const w = el('div','ledger-what');
      w.appendChild(document.createTextNode(pn.what));
      if(pn.sub) w.appendChild(el('small',null,pn.sub));
      r.appendChild(w);
      r.appendChild(el('div','ledger-min', pn.mins ? '~' + pn.mins + ' min' : '—'));
      if(pn.kind === 'subject' && pn.cid){
        r.style.cursor = 'pointer';
        r.addEventListener('click', ()=> go('unit',{classId: pn.cid}));
      } else if(pn.kind === 'mixed' && pn.cid){
        r.style.cursor = 'pointer';
        r.addEventListener('click', ()=>{ if(buildShuffleUnit(pn.cid)) go('quiz',{unitId:'__shuffle__', classId:pn.cid}); });
      }
      led.appendChild(r);
    });
    c.appendChild(led);

    /* Where to actually study. Chris's instruction, and the ordering is the
       point: the CJ first, then the school's own tools, and only then this
       app. Fixed copy on purpose — the app cannot know whether her CJ is up
       to date and must never pretend to track it. */
    /* Full on Sunday and Monday, when the week gets planned; one tappable
       line the rest of the week. 361px of identical furniture every day is
       how banner blindness starts — nothing removed, only deferred, the same
       move the Settings pickers and the badge grid made. */
    const wd2 = AZ.weekday(date);
    if(!(wd2 === 0 || wd2 === 1 || ctx._studyPath)){
      const ff = el('button','first firstfold');
      ff.appendChild(el('div','fh','Where to actually study'));
      ff.appendChild(el('div','tail','CJ first → Schoology, notes, study guides → then here  ›'));
      ff.addEventListener('click', ()=>{ ctx._studyPath = true; render(); });
      c.appendChild(ff);
    } else {
    const fb = el('div','first');
    fb.appendChild(el('div','fh','Where to actually study'));
    const step = (n, bold, rest) => {
      const st2 = el('div','step');
      st2.appendChild(el('span','n', String(n)));
      const t2 = el('span','t');
      t2.appendChild(el('b',null,bold));
      t2.appendChild(el('span',null,' ' + rest));
      st2.appendChild(t2); fb.appendChild(st2);
    };
    step(1,'Your CJ first','— make sure every assignment is written down and right.');
    step(2,'Then Schoology, class notes, worksheets, study guides','— that is where the test comes from.');
    step(3,'Then here','— for the extra practice once you have read it through.');
    fb.appendChild(el('div','tail','The minutes are how long that evening\'s practice should take, timed from your own pace.'));
    c.appendChild(fb);
    }

    /* The button prefers tonight, and falls forward to the first workable day
       when today has nothing to press — a closed day, or a test morning. It
       only disappears when the whole week genuinely asks nothing, because a
       call to action with nothing behind it would be a nag. */
    const mine = wk.plan.find(pn => pn.d.today);
    const target = (mine && ((mine.kind === 'subject' && mine.load) || (mine.kind === 'mixed' && mine.cid)))
      ? mine
      : wk.plan.find(pn => (pn.kind === 'subject' && pn.load) || (pn.kind === 'mixed' && pn.cid));
    if(target){
      const tonight = target === mine;
      const nm2 = target.kind === 'mixed' ? 'a mixed round' : target.load.cls.name;
      const b = el('button','btn btn-primary', (tonight ? 'Tonight: ' : 'Get ahead: ') + nm2);
      if(target.kind === 'mixed')
        b.addEventListener('click', ()=>{ if(buildShuffleUnit(target.cid)) go('quiz',{unitId:'__shuffle__', classId:target.cid}); });
      else
        b.addEventListener('click', ()=> go('unit',{classId: target.cid}));
      c.appendChild(b);
    }
    root.appendChild(c);
  }

  /* The strip: three live numbers that are really DOORS. Today still is not a
     dashboard — nothing here is scorekeeping for its own sake. Each tile
     answers "what should I do now" and goes straight there. */
  /* The runway — see runway() above. Sits directly under the school day,
     because before a test it is the most useful thing on the screen. */
  if(rwShow){
    const k = KINDS[rw.a.kind] || KINDS.test;
    const c0 = el('div','card ac runway subj-a');
    /* The runway is about ONE subject's test, so it wears that subject. */
    c0.style.setProperty('--pc', classColor(rw.cls));
    c0.appendChild(el('div','eyebrow', 'Before your ' + (rw.cls.short || rw.cls.name) + ' ' + k.nm.toLowerCase()));
    c0.appendChild(el('h3',null, rw.days===0 ? 'It is today'
      : rw.days===1 ? 'Tomorrow'
      : AZ.pretty(rw.a.date).split(',')[0] + ' · in ' + rw.days + ' days'));
    const line = (n, text, onTap) => {
      const b = el('button','rw');
      b.appendChild(el('span','rn', String(n)));
      b.appendChild(el('span','rt', text));
      if(onTap){ b.appendChild(el('span','rc','›')); b.addEventListener('click', onTap); }
      else b.disabled = true;
      c0.appendChild(b);
    };
    if(rw.due) line(rw.due, 'review question' + (rw.due===1?'':'s') + ' due in ' + rw.cls.name,
      ()=>{ if(buildReviewUnit({classId:rw.cid, title:(rw.cls.short||rw.cls.name)+' review'}))
              go('quiz',{unitId:'__review__', classId:rw.cid});
            else go('growth'); });
    if(rw.open.length){
      /* Name ONE lesson, never a pile. "14 lessons still open" is the whole
         book restated as a debt; what she can act on is the next one — the
         lesson she was last in, or the first she has not started. The count
         stays visible because it is true, but the words point somewhere. */
      const touched = rw.open.filter(u => unitLastStudied(u) > 0)
        .sort((a,b) => unitLastStudied(b) - unitLastStudied(a));
      rwLesson = touched[0] || rw.open[0];
      line(rw.open.length, rw.open.length===1
        ? 'lesson still open · ' + rwLesson.title
        : 'lessons open · pick up ' + rwLesson.title,
        ()=> launchQuiz(rwLesson.id, rw.cid, false));
    }
    if(!rw.due && !rw.open.length)
      c0.appendChild(el('p',null,'Every question in ' + rw.cls.name + ' is answered and nothing is due back. A mixed round is the useful kind of practice now.'));
    /* What is POSSIBLE: the teacher's own door, and whether it is the last
       one before the test. Stated, never nagged. */
    if(rw.hours){
      const when = rw.hours.inDays===0 ? 'today' : rw.hours.inDays===1 ? 'tomorrow' : rw.hours.label;
      c0.appendChild(el('div','rhours', '🕐 Student hours ' + when + ', ' + rw.hours.times
        + (rw.hours.tbd ? ' (confirm with your teacher)' : '')
        + (rw.hours.sameDay ? ' — the morning of, and the last chance.'
           : rw.hours.last ? ' — the last one before it.' : '.')));
    }
    root.appendChild(c0);
  }

  /* The three-tile strip was removed here (Wayfinder v105 / Ad Astra v122),
     Chris's call, and the brief is why: every one of its tiles had become a
     second door to something already on the screen or already in the nav.
     Tile one said "40m suggested · Math" directly under the brief's "Tonight:
     Accelerated Math"; its Growth variant was already yielding to the brief's
     review counts. Reading has a whole card on Study. Level went to Stars,
     which is a nav tab — and a level with nowhere new to go is scorekeeping,
     which is the one thing the strip's own rule (v51) said would disqualify a
     tile: "if a tile is ever added that only displays a number, it belongs on
     Stars instead." Growth keeps its live count badge in the nav, so the door
     that mattered never disappears. */

  /* Carry on, in one tap — but ONLY when it says something the screen does
     not already say. The brief names its subjects and the runway names the
     lesson to finish before a test; a hero repeating either is the same fact
     printed twice. It earns its place for a specific open lesson, or for the
     mixed round in test week. */
  /* A round parked earlier today outranks every suggestion below: it is not
     advice, it is her own half-finished work made findable — the "don't lose
     progress" promise, one door further out. Same validity rules as
     loadRound — today, a real approved unit, questions left, same content —
     WITHOUT consuming the save; the quiz screen still owns the pickup. */
  const pk = Store.get(ROUND_KEY);
  const pkU = pk && pk.date === AZ.today() && realUnit(pk.unitId) ? unitFor(pk.unitId) : null;
  const pkLive = !!(pkU && !pkU.deleted && pkU.status !== 'draft' && pkU.questions
    && (pk.seen || []).length
    /* The save fires before Next advances, so an answered question still sits
       at pk.i — step past it the way the quiz's own resume does, or the door
       shows for a finished round and tapping it starts a fresh one. */
    && (pk.i + (pk.answered !== null && pk.answered !== undefined ? 1 : 0)) < (pk.order || []).length
    && pk.print === roundPrint(pkU, pk.order));
  if(pkLive){
    const dR = cardButton('Pick your round back up',
      pkU.title + ' · ' + (pk.seen || []).length + ' of ' + (pk.order || []).length + ' answered'
      + (pk.timed ? ' · Beat the clock' : ''),
      () => go('quiz', {unitId: pk.unitId, classId: pk.classId || pkU.classId, timed: !!pk.timed}));
    dR.classList.add('hero');
    root.appendChild(dR);
  }
  /* The daily three: one tiny fixed ritual, under the parked round and above
     everything else, because a habit needs a door that is always in the same
     place. Done, it turns into the day's three squares and stops asking. */
  {
    const dl = dailyDone(date);
    if(dl){
      const dc = el('div','card quiet dailydone');
      const dr = el('div','row');
      dr.appendChild(el('span','k','The daily three · done'));
      dr.appendChild(dailySquares(false));
      dc.appendChild(dr);
      if(navigator.share || navigator.clipboard) dc.appendChild(dailyShareButton(false));
      root.appendChild(dc);
    } else if(buildDailyUnit(date)){
      const dd = cardButton('The daily three',
        dailyUnit.questions.length === 3
          ? 'Three questions, about a minute, one from each corner of your week.'
          : dailyUnit.questions.length + ' question' + (dailyUnit.questions.length===1?'':'s') + ' today — that is all there is so far.',
        () => { quizState = null; go('quiz', {unitId:'__daily__', classId:'__all__'}); });
      root.appendChild(dd);
    }
  }
  /* The generic thread hero retired here (v108/v125): once the brief named
     up to four subjects, the dupe rules meant it almost never fired — the one
     state it still served is the parked-round door above, which stays. Study
     keeps its own Pick-up-the-thread card, and the #thread home-screen
     shortcut still resolves through threadTarget(). */

  /* Coming up — school events and her own tests in one list, ordered by date.
     A Mini-Comp and a Friday maths quiz are the same kind of thing to plan
     around, so splitting them into two lists would only hide one of them. */
  const upA = upcomingAssessments(date, 21)
    /* The brief's ledger already lists this week's tests day by day; Coming up
       keeps what the ledger cannot show — events, and anything beyond Friday. */
    .filter(a => !(wk && wk.ledgerTestIds.has(a.id)))
    .map(a=>{
    const c = CLASS_BY_ID[a.classId], k = KINDS[a.kind]||KINDS.test;
    return { on:a.date, icon:k.ic, name:a.title, sub:`${c?c.name:''} · ${AZ.shortDate(a.date)}`,
             when: (dd=>dd===0?'Today':dd===1?'Tomorrow':`${dd} days`)(AZ.daysBetween(date,a.date)),
             soon: AZ.daysBetween(date,a.date)<=2, classId:a.classId,
             now: a.date === date };
  });
  const upE = upcomingEvents(date, 21).map(e=>{
    const span = evEnd(e)===e.start ? AZ.shortDate(e.start)
      : `${AZ.shortDate(e.start)} – ${AZ.shortDate(evEnd(e))}`;
    return { on:e.start, icon:e.icon, name:e.name, sub: e.note ? `${span} · ${e.note}` : span,
             when: whenLabel(date, e), soon: date>=e.start || AZ.daysBetween(date,e.start)<=2,
             now: e.start === date,
             quiet: e.kind==='early' || e.kind==='note', screen: e.screen||null };
  });
  const up = [...upA, ...upE].sort((a,b)=>a.on.localeCompare(b.on));
  if(up.length){
    root.appendChild(divider('Coming up'));
    const ac = el('div','card');
    up.slice(0,6).forEach(u=>{
      /* Today gets the rule and the tint; everything else renders plain. */
      const rc = u.classId && CLASS_BY_ID[u.classId];
      const r = el('div','row'+(u.now ? ' now' : '')+(rc ? ' subj-a' : ''));
      if(rc) r.style.setProperty('--pc', classColor(rc));
      const kk = el('span','k',`${u.icon} ${u.name}`);
      kk.appendChild(el('small',null,u.sub));
      r.appendChild(kk);
      /* Anything actionable is a door: a test opens its subject's shelf, an
         event with a screen opens that screen. */
      const clickable = u.screen || u.classId;
      r.appendChild(el('span','v'+((u.now || (u.soon && !u.quiet)) ? '' : ' plain'),
        clickable ? u.when+'  ›' : u.when));
      if(clickable){
        r.style.cursor = 'pointer';
        r.addEventListener('click',()=> u.screen ? go(u.screen) : go('unit',{classId:u.classId}));
      }
      ac.appendChild(r);
    });
    root.appendChild(ac);
  }

  /* A note from home — the parent's words, shown while they have one posted.
     Singleton record like prefs, so it syncs to her device and the newest
     edit wins. Nothing here is graded, counted or gamified; it is a sticky
     note, not a mechanic.

     Deliberately BELOW Coming up (v120), Chris's call: sitting third from the
     top it was the first thing the eye landed on and the screen ended there.
     Down here it is a reward for scrolling past the week — and the scroll is
     the point, since everything that asks something of her lives above it. */
  const pn = DATA.records['pnote'];
  if(pn && !pn.deleted && (pn.text||'').trim()){
    const pc = el('div','card pnote');
    pc.appendChild(el('div','eyebrow','A note from home'));
    pc.appendChild(el('p',null, pn.text.trim()));
    root.appendChild(pc);
  }

  /* Student hours for today — where extra help is on offer, per her planner. */
  const shrs = STUDENT_HOURS.filter(h=>h.days.includes(AZ.weekday(date)));
  if(shrs.length){
    const hc = el('div','card quiet');
    hc.appendChild(el('div','eyebrow','Student hours today'));
    shrs.forEach(h=>{
      const names = h.ids.map(id=>CLASS_BY_ID[id]?.short||id).join(' & ');
      const r = el('div','row');
      const kk = el('span','k','🕖 '+names);
      kk.appendChild(el('small',null, h.times + (h.tbd ? ' · to be confirmed' : '')));
      r.appendChild(kk);
      hc.appendChild(r);
    });
    root.appendChild(hc);
  }

  /* Tutoring today — a standing weekly appointment, not the school's. Keyed
     on the real weekday (wd), never a shown/future day, since it is not
     tied to a school day the way Student hours is. */
  const tut = TUTORING.filter(t=>t.d===wd);
  if(tut.length){
    const tc = el('div','card quiet');
    tc.appendChild(el('div','eyebrow','Tutoring today'));
    tut.forEach(t=>{
      const r = el('div','row');
      const kk = el('span','k','🧑‍🏫 Tutoring');
      kk.appendChild(el('small',null, t.times));
      r.appendChild(kk);
      tc.appendChild(r);
    });
    root.appendChild(tc);
  }

  /* Schedule — the grown-ups check this to know where she is, so it
     renders every day. On a non-school day it shows as her standing timetable
     rather than being hidden entirely. */
  const schoolDay = !weekend && !closed && date>=CAL.firstDay && date<=CAL.lastDay;
  root.appendChild(divider(schoolDay ? "Today's schedule" : 'Your school day'));
  /* FOLDED BY DEFAULT (v106), on school days too. She does not open the app
     mid-lesson, and the grown-ups' "where is she right now" need is real but
     rare — one tap serves it. What the list mostly does day to day is get her
     to a subject quickly, and the subject tiles on Study already do that. So
     the period list stops holding the screen's best space and the week ahead
     takes it instead. Nothing is removed; ctx._showTT opens it. */
  if(!ctx._showTT){
    const n = el('div','card quiet');
    /* Deliberately does NOT name the live class — the day card at the top of
       the screen already does, and saying it twice is the redundancy this
       screen keeps re-growing. */
    n.appendChild(el('p',null, date<CAL.firstDay
      ? 'This is your timetable from the first day of school onward. Same order every weekday.'
      : !schoolDay ? 'No classes today — this is your normal weekday timetable.'
      : 'Same order every weekday.'));
    const sh = el('button','btn btn-ghost btn-sm',
      schoolDay ? "Show today's periods" : 'Show the weekday timetable');
    sh.addEventListener('click',()=>{ ctx._showTT = true; render(); });
    n.appendChild(sh);
    root.appendChild(n);
  }
  /* Events still show when the timetable is folded — an event, a performance
     or a community evening is the opposite of hypothetical. */
  const foldTT = !ctx._showTT;
  /* Events for today, pinned above the periods. They are not an extra period,
     so they are painted differently rather than slotted into the timetable. */
  eventsOn(date).forEach(e=>{
    const row = el('div','evt'+(e.kind==='early'||e.kind==='note' ? ' quiet' : ''));
    row.appendChild(el('div','pchip',e.icon));
    const m = el('div','meta');
    m.appendChild(el('div','nm',e.name));
    const bits = [];
    if(evEnd(e)!==e.start) bits.push(whenLabel(date, e));
    if(e.note) bits.push(e.note);
    if(bits.length) m.appendChild(el('div','dt', bits.join(' · ')));
    row.appendChild(m);
    row.appendChild(el('div','tm', e.kind==='early' ? 'Early' : e.kind==='exam' ? 'Exam' : 'Today'));
    root.appendChild(row);
  });

  const now = AZ.nowMinutes();
  (foldTT ? [] : CLASSES).forEach(c=>{
    const live = schoolDay && now>=c.start && now<c.end;
    const cls0 = 'period'+(live?' now':'')+(schoolDay&&now>=c.end?' done':'')+(c.bookend?' bookend':'');
    /* Live period gets the full painted fill; the rest get a colour wash. */
    const p = live ? paint(el('div',cls0), c) : tint(el('div',cls0+' tinted'), c);
    p.appendChild(paint(el('div','pchip',c.icon), c));
    const m = el('div','meta');
    m.appendChild(el('div','nm',c.name));
    const er = schoolDay && earlyReleaseOn(date);
    /* Never show the usual pick-up time on an early-release day — that row is
       what a parent plans around. Until the school states the time, say so. */
    const note = (c.id==='pickup' && er)
      ? (er.dismiss || 'Early release — time not published')
      : (c.bookend ? c.note : c.break ? `Room ${c.room}` : whereLine(c));
    m.appendChild(el('div','dt', note));
    p.appendChild(m);
    if(live){
      /* How far through the period — the one number a glance at NOW wants. */
      const frac = Math.min(1, Math.max(0, (now - c.start) / (c.end - c.start)));
      const pb = el('div','pleft'), fi = el('i');
      fi.style.width = Math.round(frac*100)+'%';
      pb.appendChild(fi); m.appendChild(pb);
      p.appendChild(el('span','tag-now','NOW'));
    }
    else p.appendChild(el('div','tm',fmtTime(c.start)));
    if(!c.break) p.addEventListener('click',()=>go('unit',{classId:c.id}));
    root.appendChild(p);
  });

  /* Clubs she is SIGNED UP for that meet today — after the last bell, which
     is where they actually sit in her day. Only registered ones: a star is a
     wish and does not belong on a schedule. Folded away with the timetable on
     a day off, because a club does not meet when there is no school. */
  const todayClubs = foldTT ? [] : clubsOn(date);
  todayClubs.forEach(c=>{
    const row = el('div','evt club');
    row.appendChild(el('div','pchip','🎟️'));
    const m2 = el('div','meta');
    m2.appendChild(el('div','nm',c.nm));
    m2.appendChild(el('div','dt', 'After school' + (c.freq ? ' · '+c.freq : '')));
    row.appendChild(m2);
    row.appendChild(el('div','tm', c.time || 'After school'));
    row.addEventListener('click',()=>clubDetails(c));
    root.appendChild(row);
  });

  const ms = nextMilestone(date);
  if(ms){
    root.appendChild(divider('On the horizon'));
    const c = el('div','card');
    const r = el('div','row');
    r.appendChild(el('span','k',`${ms.icon} ${ms.name}`));
    const d = AZ.daysBetween(date, ms.date);
    r.appendChild(el('span','v', d===0?'Today':d===1?'Tomorrow':`${d} days`));
    c.appendChild(r);
    /* Only when it is a DIFFERENT fact: when the next milestone is itself the
       end of the quarter, this row restated it word for word, same number. */
    if(q && ms.date !== q.end){ const r2=el('div','row');
      r2.appendChild(el('span','k',`Quarter ${q.n} ends`));
      r2.appendChild(el('span','v plain',`${AZ.daysBetween(date,q.end)} days`)); c.appendChild(r2); }
    root.appendChild(c);
  }
};

/* ================= STUDY ================= */
SCREENS.study = function(root){
  const date = AZ.today();

  /* The morning line, with a way to say you actually read it. */
  const seen = DATA.records['affirm_'+date];
  const aff = el('div','card ac');
  aff.appendChild(el('div','eyebrow','Today'));
  const at = el('p','lede', affirmationFor(date));
  at.style.fontFamily="'Fraunces',serif"; at.style.fontSize='20px';
  at.style.lineHeight='1.38'; at.style.marginTop='8px';
  aff.appendChild(at);
  if(prefs().motto){
    const m = el('p',null,'“'+prefs().motto+'”');
    m.style.fontStyle='italic'; m.style.marginTop='12px'; m.style.fontSize='13.5px';
    aff.appendChild(m);
  }
  const acts = el('div','affirm-acts');
  /* Toggles, not one-way switches — a tap that didn't land can be taken back.
     The day's XP stays as long as EITHER action is on; undoing both takes it
     back too (no farming by re-tapping: it is the same one award). */
  const mark = (field, xp) => {
    const prev = DATA.records['affirm_'+date] || {id:'affirm_'+date, type:'affirm', date, xp:0};
    const turningOn = !prev[field];
    prev[field] = turningOn;
    const anyOn = prev.liked || prev.read;
    prev.xp = anyOn ? (prev.xp || xp) : 0;
    put(prev); checkBadges(); syncSoon();
    if(turningOn && xp && !seen) toast(`+${xp} XP`);
    render();
  };
  const heart = el('button','act'+(seen&&seen.liked?' on':''));
  heart.appendChild(el('span',null, seen&&seen.liked ? '❤️' : '🤍'));
  heart.appendChild(el('span','lb','That one lands'));
  heart.addEventListener('click',()=>mark('liked',10));
  const check = el('button','act'+(seen&&seen.read?' on':''));
  check.appendChild(el('span',null, seen&&seen.read ? '✅' : '☑️'));
  check.appendChild(el('span','lb', seen&&seen.read ? 'Read' : 'Mark as read'));
  check.addEventListener('click',()=>mark('read',10));
  acts.appendChild(heart); acts.appendChild(check);
  aff.appendChild(acts);
  if(seen && seen.xp) aff.appendChild(el('div','hintline',`+${seen.xp} XP today`));
  root.appendChild(aff);

  /* One small aim, hers. Set whenever, gone next Monday. Tracked by nothing
     except her own tap on Done — no penalty, no streak, appears nowhere else
     she sees. Self-set proximal goals beat assigned ones for commitment;
     the moment this gains a consequence it stops working, so it must not. */
  const wk = AZ.weekStart(date);
  const aim = prefs().intent;
  if(aim && aim.week === wk){
    const ac2 = el('div','card');
    ac2.appendChild(el('div','eyebrow','Your aim this week'));
    const ar2 = el('div','row');
    ar2.appendChild(el('span','k', aim.text));
    const adb = el('button','btn btn-sm '+(aim.done?'btn-primary':'btn-secondary'), aim.done?'✓ Done':'Done?');
    adb.addEventListener('click',()=>{ setPref('intent',{...aim, done:!aim.done}); render(); });
    ar2.appendChild(adb); ac2.appendChild(ar2);
    root.appendChild(ac2);
  } else {
    const aib = el('button','btn btn-ghost','◦  Set a small aim for this week');
    aib.addEventListener('click',()=>{
      showModal({ title:'One small aim',
        message:'Pick something you can actually finish — two quiz rounds, or clearing your review list twice. Yours, no one else\'s.',
        confirmText:'Set it', cancelText:'Not now',
        build:(box)=>{ const inp = el('input'); inp.type='text'; inp.id='intent-in';
          inp.placeholder='e.g. Clear the Growth Zone twice'; inp.maxLength = 80; box.appendChild(inp); },
        onConfirm:()=>{ const v = document.getElementById('intent-in');
          const t = (v && v.value.trim()) || '';
          if(!t){ toast('Needs a few words first'); return; }
          setPref('intent',{text:t, week:wk, done:false}); toast('Yours for the week'); } });
    });
    root.appendChild(aib);
  }

  /* The companion's perch: one line for the day, deterministic so it does not
     reshuffle on every render. It fronts what the screen already knows —
     due reviews first, then the top of the study plan, else a quiet line. */
  const comp = companionOf();
  if(comp){
    const dueN = dueMisses().length;
    const topPlan = studyPlan(date)[0];
    let line, dest = null;
    if(dueN){
      line = dueN===1 ? 'One question cycled back today. Clearing it now is what stops it coming back.'
        : `${dueN} questions cycled back today. Clearing them now is what stops them coming back.`;
      dest = ()=>go('growth');
    } else if(topPlan){
      const pc2 = CLASS_BY_ID[topPlan.classId];
      line = `${pc2.name} could use ${topPlan.minutes} minutes today — ${topPlan.why}.`;
      dest = ()=>go('unit',{classId:topPlan.classId});
    } else {
      const seed = date.split('-').reduce((a,b)=>a+ +b, 0);
      const idle = companionPool('idle', comp);
      /* Her own line (Settings) joins the idle rotation — her words, her voice,
         so the curation rules do not apply to it. */
      const mine = (prefs().mline||'').trim();
      const pool = mine ? idle.concat(mine) : idle;
      line = pool[seed % pool.length];
    }
    const perch = companionSays(line, comp);
    if(dest){ perch.classList.add('tap'); perch.addEventListener('click',dest); }
    root.appendChild(perch);
  }

  /* One tap back into the work — due reviews first, else her open lesson. */
  const th = threadTarget(date);
  if(th){
    root.appendChild(divider('Pick up the thread'));
    const hero = cardButton(th.title, th.sub, th.go);
    hero.classList.add('hero');
    root.appendChild(hero);
  }

  /* What to study — moved here from Today */
  const plan = studyPlan(date);
  if(plan.length){
    root.appendChild(divider('What to study today'));
    plan.forEach(p=>{
      const c = CLASS_BY_ID[p.classId];
      const d = el('div','plan'); d.style.setProperty('--pc',classColor(c));
      const hd = el('div','hd');
      hd.appendChild(el('span','nm',`${c.icon} ${c.name}`));
      hd.appendChild(el('span','mins',`${p.minutes} min`));
      d.appendChild(hd);
      d.appendChild(el('div','why', p.why));
      d.addEventListener('click',()=>go('unit',{classId:p.classId}));
      root.appendChild(d);
      /* Test week: the plan offers the mixed round itself, not just the door
         to the subject. Same rules as any shuffle round — untimed, no check-in. */
      if(p.ramp){
        const sh = el('button','btn btn-secondary','🔀  Mixed round — all ' + (c.short||c.name) + ' units');
        sh.addEventListener('click',()=>{
          if(buildShuffleUnit(p.classId)) go('quiz',{unitId:'__shuffle__', classId:p.classId});
          else go('unit',{classId:p.classId});
        });
        root.appendChild(sh);
      }
    });
  }

  root.appendChild(divider('Your subjects'));
  const g = el('div','grid');
  STUDY_CLASSES.forEach(c=>{
    const n = units(c.id).length, st = classStats(c.id);
    const goal = prefs().goals[c.id];
    const wk = goal ? minutesInRange(AZ.weekStart(date), date, c.id) : null;
    const t = paint(el('button','tile'), c);
    t.appendChild(el('span','ic',c.icon));
    t.appendChild(el('span','nm',c.name));
    t.appendChild(el('span','ct', goal ? `${wk}/${goal} min this week`
      : n===0 ? 'No units yet' : `${n} unit${n>1?'s':''}${st.accuracy!==null?` · ${st.accuracy}%`:''}`));
    t.addEventListener('click',()=>go('unit',{classId:c.id}));
    g.appendChild(t);
  });
  root.appendChild(g);

  /* Whole-card buttons rather than a card with a button inside it. */
  root.appendChild(divider('Tools'));
  /* Reading first — it is the nightly one. */
  root.appendChild(cardButton('Reading log',
    'Any book counts — log the minutes, grow the shelf.',
    ()=>go('reading')));
  const totalFocus = stats().focusMin;
  root.appendChild(cardButton('Timer',
    totalFocus ? `Focused study in blocks. ${totalFocus} minutes so far.`
               : 'Focused study in blocks, with breaks. Phone face down.',
    ()=>go('focus',{})));
  root.appendChild(cardButton('Tutor',
    'Ask about anything you are stuck on, and get advice based on how your studying is actually going.',
    ()=>go('tutor')));
  root.appendChild(cardButton('New study set',
    'Turn class notes into flashcards and quiz questions.',
    ()=>go('generate',{})));
};

/* ================= UNIT LIST ================= */
SCREENS.unit = function(root){
  const c = CLASS_BY_ID[ctx.classId];
  if(!c) return go('study');
  const st = classStats(c.id), date = AZ.today();
  const head = el('div','card ac');
  /* Extracurriculars have no period on the timetable — no start time, no
     room — so the eyebrow says what kind of subject this is instead of
     lying with fmtTime(undefined). */
  head.appendChild(el('div','eyebrow', c.extracurricular ? 'Extracurricular' : `${fmtTime(c.start)} · ${whereLine(c)}`));
  const hrow = el('div','crestrow');
  const cr = el('span','crest');
  cr.style.setProperty('--c1', palOf(c).g1); cr.style.setProperty('--c2', palOf(c).g2);
  cr.appendChild(el('span',null,c.icon));
  hrow.appendChild(cr); hrow.appendChild(el('h2',null,c.name));
  head.appendChild(hrow);
  head.appendChild(el('p',null, st.answered
    ? `${st.sessions} session${st.sessions>1?'s':''} · ${st.answered} questions · ${st.accuracy}% · ${st.minutes} min`
    : 'No study sessions logged yet.'));
  const hrsAll = hoursForAll(c.id);
  if(hrsAll.length) head.appendChild(el('div','hintline',
    `🕖 Student hours: ${hrsAll.map(h=>`${h.label} ${h.times}${h.tbd?' (to be confirmed)':''}`).join(' · ')} — extra help from your teacher, open to anyone.`));
  root.appendChild(head);

  const goal = prefs().goals[c.id];
  if(goal){
    const wk = minutesInRange(AZ.weekStart(date), date, c.id);
    const gc = el('div','card');
    const r = el('div','row');
    r.appendChild(el('span','k','This week'));
    r.appendChild(el('span','v', `${wk} / ${goal} min`));
    gc.appendChild(r);
    const bar = el('div','bar'), fi = el('i');
    fi.style.width = Math.min(100, wk/goal*100)+'%'; bar.appendChild(fi); gc.appendChild(bar);
    root.appendChild(gc);
  }

  const up = assessments().filter(a=>a.classId===c.id && a.date>=date);
  if(up.length){
    const ac = el('div','card');
    up.slice(0,3).forEach(a=>{
      const k = KINDS[a.kind]||KINDS.test, d = AZ.daysBetween(date,a.date);
      const r = el('div','row');
      const kk = el('span','k',`${k.ic} ${a.title}`);
      kk.appendChild(el('small',null,AZ.shortDate(a.date)));
      r.appendChild(kk);
      r.appendChild(el('span','v'+(d<=2?'':' plain'), d===0?'Today':`${d} days`));
      ac.appendChild(r);
    });
    root.appendChild(ac);
  }

  const list = units(c.id);
  if(!list.length){
    const e = el('div','empty');
    e.appendChild(emptyScene());
    e.appendChild(el('p',null,'No units yet for this class. Generate one from notes, or drop the material in the Drive folder and ask Claude to build it.'));
    root.appendChild(e);
  } else {
    const grouped = shelvesFor(c.id);
    if(grouped.shelves.length){
      root.appendChild(divider('Your bookshelf'));
      /* The ribbon marks the book she is in the middle of: the most recently
         touched shelf that still has unfinished lessons. */
      const cur = grouped.shelves.find(s => s.last > 0 && s.units.some(u=>!unitDone(u)));
      const sh = el('div','shelf');
      grouped.shelves.forEach(s => sh.appendChild(spineEl(s, c, s === cur)));
      root.appendChild(sh);
      root.appendChild(el('div','shelfboard'));
    }
    if(grouped.loose.length){
      root.appendChild(divider(grouped.shelves.length ? 'More units' : 'Units'));
      /* Her own deck is not a loose unit — it has its own card below, and
         unitCard would offer a quiz it cannot hold. */
      grouped.loose.filter(u => !u.own).forEach(u => root.appendChild(unitCard(u, c)));
    }
  }
  const waiting = drafts().filter(u=>u.classId===c.id).length;
  if(waiting) root.appendChild(el('div','hintline',
    waiting===1 ? 'One unit is waiting for a grown-up to check it.'
                : `${waiting} units are waiting for a grown-up to check them.`));

  /* Her own cards — her words, so no review queue (see SCREENS.owncards).
     Only shown loose here when the deck is NOT filed in a book; once it is,
     the book is where it lives and showing it twice would be the same
     redundancy the rest of this screen keeps pruning. */
  const own = ownDeck(c.id);
  if(own && own.cards.length && !seriesOf(own)){
    root.appendChild(divider('Your own cards'));
    root.appendChild(ownCardsCard(own, c));
  }

  /* Interleaving: one round drawn from everything in this subject. Only
     offered once there are two units to mix — and it skips the check-in,
     like review, because it is meant to be a frequent habit. */
  if(units(c.id).filter(u2=>u2.questions.length).length >= 2){
    const shb = el('button','btn btn-secondary','🔀  Shuffle round — a mix of everything');
    shb.addEventListener('click',()=>{
      if(buildShuffleUnit(c.id)) go('quiz',{unitId:'__shuffle__', classId:c.id});
    });
    root.appendChild(shb);
  }
  if(CALC_CLASSES.has(c.id)){
    const cb = el('button','btn btn-secondary','🧮  Calculator');
    cb.addEventListener('click',openCalc); root.appendChild(cb);
  }
  if(SHEETS[c.id]){
    const fsb = el('button','btn btn-secondary', SHEETS[c.id].ic+'  '+SHEETS[c.id].nm);
    fsb.addEventListener('click',()=>openSheet(c.id)); root.appendChild(fsb);
    /* A rubric can be walked, not just read. */
    if(SHEETS[c.id].rubric){
      const scb = el('button','btn btn-secondary','✓  Check my work against it');
      scb.addEventListener('click',()=>go('selfcheck',{classId:c.id}));
      root.appendChild(scb);
    }
  }
  {
    /* Always a door to the editor: once the deck is filed in a book, this is
       the only way back to it from the subject screen. */
    const mkb = el('button','btn btn-secondary',
      own && own.cards.length ? '✍️  Your own flashcards' : '✍️  Make your own flashcards');
    mkb.addEventListener('click', ()=> go('owncards',{classId: c.id}));
    root.appendChild(mkb);
  }
  const fb = el('button','btn btn-secondary','🍅  Focus session for '+c.short);
  fb.addEventListener('click',()=>go('focus',{classId:c.id})); root.appendChild(fb);
  const gen = el('button','btn btn-ghost','✨  Generate a unit for '+c.short);
  gen.addEventListener('click',()=>go('generate',{classId:c.id})); root.appendChild(gen);
  const back = el('button','btn btn-ghost','← All subjects');
  back.addEventListener('click',()=>go('study')); root.appendChild(back);
};

/* One unit's full card — title, pills, briefing link, study buttons. Shared by
   the subject screen (loose units) and the shelf screen (the open lesson). */
/* ---------- Mode tiles ----------
   Inline SVG so the drawings ship inside the single file and inherit the
   subject accent via currentColor. createElementNS is the house-approved
   path for SVG (renderGraph set the precedent). */
function modeSVG(kind){
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 64 48'); svg.setAttribute('aria-hidden','true');
  const add = (tag, attrs, cls)=>{ const n = document.createElementNS(NS, tag);
    for(const [k,v] of Object.entries(attrs)) n.setAttribute(k, v);
    if(cls) n.setAttribute('class', cls); svg.appendChild(n); return n; };
  const S = {fill:'none', stroke:'currentColor', 'stroke-width':'2.4',
             'stroke-linecap':'round', 'stroke-linejoin':'round'};
  if(kind === 'cards'){
    add('rect',{...S, x:8,  y:10, width:24, height:32, rx:4, opacity:.4,  transform:'rotate(-10 20 26)'});
    add('rect',{...S, x:17, y:8,  width:24, height:32, rx:4, opacity:.65, transform:'rotate(-2 29 24)'});
    add('rect',{...S, x:27, y:7,  width:24, height:32, rx:4, fill:'var(--ac-8)', transform:'rotate(7 39 23)'});
    add('path',{...S, 'stroke-width':'2', transform:'rotate(7 39 23)',
      d:'M39 17l1.8 3.6 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z'});
  } else if(kind === 'quiz'){
    add('rect',{...S, x:14, y:4, width:36, height:40, rx:5});
    add('circle',{...S, 'stroke-width':'2', cx:22, cy:14, r:3.2});
    add('line',{...S, 'stroke-width':'2', x1:30, y1:14, x2:44, y2:14, opacity:.45});
    add('circle',{...S, 'stroke-width':'2', cx:22, cy:24, r:3.2, fill:'currentColor'});
    add('path',{fill:'none', stroke:'var(--surface)', 'stroke-width':'1.6',
      'stroke-linecap':'round', 'stroke-linejoin':'round', d:'M20.7 24l1 1.1 1.8-2.2'});
    add('line',{...S, 'stroke-width':'2', x1:30, y1:24, x2:44, y2:24});
    add('circle',{...S, 'stroke-width':'2', cx:22, cy:34, r:3.2});
    add('line',{...S, 'stroke-width':'2', x1:30, y1:34, x2:44, y2:34, opacity:.45});
  } else {
    add('line',{...S, x1:4, y1:16, x2:16, y2:16, opacity:.35});
    add('line',{...S, x1:1, y1:24, x2:14, y2:24, opacity:.6});
    add('line',{...S, x1:6, y1:32, x2:18, y2:32, opacity:.35});
    add('line',{...S, x1:35, y1:5, x2:43, y2:5});
    add('line',{...S, x1:39, y1:5, x2:39, y2:9});
    add('circle',{...S, cx:39, cy:26, r:15});
    add('line',{...S, 'stroke-width':'2.2', x1:39, y1:26, x2:39, y2:16}, 'mhand');
    add('line',{...S, 'stroke-width':'2.2', x1:39, y1:26, x2:46, y2:30});
  }
  return svg;
}
function modeTile(kind, label, sub, fn){
  const b = el('button','mtile');
  b.appendChild(modeSVG(kind));
  b.appendChild(el('span', null, label));
  if(sub) b.appendChild(el('small', null, sub));
  b.addEventListener('click', fn);
  return b;
}
function unitCard(u, c, label){
  /* Test prep stands out (Chris, 2026-08). `prep:true` is an explicit content
     flag, never inferred; a paper guide is test prep by definition, so guides
     get the treatment without re-shipping their files. */
  const isPrep = !!(u.guide || u.prep);
  const card = el('div','card' + (isPrep ? ' prepcard' : ''));
  if(isPrep){
    const band = el('div','prepband');
    band.appendChild(el('span','pb-ic','✍️'));
    band.appendChild(el('span',null,'Test prep'));
    card.appendChild(band);
  }
  card.appendChild(el('h3',null, label || u.title));
  const bits = el('div');
  bits.appendChild(el('span','pill',`${u.cards.length} cards`));
  bits.appendChild(el('span','pill', u.questions.length
    ? `${u.questions.length} questions · ${(u.round||QUIZ_ROUND)>=u.questions.length?'one sitting':'rounds of '+Math.min(u.round||QUIZ_ROUND,u.questions.length)}`
    : 'reference only'));
  if(u.nextUp && u.nextUp.minutes) bits.appendChild(el('span','pill',`~${u.nextUp.minutes} min`));
  if(u.source) bits.appendChild(el('span','pill',u.source));
  card.appendChild(bits);
  if(u.srcName) card.appendChild(el('div','cite',`From ${u.srcName}`));
  if(u.summary && u.summary.text){
    const ov = el('button','btn btn-ghost','📖  What this covers');
    ov.style.marginTop='10px';
    ov.addEventListener('click',()=>go('brief',{unitId:u.id,classId:c.id}));
    card.appendChild(ov);
  }
  /* A paper guide gets its own two doors instead of the usual mode tiles: the
     modes are different enough in kind that an icon and two words would not
     carry the difference. */
  if(u.guide){
    const ans = guidePass(u.id).answers || {};
    const entered = Object.keys(ans).length;
    const door = (ic, title, sub, fn) => {
      const b = el('button','door');
      b.appendChild(el('span','dn', ic));
      const db = el('span','db');
      db.appendChild(el('b',null,title));
      db.appendChild(el('small',null,sub));
      b.appendChild(db);
      b.addEventListener('click', fn);
      return b;
    };
    card.appendChild(door('📝','I did it on paper',
      entered ? entered+' of '+u.questions.length+' answers entered — pick up where you left off'
              : 'Enter the answers you wrote, and it marks them and walks you through the misses',
      ()=>go('guideentry',{unitId:u.id, classId:c.id})));
    card.appendChild(door('✍️','Work it here',
      'Every question in order, the same letters as the printout. Your place is saved if you stop.',
      ()=>go('quiz',{unitId:u.id, classId:c.id, guideMode:'work'})));
    if(guidePass(u.id).submitted)
      card.appendChild(door('🔁','See how it went',
        'Your marked pass, the misses, and a second go at them',
        ()=>go('guidewalk',{unitId:u.id, classId:c.id})));
    card.appendChild(modeTile('cards','Flashcards','flip & check',
      ()=>go('cards',{unitId:u.id, classId:c.id})));
    return card;
  }
  /* A unit with no questions (a pure reference deck, like the ASL alphabet —
     an image can teach a static handshape safely, but there is nothing a
     multiple-choice quiz can honestly test) offers only Flashcards. Real
     content never ships with zero questions otherwise, so this never hides
     a door a normal unit needs. */
  const row = el('div','mrow'+(!u.book && u.questions.length ?' three':''));
  row.appendChild(modeTile('cards','Flashcards','flip & check',()=>go('cards',{unitId:u.id,classId:c.id})));
  if(u.questions.length){
    row.appendChild(modeTile('quiz','Quiz','prove it',()=>launchQuiz(u.id,c.id,false)));
    if(!u.book){
      /* Book-companion units never race a clock — speed-reading a novel
         quiz teaches exactly the wrong thing. */
      row.appendChild(modeTile('clock','Beat the clock','race your pace',()=>launchQuiz(u.id,c.id,true)));
    }
  }
  card.appendChild(row);
  /* Match — pairs on any deck with enough matchable cards. Same weight as
     Star sky's door: a secondary button under the three tiles, never a
     fourth tile (the row is measured for three). */
  if(matchCards(u).length >= 4){
    const mb = el('button','btn btn-secondary','🃏  Match — pair the cards');
    mb.addEventListener('click',()=>{ matchState = null; go('match',{unitId:u.id, classId:c.id}); });
    card.appendChild(mb);
  }
  /* River's game, offered where it fits: vocabulary shelves built from single
     words. Other units keep their three doors — a physics question is not a
     word you can say. */
  /* Latin joined at Chris's request (v118 / Wayfinder v96): the gate is
     content-shaped, not class-shaped — the game needs enough single sayable
     words. 'Latin I · Pronunciation & Greetings' (multi-word guide cards)
     rightly stays out while Unit 1's case names qualify. */
  if(skyCards(u).length >= 6 && (/wordly wise/i.test(u.title) || u.classId === 'latin' || c.id === 'latin')){
    const sk = el('button','btn btn-secondary','🌌  Star sky — say the words');
    sk.addEventListener('click',()=>{ skyState = null; go('starsky',{unitId:u.id, classId:c.id}); });
    card.appendChild(sk);
  }
  return card;
}

/* A book spine on the shelf: a solid colour picked by a stable hash of the
   series name — the palette deep, darkened 15% so white labels always clear
   4.5:1 (worst case 5.37:1, measured). Deliberately no subject texture. */
function spineEl(s, c, current){
  const t = el('button','spine');
  const pal = SUBJECT_PALETTE[hashStr(s.name) % SUBJECT_PALETTE.length];
  const rgb = [1,3,5].map(i => Math.round(parseInt(pal.g2.slice(i,i+2),16) * 0.85));
  t.style.backgroundColor = `rgb(${rgb.join(',')})`;
  /* Books on a real shelf aren't all the same height. */
  t.style.height = (142 + (hashStr(s.name+'#') % 3) * 9) + 'px';
  if(current) t.appendChild(el('span','ribbon'));
  t.appendChild(el('span','snm', s.name));
  const lessons = s.lessons || s.units;
  const done = lessons.filter(unitDone).length;
  /* A finished book gets a gilt title — quiet state, not currency. Her own
     deck is not counted, so filing cards in a book can never un-gild it. */
  if(lessons.length && done === lessons.length) t.classList.add('gilt');
  t.appendChild(el('span','sct', `${done}/${lessons.length}`));
  t.setAttribute('aria-label', `${s.name} — ${done} of ${lessons.length} lessons finished`);
  t.addEventListener('click', ()=>go('shelf',{classId:c.id, series:s.name}));
  return t;
}

/* ================= A BOOK OFF THE SHELF ================= */
/* The series' table of contents: one row per lesson, the bookmarked lesson
   open as a full card. Rows show coverage, never scores — and nothing is
   locked; any row opens with a tap. */
SCREENS.shelf = function(root){
  const c = CLASS_BY_ID[ctx.classId];
  const grouped = c ? shelvesFor(c.id) : null;
  const s = grouped && grouped.shelves.find(x => x.name === ctx.series);
  if(!s) return go(c ? 'unit' : 'study', c ? {classId:c.id} : undefined);
  const lessons = s.lessons || s.units;
  const done = lessons.filter(unitDone).length;

  const head = el('div','card ac');
  head.appendChild(el('div','eyebrow', `${c.icon} ${c.name}`));
  head.appendChild(el('h2',null, `📖 ${s.name}`));
  head.appendChild(el('p',null,
    lessons.length && done === lessons.length
      ? `All ${lessons.length} lesson${lessons.length>1?'s':''} finished. Anything you reopen from here is pure review.`
      : `${done} of ${lessons.length} lesson${lessons.length>1?'s':''} finished · your bookmark is on “${lessonLabel(s.mark)}”.`));
  root.appendChild(head);

  root.appendChild(divider('The map'));
  const openId = ctx.open || s.mark.id;
  /* The map IS the contents — one spine, not a path above a duplicate list.
     The lesson she taps opens below it rather than replacing a stop, so the
     path stays whole while she reads. */
  root.appendChild(topicMap(s.units, s.mark, openId, id => {
    ctx.open = id; render();
    /* The opened card sits below the whole map — off-screen on any topic with
       more than a few lessons, so a tap used to look like it did nothing and
       the wrong lesson could be opened without anyone noticing. Bring the card
       to her instead of making her go find it. */
    requestAnimationFrame(()=>{
      const oc = document.getElementById('shelfopen');
      if(oc) oc.scrollIntoView({
        behavior: matchMedia('(prefers-reduced-motion: no-preference)').matches ? 'smooth' : 'auto',
        block:'start' });

  }));
  const crest = crestEl(s.name, s.units);
  if(crest) root.appendChild(crest);
  const open = s.units.find(u => u.id === openId) || s.units[0];
  /* unitCard would offer a quiz her deck cannot hold — same trap the loose
     list hit. Her stop opens her own two doors instead. */
  if(open){
    const oc = open.own ? ownCardsCard(open, c) : unitCard(open, c, lessonLabel(open));
    oc.id = 'shelfopen';
    oc.style.scrollMarginTop = '10px';
    root.appendChild(oc);
  }

  const back = el('button','btn btn-ghost','← ' + c.name);
  back.addEventListener('click',()=>go('unit',{classId:c.id}));
  root.appendChild(back);
};

/* ================= MATCH ================= */
/* Memory match on any deck: terms and definitions face down, find the pairs.
   Rules that are the point:
   - No new record types. One ordinary log (mode:'match') updated in place as
     pairs land, so leaving early keeps her minutes and XP — Star sky's rule.
   - A wrong flip is nothing. The tiles turn back; no penalty, no count of
     misses on screen. Flips are logged for the parent's day view only as a
     number, never as a verdict.
   - XP is flat per pair (MATCH_XP), the same order as a flashcard run, and
     there is no speed bonus — racing a memory game teaches nothing.
   - The set is date-seeded: the same six pairs all day, a fresh six tomorrow,
     nothing stored. "Play again" re-seeds within the day.
   - Ponder cards and picture-only cards (the ASL alphabet) are skipped: a
     prompt is not a definition, and you cannot match a picture to text.
   - The def tile shows the def's bold lead only — the study answer — so the
     match is term ↔ meaning, not term ↔ paragraph. */
let matchState = null;
const MATCH_PAIRS = 6, MATCH_XP = 4;
/* FNV-1a, not hashStr. hashStr is a polynomial roll: change the seed in
   front of a card id and EVERY key moves by the same constant, so the
   relative order never changes — the first build dealt the same six for
   every salt, and consecutive ids at that. xor-multiply mixes the seed
   into every later character. */
const mixHash = s => { let h = 2166136261; for(const ch of String(s)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
function matchCards(u){
  return (u.cards||[]).filter(c => c.term && c.def && !/^ponder/i.test(String(c.term)) && !c.imgUrl);
}
function matchLead(def){
  const m = String(def).match(/\*\*(.+?)\*\*/);
  let t = (m ? m[1] : String(def).split('\n')[0]).replace(/\*\*/g,'').trim();
  return t.length > 90 ? t.slice(0,87).replace(/\s+\S*$/,'') + '…' : t;
}
function matchLog(u){
  const found = matchState.found.length;
  if(!found) return;
  matchState.logId = matchState.logId || uid('log');
  put({ id:matchState.logId, type:'log', mode:'match', classId:ctx.classId, unitId:u.id,
        date:AZ.today(), at:matchState.start, correct:found, total:matchState.pairs.length,
        seconds:Math.round((Date.now()-matchState.start)/1000), xp:found*MATCH_XP,
        hints:0, flips:matchState.flips });
}
function matchDeal(u, salt){
  const pool = matchCards(u);
  const seed = hashStr(u.id + AZ.today() + ':' + (salt||0));
  const order = pool.map(c => ({c, k: mixHash(seed + ':' + c.id)})).sort((a,b)=>a.k-b.k).map(x=>x.c);
  const pairs = order.slice(0, Math.min(MATCH_PAIRS, order.length));
  const tiles = [];
  pairs.forEach(c => { tiles.push({id:c.id, side:'t', text:c.term}); tiles.push({id:c.id, side:'d', text:matchLead(c.def)}); });
  matchState = { unitId:u.id, salt:salt||0, pairs, tiles:shuffle(tiles), up:[], found:[],
                 flips:0, start:Date.now(), logId:null, lock:false };
}
SCREENS.match = function(root){
  const u = unitFor(ctx.unitId);
  if(!u || matchCards(u).length < 2) return go('unit',{classId:ctx.classId});
  if(!matchState || matchState.unitId !== u.id) matchDeal(u, 0);
  const st = matchState, done = st.found.length === st.pairs.length;

  const head = el('div','card');
  head.appendChild(el('div','eyebrow', u.title + ' · Match'));
  const hr = el('div','row');
  hr.appendChild(el('span','k', done ? 'Every pair found' : 'Turn two tiles. Match a word to its meaning.'));
  hr.appendChild(el('span','v', st.found.length + ' of ' + st.pairs.length));
  head.appendChild(hr);
  root.appendChild(head);

  const grid = el('div','mgrid');
  st.tiles.forEach((t, i) => {
    const isUp = st.up.includes(i), isDone = st.found.includes(t.id);
    const b = el('button','mt' + (isDone ? ' done' : isUp ? ' up' : '') + (t.side==='t' ? ' t' : ''));
    if(isUp || isDone){ b.appendChild(el('span','txt', t.text)); }
    else b.appendChild(el('span','pip','✦'));
    b.setAttribute('aria-label', (isUp||isDone) ? t.text : 'Face-down tile');
    if(isDone) b.disabled = true;
    b.addEventListener('click', ()=>{
      if(st.lock || isUp || isDone) return;
      st.up.push(i);
      if(st.up.length === 2){
        st.flips++;
        const [a, c] = st.up.map(k => st.tiles[k]);
        if(a.id === c.id && a.side !== c.side){
          st.found.push(a.id); st.up = [];
          /* The right-answer buzz, scaled down — a miss gets nothing. */
          if(navigator.vibrate) navigator.vibrate([12,40,12]);
          matchLog(u);
          if(st.found.length === st.pairs.length){ checkBadges(); syncSoon(); celebrate(); }
          render();
        } else {
          st.lock = true; render();
          setTimeout(()=>{ if(matchState !== st) return; st.up = []; st.lock = false; render(); }, 750);
        }
      } else render();
    });
    grid.appendChild(b);
  });
  root.appendChild(grid);

  if(done){
    const c = el('div','card ac');
    c.appendChild(el('h2',null, "That's every pair"));
    const t = el('div','tally');
    const chip = (n, rest) => { const s = el('span'); s.appendChild(el('b',null,String(n))); s.appendChild(document.createTextNode(rest)); t.appendChild(s); };
    chip(st.pairs.length, ' pairs'); chip(st.flips, ' turns');
    const secs = Math.round((Date.now()-st.start)/1000);
    chip(secs < 90 ? secs : Math.round(secs/60), secs < 90 ? ' sec' : ' min');
    chip('+'+(st.found.length*MATCH_XP), ' XP');
    c.appendChild(t);
    /* The fewest turns possible is one per pair; the number is information
       about the set, not a grade on her. */
    c.appendChild(el('p',null, st.flips === st.pairs.length
      ? 'Every turn a match. Nothing left to learn from this six.'
      : 'Matching terms to meanings is recognition. The quiz is where you find out what actually stuck.'));
    /* A deck with more than six matchable cards deals a different six; a
       deck of exactly six can only shuffle their places — say which. */
    const again = el('button','btn btn-primary', matchCards(u).length > MATCH_PAIRS
      ? 'Play again · a fresh six' : 'Play again · same pairs, new places');
    again.addEventListener('click',()=>{ matchDeal(u, st.salt + 1); render(); });
    c.appendChild(again);
    if(u.questions.length){
      const q = el('button','btn btn-secondary','Take the quiz');
      q.addEventListener('click',()=>{ matchState = null; launchQuiz(u.id, ctx.classId, false); });
      c.appendChild(q);
    }
    root.appendChild(c);
  }
  const leave = el('button','btn btn-ghost', done ? '← Back' : '← Leave — pairs found so far still count');
  leave.addEventListener('click',()=>{ matchLog(u); matchState = null; go('unit',{classId:ctx.classId}); });
  root.appendChild(leave);
};

/* ================= FLASHCARDS ================= */
let cardState = {start:0};
/* Card definitions render line by line, so the lead answer and each further
   meaning sit visibly apart instead of stacking into one block. */
function defEl(text){
  const d = el('div','def');
  String(text||'').split('\n').forEach(line=>{
    if(!line.trim()) return;
    d.appendChild(richify(el('div','defline'), line));
  });
  return d;
}

/* ---- Her own cards (v110 / Ad Astra v127) ----
   One deck per subject that she writes herself, card by card. Rules that are
   the point:
   - HER OWN WORDS SKIP THE REVIEW QUEUE. The draft gate exists to catch what
     the MODEL got wrong before it reaches her; these are her words, like the
     weekly aim, the motto and the teach-backs, and gating them behind a
     grown-up would turn making flashcards into being checked on.
   - Making a card earns nothing. Writing a card IS studying — deciding what
     matters and saying it in your own words is generation practice, the
     strongest encoding there is — and pricing it would cheapen it. Reviewing
     the deck earns ordinary flashcard XP like any other deck.
   - The deck is a real unit record (deterministic id, so two devices can
     never mint duplicates), which means sync, the day view and the reading
     of minutes all work for free. `own:true` keeps it out of every door
     that needs questions: no quiz tile, no clock, no shuffle, no brief row —
     all of those already guard on questions.length. */
/* Her deck's card — used on the subject screen when the deck is loose, and
   inside the book when she has filed it there. */
function ownCardsCard(deck, c){
  const oc = el('div','card');
  oc.appendChild(el('h3',null, deck.title));
  oc.appendChild(el('p',null, deck.cards.length + (deck.cards.length===1 ? ' card' : ' cards') + ', written by you.'));
  const rb = el('button','btn btn-secondary','🃏  Review your cards');
  rb.addEventListener('click', ()=> go('cards',{unitId: deck.id, classId: c.id}));
  oc.appendChild(rb);
  const ebb = el('button','btn btn-ghost','✍️  Add or edit');
  ebb.addEventListener('click', ()=> go('owncards',{classId: c.id}));
  oc.appendChild(ebb);
  return oc;
}
const ownDeckId = cid => 'unit-own-' + cid;
const ownDeck = cid => { const r = DATA.records[ownDeckId(cid)]; return (r && !r.deleted) ? r : null; };

SCREENS.owncards = function(root){
  const c = CLASS_BY_ID[ctx.classId];
  if(!c) return go('study');
  const deck = ownDeck(c.id);
  const cards = deck ? deck.cards : [];
  const editing = ctx._ocEdit ? cards.find(k => k.id === ctx._ocEdit) : null;

  const head = el('div','card ac');
  head.appendChild(el('div','eyebrow', c.name + ' · Your own cards'));
  head.appendChild(el('h2',null, editing ? 'Edit this card' : 'Make a card'));
  head.appendChild(el('p',null, 'Writing a card is studying: you decide what matters and say it in your own words. The app never grades these — they are yours.'));

  const lt = el('label',null,'Front — the word or question'); head.appendChild(lt);
  const ti = el('input'); ti.type='text'; ti.autocomplete='off';
  ti.placeholder = 'e.g. Nominative';
  ti.value = editing ? editing.term : '';
  head.appendChild(ti);
  const ld = el('label',null,'Back — the answer'); head.appendChild(ld);
  const ta = el('textarea');
  ta.placeholder = 'What you want to remember, in your words.';
  ta.value = editing ? editing.def : '';
  head.appendChild(ta);
  const lh = el('label',null,'Hint (optional)'); head.appendChild(lh);
  const hi = el('input'); hi.type='text'; hi.autocomplete='off';
  hi.placeholder = 'A memory hook, not the answer.';
  hi.value = editing && editing.hint ? editing.hint : '';
  head.appendChild(hi);

  /* Which book this deck lives in. Her cards for a Wordly Wise lesson belong
     ON the Wordly Wise shelf, where she goes to study it — the deck carries
     `series`, which seriesOf() honours over the title convention, so nothing
     is renamed. Only offered once there is a book to file it in. */
  const books = [...new Set(units(c.id).filter(u2 => !u2.own)
    .map(seriesOf).filter(Boolean))].sort();
  let sel = null;
  if(books.length){
    head.appendChild(el('label',null,'Keep these cards'));
    sel = el('select');
    const o0 = el('option',null,'On their own'); o0.value = ''; sel.appendChild(o0);
    books.forEach(b => { const o = el('option',null,'In “' + b + '”'); o.value = b; sel.appendChild(o); });
    sel.value = (deck && deck.series) || '';
    head.appendChild(sel);
  }

  const saveB = el('button','btn btn-primary', editing ? 'Save the change' : 'Add the card');
  saveB.addEventListener('click', () => {
    const term = ti.value.trim(), def = ta.value.trim(), hint = hi.value.trim();
    if(!term || !def){ toast('A card needs both sides.'); return; }
    let d = ownDeck(c.id);
    if(!d) d = { id: ownDeckId(c.id), type:'unit', classId:c.id, own:true, status:'approved',
                 title:'My ' + (c.short || c.name) + ' cards', cards:[], questions:[] };
    if(editing){
      editing.term = term; editing.def = def;
      if(hint) editing.hint = hint; else delete editing.hint;
    } else {
      d.cards.push(Object.assign({id:uid('oc'), term, def}, hint ? {hint} : {}));
    }
    if(sel){ if(sel.value) d.series = sel.value; else delete d.series; }
    put(d); syncSoon();
    ctx._ocEdit = null;
    toast(editing ? 'Saved.' : d.cards.length === 1 ? 'Your first card.' : d.cards.length + ' cards now.');
    render();
  });
  head.appendChild(saveB);
  if(editing){
    const cancelB = el('button','btn btn-ghost','Stop editing');
    cancelB.addEventListener('click', ()=>{ ctx._ocEdit = null; render(); });
    head.appendChild(cancelB);
  }
  root.appendChild(head);

  if(cards.length && sel){
    /* Filing is a property of the DECK, not of the card being written, so it
       can be changed without adding one. */
    const fb2 = el('button','btn btn-ghost','📖  Save where these are kept');
    fb2.addEventListener('click', ()=>{
      const d = ownDeck(c.id); if(!d) return;
      if(sel.value) d.series = sel.value; else delete d.series;
      put(d); syncSoon();
      toast(sel.value ? 'Filed in “' + sel.value + '”.' : 'Kept on their own.');
      render();
    });
    root.appendChild(fb2);
  }
  if(cards.length){
    root.appendChild(divider(cards.length === 1 ? 'Your card' : 'Your ' + cards.length + ' cards'));
    const rv = el('button','btn btn-secondary','🃏  Review these as flashcards');
    rv.addEventListener('click', ()=> go('cards',{unitId: deck.id, classId: c.id}));
    root.appendChild(rv);
    cards.forEach(k => {
      const row = el('div','rev ocrow');
      row.appendChild(el('div','oct', k.term));
      row.appendChild(el('div','ocd', k.def));
      if(k.hint) row.appendChild(el('div','ocd','💡 ' + k.hint));
      const br = el('div','btn-row');
      const eb = el('button','btn btn-ghost','Edit');
      eb.addEventListener('click', ()=>{ ctx._ocEdit = k.id; render(); window.scrollTo({top:0}); });
      br.appendChild(eb);
      const db = el('button','btn btn-ghost','Delete');
      db.addEventListener('click', ()=> showModal({
        title:'Delete this card?', message:k.term,
        confirmText:'Delete', cancelText:'Keep it',
        onConfirm:()=>{ const d = ownDeck(c.id);
          d.cards = d.cards.filter(x => x.id !== k.id);
          if(ctx._ocEdit === k.id) ctx._ocEdit = null;
          put(d); syncSoon(); render(); }}));
      br.appendChild(db);
      row.appendChild(br);
      root.appendChild(row);
    });
  }
  const back = el('button','btn btn-ghost','← ' + c.name);
  back.addEventListener('click', ()=>{ ctx._ocEdit = null; go('unit',{classId:c.id}); });
  root.appendChild(back);
};

SCREENS.cards = function(root){
  const u = unitFor(ctx.unitId);
  if(!u || !u.cards.length) return go('unit',{classId:ctx.classId});
  if(!cardState.start || cardState.unitId!==u.id)
    cardState = {unitId:u.id,i:0,flipped:false,start:Date.now(),seen:new Set(),
      order:shuffle(u.cards.map((_,i)=>i)), missed:[], round:1};
  const card = u.cards[cardState.order[cardState.i]], cls = CLASS_BY_ID[ctx.classId];

  const head = el('div','card');
  head.appendChild(el('div','eyebrow',u.title));
  const r = el('div','row');
  r.appendChild(el('span','k',`Card ${cardState.i+1} of ${cardState.order.length}${cardState.round>1?` · round ${cardState.round}`:''}`));
  const seenLabel = el('span','v',`${cardState.seen.size} reviewed`);
  r.appendChild(seenLabel); head.appendChild(r);
  const bar = el('div','bar'), fi = el('i');
  fi.style.width = (cardState.i/cardState.order.length*100)+'%'; bar.appendChild(fi); head.appendChild(bar);
  root.appendChild(head);

  /* The card wears its subject: graph paper for maths, ruled paper for English,
     cell dots for Biology, and so on. */
  const flip = el('div','flip'+(cardState.flipped?' on':'')), inner = el('div','flip-in');
  const front = paint(el('div','face front'), cls);
  front.appendChild(el('div','wm', cls?cls.icon:'✦'));
  if(cls) front.appendChild(el('div','subjtag', cls.name));
  front.appendChild(el('div','term',card.term));
  /* A hand-checked respelling, for material where reading it is not the same
     as saying it. Shown as well as spoken — she can check the voice against
     the page, which a black-box recording would never let her do. */
  if(card.sp) front.appendChild(el('div','saidas',card.sp));
  const fg = graphNode(card.graph); if(fg) front.appendChild(fg);
  /* Hear it said — vocabulary she has only ever read is vocabulary she can't
     use out loud. Browser speech, offline, tap-only. stopPropagation so the
     button never flips the card. */
  if('speechSynthesis' in window){
    const sp = el('button','sayb','🔊');
    sp.setAttribute('aria-label','Hear it said');
    /* Lowercased on the way to the voice: the CAPS in a respelling mark stress
       for the eye, but Android TTS reads an all-caps run as an acronym and
       spells "OO" out loud. The page keeps the caps; the speaker doesn't. */
    sp.addEventListener('click',e=>{ e.stopPropagation();
      say(card.sp ? card.sp.toLowerCase() : card.term); });
    front.appendChild(sp);
  }
  front.appendChild(el('div','tap','Tap to reveal'));
  const back = paint(el('div','face back'), cls);
  back.appendChild(defEl(card.def));
  const bg = graphNode(card.graph); if(bg) back.appendChild(bg);
  const ig = signImgNode(card); if(ig) back.appendChild(ig);
  if(card.eq) back.appendChild(el('div','eq',card.eq));
  if(card.hint) back.appendChild(el('div','hint','💡 '+card.hint));
  /* Some cards (ASL signs) can only truly be taught by video — the card
     itself never claims to describe a handshape or movement in words. */
  const wn = watchNode(card, 'watchb'); if(wn) back.appendChild(wn);
  back.appendChild(el('div','tap','Tap to flip back'));
  inner.appendChild(front); inner.appendChild(back); flip.appendChild(inner);
  // Toggle in place — a full render would rebuild the node and kill the transition.
  let syncRows = ()=>{};
  flip.addEventListener('click',()=>{
    cardState.flipped=!cardState.flipped; cardState.seen.add(cardState.order[cardState.i]);
    flip.classList.toggle('on',cardState.flipped);
    seenLabel.textContent = `${cardState.seen.size} reviewed`;
    syncRows();
  });
  root.appendChild(flip);

  /* Self-check: after seeing the answer she judges herself — ✓ moves on,
     "not yet" queues the card for another round. The deck only finishes when
     every card has earned its check. Session-only; no records, no scores. */
  const advance = (knewIt)=>{
    const idx = cardState.order[cardState.i];
    cardState.seen.add(idx);
    if(!knewIt) cardState.missed.push(idx);
    cardState.flipped = false;
    if(cardState.i < cardState.order.length-1){ cardState.i++; render(); }
    else if(cardState.missed.length){
      toast(cardState.missed.length===1 ? '1 card coming back around' : cardState.missed.length+' cards coming back around');
      cardState.order = shuffle(cardState.missed); cardState.missed = []; cardState.i = 0; cardState.round++;
      render();
    } else finishCards(u);
  };
  const rowNav = el('div','btn-row');
  const prev = el('button','btn btn-secondary','← Back');
  prev.addEventListener('click',()=>{ if(cardState.i>0){cardState.i--;cardState.flipped=false;render();} });
  const flipBtn = el('button','btn btn-primary','Flip it →');
  flipBtn.addEventListener('click',()=>{
    cardState.flipped = true; cardState.seen.add(cardState.order[cardState.i]);
    flip.classList.add('on');
    seenLabel.textContent = `${cardState.seen.size} reviewed`;
    syncRows();
  });
  rowNav.appendChild(prev); rowNav.appendChild(flipBtn); root.appendChild(rowNav);
  const rowKnow = el('div','btn-row');
  const missB = el('button','btn btn-secondary','↻  Not yet');
  missB.addEventListener('click',()=>advance(false));
  const gotB = el('button','btn btn-primary','✓  Knew it');
  gotB.addEventListener('click',()=>advance(true));
  rowKnow.appendChild(missB); rowKnow.appendChild(gotB); root.appendChild(rowKnow);
  syncRows = ()=>{
    rowNav.style.display  = cardState.flipped ? 'none' : '';
    rowKnow.style.display = cardState.flipped ? '' : 'none';
  };
  syncRows();
  const quit = el('button','btn btn-ghost','Exit');
  quit.addEventListener('click',()=>{cardState.start=0;go('unit',{classId:ctx.classId});});
  root.appendChild(quit);
};
function finishCards(u){
  const secs = Math.round((Date.now()-cardState.start)/1000);
  const xp = Math.min(cardState.seen.size*5,150);
  put({id:uid('log'),type:'log',mode:'cards',classId:ctx.classId,unitId:u.id,
       date:AZ.today(),at:Date.now(),correct:0,total:0,seconds:secs,xp});
  checkBadges(); syncSoon(); celebrate();
  const seen = cardState.seen.size; cardState.start=0;
  showModal(u.questions.length ? { title:`+${xp} XP`,
    message:`${seen} cards reviewed in ${Math.max(1,Math.round(secs/60))} min.\n\nFlashcards build recognition. The quiz is where you find out what actually stuck.`,
    confirmText:'Take the quiz', cancelText:'Later',
    onConfirm:()=>launchQuiz(u.id,ctx.classId) }
  : { title:`+${xp} XP`,
    /* Two different reasons a deck has no quiz: her own cards (she wrote
       them, so studying them IS the whole loop) versus a pure reference
       deck like the ASL alphabet (nothing to quiz — the picture is the
       whole answer). */
    message:`${seen} cards reviewed in ${Math.max(1,Math.round(secs/60))} min.\n\n`
      + (u.own ? 'You wrote these and now you have studied them — that is the whole loop.'
                : 'Some decks are reference, not a quiz — this is one of them.'),
    confirmText:'Done', cancelText:null });
  go('unit',{classId:ctx.classId});
}

/* ================= READING LOG ================= */
/* The simplest possible reading tracker: a book title and minutes, stored as
   ordinary log records (mode:'read'; finishing a book is mode:'readfin', one
   per title). XP, streaks, sky-map stars and weekly minutes all follow for
   free, and Fresh start clears it like any other progress. Deliberately NO
   prize economy on her side — the shelf and honest XP are the whole loop;
   real-world celebrations live in the parent view, as the parent's surprise. */
/* ---------- Rubric self-check ----------
   She rates her OWN draft against each rubric row before handing it in, then
   the real score goes in beside her prediction. The app never evaluates her
   writing — that is the whole design. What it does is show her the gap between
   how she judged the work and how it was judged, which is the same
   metacognitive move as the readiness check before a quiz, applied to essays.

   Deliberate rules:
   · No model call, no API key, works offline. The rubric is the only authority.
   · "What would move this up" quotes the NEXT band in the teacher's own words.
     It never suggests sentences — that would be writing her essay for her.
   · Nothing is scored or graded by the app. lo/hi come straight off the rubric. */
const selfChecks = () => all('selfcheck').sort((a,b)=>(a.date<b.date?1:-1));
function scRange(rec, rub){
  let lo = 0, hi = 0;
  rub.rows.forEach(row=>{
    const b = row.bands[rec.picks[row.k]];
    if(b){ lo += b.lo; hi += b.hi; }
  });
  return {lo, hi};
}
SCREENS.selfcheck = function(root){
  const cls = CLASS_BY_ID[ctx.classId], sh = SHEETS[ctx.classId];
  if(!sh || !sh.rubric) return go('today');

  if(!ctx._sc || ctx._scFor !== ctx.classId){ ctx._sc = {}; ctx._scFor = ctx.classId; ctx._scT = ''; }

  root.appendChild(headline('Check it yourself',
    'Read your draft against each row and pick the band you honestly think it earns. Nothing here is sent anywhere, and nothing marks your work but you.'));

  const tc = el('div','card ac');
  tc.appendChild(el('label',null,'Which piece of work?'));
  const t = el('input'); t.type='text'; t.placeholder='e.g. Unit 1 DBQ essay';
  t.value = ctx._scT || '';
  t.addEventListener('input',()=>{ ctx._scT = t.value; });
  tc.appendChild(t);
  root.appendChild(tc);

  rub.rows.forEach(row=>{
    const c = el('div','card');
    c.appendChild(el('div','eyebrow', row.nm + '  (/' + row.max + ')'));
    const picked = ctx._sc[row.k];

    row.bands.forEach((b,i)=>{

      bt.addEventListener('click',()=>{ ctx._sc[row.k] = i; render(); });

    });

        n.textContent = 'To reach ' + up.nm + ': ' + up.d;
        c.appendChild(n);
      } else {
        c.appendChild(el('div','hintline','Top band. Check it against the wording once more before you commit.'));
      }
    }
    root.appendChild(c);
  });

  const done = rub.rows.filter(r=>ctx._sc[r.k] != null).length;
  const sum = el('div','card ac');
  if(done < rub.rows.length){
    sum.appendChild(el('p',null, done + ' of ' + rub.rows.length + ' rows rated.'));

  }

  const save = el('button','btn btn-primary','Save my check');

    const {lo,hi} = scRange({picks:ctx._sc}, rub);
    put({ id:uid('selfcheck'), type:'selfcheck', classId:ctx.classId, title,
          date:AZ.today(), picks:{...ctx._sc}, lo, hi, actual:null });
    ctx._sc = null; ctx._scT = ''; syncSoon();
    showModal({ title:'Saved', confirmText:'Got it',
      message:'Your prediction is '+(lo===hi?lo:lo+'–'+hi)+' out of '+rub.total+
              '.\n\nWhen the marked work comes back, add the real score in the grown-up view. The gap between the two is the useful part — it tells you whether you can see your own work the way a marker does.' });
    go('unit',{classId:ctx.classId});

};
