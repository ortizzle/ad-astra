/* ---- The day, as a dashboard ----
   Top-level numbers first, then subjects, then every session, and inside a
   quiz session every question with what she picked. Each layer is one tap
   deeper, so nothing is hidden and nothing is dumped on you at once.
   Still no clock times — `at` orders the sessions and does nothing else. */
/* ---- What is worth a word ----
   The screen told the day three times and told the story none. This names, at
   most twice, the thing a parent might actually want to raise — every signal
   read from records the app already keeps.

   Rules, and they are the point:
   - It describes a SESSION, never her. No verdicts, no "problem" language.
     Same register as the Growth Zone: information, not a judgement.
   - Wellbeing outranks every score on the screen, so a low mood sorts first.
   - Capped at two. A list of faults is exactly what this must not become.
   - Good news is eligible too — beating her own expectation is worth saying.
   - When nothing stands out it says so, because an ordinary evening is
     information a parent wants as much as an unusual one. */
function daySignals(rep){
  const out = [];
  const pct = s => Math.round(s.correct / s.total * 100);
  const nm  = s => s.classId && CLASS_BY_ID[s.classId]
    ? (CLASS_BY_ID[s.classId].short || CLASS_BY_ID[s.classId].name) : 'that round';
  rep.sessions.forEach((s, idx) => {
    const key = 'ses' + idx;
    if(s.pre && s.pre.feeling <= 2)
      out.push({ rank:1, key, t:'She logged a low mood going into ' + nm(s) + '.',
        d:'Worth a gentle check-in, not a confrontation.' });
    if(s.partial && s.total > 0)
      out.push({ rank:2, key, t:'She stopped the ' + nm(s) + ' round after ' + s.total +
          (s.total === 1 ? ' question' : ' questions') + '.',
        d:'Scored on what she answered — the rest were never counted against her.' });
    if(s.pre && s.pre.readiness && s.total >= 4){
      const predicted = s.pre.readiness * 20, gap = pct(s) - predicted;
      if(gap <= -20) out.push({ rank:3, key, t:'Felt ready for ' + predicted + '% in ' + nm(s) + ', scored ' + pct(s) + '%.',
        d:'That gap is the useful part — revising had felt like knowing.' });
      else if(gap >= 20) out.push({ rank:5, key, t:'She undersold herself on ' + nm(s) + ' — expected ' + predicted +
          '%, scored ' + pct(s) + '%.',
        d:'Worth telling her. Her nerves read her lower than her work does.' });
    }
  });
  rep.subs.forEach(b => {
    if(b.asked >= 5 && b.right / b.asked < 0.6)
      out.push({ rank:4, key:null, t:subName(b.id) + ' came out at ' + Math.round(b.right / b.asked * 100) + '% today.',
        d:'Everything she missed is already on the review ladder for another go.' });
  });
  return out.sort((a,b) => a.rank - b.rank).slice(0, 2);
}

/* The emotion check, folded into the session it belongs to rather than living
   in a section of its own where it had to name the quiz all over again. */
function dayMoodBlock(s){
  const box = el('div','felt');
  const line = (k, v) => { const r = el('div','row');
    r.appendChild(el('span','k',k)); r.appendChild(el('span','v plain',v)); box.appendChild(r); };
  if(s.pre  && readyOf(s.pre.readiness)) line('Felt ready',  readyOf(s.pre.readiness).e + '  ' + readyOf(s.pre.readiness).l);
  if(s.pre  && feelOf(s.pre.feeling))    line('Mood before', feelOf(s.pre.feeling).e + '  ' + feelOf(s.pre.feeling).l);
  if(s.post && feelOf(s.post.feeling))   line('Mood after',  feelOf(s.post.feeling).e + '  ' + feelOf(s.post.feeling).l);
  if(s.pre && s.pre.readiness && s.total > 0){
    const predicted = s.pre.readiness * 20;
    const actual = Math.round(s.correct / s.total * 100);
    const r = el('div','row');
    r.appendChild(el('span','k','Felt ready for ' + predicted + '%'));
    r.appendChild(el('span','v','scored ' + actual + '%'));
    box.appendChild(r);
    /* Printed only when the gap is worth naming. The old screen printed the
       same sentence under every quiz on the day — word for word, twice on one
       screen — which is how an insight turns into wallpaper and stops being
       read. Two numbers side by side say it well enough on their own. */
    const gap = actual - predicted;
    if(Math.abs(gap) > 15) box.appendChild(el('div','hintline', gap < 0
      ? 'Revising had felt like knowing. That gap is the useful part, not the score.'
      : 'She did better than she expected — worth telling her.'));
  }
  return box;
}

/* Misses first, and by default misses ONLY. What a parent acts on is the
   handful she got wrong; eighteen rows of confirmation buries them and turns
   one open session into most of a screen. The right answers are still one tap
   away, and the count is always stated so nothing is hidden silently. */
function dayQuestionList(s){
  const qs = el('div');
  const items  = s.items;
  const misses = items.filter(it => !it.c);
  const showAll = !!ctx.allQ;
  const shown  = showAll ? items : misses;

  const cap = el('div','qcap');
  cap.appendChild(el('span', null, misses.length
    ? misses.length + ' missed of ' + items.length
    : 'All ' + items.length + ' right'));
  if(misses.length < items.length){
    const tog = el('button','qtog', showAll
      ? (misses.length ? 'Misses only' : 'Hide')
      : 'Show all ' + items.length);
    tog.addEventListener('click', () => go('day',
      { date: ctx.date, dayView: ctx.dayView, openSes: ctx.openSes, allQ: !showAll }));
    cap.appendChild(tog);
  }
  qs.appendChild(cap);

  shown.forEach(it => {
    const line = el('div','qline');
    line.appendChild(el('span','mk ' + (it.c ? 'ok' : 'no'), it.c ? '✓' : '✗'));
    const tx = el('span','tx', it.qt || '(question not recorded)');
    const detail = el('small');
    if(it.c){
      detail.textContent = 'She answered: ' + (it.ch || '—');
    } else {
      detail.textContent = 'She answered: ' + (it.ch || '—') + '  ·  ';
      detail.appendChild(el('b', null, 'Answer: ' + (it.ca || '—')));
    }
    tx.appendChild(detail);
    line.appendChild(tx);
    qs.appendChild(line);
  });
  return qs;
}

/* One session. Opens to its questions AND its check-in together, so the day is
   one list read once instead of three lists cross-referenced. A session with
   nothing underneath renders as a plain row, not a dead button. */
function daySessionRow(s, idx, date){
  const key   = 'ses' + idx;
  const open  = ctx.openSes === key;
  const hasQ  = !!(s.items && s.items.length);
  const hasM  = !!(s.pre || s.post);
  const oldQ  = !hasQ && s.total > 0;
  const openable = hasQ || hasM || oldQ;
  const wrap  = el('div','sesblock' + (open ? ' open' : ''));
  const sub   = s.classId && CLASS_BY_ID[s.classId]
    ? (CLASS_BY_ID[s.classId].short || CLASS_BY_ID[s.classId].name) : null;
  const head  = el(openable ? 'button' : 'div','sesrow');
  const tl    = el('span','tl');
  /* Subject first: it is what a parent scans for, and six rows that all begin
     "Quiz ·" put the repeated word where the distinguishing one belongs. */
  tl.appendChild(el('div','nm', (sub ? sub + ' · ' : '') + s.label));
  const meta = [];
  if(s.unit)    meta.push(s.unit);
  if(s.minutes) meta.push(s.minutes + ' min');
  if(s.hints)   meta.push(s.hints + (s.hints === 1 ? ' hint' : ' hints'));
  const chip = moodChip(s); if(chip) meta.push(chip);
  if(meta.length) tl.appendChild(el('div','mt', meta.join(' · ')));
  head.appendChild(tl);
  if(s.total > 0){
    const sc = el('span','score');
    sc.appendChild(el('b',null, s.correct + '/' + s.total));
    sc.appendChild(el('i',null, Math.round(s.correct / s.total * 100) + '%'));
    head.appendChild(sc);
  }
  if(openable){
    head.appendChild(el('span','exp', open ? '−' : '+'));
    head.addEventListener('click', () => go('day',
      { date, dayView: ctx.dayView, openSes: open ? null : key }));
  }
  wrap.appendChild(head);
  if(open){
    if(hasM) wrap.appendChild(dayMoodBlock(s));
    if(hasQ) wrap.appendChild(dayQuestionList(s));
    else if(oldQ) wrap.appendChild(el('div','hintline',
      'This round predates the app keeping individual questions, so only the score survived.'));
  }
  return wrap;
}

function daySubjectHead(b, dueN){
  const h = el('div','subhead');
  const top = el('div','row');
  top.appendChild(el('span','k', subName(b.id)));
  const bits = [];
  if(b.asked)   bits.push(b.right + '/' + b.asked + ' · ' + Math.round(b.right / b.asked * 100) + '%');
  if(b.minutes) bits.push(b.minutes + ' min');
  if(dueN)      bits.push(dueN + ' due');
  top.appendChild(el('span','v plain', bits.join('  ·  ')));
  h.appendChild(top);
  if(b.asked){
    const m = el('div','meter'), i = el('i');
    i.style.width = Math.max(2, Math.round(b.right / b.asked * 100)) + '%';
    m.appendChild(i); h.appendChild(m);
  }
  return h;
}

SCREENS.day = function(root){

  const isToday = date === today;
  const dueNow  = isToday ? dueMisses() : [];
  const dueBySub = {};

  const view = ctx.dayView === 'subject' ? 'subject' : 'order';

  tiles.appendChild(tile(rep.minutes, 'Minutes',

    const m = el('div','meter'), i = el('i');
    i.style.width = Math.max(2, rep.acc) + '%'; m.appendChild(i); accTile.appendChild(m);
  }
  tiles.appendChild(accTile);
  tiles.appendChild(isToday
    ? tile(dueNow.length, 'Growth due', dueNow.length ? 'waiting for review' : 'all clear')
    : tile(rep.subs.length, 'Subjects', 'touched this day'));
  root.appendChild(tiles);

  if(!rep.sessions.length){
    const e = el('div','card');
    e.appendChild(el('p',null, isToday
      ? 'Nothing recorded yet today. This fills in as she studies — it is not a to-do list, and a quiet day is just a quiet day.'
      : 'Nothing was recorded on this day.'));
    root.appendChild(e);
  } else {
    /* ---- Worth a word ---- */
    root.appendChild(divider('Worth a word'));
    const wc = el('div','card ac');
    const sig = daySignals(rep);
    if(!sig.length){
      wc.appendChild(el('p',null,
        'Nothing stands out. She studied, and it went about the way she expected — which is its own kind of good day.'));
    } else {
      sig.forEach(g => {
        const row = el(g.key ? 'button' : 'div','sig');
        const bd = el('span','bd');
        bd.appendChild(el('b',null,g.t));
        bd.appendChild(el('small',null,g.d));
        row.appendChild(bd);
        if(g.key){
          row.appendChild(el('span','go','›'));
          row.addEventListener('click', () => go('day',
            { date, dayView: view, openSes: g.key }));
        }
        wc.appendChild(row);
      });
    }
    root.appendChild(wc);

    /* ---- The day itself: ONE list, grouped two ways ---- */
    root.appendChild(divider('The day'));
    const chips = el('div','chiprow');
    [['order','In order'],['subject','By subject']].forEach(([v,label]) => {
      const c = el('button','chipbtn' + (view === v ? ' on' : ''), label);
      c.addEventListener('click', () => go('day',
        { date, dayView: v, openSes: ctx.openSes, allQ: ctx.allQ }));
      chips.appendChild(c);

    root.appendChild(chips);

    if(view === 'order'){

/* ---- Door 1: she worked it on paper, and just needs it marked ----
   A grid of A/B/C/D, one row per question. Thirty taps instead of thirty
   quiz screens, because she has already done the thinking. Nothing is graded
   until she says so, and a blank is a blank — not a wrong answer. Skipping a
   question on paper is not the same as getting it wrong, and scoring it as
   wrong would put a question she never attempted onto the review ladder. */
SCREENS.guideentry = function(root){
  const u = DATA.records[ctx.unitId];
  if(!u || u.deleted) return go('today');
  const pass = guidePass(u.id);
  const ans = pass.answers || {};
  const done = Object.keys(ans).length;
  const total = u.questions.length;

  root.appendChild(headline('Enter your answers',
    'Put in what you actually wrote on the paper — not what you wish you wrote. The ones you missed are the whole point.'));

  const card = el('div','card');
  u.questions.forEach((q,i)=>{
    const row = el('div','grow');
    row.appendChild(el('span','gn', String(i+1)));
    const box = el('div','gopt');
    q.opts.forEach((_,k)=>{
      const b = el('button','' + (ans[q.id]===k ? 'on' : ''),
        String.fromCharCode(65+k));
      b.addEventListener('click',()=>{
        /* Tapping the same letter again clears it, so a mis-tap is fixable
           without a separate clear control. */
        const g = guidePass(u.id);
        const next = { ...g.answers };
        if(next[q.id] === k) delete next[q.id]; else next[q.id] = k;
        put({ ...g, answers: next });
        render();
      });
      box.appendChild(b);
    });
    row.appendChild(box);
    card.appendChild(row);
  });
  root.appendChild(card);

  const bar = el('div','gbar');
  const go2 = el('button','btn btn-primary',
    done ? 'Mark '+done+' of '+total : 'Enter at least one answer');
  go2.disabled = !done;
  go2.addEventListener('click',()=>{
    if(!done) return;
    gradeGuide(u);
  });
  bar.appendChild(go2);
  if(done && done < total)
    bar.appendChild(el('div','hintline',
      (total-done)+' still blank. Blanks are left alone — they are not marked wrong.'));
  root.appendChild(bar);

  const back = el('button','btn btn-ghost','← Back');
  back.addEventListener('click',()=>go('unit',{classId:u.classId}));
  root.appendChild(back);
};

/* Marking the paper pass. Everything a normal quiz writes, written here too —
   the tally, the misses, and one log — because the work was real; she did it
   on paper. The only thing it does not do is ask the questions again. */
function gradeGuide(u){
  const ans = guidePass(u.id).answers || {};
  const asked = u.questions.filter(q=>ans[q.id]!=null);
  let right = 0;
  const items = [];
  asked.forEach(q=>{
    const ok = ans[q.id]===q.ans;
    if(ok) right++;
    const key = 'qstat_'+u.id+'_'+q.id;
    const prev = DATA.records[key];
    put({ id:key, type:'qstat', unitId:u.id, classId:u.classId, qid:q.id, q:q.q,
          attempts:(prev?.attempts||0)+1, correct:(prev?.correct||0)+(ok?1:0) });
    if(items.length < QUIZ_ITEM_MAX)
      items.push({ c: ok?1:0, qt:String(q.q).slice(0,110),
        ch:String(q.opts[ans[q.id]]||'').slice(0,70),
        ca: ok ? '' : String(q.opts[q.ans]||'').slice(0,70) });
    if(!ok){
      const was = DATA.records['miss_'+u.id+'_'+q.id];
      put(scheduleMiss({ id:'miss_'+u.id+'_'+q.id, type:'miss', unitId:u.id,
        classId:u.classId, qid:q.id, q:q.q, opts:q.opts, ans:q.ans,
        kind:q.kind||null, right:q.opts[q.ans], chose:q.opts[ans[q.id]],
        why:q.ex?.main||'', graph:q.graph||null, steps:q.steps||null,
        on:(was&&!was.deleted?was.on:AZ.today()) }, false));
    }
  });
  put({ ...guidePass(u.id), submitted:true });
  put({ id:uid('log'), type:'log', mode:'quiz', classId:u.classId, unitId:u.id,
    date:AZ.today(), at:Date.now(), correct:right, total:asked.length,
    seconds:0, xp:right*10, hints:0, timed:false, speedBonus:0,
    partial: asked.length < u.questions.length, paper:true, items });
  checkBadges(); syncSoon();
  go('guidewalk',{unitId:u.id, classId:u.classId});
}

/* ---- What she got wrong, and why ----
   The steps are already on every question for the quiz's "walk me through it".
   Here they are the whole screen, because a study guide's value is entirely in
   the questions that did not go well. */
SCREENS.guidewalk = function(root){
  const u = DATA.records[ctx.unitId];
  if(!u || u.deleted) return go('today');
  const ans = guidePass(u.id).answers || {};
  const asked = u.questions.filter(q=>ans[q.id]!=null);
  const wrong = guideWrong(u);
  const pct = asked.length ? Math.round((asked.length-wrong.length)/asked.length*100) : 0;

  root.appendChild(headline('Your paper pass',
    (asked.length-wrong.length)+' of '+asked.length+' right · '+pct+'%'));

  if(!wrong.length){
    const e = el('div','card ac');
    e.appendChild(el('p',null,'Every one you entered was right. Nothing to walk through — go in fresh on the test.'));
    root.appendChild(e);
  } else {
    root.appendChild(divider(wrong.length===1 ? 'The one to look at' : 'The '+wrong.length+' to look at'));
    const card = el('div','card');
    wrong.forEach((q,i)=>{
      const w = el('div','wq');
      w.appendChild(el('div','qh', (i+1)+'.  '+q.q));
      const pk = el('div','picked');
      pk.textContent = 'You put: '+(q.opts[ans[q.id]]||'—')+'  ·  ';
      pk.appendChild(el('b',null,'Answer: '+(q.opts[q.ans]||'—')));
      w.appendChild(pk);
      const steps = q.steps || [];
      if(steps.length){
        const open = (ctx.openW||[]).includes(q.id);
        const t = el('button','btn btn-ghost btn-sm', open ? 'Hide the working' : 'Walk me through it');
        t.addEventListener('click',()=>{
          const cur = ctx.openW||[];
          go('guidewalk',{unitId:u.id, classId:u.classId,
            openW: open ? cur.filter(x=>x!==q.id) : cur.concat([q.id])});
        });
        w.appendChild(t);
        if(open){
          const ol = el('div');
          ol.style.marginTop='8px';
          /* The same .step markup the quiz's own walkthrough uses. It was
             briefly built out of .row/.k/.v, which is a label-and-value
             layout: .row .v is white-space:nowrap, so a sentence-long step
             ran off the side of the screen instead of wrapping. */
          steps.forEach((st,n)=>{
            const r = el('div','step');
            r.appendChild(el('span','n', String(n+1)));
            r.appendChild(richify(el('p'), st));
            ol.appendChild(r);
          });
          if(q.ex && q.ex.main) ol.appendChild(richify(el('div','hintline'), q.ex.main));
          w.appendChild(ol);
        }
      }
      card.appendChild(w);
    });
    root.appendChild(card);

    if(rescueReady(u)){
      const rc = el('div','card ac');
      rc.appendChild(el('h3',null,'Try them again, different numbers'));
      rc.appendChild(el('p',null,'Same skills, fresh questions. This one is practice — it does not change when the Growth Zone brings the originals back.'));
      const b = el('button','btn btn-primary','Start the second pass');
      b.addEventListener('click',()=>{
        if(!buildRescueUnit(u.id)){ toast('Nothing to practise yet'); return; }
        quizState = null;
        go('quiz',{unitId:'__rescue__', classId:u.classId});
      });
      rc.appendChild(b);
      root.appendChild(rc);
    }
  }
  const back = el('button','btn btn-ghost','← Back to the unit');
  back.addEventListener('click',()=>go('unit',{classId:u.classId}));
  root.appendChild(back);
};

/* ================= EMOTION CHECK ================= */
/* Asked before every quiz. Two taps. The readiness rating is compared to her
   actual score afterwards, which is a calibration signal — it teaches her
   whether her gut feeling about being prepared is accurate. */
const READY = [
  {v:1,e:'😰',l:'Not at all'},{v:2,e:'😕',l:'Shaky'},{v:3,e:'😐',l:'Kind of'},
  {v:4,e:'🙂',l:'Pretty good'},{v:5,e:'😎',l:'Totally'}
];
const FEELING = [
  {v:1,e:'😩',l:'Rough'},{v:2,e:'😔',l:'Meh'},{v:3,e:'😌',l:'OK'},
  {v:4,e:'😊',l:'Good'},{v:5,e:'🤩',l:'Great'}
];
/* ---------- Paper study guides ----------
   A unit flagged `guide:true` mirrors a printout the class handed out, and
   that changes three things about how the engine may treat it.

   1. OPTION ORDER IS FIXED. Everywhere else options shuffle per question so
      the answer cannot be learned by position (v64). Here it must NOT: she is
      entering the letter she wrote on paper, and if the app's C is not the
      paper's C the whole mode is a lie. The exception is scoped to guide
      units, and the rescue round that follows shuffles normally because that
      is ordinary practice, not transcription.
   2. QUESTIONS RUN IN THE AUTHORED ORDER, all of them — a guide is a
      sequence, not a sampled round.
   3. HER PLACE IS SAVED. Thirty questions is more than one sitting, so the
      answers live in a record rather than in memory.

   One `guidepass` record per unit, id derived from the unit id so it can
   never duplicate across devices. */
const guideId = unitId => 'guide_' + unitId;
function guidePass(unitId){
  const r = DATA.records[guideId(unitId)];
  return (r && !r.deleted) ? r : { id:guideId(unitId), type:'guidepass',
    unitId, answers:{}, submitted:false };
}
function guideSet(unitId, qid, idx){
  const g = guidePass(unitId);
  put({ ...g, answers:{ ...g.answers, [qid]: idx } });
}
const guideCount = unitId => Object.keys(guidePass(unitId).answers || {}).length;
/* Which questions she got wrong on the paper pass — the input to both the
   walkthrough and the rescue round. */
function guideWrong(u){
  const ans = guidePass(u.id).answers || {};
  return (u.questions||[]).filter(q => ans[q.id] != null && ans[q.id] !== q.ans);
}

/* The rescue round: for every question she missed that carries a hand-written
   `variant`, ask the variant instead — same skill, different numbers. Synthetic
   like __review__ and __shuffle__: never stored, never synced.

   It deliberately does NOT move the review ladder in either direction. Answering
   a fresh variant moments after reading the walkthrough is massed practice, not
   spaced retrieval; promoting the box on that would credit her with a durability
   she has not demonstrated yet. The miss stays where it is and comes back
   tomorrow as scheduled. Attempts still count, so the parent view sees the work. */
let rescueUnit = null;
function buildRescueUnit(unitId){
  const u = DATA.records[unitId];
  if(!u || u.deleted) return null;
  const qs = [];
  guideWrong(u).forEach(q=>{
    if(!q.variant) return;
    qs.push({ ...q.variant, id:'rv_'+q.id, lv:q.lv||2,
      _srcUnit:unitId, _srcClass:u.classId, _srcQid:q.id, _rescue:true });
  });
  if(!qs.length) return null;
  rescueUnit = { id:'__rescue__', classId:u.classId, book:true,
    title:'Second pass · '+(u.title||'Study guide'), cards:[], questions:qs,
    round:qs.length };
  return rescueUnit;
}
const rescueReady = u => u && u.guide && guideWrong(u).some(q=>q.variant);
function launchQuiz(unitId, classId, timed){ go('checkin',{unitId,classId,timed:!!timed}); }

/* Quizzes run in short rounds — a few questions feels attainable in the car
   on the way to school; the next round picks up whatever is least practised,
   so repeated rounds still cycle the whole unit. */
const QUIZ_ROUND = 5;
/* Per-question detail is capped so one very long round cannot bloat the gist. */
const QUIZ_ITEM_MAX = 40;
function pickRound(u, timed){
  if(u.id==='__review__') return shuffle(u.questions.map((_,i)=>i));
  /* A paper guide is a sequence, not a sample: every question, in the order
     it is printed, minus the ones she has already answered this pass. */
  if(u.guide){
    const done = guidePass(u.id).answers || {};
    const left = u.questions.map((q,i)=>({q,i})).filter(x=>done[x.q.id]==null).map(x=>x.i);
    return left.length ? left : u.questions.map((_,i)=>i);
  }
  /* Shuffle-round questions look attempts up on their ORIGINAL unit, so
     least-practised stays honest across the whole subject. */
  const key = q => (q._srcUnit||u.id)+'_'+(q._srcQid||q.id);
  const att = q => (DATA.records['qstat_'+key(q)]?.attempts)||0;
  /* qstat.updatedAt is stamped on every answer, so it doubles as last-seen
     for free. Among equal attempt counts, the question she met longest ago
     comes back first — spacing for material she got RIGHT, not only misses. */
  const seen = q => (DATA.records['qstat_'+key(q)]?.updatedAt)||0;
  /* A question she has missed is already ON the review ladder, which has
     scheduled when it comes back. Letting it compete for an ordinary quiz slot
     asks it twice and crowds out questions she has not seen — so it sorts last
     rather than by attempts. Not excluded: a short unit, or one where she has
     missed everything, still needs questions to serve. */
  const owed = q => { const m = DATA.records['miss_'+key(q)]; return (m && !m.deleted) ? 1 : 0; };
  const idx = u.questions.map((q,i)=>({i, q, a:att(q), g:owed(q), t:seen(q), r:Math.random()}))
    /* Typing against a countdown tests typing, not spelling. */
    .filter(x => !timed || x.q.kind!=='spell');
  idx.sort((x,y)=> x.g-y.g || x.a-y.a || x.t-y.t || x.r-y.r);
  /* A unit may set its own sitting size (u.round) — a lesson-a-day maths
     quiz serves all ~10 in one go; a topic review serves 12. Content-side
     knob, engine default unchanged. */
  return shuffle(idx.slice(0, Math.min(u.round||QUIZ_ROUND, idx.length)).map(x=>x.i));
}

/* A shuffle round mixes the least-practised questions from ACROSS a subject's
   units — interleaving, the technique the tutor preaches but single-unit
   rounds can't deliver. Synthetic like the review unit: never stored, never
   synced. Question ids are namespaced (unit~q) so a mixed round can't collide;
   _src* carries each question's real identity so qstats, misses and the
   review ladder all land on the unit it came from. book:true keeps it off
   any clock. */
let shuffleUnit = null;
function buildShuffleUnit(classId){
  const qs = [];
  units(classId).forEach(un => un.questions.forEach(q => qs.push({
    ...q, id: un.id+'~'+q.id,
    _srcUnit: un.id, _srcClass: un.classId==='__all__' ? classId : un.classId, _srcQid: q.id })));
  if(!qs.length) return null;
  shuffleUnit = { id:'__shuffle__', classId, title:'Shuffle round', book:true, cards:[], questions:qs };
  return shuffleUnit;
}

/* ================= THE DAILY THREE ================= */
/* One tiny fixed ritual: three questions, one per subject where she has
   approved units, drawn deterministically by date — the same three all day,
   a fresh three tomorrow — served as an ordinary round, so misses land in
   the Growth Zone and qstats credit the real units exactly as a shuffle
   round's do. Rules that are the point:
   - Never more than three, never gated on anything, never a streak. The door
     on Today turns into three squares when it is done and stops asking.
   - Subjects rotate with the date; inside a subject the least-practised
     question wins, ties by hash. Nothing is stored: it is a view of the
     library and the date.
   - The share is one plain line through the Web Share API (the backup
     already uses it), else the clipboard. It says done, never a score. */
let dailyUnit = null;
function dailyPicks(date){
  const seed = hashStr('daily:' + date);
  const byC = {};
  STUDY_CLASSES.forEach(c => {
    const qs = [];
    units(c.id).forEach(un => { if(un.own || un.guide) return;
      (un.questions||[]).forEach(q => { if(!q.kind || q.kind==='mc') qs.push({un, q, cid:c.id}); }); });
    if(qs.length) byC[c.id] = qs;
  });
  const cids = Object.keys(byC);
  if(!cids.length) return [];
  const start = seed % cids.length, picked = [];
  for(let i=0; i<cids.length && picked.length<3; i++){
    const cid = cids[(start+i) % cids.length];
    const cand = byC[cid].filter(x => !picked.some(p => p.un.id===x.un.id && p.q.id===x.q.id));
    if(!cand.length) continue;
    const att = x => (DATA.records['qstat_'+x.un.id+'_'+x.q.id]?.attempts)||0;
    cand.sort((a,b) => att(a)-att(b) || (mixHash(seed+':'+a.un.id+a.q.id) - mixHash(seed+':'+b.un.id+b.q.id)));
    picked.push(cand[0]);
  }
  /* One subject only: fill to three from it rather than serve one question. */
  if(picked.length < 3 && cids.length === 1){
    const cid = cids[0];
    const rest = byC[cid].filter(x => !picked.some(p => p.q.id===x.q.id && p.un.id===x.un.id))
      .sort((a,b) => mixHash(seed+':'+a.un.id+a.q.id) - mixHash(seed+':'+b.un.id+b.q.id));
    while(picked.length < 3 && rest.length) picked.push(rest.shift());
  }
  return picked;
}
function buildDailyUnit(date){
  const picks = dailyPicks(date || AZ.today());
  if(!picks.length) return null;
  dailyUnit = { id:'__daily__', classId:'__all__', title:'The daily three', book:true, cards:[], round:3,
    questions: picks.map(({un,q,cid}) => ({ ...q, id: un.id+'~'+q.id,
      _srcUnit: un.id, _srcClass: un.classId==='__all__' ? cid : un.classId, _srcQid: q.id })) };
  return dailyUnit;
}
const dailyDone = date => logs().find(l => l.unitId==='__daily__' && l.date===(date||AZ.today()) && !l.partial);
/* Three squares: lit for done. Inside the results modal the round's own
   constellation already shows which stars lit, so the squares repeat only
   the fact that matters for the ritual — the day is done. */
function dailySquares(big){
  const w = el('span','dsq' + (big ? ' big' : ''));
  const n = (dailyUnit && dailyUnit.questions.length) || 3;
  for(let i=0;i<n;i++) w.appendChild(el('i',null,'✦'));
  return w;
}
function dailyShareText(){
  const n = (dailyUnit && dailyUnit.questions.length) || 3;
  return '✦'.repeat(n) + ' ' + (typeof APP_NAME!=='undefined' ? APP_NAME : document.title.split('·')[0].trim())
    + ' · The daily three · ' + AZ.short(AZ.today()) + ' · done';
}
function dailyShareButton(inModal){
  const b = el('button', inModal ? 'btn btn-ghost' : 'btn btn-ghost btn-sm', 'Share today\'s three');
  b.addEventListener('click', async ()=>{
    const text = dailyShareText();
    try{
      if(navigator.share){ await navigator.share({text}); return; }
      if(navigator.clipboard){ await navigator.clipboard.writeText(text); toast('Copied — paste it to the family'); return; }
    }catch(e){ /* she cancelled the sheet, or it is unavailable — nothing to do */ }
    toast(text);
  });
  return b;
}

/* Timed mode. Each question gets a countdown; answering faster is worth more,
   and running out of time simply moves on. The deadline is an absolute
   timestamp so a re-render never resets the clock.
   The countdown calibrates to HER: regular (untimed) quizzes measure how long
   she actually takes per answer, and Beat the clock uses that average —
   clamped to 8–40s, 20s until there is data. */
function quizLimit(){
  let ms=0, n=0;
  logs().forEach(l=>{ if(l.mode==='quiz' && !l.timed && l.ansSeconds && l.ansCount){ ms += l.ansSeconds*1000; n += l.ansCount; } });
  if(!n) return 20000;
  return Math.round(Math.min(40000, Math.max(8000, ms/n)));
}
let quizTimer = null;
function stopQuestionTimer(){ clearInterval(quizTimer); quizTimer = null; }
function startQuestionTimer(u){
  stopQuestionTimer();
  if(!quizState || !quizState.timed) return;
  quizState.deadline = Date.now() + quizState.limit;
  quizTimer = setInterval(()=>{
    if(!quizState || quizState.answered !== null){ stopQuestionTimer(); return; }
    const left = quizState.deadline - Date.now();
    const bar = document.getElementById('qtimer');
    if(bar){
      bar.style.width = Math.max(0, left/quizState.limit*100)+'%';
      bar.className = left < 5000 ? 'low' : '';
    }
    if(left <= 0){ stopQuestionTimer(); timeUp(u); }
  }, 100);
}

/* Varied, honest encouragement — the label on every answer, not a flat
   'Correct'. Picked deterministically so re-renders don't reshuffle it. */
const CHEER_RIGHT = ['Nailed it','That one is yours now','Clean','Exactly right','Yes — that is the one','Locked in','Sharp','You saw straight through that one','Textbook','Called it'];
const CHEER_WRONG = ['Not this one — the why is below','Close. Read the why and it sticks','Good swing — here is the why','Not yet. This is what learning feels like','A miss here beats a miss on the test','Worth the stumble — this one will come back'];
function cheerLabel(right, timedOut){
  if(timedOut) return 'Out of time';
  if(right){
    if(quizState.runStreak>=3) return `${quizState.runStreak} in a row — on a roll`;
    return CHEER_RIGHT[(quizState.correct*7+quizState.i)%CHEER_RIGHT.length];
  }
  return CHEER_WRONG[(quizState.missed.length*5+quizState.i)%CHEER_WRONG.length];
}
function timeUp(u){
  const q = u.questions[quizState.order[quizState.i]];
  quizState.answered = -1;                       // -1 = ran out of time
  if(!quizState.seen.includes(q.id)) quizState.seen.push(q.id);
  quizState.missed.push(q.id);
  const src = u.id==='__review__' ? DATA.records[q._missId] : null;
  if(src){ put({ ...src, chose:'(ran out of time)' }); }
  else {
    const unitId  = q._srcUnit  || u.id;
    const classId = q._srcClass || ctx.classId;
    const qid     = q._srcQid   || q.id;
    const was = DATA.records['miss_'+unitId+'_'+qid];
    put(scheduleMiss({ id:'miss_'+unitId+'_'+qid, type:'miss', unitId, classId,
          qid, q:q.q, opts:q.opts, ans:q.ans, kind:q.kind||null, passage:q.passage||null,
          right:(q.kind==='order' ? q.opts.join(' → ') : q.opts[q.ans]), chose:'(ran out of time)',
          why:q.ex?.main||'', graph:q.graph||null, steps:q.steps||null,
          on:(was&&!was.deleted?was.on:AZ.today()) }, false));
  }
  if(navigator.vibrate) navigator.vibrate(60);
  render();
}

SCREENS.checkin = function(root){

  clearTimeout(ctx._ciT);

/* ================= QUIZ ================= */

/* ---- The star sky (v111 / Wayfinder v89) ----
   River asked for this one, by name: a night sky where pressing a star shows
   a definition, and then she has to SAY the word out loud. It is retrieval
   practice run backwards — definition to word, spoken rather than tapped —
   which is exactly the direction a vocabulary quiz asks for and the direction
   flashcards practise least.

   Rules that are the point:
   - Voice checking uses the browser's speech recognition where it exists
     (Chrome on their Pixels has it). The app NEVER records or stores audio;
     the transcript is compared and discarded. Where recognition is missing,
     she reveals the word and marks herself — same honour system as "see it
     again tomorrow".
   - A star that takes several tries still lights. Sky Map rules: showing up
     counts, and a hard word is information, not a fault.
   - No new record types. One ordinary log (mode:'starsky') updated in place
     as she goes, so leaving early keeps her minutes and XP.
   - Ponder cards are excluded — they are dinner-table prompts, not words.
   - Ships on Wordly Wise units only for now: the game needs single-word
     terms, and that is the shelf built from single words. */
let skyState = null;
const SKY_XP = 4;
function skyCards(u){
  /* Single sayable words only: 'First declension' or 'C — vacca' are cards,
     not words you can say into a microphone. Ponder cards are dinner-table
     prompts, not words. */
  return u.cards.filter(c => !/^ponder/i.test(c.term) && !/\s/.test(String(c.term).trim()));
}
/* Deterministic star positions: same unit, same sky, nothing stored. Grid
   cells keep stars a tap apart; the hash jitters them so it reads as sky
   rather than as a chart. */
function skySpots(n, seed){
  let h = 2166136261;
  for(const ch of seed){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => ((h = Math.imul(h ^ (h >>> 15), 2246822507)) >>> 0) / 4294967296;
  const cols = Math.ceil(Math.sqrt(n)), rows = Math.ceil(n / cols);
  const cells = [];
  for(let i = 0; i < cols * rows; i++) cells.push(i);
  for(let i = cells.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [cells[i], cells[j]] = [cells[j], cells[i]]; }
  return Array.from({length:n}, (_, i) => {
    const c = cells[i] % cols, r = Math.floor(cells[i] / cols);
    return { x: (c + 0.24 + rnd() * 0.52) / cols * 100, y: (r + 0.24 + rnd() * 0.52) / rows * 100 };
  });
}
/* Match the transcript to the word. Recognition returns whole phrases and
   sometimes near-spellings, so: exact word in the phrase first, then an edit
   distance the length of the word can absorb. Deliberately forgiving — the
   goal is saying the word, not defeating a microphone. */
function skyMatch(term, alts){
  const norm = t => String(t).toLowerCase().replace(/[^a-z]/g, '');
  const want = norm(term);
  if(!want) return false;
  const dist = (a, b) => {
    if(Math.abs(a.length - b.length) > 2) return 9;
    let prev = Array.from({length: b.length + 1}, (_, i) => i);
    for(let i = 0; i < a.length; i++){
      const cur = [i + 1];
      for(let j = 0; j < b.length; j++)
        cur.push(Math.min(prev[j + 1] + 1, cur[j] + 1, prev[j] + (a[i] === b[j] ? 0 : 1)));
      prev = cur;
    }
    return prev[b.length];
  };
  /* One edit of slack up to eight letters, two beyond. Two edits on a short
     word accepts a DIFFERENT word — adept/inept are two edits apart — and a
     wrong word accepted is worse for learning than a right one re-asked. */
  const tol = want.length <= 8 ? 1 : 2;
  return (alts || []).some(t => {
    const words = String(t).toLowerCase().split(/\s+/).map(norm).filter(Boolean);
    return words.some(w => w === want || dist(w, want) <= tol) || norm(t) === want;
  });
}
/* The clue is the DEFINITION ALONE. A card's def leads with the bold meaning
   and then gives example sentences — and those examples use the word, which
   hands the answer over before she has guessed. So the game shows the first
   line only, and the examples become hints with the word blanked out. */
const skyDefLine = c => String(c.def || '').split('\n')[0];
const skyExamples = c => String(c.def || '').split('\n').slice(1)
  .map(l => l.replace(/^\s*[•\-]\s*/, '').trim()).filter(Boolean);
/* Blank the word and anything grown from it: bewail hides "bewailed",
   detract hides "detractor", emancipate hides "Emancipation". Rooting by
   dropping a trailing e catches the -ing and -ion forms that would otherwise
   walk straight past an exact match. */
function skyBlank(text, term){
  const root = String(term || '').toLowerCase().replace(/e$/, '');
  if(root.length < 3) return text;
  const esc = root.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return String(text).replace(new RegExp('\\b' + esc + '\\w*', 'gi'), '____');
}
function skyHints(c){
  const out = skyExamples(c).map(t => skyBlank(t, c.term));
  if(c.hint) out.push(skyBlank(c.hint, c.term));
  return out;
}
function skyLog(u){
  const lit = Object.keys(skyState.lit).length;
  if(!lit) return;
  skyState.logId = skyState.logId || uid('log');
  put({ id: skyState.logId, type:'log', mode:'starsky', classId: ctx.classId, unitId: u.id,
        date: AZ.today(), at: skyState.start, correct: lit, total: skyCards(u).length,
        seconds: Math.round((Date.now() - skyState.start) / 1000),
        xp: lit * SKY_XP, hints: 0 });
}
SCREENS.starsky = function(root){
  const u = unitFor(ctx.unitId);
  if(!u || !u.cards.length) return go('unit', {classId: ctx.classId});
  const cards = skyCards(u);
  if(!skyState || skyState.unitId !== u.id)
    skyState = { unitId: u.id, lit: {}, open: null, tried: {}, start: Date.now(),
                 listening: false, verdict: null, won: false, spell: false,
                 spellTries: 0, typed: '', reveal: false, hints: 0, srDead: false, logId: null };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const voiceOK = !!SR && !skyState.srDead;
  const litCount = Object.keys(skyState.lit).length;

  const head = el('div','card');
  head.appendChild(el('div','eyebrow', u.title + ' · Star sky'));
  const hr = el('div','row');
  hr.appendChild(el('span','k', voiceOK ? 'Press a star, read the meaning, say the word'
                                        : 'Press a star, read the meaning, spell the word'));
  hr.appendChild(el('span','v', litCount + ' of ' + cards.length));
  head.appendChild(hr);
  root.appendChild(head);

  const sky = el('div','skyfield');
  const spots = skySpots(cards.length, u.id);
  cards.forEach((c, i) => {
    const b = el('button','skystar' + (skyState.lit[c.id] ? ' lit' : '') + (skyState.open === c.id ? ' open' : ''));
    b.style.left = spots[i].x + '%'; b.style.top = spots[i].y + '%';
    b.textContent = skyState.lit[c.id] ? '★' : '✦';

    b.addEventListener('click', () => {
      skyState.open = c.id; skyState.verdict = null; skyState.typed = '';
      skyState.spellTries = 0; skyState.reveal = false; skyState.hints = 0;
      skyState.won = false; skyState.spell = !voiceOK;
      render();
    });
    sky.appendChild(b);
  });
  root.appendChild(sky);

  const cur = cards.find(c => c.id === skyState.open);
  if(cur){
    const isLit = !!skyState.lit[cur.id];
    /* The moment she gets it has to be unmistakable — Chris said the word
       just appeared with no fanfare. A won card gets its own green panel,
       a tick, the celebration and a buzz. */
    const p = el('div','card ac' + (skyState.won ? ' skywon' : ''));
    if(isLit){
      p.appendChild(el('div','eyebrow', skyState.won ? '✓ You said it' : 'You lit this one'));
      const w = el('p','skyword', cur.term);
      p.appendChild(w);
      /* The phonetic is SHOWN, never spoken: the voice reads the word itself
         plainly, and a respelling read aloud is just noise. This diverges from
         the flashcard 🔊 on purpose — see the note in the commit. */
      if(cur.sp) p.appendChild(el('div','saidas', cur.sp));
      p.appendChild(richify(el('p'), cur.def));
      const hear = el('button','btn btn-ghost','🔊 Hear it');
      hear.addEventListener('click', () => say(cur.term));
      p.appendChild(hear);
    } else {
      p.appendChild(el('div','eyebrow','What word is this?'));
      /* Definition only — the examples live behind the hint button. */
      /* Belt and braces: a def line should never use its own word, but a future
         card that slips would hand the answer over — blank it like the hints. */
      p.appendChild(richify(el('p'), skyBlank(skyDefLine(cur), cur.term)));
      const hints = skyHints(cur);
      for(let i = 0; i < Math.min(skyState.hints, hints.length); i++)
        p.appendChild(el('div','skyhint', hints[i]));
      if(skyState.listening){
        const li = el('div','skylisten');

        li.appendChild(el('span',null,'Listening — say the word now'));
        p.appendChild(li);
      }
      if(skyState.verdict) p.appendChild(el('p','skysay', skyState.verdict));
      const btns = el('div','btn-row');
      const markTry = () => { skyState.tried[cur.id] = (skyState.tried[cur.id] || 0) + 1; };
      const lightIt = () => {
        skyState.lit[cur.id] = true; skyState.verdict = null; skyState.typed = '';
        skyState.won = true; skyLog(u);
        if(navigator.vibrate) navigator.vibrate([18, 40, 18]);
        const all = Object.keys(skyState.lit).length === cards.length;
        celebrate(all ? {big:true} : undefined);
      };
      if(voiceOK && !skyState.spell){
        const mic = el('button','btn btn-primary', skyState.listening ? '● Listening…' : '🎤 Say the word');
